<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="description" content="העלו סרטון וקבלו כתוביות בכל שפה, בחינם לגמרי, ישירות בדפדפן">
  <title>כתוביות חינם · Free Subtitles</title>
  <!-- Single self-contained file: no build step, no server, no network calls except
       the one-time model download. Generated by build.js from the sources in src/. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <style>
/* Free Subtitles — dark-first, RTL-first, logical properties throughout so the
   English/LTR layout is a direction flip and nothing else. */

:root {
  color-scheme: dark;
  --bg: #0b0f17;
  --bg-soft: #111826;
  --card: #141c2b;
  --card-2: #182133;
  --line: #24314a;
  --text: #e8edf7;
  --muted: #93a1bd;
  --accent: #5b8cff;
  --accent-2: #7c5cff;
  --good: #34d399;
  --danger: #f87171;
  --radius: 16px;
  --shadow: 0 18px 50px rgb(0 0 0 / 45%);
  --font: 'Segoe UI', 'Rubik', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
}

* { box-sizing: border-box; }

/* Rules like `display: flex` outrank the UA stylesheet's [hidden] rule, so
   anything toggled with the hidden attribute needs this to actually disappear. */
[hidden] { display: none !important; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100dvh;
  background:
    radial-gradient(1100px 520px at 85% -10%, rgb(124 92 255 / 22%), transparent 60%),
    radial-gradient(900px 480px at 5% 0%, rgb(91 140 255 / 18%), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
}

.skip-link {
  position: absolute;
  inset-block-start: -60px;
  inset-inline-start: 12px;
  z-index: 20;
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  text-decoration: none;
}
.skip-link:focus { inset-block-start: 12px; }

.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 20px 8px;
}

.brand { display: flex; gap: 14px; align-items: center; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  font-size: 26px;
  box-shadow: var(--shadow);
}
.brand h1 { margin: 0; font-size: clamp(22px, 3.6vw, 30px); letter-spacing: -0.02em; }
.tagline { margin: 2px 0 0; color: var(--muted); font-size: 15px; }

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  max-width: 1080px;
  margin: 0 auto;
  padding: 6px 20px 4px;
}
.badge {
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgb(255 255 255 / 3%);
  color: var(--muted);
  font-size: 13px;
}

main { max-width: 1080px; margin: 0 auto; padding: 16px 20px 40px; display: grid; gap: 18px; }

.card {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, var(--card), var(--card-2));
  box-shadow: var(--shadow);
}

.step {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ---------- dropzone ---------- */

.dropzone {
  display: grid;
  place-items: center;
  gap: 6px;
  padding: 38px 20px;
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  background: rgb(255 255 255 / 2%);
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
}
.dropzone:hover, .dropzone:focus-visible { border-color: var(--accent); background: rgb(91 140 255 / 8%); }
.dropzone.dragging { border-color: var(--accent); background: rgb(91 140 255 / 14%); transform: scale(1.01); }
.drop-icon { width: 42px; height: 42px; color: var(--accent); }
.drop-title { margin: 6px 0 0; font-size: 18px; font-weight: 600; }

.file-card {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-block-start: 14px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgb(52 211 153 / 6%);
}
.file-icon { font-size: 26px; }
.file-meta { display: grid; min-width: 0; flex: 1; }
.file-meta strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- form ---------- */

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.field { display: grid; gap: 6px; align-content: start; }
/* Keep controls at their natural height when a sibling field has a hint under it. */
.field > select, .field > input { align-self: start; }
.field-label { font-size: 14px; font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; }

select, input[type='search'], textarea {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--bg-soft);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
}
select:focus-visible, input:focus-visible, textarea:focus-visible,
button:focus-visible, .dropzone:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.targets { margin-block-start: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 4px; }
.chip {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 5px 8px 5px 12px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  font-size: 13px;
}
.chip button {
  width: 18px;
  height: 18px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgb(0 0 0 / 25%);
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  line-height: 1;
}

.target-list {
  display: grid;
  max-height: 210px;
  gap: 2px;
  overflow-y: auto;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-soft);
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
}
.target-option {
  display: flex;
  gap: 9px;
  align-items: center;
  padding: 7px 9px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 14px;
}
.target-option:hover { background: rgb(255 255 255 / 5%); }
.target-option input { accent-color: var(--accent); }
.target-option .code { color: var(--muted); font-size: 12px; }

/* ---------- buttons ---------- */

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

button, .button {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  padding: 12px 22px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-soft);
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  transition: filter 0.15s, transform 0.05s;
}
button:hover:not(:disabled), .button:hover { filter: brightness(1.15); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.primary {
  border-color: transparent;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
}
.ghost { background: rgb(255 255 255 / 4%); }
.danger { border-color: rgb(248 113 113 / 45%); color: var(--danger); }
.small { padding: 9px 15px; font-size: 14px; }

/* ---------- progress ---------- */

.progress { margin-block-start: 18px; }
.progress-head { display: flex; justify-content: space-between; gap: 12px; margin-block-end: 8px; font-size: 14px; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; color: var(--muted); }

.bar { height: 10px; overflow: hidden; border-radius: 999px; background: var(--bg-soft); }
.bar-fill {
  width: 0%;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.25s ease;
}
.bar-fill.indeterminate {
  width: 35% !important;
  animation: slide 1.4s ease-in-out infinite;
}
@keyframes slide {
  0% { margin-inline-start: 0; }
  50% { margin-inline-start: 65%; }
  100% { margin-inline-start: 0; }
}

.log {
  max-height: 160px;
  margin: 12px 0 0;
  padding: 0;
  overflow-y: auto;
  color: var(--muted);
  font-size: 13px;
  list-style: none;
}
.log li { padding: 3px 0; border-block-start: 1px solid rgb(255 255 255 / 4%); }
.log li:first-child { border: 0; }

.status { margin: 12px 0 0; min-height: 22px; font-size: 14px; }
.status.error { color: var(--danger); }
.status.done { color: var(--good); }

/* ---------- results ---------- */

.player-wrap { position: relative; overflow: hidden; border-radius: 12px; background: #000; }
#player { display: block; width: 100%; max-height: 460px; background: #000; }
.overlay {
  position: absolute;
  inset-inline: 4%;
  inset-block-end: 12%;
  padding: 8px 14px;
  border-radius: 8px;
  background: rgb(0 0 0 / 70%);
  color: #fff;
  font-size: clamp(15px, 2.4vw, 22px);
  line-height: 1.35;
  text-align: center;
  text-shadow: 0 1px 3px #000;
  white-space: pre-line;
  pointer-events: none;
}
.overlay:empty { display: none; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 16px 12px; }
.tab {
  padding: 8px 15px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg-soft);
  font-size: 14px;
}
.tab[aria-selected='true'] {
  border-color: transparent;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
}

.downloads { display: flex; flex-wrap: wrap; gap: 8px; margin-block-end: 12px; }

.cues { display: grid; gap: 8px; max-height: 460px; margin: 10px 0 0; padding: 0; overflow-y: auto; list-style: none; }
.cue {
  display: grid;
  gap: 10px;
  align-items: start;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--bg-soft);
  grid-template-columns: auto 1fr;
}
.cue.active { border-color: var(--accent); background: rgb(91 140 255 / 12%); }
.cue-time {
  padding: 4px 8px;
  border: 0;
  border-radius: 7px;
  background: rgb(255 255 255 / 6%);
  color: var(--muted);
  cursor: pointer;
  font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-size: 12px;
  white-space: nowrap;
}
.cue textarea { min-height: 44px; padding: 7px 10px; border-radius: 9px; resize: vertical; }

.footer { max-width: 1080px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 13px; }

@media (max-width: 620px) {
  .card { padding: 16px; }
  .cue { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">דלג לתוכן</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">💬</span>
      <div>
        <h1 data-i18n="app.title">כתוביות חינם</h1>
        <p class="tagline" data-i18n="app.tagline"></p>
      </div>
    </div>
    <button id="ui-lang" class="ghost" type="button" data-i18n="lang.toggle">English</button>
  </header>

  <div class="badges">
    <span class="badge" data-i18n="badge.free"></span>
    <span class="badge" data-i18n="badge.private"></span>
    <span class="badge" data-i18n="badge.nokey"></span>
  </div>

  <main id="main">
    <section class="card">
      <h2 class="step" data-i18n="step.1"></h2>

      <div id="drop" class="dropzone" tabindex="0" role="button" aria-describedby="drop-hint">
        <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 16V4m0 0 4 4m-4-4-4 4" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <p class="drop-title" data-i18n="drop.title"></p>
        <p id="drop-hint" class="hint" data-i18n="drop.hint"></p>
        <span class="button" data-i18n="drop.button"></span>
        <input id="file-input" type="file" accept="video/*,audio/*,.mkv,.avi,.wmv,.flv,.m4a,.ts" hidden>
      </div>

      <div id="file-card" class="file-card" hidden>
        <span class="file-icon" aria-hidden="true">🎬</span>
        <div class="file-meta">
          <strong id="file-name"></strong>
          <span id="file-info" class="hint"></span>
        </div>
        <button id="file-replace" class="ghost" type="button" data-i18n="file.replace"></button>
      </div>
    </section>

    <section class="card">
      <h2 class="step" data-i18n="step.2"></h2>

      <div class="grid">
        <label class="field">
          <span class="field-label" data-i18n="options.model"></span>
          <select id="model"></select>
          <span class="hint" data-i18n="options.model.hint"></span>
        </label>

        <label class="field">
          <span class="field-label" data-i18n="options.source"></span>
          <select id="source-lang"></select>
        </label>

        <label class="field">
          <span class="field-label" data-i18n="options.engine"></span>
          <select id="device"></select>
          <span id="device-note" class="hint"></span>
        </label>
      </div>

      <div class="field targets">
        <span class="field-label" data-i18n="options.targets"></span>
        <span class="hint" data-i18n="options.targets.hint"></span>
        <div id="target-chips" class="chips" aria-live="polite"></div>
        <input id="target-search" type="search" class="search" data-i18n-placeholder="options.targets.search">
        <div id="target-list" class="target-list" role="group"></div>
      </div>
    </section>

    <section class="card">
      <h2 class="step" data-i18n="step.3"></h2>
      <div class="actions">
        <button id="generate" class="primary" type="button" data-i18n="action.generate"></button>
        <button id="cancel" class="ghost danger" type="button" hidden data-i18n="action.cancel"></button>
      </div>
      <p class="hint" data-i18n="note.first"></p>

      <div id="progress-panel" class="progress" hidden>
        <div class="progress-head">
          <span id="stage-label"></span>
          <span id="progress-percent" class="mono"></span>
        </div>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
        <ul id="log" class="log"></ul>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="results" class="card" hidden>
      <h2 class="step" data-i18n="result.title"></h2>

      <div class="player-wrap">
        <video id="player" controls playsinline preload="metadata"></video>
        <div id="overlay" class="overlay" aria-hidden="true"></div>
      </div>

      <div id="tabs" class="tabs" role="tablist"></div>

      <div class="downloads">
        <button id="download-srt" class="primary small" type="button" data-i18n="download.srt"></button>
        <button id="download-vtt" class="ghost small" type="button" data-i18n="download.vtt"></button>
        <button id="download-txt" class="ghost small" type="button" data-i18n="download.txt"></button>
        <button id="download-all" class="ghost small" type="button" data-i18n="download.all"></button>
        <button id="copy" class="ghost small" type="button" data-i18n="copy"></button>
      </div>

      <p class="hint" data-i18n="result.edit.hint"></p>
      <ol id="cues" class="cues"></ol>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footer"></p>
  </footer>

  <script id="shared-source" type="text/plain">
/**
 * Where the app fetches its runtime pieces from.
 *
 * By default everything comes from public CDNs, which is what makes the app a
 * single static folder anyone can host for free. Both bases can be overridden
 * with query parameters so the whole thing can also run fully self-hosted or
 * air-gapped:
 *
 *   index.html?cdn=/vendor&models=/models/
 *
 *   cdn    - base URL that mirrors the npm registry layout
 *            (<cdn>/@huggingface/transformers@<version>/dist/transformers.min.js)
 *   models - base URL for model repositories, Hugging Face layout
 *            (<models><repo>/resolve/main/<file>)
 */

// Pinned deliberately: the onnxruntime build bundled with transformers.js 4.x
// fails to create a Whisper session on the WASM backend
// ("TransposeDQWeightsForMatMulNBits: missing required scale"), which is the
// backend every browser without WebGPU falls back to.
export const TRANSFORMERS_VERSION = '3.8.1';
export const FFMPEG_VERSION = '0.12.15';
export const FFMPEG_CORE_VERSION = '0.12.10';
export const FFMPEG_UTIL_VERSION = '0.12.2';

const DEFAULT_CDN = 'https://cdn.jsdelivr.net/npm';

function stripTrailingSlash(value) {
  return value.replace(/\/+$/, '');
}

export function readConfig(search = '') {
  const params = new URLSearchParams(search);
  return {
    cdn: stripTrailingSlash(params.get('cdn') || DEFAULT_CDN),
    customCDN: Boolean(params.get('cdn')),
    // transformers.js expects a trailing slash on the model host.
    models: params.get('models') ? `${stripTrailingSlash(params.get('models'))}/` : '',
  };
}

/**
 * Language table.
 *
 * `code`  - ISO-639-1 code used by Whisper for transcription and by the browser's
 *           built-in Translator API (BCP-47 compatible for these entries).
 * `nllb`  - FLORES-200 code used by the offline NLLB translation model.
 * `he`/`en` - display names.
 * `rtl`   - right-to-left script (affects subtitle preview direction).
 *
 * Every entry is supported both as a transcription source (Whisper) and as a
 * translation target (NLLB), so any pair in this table is a valid job.
 */
export const LANGUAGES = [
  { code: 'he', nllb: 'heb_Hebr', he: 'עברית', en: 'Hebrew', rtl: true },
  { code: 'en', nllb: 'eng_Latn', he: 'אנגלית', en: 'English' },
  { code: 'ar', nllb: 'arb_Arab', he: 'ערבית', en: 'Arabic', rtl: true },
  { code: 'ru', nllb: 'rus_Cyrl', he: 'רוסית', en: 'Russian' },
  { code: 'es', nllb: 'spa_Latn', he: 'ספרדית', en: 'Spanish' },
  { code: 'fr', nllb: 'fra_Latn', he: 'צרפתית', en: 'French' },
  { code: 'de', nllb: 'deu_Latn', he: 'גרמנית', en: 'German' },
  { code: 'pt', nllb: 'por_Latn', he: 'פורטוגזית', en: 'Portuguese' },
  { code: 'it', nllb: 'ita_Latn', he: 'איטלקית', en: 'Italian' },
  { code: 'nl', nllb: 'nld_Latn', he: 'הולנדית', en: 'Dutch' },
  { code: 'pl', nllb: 'pol_Latn', he: 'פולנית', en: 'Polish' },
  { code: 'uk', nllb: 'ukr_Cyrl', he: 'אוקראינית', en: 'Ukrainian' },
  { code: 'tr', nllb: 'tur_Latn', he: 'טורקית', en: 'Turkish' },
  { code: 'fa', nllb: 'pes_Arab', he: 'פרסית', en: 'Persian', rtl: true },
  { code: 'zh', nllb: 'zho_Hans', he: 'סינית', en: 'Chinese' },
  { code: 'ja', nllb: 'jpn_Jpan', he: 'יפנית', en: 'Japanese' },
  { code: 'ko', nllb: 'kor_Hang', he: 'קוריאנית', en: 'Korean' },
  { code: 'hi', nllb: 'hin_Deva', he: 'הינדי', en: 'Hindi' },
  { code: 'bn', nllb: 'ben_Beng', he: 'בנגלית', en: 'Bengali' },
  { code: 'ur', nllb: 'urd_Arab', he: 'אורדו', en: 'Urdu', rtl: true },
  { code: 'id', nllb: 'ind_Latn', he: 'אינדונזית', en: 'Indonesian' },
  { code: 'ms', nllb: 'zsm_Latn', he: 'מלאית', en: 'Malay' },
  { code: 'vi', nllb: 'vie_Latn', he: 'ויאטנמית', en: 'Vietnamese' },
  { code: 'th', nllb: 'tha_Thai', he: 'תאילנדית', en: 'Thai' },
  { code: 'el', nllb: 'ell_Grek', he: 'יוונית', en: 'Greek' },
  { code: 'cs', nllb: 'ces_Latn', he: 'צ׳כית', en: 'Czech' },
  { code: 'sk', nllb: 'slk_Latn', he: 'סלובקית', en: 'Slovak' },
  { code: 'hu', nllb: 'hun_Latn', he: 'הונגרית', en: 'Hungarian' },
  { code: 'ro', nllb: 'ron_Latn', he: 'רומנית', en: 'Romanian' },
  { code: 'bg', nllb: 'bul_Cyrl', he: 'בולגרית', en: 'Bulgarian' },
  { code: 'sr', nllb: 'srp_Cyrl', he: 'סרבית', en: 'Serbian' },
  { code: 'hr', nllb: 'hrv_Latn', he: 'קרואטית', en: 'Croatian' },

export function getLanguage(code) {
  return BY_CODE.get(code) || null;
}

export function languageName(code, ui = 'he') {
  const lang = BY_CODE.get(code);
  if (!lang) return code;
  return ui === 'he' ? lang.he : lang.en;
}

export function isRTL(code) {
  return Boolean(BY_CODE.get(code)?.rtl);
}

/** Languages sorted for display, keeping the most common ones on top. */
export function sortedLanguages(ui = 'he') {
  const pinned = ['he', 'en', 'ar', 'ru', 'es', 'fr'];
  const head = pinned.map((c) => BY_CODE.get(c)).filter(Boolean);
  const tail = LANGUAGES.filter((l) => !pinned.includes(l.code)).sort((a, b) =>
    (ui === 'he' ? a.he : a.en).localeCompare(ui === 'he' ? b.he : b.en, ui),
  );
  return [...head, ...tail];
}

/**
 * Pure helpers for turning raw Whisper output into subtitle files.
 * No DOM access here, so the logic is unit-testable under Node.
 */

const MIN_DURATION = 0.4;
const MAX_DURATION = 8;

/** 12.345 -> "00:00:12,345" (SRT) or "00:00:12.345" (WebVTT). */
export function formatTime(seconds, msSeparator = ',') {
  const total = Math.max(0, Number.isFinite(seconds) ? seconds : 0);
  const ms = Math.round((total - Math.floor(total)) * 1000);
  // Rounding up to 1000ms must roll over into the next second.
  const carry = ms === 1000 ? 1 : 0;
  const whole = Math.floor(total) + carry;
  const h = String(Math.floor(whole / 3600)).padStart(2, '0');
  const m = String(Math.floor((whole % 3600) / 60)).padStart(2, '0');
  const s = String(whole % 60).padStart(2, '0');
  return `${h}:${m}:${s}${msSeparator}${String(carry ? 0 : ms).padStart(3, '0')}`;
}

/** Collapse whitespace and strip the artefacts Whisper sometimes emits. */
export function cleanText(text) {
  return String(text ?? '')
    .replace(/\s+/g, ' ')
    .replace(/^[\s\-–—]+/, '')
    .trim();
}

/**
 * Break a caption into at most `maxLines` lines of ~`maxChars` characters,
 * preferring word boundaries. Longer captions keep their extra words on the
 * last line rather than losing them.
 */
export function wrapText(text, maxChars = 42, maxLines = 2) {
  const words = cleanText(text).split(' ').filter(Boolean);
  if (words.length === 0) return '';
  const lines = [];
  let line = '';
  for (const word of words) {
    const candidate = line ? `${line} ${word}` : word;
    if (candidate.length > maxChars && line && lines.length < maxLines - 1) {
      lines.push(line);
      line = word;
    } else {
      line = candidate;
    }
  }
  lines.push(line);
  return lines.join('\n');
}

/**
 * Turn the `chunks` array of an ASR pipeline result into clean segments.
 * Whisper leaves the final timestamp as `null` and can emit zero-length or
 * overlapping chunks, so every segment is repaired against its neighbours.
 *
 * @param {Array<{timestamp:[number, number|null], text:string}>} chunks
 * @param {{offset?:number, duration?:number}} [options] offset is added to
 *        every timestamp, so a long file can be transcribed block by block.
 */
export function normalizeChunks(chunks, options = {}) {
  const offset = options.offset ?? 0;
  const duration = options.duration ?? Infinity;
  const raw = [];

  for (const chunk of Array.isArray(chunks) ? chunks : []) {
    const text = cleanText(chunk?.text);
    if (!text) continue;
    const [rawStart, rawEnd] = chunk?.timestamp ?? [];
    const start = Number.isFinite(rawStart) ? rawStart : null;
    if (start === null) continue;
    raw.push({ start: start + offset, end: Number.isFinite(rawEnd) ? rawEnd + offset : null, text });
  }

  const segments = [];
  for (let i = 0; i < raw.length; i += 1) {
    const current = raw[i];
    const next = raw[i + 1];
    let end = current.end;
    if (end === null || end <= current.start) {
      // Estimate from reading speed (~14 characters per second), then clamp.
      const estimated = current.start + Math.min(MAX_DURATION, current.text.length / 14 + 0.6);
      end = next ? Math.min(estimated, next.start) : estimated;
    }
    if (next && end > next.start) end = next.start;
    end = Math.min(end, duration);
    if (end - current.start < MIN_DURATION) end = current.start + MIN_DURATION;
    if (current.start >= duration) continue;
    segments.push({ start: current.start, end, text: current.text });
  }
  return segments;
}

/**
 * Split a caption that is too long to read into several cues.
 *
 * Whisper emits one chunk per sentence, and a long sentence would otherwise
 * become a wall of text on screen. Sentence-ending punctuation is preferred as
 * the cut point, then word boundaries; the original duration is divided between
 * the pieces in proportion to their length.
 */
export function splitLongSegments(segments, maxChars = 84) {
  const result = [];
  for (const segment of segments) {
    const text = cleanText(segment.text);
    if (!text) continue;
    if (text.length <= maxChars) {
      result.push({ ...segment, text });
      continue;
    }

    const pieces = splitReadable(text, maxChars);
    const characters = pieces.reduce((total, piece) => total + piece.length, 0) || 1;
    const span = segment.end - segment.start;
    let cursor = segment.start;
    for (const piece of pieces) {
      const share = span * (piece.length / characters);
      const end = Math.min(segment.end, cursor + share);
      result.push({ ...segment, start: cursor, end, text: piece });
      cursor = end;
    }
  }
  return result;
}

function splitReadable(text, maxChars) {
  const words = text.split(' ');
  const pieces = [];
  let current = '';
  for (const word of words) {
    const candidate = current ? `${current} ${word}` : word;
    if (candidate.length > maxChars && current) {
      pieces.push(current);
      current = word;
    } else {
      current = candidate;
      // A sentence boundary is a better cut than a word boundary, as long as
      // the piece is already worth showing on its own.
      if (/[.!?۔。！？…]$/.test(word) && current.length >= maxChars * 0.45) {
        pieces.push(current);
        current = '';
      }
    }
  }
  if (current) pieces.push(current);
  return pieces;
}

/**
 * Append a freshly transcribed block to the running list, dropping anything the
 * previous block already covered (blocks overlap on purpose so words are not
 * cut in half at the seam).
 */
export function appendSegments(accumulator, incoming) {
  const lastEnd = accumulator.length ? accumulator[accumulator.length - 1].end : 0;
  for (const segment of incoming) {
    const middle = (segment.start + segment.end) / 2;
    if (middle <= lastEnd + 0.05) continue;
    const start = Math.max(segment.start, lastEnd);
    if (segment.end - start < 0.15) continue;
    accumulator.push({ ...segment, start });
  }
  return accumulator;
}

export function toSRT(segments) {
  return (
    segments
      .map((segment, index) => {
        const from = formatTime(segment.start, ',');
        const to = formatTime(segment.end, ',');
        return `${index + 1}\n${from} --> ${to}\n${wrapText(segment.text)}\n`;
      })
      .join('\n') + '\n'
  );
}

export function toVTT(segments) {
  const cues = segments
    .map((segment, index) => {
      const from = formatTime(segment.start, '.');
      const to = formatTime(segment.end, '.');
      return `${index + 1}\n${from} --> ${to}\n${wrapText(segment.text)}\n`;
    })
    .join('\n');
  return `WEBVTT\n\n${cues}`;
}

export function toTXT(segments) {
  return segments.map((segment) => cleanText(segment.text)).join('\n') + '\n';
}

export const FORMATS = {
  srt: { extension: 'srt', mime: 'text/plain;charset=utf-8', build: toSRT },
  vtt: { extension: 'vtt', mime: 'text/vtt;charset=utf-8', build: toVTT },
  txt: { extension: 'txt', mime: 'text/plain;charset=utf-8', build: toTXT },
};

/** Index of the segment covering `time`, or -1. Binary search for smooth playback. */
export function segmentAt(segments, time) {
  let low = 0;
  let high = segments.length - 1;
  while (low <= high) {
    const mid = (low + high) >> 1;
    const segment = segments[mid];
    if (time < segment.start) high = mid - 1;
    else if (time > segment.end) low = mid + 1;
    else return mid;
  }
  return -1;
}

  <script id="engine-source" type="text/plain">
/**
 * Recognition + translation engine.
 *
 * The build concatenates this file after the shared module (config, languages,
 * subtitle helpers) and after a one-line preamble that defines ENGINE_SEARCH,
 * so the whole thing becomes a single JavaScript module. That module is used
 * two ways:
 *
 *   - as a Web Worker, the normal path: the bootstrap at the bottom wires the
 *     message port to an engine instance;
 *   - imported directly by the page, the fallback for `file://` pages where
 *     browsers refuse to start a worker from a blob URL. Then the page calls
 *     `createEngine()` itself and talks to it through plain function calls.
 *
 * Everything runs on the user's own machine, over WebGPU when it is usable and
 * WASM otherwise. Models are fetched once and then served from the browser
 * cache, so repeat runs cost nothing and work offline.
 */


const config = readConfig(ENGINE_SEARCH);

const SAMPLE_RATE = 16000;
/** Audio is transcribed in blocks so progress and partial results keep flowing. */
const BLOCK_SECONDS = 120;
/** Blocks overlap so a word spoken across a seam is not lost. */
const OVERLAP_SECONDS = 4;

const TRANSLATION_MODEL = 'Xenova/nllb-200-distilled-600M';
const TRANSLATION_BATCH = 4;

/**
 * Precision candidates per backend, best first. Not every model repository
 * ships every variant and not every runtime accepts every graph, so a failed
 * session falls through to the next candidate instead of failing the run.
 */
const DTYPES = {
  webgpu: [{ encoder_model: 'fp32', decoder_model_merged: 'q4' }, 'fp32', 'q8'],
  wasm: ['q8', 'fp32'],
};

/**
 * transformers.js is loaded on first use rather than at module evaluation, so
 * an engine is ready to receive messages while its library is still arriving.
 * Shared across engines on purpose: it is the model sessions that must stay
 * apart, not the library itself.
 */
let libraryPromise = null;
function loadLibrary() {
  libraryPromise ??= import(
    `${config.cdn}/@huggingface/transformers@${TRANSFORMERS_VERSION}/dist/transformers.min.js`
  ).then((library) => {
    library.env.allowLocalModels = false;
    if (config.models) library.env.remoteHost = config.models;
    if (config.customCDN) {
      // The ONNX runtime resolves its own WASM binaries against jsDelivr; point
      // those at the mirror too, otherwise a self-hosted install still reaches out.
      const onnx = library.env.backends?.onnx;
      if (onnx?.wasm) {
        onnx.wasm.wasmPaths = `${config.cdn}/@huggingface/transformers@${TRANSFORMERS_VERSION}/dist/`;
      }
    }
    return library;
  });
  return libraryPromise;
}

/**
 * @param {(message: object, transfer?: Transferable[]) => void} post
 * @returns {(request: object) => Promise<void>} handler for one request
 */
export function createEngine(post) {
  const state = { audio: null, asr: null, asrKey: '', translator: null };

  function downloadReporter() {
    return (report) => {
      if (report?.status === 'progress') {
        post({
          type: 'download',
          file: report.file,
          progress: report.progress ?? 0,
          loaded: report.loaded ?? 0,
          total: report.total ?? 0,
        });
      } else if (report?.status === 'ready' || report?.status === 'done') {
        post({ type: 'download', file: report.file, progress: 100 });
      }
    };
  }

  async function disposeRecognizer() {
    if (!state.asr) return;
    try {
      await state.asr.dispose?.();
    } catch {
      /* a half-initialised pipeline can refuse to dispose; drop it either way */
    }
    state.asr = null;
    state.asrKey = '';
  }

  async function getRecognizer(model, device) {
    const key = `${model}|${device}`;
    if (state.asr && state.asrKey === key) return state.asr;
    await disposeRecognizer();

    const { pipeline } = await loadLibrary();
    post({ type: 'stage', stage: 'model', detail: model });

    const candidates = DTYPES[device] ?? DTYPES.wasm;
    let lastError;
    for (const dtype of candidates) {
      try {
        state.asr = await pipeline('automatic-speech-recognition', model, {
          device,
          dtype,
          progress_callback: downloadReporter(),
        });
        state.asrKey = key;
        return state.asr;
      } catch (error) {
        lastError = error;
        post({ type: 'notice', message: `${JSON.stringify(dtype)} → ${error.message}` });
      }
    }
    throw lastError ?? new Error('could not load the model');
  }

  async function getTranslator() {
    if (state.translator) return state.translator;
    // When one engine serves both jobs (the no-worker fallback), the speech
    // model has to go before the translation model arrives: two of them in one
    // 32-bit WASM heap is what makes a run stall.
    await disposeRecognizer();

    const { pipeline } = await loadLibrary();
    post({ type: 'stage', stage: 'model', detail: TRANSLATION_MODEL });
    state.translator = await pipeline('translation', TRANSLATION_MODEL, {
      dtype: 'q8',
      progress_callback: downloadReporter(),
    });
    return state.translator;
  }

  async function transcribe({ model, device, language }) {
    const audio = state.audio;
    if (!audio || audio.length === 0) throw new Error('no audio loaded');

    const recognizer = await getRecognizer(model, device);
    const duration = audio.length / SAMPLE_RATE;
    const blockSamples = BLOCK_SECONDS * SAMPLE_RATE;
    const overlapSamples = OVERLAP_SECONDS * SAMPLE_RATE;
    const step = blockSamples - overlapSamples;

    post({ type: 'stage', stage: 'transcribe', detail: '' });

    const segments = [];
    for (let offset = 0; offset < audio.length; offset += step) {
      const end = Math.min(offset + blockSamples, audio.length);
      // A sliver shorter than the overlap holds nothing the previous block missed.
      if (offset > 0 && end - offset < overlapSamples) break;

      const options = { chunk_length_s: 30, stride_length_s: 5, return_timestamps: true };
      if (language) options.language = language;

      const output = await recognizer(audio.subarray(offset, end), options);
      const chunks =
        Array.isArray(output?.chunks) && output.chunks.length > 0
          ? output.chunks
          : [{ timestamp: [0, (end - offset) / SAMPLE_RATE], text: output?.text ?? '' }];

      const blockSegments = splitLongSegments(
        normalizeChunks(chunks, { offset: offset / SAMPLE_RATE, duration }),
      );
      const before = segments.length;
      appendSegments(segments, blockSegments);

      post({ type: 'partial', segments: segments.slice(before) });
      post({ type: 'progress', value: Math.min(1, end / audio.length) });

      if (end >= audio.length) break;
    }

    return segments;
  }

  async function translate({ texts, src, tgt }) {
    const translator = await getTranslator();
    post({ type: 'stage', stage: 'translate', detail: `${src} → ${tgt}` });

    const results = [];
    for (let i = 0; i < texts.length; i += TRANSLATION_BATCH) {
      const batch = texts.slice(i, i + TRANSLATION_BATCH);
      let output;
      try {
        output = await translator(batch, { src_lang: src, tgt_lang: tgt, max_new_tokens: 256 });
      } catch {
        // Padding a mixed-length batch can fail on some backends; fall back to one at a time.
        output = [];
        for (const text of batch) {
          const single = await translator(text, { src_lang: src, tgt_lang: tgt, max_new_tokens: 256 });
          output.push(Array.isArray(single) ? single[0] : single);
        }
      }
      const list = Array.isArray(output) ? output : [output];
      for (let j = 0; j < batch.length; j += 1) {
        results.push(list[j]?.translation_text ?? batch[j]);
      }
      post({ type: 'progress', value: Math.min(1, results.length / texts.length) });
    }
    return results;
  }

  return async function handle(request = {}) {
    try {
      switch (request.type) {
        case 'load-audio':
          state.audio = new Float32Array(request.audio);
          post({ type: 'audio-loaded', id: request.id, samples: state.audio.length });
          break;
        case 'transcribe':
          post({ type: 'transcribed', id: request.id, segments: await transcribe(request) });
          break;
        case 'translate':
          post({ type: 'translated', id: request.id, texts: await translate(request) });
          break;
        case 'release':
          await disposeRecognizer();
          state.audio = null;
          post({ type: 'released', id: request.id });
          break;
        default:
          throw new Error(`unknown request: ${request.type}`);
      }
    } catch (error) {
      post({ type: 'error', id: request.id, message: error?.message ?? String(error) });
    }
  };
}

// Worker bootstrap. Skipped when the page imports this module directly.
if (typeof WorkerGlobalScope !== 'undefined' && self instanceof WorkerGlobalScope) {
  const handle = createEngine((message, transfer) => self.postMessage(message, transfer ?? []));
  self.addEventListener('message', (event) => handle(event.data));
  self.postMessage({ type: 'ready' });
}

    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '');

  if (tokens.length === 0) return 'en';

  const scores = new Map();
  for (const token of tokens) {
    for (const [code, words] of Object.entries(WORDS)) {
      if (words.has(token)) scores.set(code, (scores.get(code) ?? 0) + 1);
    }
  }
  // Diacritics break ties between languages that share their common words.
  for (const hint of DIACRITIC_HINTS) {
    if (hint.pattern.test(text)) scores.set(hint.code, (scores.get(hint.code) ?? 0) + tokens.length * 0.08);

  if (scores.size === 0) return 'en';
  return [...scores.entries()].sort((a, b) => b[1] - a[1])[0][0];

  if (!sample.trim()) return 'en';

  const tallies = [
    ['hebrew', count(sample, HEBREW)],
    ['arabic', count(sample, ARABIC)],
    ['cyrillic', count(sample, CYRILLIC)],
    ['devanagari', count(sample, DEVANAGARI)],
    ['han', count(sample, HAN)],
    ['latin', count(sample, LATIN)],
    ...SCRIPTS.map((script) => [script.code, count(sample, script.pattern)]),
  ];
  const [winner, hits] = tallies.sort((a, b) => b[1] - a[1])[0];
  if (hits === 0) return 'en';

  switch (winner) {
    case 'hebrew':
      return firstMarker(sample, MARKERS.hebrew, 'he');
    case 'arabic':
      return firstMarker(sample, MARKERS.arabic, 'ar');
    case 'cyrillic':
      return firstMarker(sample, MARKERS.cyrillic, 'ru');
    case 'devanagari':
      return firstMarker(sample, MARKERS.devanagari, 'hi');
    case 'han':
      return 'zh';
    case 'latin':
      return detectLatin(sample);
    default:

  }

 * Browser-native translation, used when the platform offers it.
 *
 * Chrome ships an on-device Translator (and LanguageDetector) behind
 * `window.Translator`. When it is available for a language pair it is the best
 * option by far: no 850 MB model download and near-instant per-line output. The
 * worker's NLLB model is the portable fallback for everyone else.
 *
 * Both entry points are time-boxed. `Translator.create()` may block while the
 * browser fetches its own translation pack — that download can be slow, can
 * need a user gesture, and never reports failure — so a run that waits on it
 * would simply hang. When the budget runs out we fall back instead of waiting.
 */

const CREATE_TIMEOUT_MS = 25000;
const DETECT_TIMEOUT_MS = 10000;

/** Resolves to `null` if `promise` has not settled within `ms`. */
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((resolve) => setTimeout(() => resolve(null), ms)),
  ]);
}

function hasTranslator() {
  return typeof globalThis.Translator?.availability === 'function';
}

async function buildTranslator(source, target, onDownload) {
  const availability = await globalThis.Translator.availability({
    sourceLanguage: source,
    targetLanguage: target,
  });
  if (!availability || availability === 'unavailable') return null;

  const instance = await globalThis.Translator.create({
    sourceLanguage: source,
    targetLanguage: target,
    monitor(monitor) {
      monitor.addEventListener('downloadprogress', (event) => onDownload?.(event.loaded ?? 0));
    },
  });
  // Prove the pair really works before the caller commits a whole track to it.
  await instance.translate('ok');
  return instance;
}

/**
 * @returns {Promise<null | {translate(text:string):Promise<string>, destroy():void}>}
 *          null when the platform cannot translate this pair on-device.
 */
async function createBuiltinTranslator(source, target, onDownload) {
  if (!hasTranslator() || source === target) return null;
  let instance = null;
  try {
    instance = await withTimeout(buildTranslator(source, target, onDownload), CREATE_TIMEOUT_MS);
  } catch {
    return null;
  }
  if (!instance) return null;

  return {
    async translate(text) {
      const output = await instance.translate(text);
      return typeof output === 'string' && output ? output : text;
    },
    destroy() {
      instance.destroy?.();
    },
  };
}

async function detectWithBrowser(text) {
  try {
    const Detector = globalThis.LanguageDetector;
    if (typeof Detector?.availability !== 'function') return null;

    const best = await withTimeout(
      (async () => {
        if ((await Detector.availability()) !== 'available') return null;
        const detector = await Detector.create();
        const results = await detector.detect(text.slice(0, 2000));
        detector.destroy?.();
        return results?.[0] ?? null;
      })(),
      DETECT_TIMEOUT_MS,
    );

    if (!best || best.confidence < 0.5) return null;
    return String(best.detectedLanguage).split('-')[0];
  } catch {
    return null;
  }

 *   2. ffmpeg.wasm - the fallback for containers and codecs the browser refuses
 *      (mkv, avi, wmv, flv, ac3 tracks...). Downloaded from a CDN on demand, so
 *      it costs nothing until it is actually needed.
 */

const SAMPLE_RATE = 16000;


const CDN = readConfig(window.location.search).cdn;

class AudioExtractionError extends Error {
  constructor(message, cause) {
    super(message);
    this.name = 'AudioExtractionError';
    this.cause = cause;
  }
}

/** Duration in seconds, read from the media element without decoding anything. */
function probeDuration(url) {
  return new Promise((resolve) => {
    const probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.muted = true;
    const done = (value) => {
      probe.removeAttribute('src');
      probe.load();
      resolve(value);
    };
    probe.addEventListener('loadedmetadata', () => done(Number.isFinite(probe.duration) ? probe.duration : 0));
    probe.addEventListener('error', () => done(0));
    probe.src = url;
  });
}

function mixToMono(audioBuffer) {
  const channels = audioBuffer.numberOfChannels;
  const first = audioBuffer.getChannelData(0);
  if (channels === 1) return first.slice();
  const mono = new Float32Array(first.length);
  for (let channel = 0; channel < channels; channel += 1) {
    const data = audioBuffer.getChannelData(channel);
    for (let i = 0; i < mono.length; i += 1) mono[i] += data[i];
  }
  for (let i = 0; i < mono.length; i += 1) mono[i] /= channels;
  return mono;
}

/** Linear resample, only used when a browser ignores the requested sample rate. */
function resample(samples, fromRate, toRate) {
  if (fromRate === toRate) return samples;
  const ratio = fromRate / toRate;
  const length = Math.floor(samples.length / ratio);
  const output = new Float32Array(length);
  for (let i = 0; i < length; i += 1) {
    const position = i * ratio;
    const index = Math.floor(position);
    const fraction = position - index;
    const next = Math.min(index + 1, samples.length - 1);
    output[i] = samples[index] * (1 - fraction) + samples[next] * fraction;
  }
  return output;
}

async function decodeWithWebAudio(file) {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) throw new AudioExtractionError('Web Audio is not available');

  const bytes = await file.arrayBuffer();
  let context;
  try {
    context = new AudioContextClass({ sampleRate: SAMPLE_RATE });
  } catch {
    context = new AudioContextClass();
  }
  try {
    const decoded = await context.decodeAudioData(bytes);
    const mono = mixToMono(decoded);
    return resample(mono, decoded.sampleRate, SAMPLE_RATE);
  } finally {
    context.close?.();
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[data-src="${src}"]`);
    if (existing) {
      existing.dataset.loaded === 'yes'
        ? resolve()
        : existing.addEventListener('load', () => resolve(), { once: true });
      return;
    }
    const script = document.createElement('script');
    script.src = src;
    script.dataset.src = src;
    script.addEventListener('load', () => {
      script.dataset.loaded = 'yes';
      resolve();
    });
    script.addEventListener('error', () => reject(new AudioExtractionError(`Failed to load ${src}`)));

 * Load the UMD build of ffmpeg.wasm. The ESM build spawns its worker from a
 * relative URL, which browsers refuse to do cross-origin, so the worker chunk is
 * turned into a same-origin blob URL first.
 */
async function getFFmpeg(onNotice) {
  if (ffmpegPromise) return ffmpegPromise;
  ffmpegPromise = (async () => {
    onNotice?.('ffmpeg');
    await loadScript(`${CDN}/@ffmpeg/ffmpeg@${FFMPEG_VERSION}/dist/umd/ffmpeg.js`);
    await loadScript(`${CDN}/@ffmpeg/util@${FFMPEG_UTIL_VERSION}/dist/umd/index.js`);
    const { FFmpeg } = window.FFmpegWASM ?? {};
    const { toBlobURL } = window.FFmpegUtil ?? {};
    if (!FFmpeg || !toBlobURL) throw new AudioExtractionError('ffmpeg.wasm did not load');

    const core = `${CDN}/@ffmpeg/core@${FFMPEG_CORE_VERSION}/dist/umd`;
    const instance = new FFmpeg();
    await instance.load({
      coreURL: await toBlobURL(`${core}/ffmpeg-core.js`, 'text/javascript'),
      wasmURL: await toBlobURL(`${core}/ffmpeg-core.wasm`, 'application/wasm'),
      classWorkerURL: await toBlobURL(
        `${CDN}/@ffmpeg/ffmpeg@${FFMPEG_VERSION}/dist/umd/814.ffmpeg.js`,
        'text/javascript',
      ),
    });
    return instance;
  })().catch((error) => {
    ffmpegPromise = null;
    throw error;
  });
  return ffmpegPromise;
}

async function decodeWithFFmpeg(file, { onProgress, onNotice } = {}) {
  const ffmpeg = await getFFmpeg(onNotice);
  const inputName = `input${(file.name.match(/\.[a-z0-9]+$/i) || ['.bin'])[0]}`;
  const outputName = 'audio.raw';

  const listener = ({ progress }) => {
    if (Number.isFinite(progress)) onProgress?.(Math.min(1, Math.max(0, progress)));
  };
  ffmpeg.on('progress', listener);
  try {
    await ffmpeg.writeFile(inputName, new Uint8Array(await file.arrayBuffer()));
    // Raw 32-bit floats: no WAV header to parse and no extra copy.
    const code = await ffmpeg.exec([
      '-i', inputName,
      '-vn',
      '-ac', '1',
      '-ar', String(SAMPLE_RATE),
      '-f', 'f32le',
      outputName,
    ]);
    if (code !== 0) throw new AudioExtractionError(`ffmpeg exited with code ${code}`);
    const data = await ffmpeg.readFile(outputName);
    const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
    // Copy into an aligned buffer; the wasm heap view may not start on a 4-byte boundary.
    const aligned = new Uint8Array(bytes.length - (bytes.length % 4));
    aligned.set(bytes.subarray(0, aligned.length));
    return new Float32Array(aligned.buffer);
  } finally {
    ffmpeg.off?.('progress', listener);
    await ffmpeg.deleteFile(inputName).catch(() => {});
    await ffmpeg.deleteFile(outputName).catch(() => {});
  }
}

/**
 * @param {File|Blob} file
 * @param {{onProgress?:(ratio:number)=>void, onNotice?:(kind:string)=>void}} [options]
 * @returns {Promise<Float32Array>} mono 16 kHz samples
 */
async function extractAudio(file, options = {}) {
  if (!file || file.size === 0) throw new AudioExtractionError('empty file');
  try {
    options.onProgress?.(0.05);
    const samples = await decodeWithWebAudio(file);
    if (samples.length === 0) throw new AudioExtractionError('no audio track');
    options.onProgress?.(1);
    return samples;
  } catch (webAudioError) {
    try {
      const samples = await decodeWithFFmpeg(file, options);
      if (samples.length === 0) throw new AudioExtractionError('no audio track');
      options.onProgress?.(1);
      return samples;
    } catch (ffmpegError) {
      throw new AudioExtractionError(
        `Could not read the audio track (${webAudioError.message}; ${ffmpegError.message})`,
        ffmpegError,
      );
    }
  }
}

const AUDIO_SAMPLE_RATE = SAMPLE_RATE;

/**
 * Free Subtitles — application shell.
 *
 * Pipeline: file -> 16 kHz mono samples (main thread, Web Audio or ffmpeg.wasm)
 * -> worker (Whisper) -> segments -> optional translation (browser built-in
 * translator, or NLLB in the worker) -> editable cues -> SRT/VTT/TXT.
 */


const MODELS = [
  { id: 'onnx-community/whisper-tiny', he: 'זעיר — הכי מהיר, כ‑45MB', en: 'Tiny — fastest (~45MB)' },
  { id: 'onnx-community/whisper-base', he: 'בסיסי — מהיר ומדויק סביר, כ‑85MB', en: 'Base — fast, decent (~85MB)' },
  { id: 'onnx-community/whisper-small', he: 'בינוני — מומלץ, כ‑250MB', en: 'Small — recommended (~250MB)' },
  {
    id: 'onnx-community/whisper-large-v3-turbo',
    he: 'גדול Turbo — הכי מדויק, כ‑800MB, עדיף WebGPU',
    en: 'Large v3 Turbo — most accurate (~800MB, WebGPU preferred)',
  },
];

const SETTINGS_KEY = 'free-subtitles:settings';
const PHASE = { audio: [0, 0.1], transcribe: [0.1, 0.6], translate: [0.6, 1] };

const dom = {};
const state = {
  file: null,
  fileURL: '',
  duration: 0,
  audioLoaded: false,
  asrKey: '',
  sourceCode: 'en',
  tracks: new Map(),
  activeTrack: '',
  targets: new Set(['en']),
  running: false,
  cancelled: false,
  webgpu: false,
};

/* ------------------------------------------------------------------ engine */

/**
 * The engine (Whisper + NLLB) is assembled at runtime from the two source
 * blocks embedded in this page and started as a Web Worker.
 *
 * Speech recognition and translation get a worker each: sharing one makes the
 * second model fight the first for a 32-bit WASM address space and the run
 * stalls. A page opened straight from disk cannot start a worker from a blob
 * URL at all, so there is a fallback that runs a single engine inside the page
 * — slower and it blocks the interface, but it works with no server at all.
 */
const engines = { asr: null, mt: null };
const hooks = { progress: null, partial: null };
const pending = new Map();
let nextRequestId = 1;
let engineURL = '';
let inlineEngine = null;
let useInline = false;

function getEngineURL() {
  if (engineURL) return engineURL;
  const shared = document.getElementById('shared-source').textContent;
  const engine = document.getElementById('engine-source').textContent;
  // The engine reads the ?cdn / ?models overrides from here: a blob URL has no
  // query string of its own to read them from.
  const preamble = `const ENGINE_SEARCH = ${JSON.stringify(window.location.search)};\n`;
  engineURL = URL.createObjectURL(new Blob([preamble, shared, '\n', engine], { type: 'text/javascript' }));
  return engineURL;
}

/** Resolves once the worker reports itself ready, rejects if it cannot start. */
function startWorker(url) {
  return new Promise((resolve, reject) => {
    let worker;
    try {
      worker = new Worker(url, { type: 'module' });
    } catch (error) {
      reject(error);
      return;
    }
    const finish = (fn, value) => {
      clearTimeout(timer);
      worker.removeEventListener('message', onMessage);
      worker.removeEventListener('error', onError);
      fn(value);
    };
    const onMessage = (event) => {
      if (event.data?.type === 'ready') finish(resolve, worker);
    };
    const onError = (event) => {
      event.preventDefault?.();
      worker.terminate();
      finish(reject, new Error(event.message || 'worker failed to start'));
    };
    const timer = setTimeout(() => {
      worker.terminate();
      finish(reject, new Error('worker did not start in time'));
    }, 10000);
    worker.addEventListener('message', onMessage);
    worker.addEventListener('error', onError);
  });
}

async function ensureEngine(kind) {
  if (engines[kind]) return engines[kind];

  if (!useInline) {
    try {
      const worker = await startWorker(getEngineURL());
      worker.addEventListener('message', onEngineMessage);
      engines[kind] = {
        post: (message, transfer) => worker.postMessage(message, transfer ?? []),
        stop: () => worker.terminate(),
      };
      return engines[kind];
    } catch {
      useInline = true;
      log(t('note.inline'));
    }
  }

  // One in-page engine for both jobs; a second would only compete for memory.
  if (!inlineEngine) {
    const module = await import(getEngineURL());
    const handle = module.createEngine((message) => onEngineMessage({ data: message }));
    inlineEngine = { post: (message) => handle(message), stop: () => {}, inline: true };
  }
  engines[kind] = inlineEngine;
  return inlineEngine;
}

function failAll(error) {
  for (const { reject } of pending.values()) reject(error);
  pending.clear();
}

function settle(id, value, error) {
  const entry = pending.get(id);
  if (!entry) return;
  pending.delete(id);
  error ? entry.reject(error) : entry.resolve(value);
}

function onEngineMessage(event) {
  const message = event.data ?? {};
  switch (message.type) {
    case 'download':
      reportDownload(message);
      break;
    case 'stage':
      setStage(message.stage, message.detail);
      break;
    case 'notice':
      log(`⚠ ${message.message}`);
      break;
    case 'progress':
      hooks.progress?.(message.value);
      break;
    case 'partial':
      hooks.partial?.(message.segments ?? []);
      break;
    case 'audio-loaded':
    case 'released':
      settle(message.id, true);
      break;
    case 'transcribed':
      settle(message.id, message.segments ?? []);
      break;
    case 'translated':
      settle(message.id, message.texts ?? []);
      break;
    case 'error':
      settle(message.id, null, new Error(message.message));
      break;
    default:
      break;
  }
}

function requestFromEngine(kind, message, transfer) {
  const id = nextRequestId++;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    ensureEngine(kind).then(
      // Transferring detaches the buffer, which the in-page engine still needs.
      (engine) => engine.post({ ...message, id }, engine.inline ? undefined : transfer),
      (error) => settle(id, null, error),
    );
  });
}

function stopEngines() {
  let stopped = false;
  for (const kind of Object.keys(engines)) {
    if (!engines[kind]) continue;
    engines[kind].stop();
    engines[kind] = null;
    stopped = true;
  }
  inlineEngine = null;
  if (!stopped) return;
  failAll(new Error('cancelled'));
  state.audioLoaded = false;
  state.asrKey = '';
}

/* -------------------------------------------------------------- ui helpers */

function log(text) {
  const item = document.createElement('li');
  item.textContent = text;
  dom.log.appendChild(item);
  dom.log.scrollTop = dom.log.scrollHeight;
}

function setStatus(text, kind = '') {
  dom.status.textContent = text;
  dom.status.className = `status ${kind}`.trim();
}

function setStage(stage, detail = '') {
  const key = `stage.${stage}`;
  dom.stageLabel.textContent = detail ? `${t(key)} ${detail}` : t(key);
}

function setProgress(value, indeterminate = false) {
  dom.barFill.classList.toggle('indeterminate', indeterminate);
  if (indeterminate) {
    dom.percent.textContent = '';
    return;
  }
  const percent = Math.round(Math.min(1, Math.max(0, value)) * 100);
  dom.barFill.style.width = `${percent}%`;
  dom.percent.textContent = `${percent}%`;
}

function phaseProgress(phase, ratio, slice = [0, 1]) {
  const [phaseStart, phaseEnd] = PHASE[phase];
  const span = phaseEnd - phaseStart;
  const start = phaseStart + span * slice[0];
  const end = phaseStart + span * slice[1];
  setProgress(start + (end - start) * Math.min(1, Math.max(0, ratio)));
}

const downloadTotals = new Map();

function reportDownload({ file, progress, loaded, total }) {
  if (!file) return;
  const percent = Math.round(progress ?? 0);
  const previous = downloadTotals.get(file) ?? -1;
  // One log line per 20% so a multi-file download stays readable.
  if (percent >= 100 && previous < 100) {
    downloadTotals.set(file, 100);
    log(`✓ ${file}`);
  } else if (percent - previous >= 20) {
    downloadTotals.set(file, percent);
    const mb = total ? ` (${(loaded / 1048576).toFixed(0)}/${(total / 1048576).toFixed(0)} MB)` : '';
    log(`⬇ ${file} — ${percent}%${mb}`);
  }
  setProgress(0, true);
}

function formatBytes(bytes) {
  const units = ['B', 'KB', 'MB', 'GB'];
  let value = bytes;
  let unit = 0;
  while (value >= 1024 && unit < units.length - 1) {
    value /= 1024;
    unit += 1;
  }
  return `${value.toFixed(value >= 10 || unit === 0 ? 0 : 1)} ${units[unit]}`;
}

function formatDuration(seconds) {
  if (!Number.isFinite(seconds) || seconds <= 0) return '—';
  const total = Math.round(seconds);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return h > 0
    ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
    : `${m}:${String(s).padStart(2, '0')}`;
}

/* ---------------------------------------------------------------- settings */

function loadSettings() {
  try {
    return JSON.parse(localStorage.getItem(SETTINGS_KEY)) ?? {};
  } catch {
    return {};
  }
}

function saveSettings() {
  try {
    localStorage.setItem(
      SETTINGS_KEY,
      JSON.stringify({
        ui: getUILanguage(),
        model: dom.model.value,
        sourceLang: dom.sourceLang.value,
        device: dom.device.value,
        targets: [...state.targets],
      }),
    );
  } catch {
    /* private mode: settings simply do not persist */
  }
}

/* ------------------------------------------------------------- form build  */

function fillModels() {
  const ui = getUILanguage();
  const selected = dom.model.value;
  dom.model.replaceChildren(
    ...MODELS.map((model) => {
      const option = document.createElement('option');
      option.value = model.id;
      option.textContent = ui === 'he' ? model.he : model.en;
      return option;
    }),
  );
  if (selected) dom.model.value = selected;
}

function fillSourceLanguages() {
  const ui = getUILanguage();
  const selected = dom.sourceLang.value;
  const auto = document.createElement('option');
  auto.value = '';
  auto.textContent = t('options.source.auto');
  dom.sourceLang.replaceChildren(
    auto,
    ...sortedLanguages(ui).map((language) => {
      const option = document.createElement('option');
      option.value = language.code;
      option.textContent = ui === 'he' ? language.he : language.en;
      return option;
    }),
  );
  dom.sourceLang.value = selected;
}

function fillDevices() {
  const selected = dom.device.value;
  dom.device.replaceChildren(
    ...[
      ['auto', t('options.engine.auto')],
      ['webgpu', t('options.engine.webgpu')],
      ['wasm', t('options.engine.wasm')],
    ].map(([value, label]) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = label;
      return option;
    }),
  );
  dom.device.value = selected || 'auto';
}

/** `navigator.gpu` can exist while no adapter is actually available. */
async function probeWebGPU() {
  try {
    state.webgpu = Boolean(await navigator.gpu?.requestAdapter());
  } catch {
    state.webgpu = false;
  }
  updateDeviceNote();
}

function updateDeviceNote() {
  dom.deviceNote.textContent = state.webgpu ? 'WebGPU ✓' : 'WebGPU ✗ — WASM';
}

function renderTargets() {
  const ui = getUILanguage();
  const query = dom.targetSearch.value.trim().toLowerCase();
  const languages = sortedLanguages(ui).filter((language) => {
    if (!query) return true;
    return (
      language.he.toLowerCase().includes(query) ||
      language.en.toLowerCase().includes(query) ||
      language.code.includes(query)
    );
  });

  dom.targetList.replaceChildren(
    ...languages.map((language) => {
      const label = document.createElement('label');
      label.className = 'target-option';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = language.code;
      input.checked = state.targets.has(language.code);
      input.addEventListener('change', () => {
        input.checked ? state.targets.add(language.code) : state.targets.delete(language.code);
        renderChips();
        saveSettings();
      });
      const name = document.createElement('span');
      name.textContent = ui === 'he' ? language.he : language.en;
      const code = document.createElement('span');
      code.className = 'code';
      code.textContent = language.code;
      label.append(input, name, code);
      return label;
    }),
  );
  renderChips();
}

function renderChips() {
  const ui = getUILanguage();
  if (state.targets.size === 0) {
    const empty = document.createElement('span');
    empty.className = 'hint';
    empty.textContent = t('options.targets.empty');
    dom.targetChips.replaceChildren(empty);
    return;
  }
  dom.targetChips.replaceChildren(
    ...[...state.targets].map((code) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = languageName(code, ui);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = '×';
      remove.setAttribute('aria-label', `${languageName(code, ui)} ✕`);
      remove.addEventListener('click', () => {
        state.targets.delete(code);
        renderTargets();
        saveSettings();
      });
      chip.appendChild(remove);
      return chip;
    }),
  );
}

/* -------------------------------------------------------------- file input */

async function acceptFile(file) {
  if (!file) return;
  if (state.fileURL) URL.revokeObjectURL(state.fileURL);

  state.file = file;
  state.fileURL = URL.createObjectURL(file);
  state.audioLoaded = false;
  state.asrKey = '';
  state.tracks.clear();
  stopEngines();

  dom.fileName.textContent = file.name;
  dom.fileCard.hidden = false;
  dom.results.hidden = true;
  setStatus('');

  dom.player.src = state.fileURL;
  state.duration = await probeDuration(state.fileURL);
  dom.fileInfo.textContent = `${t('file.duration')}: ${formatDuration(state.duration)} · ${t('file.size')}: ${formatBytes(file.size)}`;
}

/* ---------------------------------------------------------------- pipeline */

function resolveDevice() {
  const choice = dom.device.value;
  if (choice === 'auto') return state.webgpu ? 'webgpu' : 'wasm';
  return choice;
}

async function translateSegments(segments, sourceCode, targetCode, slice) {
  const source = getLanguage(sourceCode);
  const target = getLanguage(targetCode);
  if (!target) return null;

  setStage('translate', `${languageName(sourceCode)} → ${languageName(targetCode)}`);
  const texts = segments.map((segment) => segment.text);

  const builtin = await createBuiltinTranslator(sourceCode, targetCode, () => setProgress(0, true));
  if (builtin) {
    log(`${t('note.translator.builtin')}: ${sourceCode} → ${targetCode}`);
    const translated = [];
    for (const text of texts) {
      if (state.cancelled) throw new Error('cancelled');
      translated.push(await builtin.translate(text));
      phaseProgress('translate', translated.length / texts.length, slice);
    }
    builtin.destroy();
    return segments.map((segment, index) => ({ ...segment, text: translated[index] }));
  }

  log(`${t('note.translator.model')}: ${sourceCode} → ${targetCode}`);
  hooks.progress = (value) => phaseProgress('translate', value, slice);
  const translated = await requestFromEngine('mt', {
    type: 'translate',
    texts,
    src: source?.nllb ?? 'eng_Latn',
    tgt: target.nllb,
  });
  hooks.progress = null;
  return segments.map((segment, index) => ({ ...segment, text: translated[index] ?? segment.text }));
}

async function generate() {
  if (state.running) return;
  if (!state.file) {
    setStatus(t('error.nofile'), 'error');
    return;
  }

  state.running = true;
  state.cancelled = false;
  dom.generate.disabled = true;
  dom.cancel.hidden = false;
  dom.progressPanel.hidden = false;
  dom.log.replaceChildren();
  downloadTotals.clear();
  setStatus('');
  setProgress(0);

  try {
    if (!state.audioLoaded) {
      setStage('audio');
      const samples = await extractAudio(state.file, {
        onProgress: (ratio) => phaseProgress('audio', ratio),
        onNotice: (kind) => {
          if (kind === 'ffmpeg') {
            setStage('ffmpeg');
            log('ffmpeg.wasm');
          }
        },
      });
      state.duration = samples.length / AUDIO_SAMPLE_RATE;
      log(`🎧 ${formatDuration(state.duration)}`);
      await requestFromEngine('asr', { type: 'load-audio', audio: samples.buffer }, [samples.buffer]);
      state.audioLoaded = true;
    }

    const model = dom.model.value;
    const sourceChoice = dom.sourceLang.value;
    const device = resolveDevice();
    const asrKey = `${model}|${sourceChoice}|${device}`;

    if (state.asrKey !== asrKey || !state.tracks.has(state.sourceCode)) {
      setStage('transcribe');
      const preview = [];
      hooks.progress = (value) => phaseProgress('transcribe', value);
      hooks.partial = (segments) => {
        preview.push(...segments);
        setStatus(preview.slice(-1)[0]?.text ?? '');
      };
      let segments;
      try {
        segments = await requestFromEngine('asr', {
          type: 'transcribe',
          model,
          device,
          language: sourceChoice || undefined,
        });
      } catch (error) {
        // WebGPU can be present but unusable (driver, memory, shader limits).
        // An automatic choice retries on WASM rather than failing the run.
        if (device !== 'webgpu' || dom.device.value !== 'auto' || state.cancelled) throw error;
        state.webgpu = false;
        updateDeviceNote();
        log(`⚠ WebGPU → WASM (${error.message})`);
        segments = await requestFromEngine('asr', {
          type: 'transcribe',
          model,
          device: 'wasm',
          language: sourceChoice || undefined,
        });
      }
      hooks.progress = null;
      hooks.partial = null;
      if (segments.length === 0) throw new Error(t('error.audio'));

      const transcriptSample = segments
        .slice(0, 60)
        .map((segment) => segment.text)
        .join(' ');
      if (sourceChoice) {
        state.sourceCode = sourceChoice;
      } else {
        setStage('detect');
        const fromBrowser = await detectWithBrowser(transcriptSample);
        state.sourceCode = getLanguage(fromBrowser) ? fromBrowser : detectLanguage(transcriptSample);
      }

      state.tracks.clear();
      state.tracks.set(state.sourceCode, segments);
      state.activeTrack = state.sourceCode;
      state.asrKey = asrKey;
      log(`📝 ${segments.length} ${t('result.segments')} · ${languageName(state.sourceCode)}`);
      renderResults();
    }

    const originals = state.tracks.get(state.sourceCode) ?? [];
    const targets = [...state.targets].filter((code) => code !== state.sourceCode && !state.tracks.has(code));

    for (let index = 0; index < targets.length; index += 1) {
      if (state.cancelled) throw new Error('cancelled');
      const slice = [index / targets.length, (index + 1) / targets.length];
      const translated = await translateSegments(originals, state.sourceCode, targets[index], slice);
      if (translated) {
        state.tracks.set(targets[index], translated);
        log(`🌍 ${languageName(targets[index])}`);
        renderResults();
      }
    }

    setProgress(1);
    setStage('done');
    setStatus(t('stage.done'), 'done');
    dom.generate.textContent = t('action.again');
  } catch (error) {
    if (state.cancelled || error?.message === 'cancelled') {
      setStage('cancelled');
      setStatus(t('stage.cancelled'));
    } else {
      console.error(error);
      setStatus(`${t('error.generic')}: ${error?.message ?? error}`, 'error');
    }
  } finally {
    hooks.progress = null;
    hooks.partial = null;
    state.running = false;
    dom.generate.disabled = false;
    dom.cancel.hidden = true;
  }
}

function cancel() {
  if (!state.running) return;
  state.cancelled = true;
  stopEngines();
}

/* ----------------------------------------------------------------- results */

function activeSegments() {
  return state.tracks.get(state.activeTrack) ?? [];
}

/** "12:34" for short media, "01:12:34" once the hour matters. */
function shortTime(seconds) {
  const full = formatTime(seconds, '.').slice(0, 8);
  return seconds >= 3600 ? full : full.slice(3);
}

function renderResults() {
  if (state.tracks.size === 0) return;
  dom.results.hidden = false;
  if (!state.tracks.has(state.activeTrack)) state.activeTrack = [...state.tracks.keys()][0];

  const ui = getUILanguage();
  dom.tabs.replaceChildren(
    ...[...state.tracks.keys()].map((code) => {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'tab';
      tab.role = 'tab';
      tab.setAttribute('aria-selected', String(code === state.activeTrack));
      const suffix = code === state.sourceCode ? ` · ${t('result.original')}` : '';
      tab.textContent = `${languageName(code, ui)}${suffix}`;
      tab.addEventListener('click', () => {
        state.activeTrack = code;
        renderResults();
      });
      return tab;
    }),
  );

  const segments = activeSegments();
  const rtl = isRTL(state.activeTrack);
  dom.overlay.dir = rtl ? 'rtl' : 'ltr';

  dom.cues.replaceChildren(
    ...segments.map((segment, index) => {
      const item = document.createElement('li');
      item.className = 'cue';
      item.dataset.index = String(index);

      const time = document.createElement('button');
      time.type = 'button';
      time.className = 'cue-time';
      // A time range always reads left to right, even inside an RTL page.
      time.dir = 'ltr';
      time.textContent = `${shortTime(segment.start)} → ${shortTime(segment.end)}`;
      time.addEventListener('click', () => {
        dom.player.currentTime = segment.start;
        dom.player.play().catch(() => {});
      });

      const text = document.createElement('textarea');
      text.value = segment.text;
      text.rows = 2;
      text.dir = rtl ? 'rtl' : 'ltr';
      text.addEventListener('input', () => {
        segment.text = text.value;
      });

      item.append(time, text);
      return item;
    }),
  );
}

function downloadBlob(content, filename, mime) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function baseName() {
  return (state.file?.name ?? 'subtitles').replace(/\.[^.]+$/, '');
}

function download(format) {
  const segments = activeSegments();
  if (segments.length === 0) return;
  const spec = FORMATS[format];
  downloadBlob(spec.build(segments), `${baseName()}.${state.activeTrack}.${spec.extension}`, spec.mime);
}

async function downloadEveryLanguage() {
  for (const [code, segments] of state.tracks) {
    downloadBlob(toSRT(segments), `${baseName()}.${code}.srt`, FORMATS.srt.mime);
    await new Promise((resolve) => setTimeout(resolve, 350));
  }
}

async function copyActive() {
  const segments = activeSegments();
  if (segments.length === 0) return;
  try {
    await navigator.clipboard.writeText(toSRT(segments));
    const original = dom.copy.textContent;
    dom.copy.textContent = t('copied');
    setTimeout(() => {
      dom.copy.textContent = original;
    }, 1500);
  } catch {
    setStatus(t('error.generic'), 'error');
  }
}

/* --------------------------------------------------------- subtitle overlay */

let overlayFrame = 0;
let lastCueIndex = -1;

function syncOverlay() {
  const segments = activeSegments();
  const index = segmentAt(segments, dom.player.currentTime);
  if (index !== lastCueIndex) {
    lastCueIndex = index;
    dom.overlay.textContent = index >= 0 ? segments[index].text : '';
    for (const node of dom.cues.children) node.classList.remove('active');
    if (index >= 0) {
      const row = dom.cues.children[index];
      row?.classList.add('active');
      // Only follow along during playback, so editing is never yanked away.
      if (!dom.player.paused) row?.scrollIntoView({ block: 'nearest' });
    }
  }
  overlayFrame = requestAnimationFrame(syncOverlay);
}

/* --------------------------------------------------------------- bootstrap */

function switchUILanguage() {
  const next = getUILanguage() === 'he' ? 'en' : 'he';
  setUILanguage(next);
  document.documentElement.lang = next;
  document.documentElement.dir = next === 'he' ? 'rtl' : 'ltr';
  applyTranslations();
  fillModels();
  fillSourceLanguages();
  fillDevices();
  renderTargets();
  if (state.tracks.size) renderResults();
  if (state.file) {
    dom.fileInfo.textContent = `${t('file.duration')}: ${formatDuration(state.duration)} · ${t('file.size')}: ${formatBytes(state.file.size)}`;
  }
  saveSettings();
}

function bindDropzone() {
  const stop = (event) => {
    event.preventDefault();
    event.stopPropagation();
  };
  for (const type of ['dragenter', 'dragover']) {
    dom.drop.addEventListener(type, (event) => {
      stop(event);
      dom.drop.classList.add('dragging');
    });
  }
  for (const type of ['dragleave', 'drop']) {
    dom.drop.addEventListener(type, (event) => {
      stop(event);
      dom.drop.classList.remove('dragging');
    });
  }
  dom.drop.addEventListener('drop', (event) => acceptFile(event.dataTransfer?.files?.[0]));
  dom.drop.addEventListener('click', () => dom.fileInput.click());
  dom.drop.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      dom.fileInput.click();
    }
  });
  dom.fileReplace.addEventListener('click', () => dom.fileInput.click());
  dom.fileInput.addEventListener('change', () => acceptFile(dom.fileInput.files?.[0]));
}

function init() {
  Object.assign(dom, {
    uiLang: document.getElementById('ui-lang'),
    drop: document.getElementById('drop'),
    fileInput: document.getElementById('file-input'),
    fileCard: document.getElementById('file-card'),
    fileName: document.getElementById('file-name'),
    fileInfo: document.getElementById('file-info'),
    fileReplace: document.getElementById('file-replace'),
    model: document.getElementById('model'),
    sourceLang: document.getElementById('source-lang'),
    device: document.getElementById('device'),
    deviceNote: document.getElementById('device-note'),
    targetSearch: document.getElementById('target-search'),
    targetList: document.getElementById('target-list'),
    targetChips: document.getElementById('target-chips'),
    generate: document.getElementById('generate'),
    cancel: document.getElementById('cancel'),
    progressPanel: document.getElementById('progress-panel'),
    stageLabel: document.getElementById('stage-label'),
    percent: document.getElementById('progress-percent'),
    barFill: document.getElementById('bar-fill'),
    log: document.getElementById('log'),
    status: document.getElementById('status'),
    results: document.getElementById('results'),
    player: document.getElementById('player'),
    overlay: document.getElementById('overlay'),
    tabs: document.getElementById('tabs'),
    cues: document.getElementById('cues'),
    copy: document.getElementById('copy'),
  });

  const saved = loadSettings();
  setUILanguage(saved.ui ?? 'he');
  document.documentElement.lang = getUILanguage();
  document.documentElement.dir = getUILanguage() === 'he' ? 'rtl' : 'ltr';
  if (Array.isArray(saved.targets)) state.targets = new Set(saved.targets.filter(getLanguage));

  applyTranslations();
  fillModels();
  fillSourceLanguages();
  fillDevices();

  dom.model.value = saved.model ?? ('gpu' in navigator ? 'onnx-community/whisper-small' : 'onnx-community/whisper-base');
  if (!dom.model.value) dom.model.value = MODELS[1].id;
  dom.sourceLang.value = saved.sourceLang ?? '';
  dom.device.value = saved.device ?? 'auto';
  probeWebGPU();
  renderTargets();

  bindDropzone();
  dom.uiLang.addEventListener('click', switchUILanguage);
  dom.targetSearch.addEventListener('input', renderTargets);
  dom.generate.addEventListener('click', generate);
  dom.cancel.addEventListener('click', cancel);
  dom.model.addEventListener('change', saveSettings);
  dom.sourceLang.addEventListener('change', saveSettings);
  dom.device.addEventListener('change', saveSettings);
  document.getElementById('download-srt').addEventListener('click', () => download('srt'));
  document.getElementById('download-vtt').addEventListener('click', () => download('vtt'));
  document.getElementById('download-txt').addEventListener('click', () => download('txt'));
  document.getElementById('download-all').addEventListener('click', downloadEveryLanguage);
  dom.copy.addEventListener('click', copyActive);

  cancelAnimationFrame(overlayFrame);
  overlayFrame = requestAnimationFrame(syncOverlay);

  // Start the recognition engine now, so a browser that cannot run workers
  // falls back to the in-page engine before the user presses anything.
  ensureEngine('asr').catch(() => {});
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init, { once: true });
} else {
  init();
}

  </script>
</body>
