<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="description" content="EXIT 8 — מסדרון תת־קרקעי שחוזר על עצמו. מצא את האנומליות, חזור אחורה כשצריך, וצא דרך יציאה 8.">
  <title>EXIT 8</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root {
      --bg: #0b0c0e;
      --panel: rgba(13, 14, 17, 0.86);
      --line: rgba(255, 255, 255, 0.09);
      --text: #ececea;
      --muted: #a3a6ab;
      --yellow: #f4c20d;
      --ink: #141414;
      --danger: #e5484d;
      --ok: #3fb47a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    body { font-family: "Rubik", "Segoe UI", "Arial Hebrew", Arial, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
    canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; touch-action: none; }

    .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); overflow-y: auto; touch-action: pan-y; background: radial-gradient(ellipse at center, rgba(0,0,0,0.25), rgba(0,0,0,0.78)); }
    .screen.show { display: flex; }
    .panel { width: min(560px, 100%); margin: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px 26px; box-shadow: 0 30px 80px rgba(0,0,0,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .panel.narrow { width: min(420px, 100%); }
    h1, h2, h3 { margin: 0; font-weight: 800; }
    h2 { font-size: 1.05rem; letter-spacing: 0.02em; color: var(--yellow); margin: 22px 0 10px; }
    p { margin: 0; line-height: 1.6; }

    .sign-logo { display: inline-flex; align-items: center; gap: 14px; background: var(--yellow); color: var(--ink); border-radius: 8px; padding: 8px 18px 8px 8px; box-shadow: 0 0 0 3px #222 inset, 0 10px 40px rgba(244,194,13,0.18); direction: ltr; }
    .sign-logo .num { background: var(--ink); color: #fff; font-weight: 900; font-size: 46px; line-height: 1; width: 62px; height: 62px; display: grid; place-items: center; border-radius: 6px; }
    .sign-logo .jp { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; font-weight: 900; font-size: 40px; }
    .sign-logo .en { font-weight: 800; font-size: 34px; }
    .sign-logo svg { width: 28px; height: 36px; }
    .subtitle { margin-top: 14px; font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .tagline { margin-top: 6px; color: var(--muted); font-size: 0.95rem; }

    ol.rules { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: r; }
    ol.rules li { counter-increment: r; display: flex; gap: 12px; align-items: flex-start; line-height: 1.5; }
    ol.rules li::before { content: counter(r); flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--yellow); color: var(--ink); font-weight: 800; display: grid; place-items: center; font-size: 0.85rem; margin-top: 1px; }
    .hint { margin-top: 12px; color: var(--muted); font-size: 0.9rem; }
    .controls { margin-top: 16px; color: var(--muted); font-size: 0.82rem; line-height: 1.7; }
    .found { margin-top: 6px; color: var(--muted); font-size: 0.82rem; }

    .btn { font: inherit; font-weight: 600; color: var(--text); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 12px; padding: 11px 16px; min-height: 46px; cursor: pointer; transition: background .15s, transform .1s, border-color .15s; }
    .btn:hover { background: rgba(255,255,255,0.11); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    .btn.primary { display: block; width: 100%; margin-top: 22px; background: var(--yellow); color: var(--ink); border-color: transparent; font-weight: 800; font-size: 1.08rem; min-height: 54px; }
    .btn.primary:hover { background: #ffd23a; }
    .btn.danger { color: #ffb3b5; }
    .row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .row .btn { flex: 1 1 120px; }
    .stack { display: grid; gap: 10px; margin-top: 18px; }

    .codex-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .codex-count { color: var(--muted); font-size: 0.9rem; }
    .bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,0.08); margin: 14px 0 16px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--yellow); width: 0; transition: width .4s; }
    ul.codex { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; max-height: min(52vh, 460px); overflow-y: auto; padding-inline-end: 4px; }
    ul.codex li { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 0.9rem; display: flex; gap: 9px; align-items: center; background: rgba(255,255,255,0.03); }
    ul.codex li .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.78rem; min-width: 1.6em; }
    ul.codex li.locked { color: #6c6f75; }
    ul.codex li.new { border-color: rgba(244,194,13,0.6); }
    .empty { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }

    .field { display: grid; gap: 8px; margin-top: 16px; }
    .field label { font-weight: 600; font-size: 0.95rem; display: flex; justify-content: space-between; }
    .field output { color: var(--muted); font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--yellow); height: 28px; }
    .check { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-weight: 600; cursor: pointer; }
    .check input { width: 22px; height: 22px; accent-color: var(--yellow); }
    select { font: inherit; color: var(--text); background: #1a1b1f; border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 44px; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
    .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; background: rgba(255,255,255,0.03); }
    .stat b { display: block; font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 0.8rem; }
    .best { margin-top: 14px; text-align: center; color: var(--muted); }
    .best.newbest { color: var(--yellow); font-weight: 700; }
    .spotted { margin-top: 10px; color: var(--muted); font-size: 0.9rem; line-height: 1.7; }
    .end-title { font-size: 2rem; }
    .end-text { color: var(--muted); margin-top: 6px; }

    #loading p { color: var(--muted); margin-top: 16px; }
    #loading .inner { text-align: center; }
    .spinner { width: 36px; height: 36px; margin: 0 auto; border-radius: 50%; border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--yellow); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ffb3b5; max-width: 420px; text-align: center; line-height: 1.6; }

    #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,0.55); pointer-events: none; display: none; }
    body.playing #crosshair { display: block; }
    body.touchmode #crosshair { display: none; }

    .toast { position: fixed; inset-inline: 0; bottom: max(28px, env(safe-area-inset-bottom)); margin: auto; width: fit-content; max-width: calc(100% - 32px); background: rgba(10,10,12,0.82); border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 999px; font-size: 0.92rem; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; pointer-events: none; }
    .toast.show { opacity: 1; transform: none; }

    #touchUi { display: none; }
    body.touchmode.playing #touchUi { display: block; }
    #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.05); pointer-events: none; display: none; }
    #joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,0.28); }
    #joy.run i { background: rgba(244,194,13,0.7); }
    #touchHint { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); inset-inline: 22px; text-align: center; color: rgba(255,255,255,0.5); font-size: 0.8rem; pointer-events: none; transition: opacity 1.2s; }
    body.hint-done #touchHint { opacity: 0; }
    #btnPauseTouch { position: fixed; top: max(14px, env(safe-area-inset-top)); inset-inline-end: 14px; width: 48px; height: 48px; min-height: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,0.35); }
    #btnPauseTouch svg { width: 18px; height: 18px; }

    @media (max-height: 640px) { .panel { padding: 20px 18px; } h2 { margin-top: 14px; } .tagline { display: none; } }
    @media (max-width: 420px) { .sign-logo .jp { font-size: 30px; } .sign-logo .en { font-size: 26px; } .sign-logo .num { width: 50px; height: 50px; font-size: 36px; } .stats { gap: 6px; } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .toast, .btn, .bar > i { transition: none; } }
  </style>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="EXIT 8"></canvas>
  <div id="crosshair" aria-hidden="true"></div>

  <section id="loading" class="screen show" aria-live="polite">
    <div class="inner">
      <div class="spinner" aria-hidden="true"></div>
      <p data-i18n="loading">טוען את המסדרון…</p>
    </div>
  </section>

  <section id="menu" class="screen" aria-labelledby="menuTitle">
    <div class="panel">
      <h1 id="menuTitle" class="sign-logo" aria-label="EXIT 8">
        <span class="num">8</span><span class="jp">出口</span><span class="en">Exit</span>
        <svg viewBox="0 0 28 36" aria-hidden="true"><path d="M14 0 28 15H19V36H9V15H0Z" fill="#141414"/></svg>
      </h1>
      <p class="subtitle" data-i18n="subtitle"></p>
      <p class="tagline" data-i18n="tagline"></p>
      <h2 data-i18n="rulesTitle"></h2>
      <ol class="rules" id="rulesList"></ol>
      <p class="hint" data-i18n="rulesHint"></p>
      <button class="btn primary" id="btnStart" data-i18n="start"></button>
      <div class="row">
        <button class="btn" id="btnCodex" data-i18n="codex"></button>
        <button class="btn" id="btnSettings" data-i18n="settings"></button>
        <button class="btn" id="btnLang" lang="en"></button>
      </div>
      <p class="controls" id="controlsText"></p>
      <p class="controls" data-i18n="headphones"></p>

    </div>
  </section>

  <section id="pause" class="screen" aria-labelledby="pauseTitle">
    <div class="panel narrow">
      <h1 id="pauseTitle" data-i18n="paused"></h1>
      <div class="stack">
        <button class="btn primary" id="btnResume" data-i18n="resume" style="margin-top:0"></button>
        <button class="btn" id="btnCodex2" data-i18n="codex"></button>
        <button class="btn" id="btnSettings2" data-i18n="settings"></button>
        <button class="btn" id="btnRestart" data-i18n="restart"></button>
        <button class="btn" id="btnMenu" data-i18n="toMenu"></button>
      </div>
    </div>
  </section>

  <section id="codex" class="screen" aria-labelledby="codexTitle">
    <div class="panel">
      <div class="codex-head">
        <h1 id="codexTitle" data-i18n="codex"></h1>
        <span class="codex-count" id="codexCount"></span>
      </div>
      <div class="bar" aria-hidden="true"><i id="codexBar"></i></div>
      <p class="empty" id="codexEmpty" data-i18n="codexEmpty"></p>
      <ul class="codex" id="codexList"></ul>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="btnCodexBack" data-i18n="back"></button>
        <button class="btn danger" id="btnCodexReset" data-i18n="resetCodex"></button>
      </div>
    </div>
  </section>

  <section id="settings" class="screen" aria-labelledby="settingsTitle">
    <div class="panel narrow">
      <h1 id="settingsTitle" data-i18n="settings"></h1>
      <div class="field">
        <label for="optSens"><span data-i18n="sensitivity"></span><output id="outSens"></output></label>
        <input id="optSens" type="range" min="0.3" max="3" step="0.1">
      </div>
      <div class="field">
        <label for="optVol"><span data-i18n="volume"></span><output id="outVol"></output></label>
        <input id="optVol" type="range" min="0" max="1" step="0.05">
      </div>
      <div class="field">
        <label for="optQuality" data-i18n="quality"></label>
        <select id="optQuality">
          <option value="high" data-i18n="qualityHigh"></option>
          <option value="low" data-i18n="qualityLow"></option>
        </select>
      </div>
      <label class="check"><input id="optFlash" type="checkbox"><span data-i18n="reduceFlash"></span></label>
      <label class="check"><input id="optScare" type="checkbox"><span data-i18n="jumpscares"></span></label>
      <button class="btn primary" id="btnSettingsBack" data-i18n="back"></button>
    </div>
  </section>

  <section id="end" class="screen" aria-labelledby="endTitle">
    <div class="panel">
      <h1 id="endTitle" class="end-title" data-i18n="endTitle"></h1>
      <p class="end-text" data-i18n="endText"></p>
      <div class="stats">
        <div class="stat"><b id="stTime"></b><span data-i18n="statTime"></span></div>
        <div class="stat"><b id="stLoops"></b><span data-i18n="statLoops"></span></div>
        <div class="stat"><b id="stMistakes"></b><span data-i18n="statMistakes"></span></div>
      </div>
      <p class="best" id="stBest"></p>
      <p class="spotted" id="stSpotted"></p>
      <button class="btn primary" id="btnAgain" data-i18n="playAgain"></button>
      <div class="row">
        <button class="btn" id="btnCodex3" data-i18n="codex"></button>
        <button class="btn" id="btnMenu2" data-i18n="toMenu"></button>
      </div>
    </div>
  </section>

  <section id="fatal" class="screen"><p class="error" id="fatalText"></p></section>

  <div id="touchUi">
    <div id="joy" aria-hidden="true"><i></i></div>
    <p id="touchHint"></p>
    <button class="btn" id="btnPauseTouch" aria-label="השהיה">
      <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="1" fill="#fff"/><rect x="11" y="2" width="4" height="14" rx="1" fill="#fff"/></svg>
    </button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>/* js/logic.js */
/* EXIT 8 — pure game logic (no DOM, no WebGL).
 * Loaded as a classic <script> in the browser and imported by the node tests.
 *
 * The corridor loop lives in a fixed "loop frame" (metres, X right, Z forward, Y up):
 *
 *   Lnext ┐                  each loop is   L ─ C1 ─ H ─ C2 ─ (next L)
 *         C2 ┐               L  = lobby with the exit-number sign
 *            H (hallway)     C1 = connector from the lobby into the hallway
 *         C1 ┘               H  = the long hallway where anomalies live
 *   L ────┘                  C2 = connector to the next lobby
 *   C2prev┘
 *
 * Every connector is point-symmetric about its own centre, so walking back through
 * C1 can be mapped onto walking forward through C2prev with a 180° turn, and walking
 * forward through C2 is a pure translation by D. The player never sees the seam.
 */
(function (root) {
  'use strict';
  const E = (root.EXIT8 = root.EXIT8 || {});

  const W = 3;              // corridor width
  const CEIL = 3;           // ceiling height
  const LOBBY = 16;         // lobby length
  const HALL = 32;          // normal hallway length
  const HALL_LONG = 48;     // "corridor too long" anomaly
  const STAIRS = 13;        // exit staircase run
  const STAIR_RISE = 4.5;

  const TRIG_FWD = 13.5;    // C2 midline: crossing it +X means "kept going"
  const TRIG_BACK = 4.5;    // C1 midline: crossing it -X (after arming) means "turned back"
  const TRIG_START = -5;    // just behind the arrival point in C2prev: crossing -X means "turned back"
  const ARM_X = 5.5;        // the player must reach this far into C1 before C1 counts as a turn-back
  const SPAWN = { x: 0, z: 2.2, yaw: 0 };
  const ARRIVAL_X = -4.5;
  const MAX_COUNT = 8;

  function layout(opts) {
    const hl = (opts && opts.hl) || HALL;
    const exit = !!(opts && opts.exit);
    const rects = [
      { id: 'Lprev', x0: -19.5, x1: -16.5, z0: -32, z1: -26 },
      { id: 'C1prev', x0: -16.5, x1: -10.5, z0: -29, z1: -26 },
      { id: 'Hprev', x0: -10.5, x1: -7.5, z0: -29, z1: 3 },
      { id: 'C2prev', x0: -7.5, x1: -1.5, z0: 0, z1: 3 },
      { id: 'L', x0: -1.5, x1: 1.5, z0: 0, z1: LOBBY },
      { id: 'C1', x0: 1.5, x1: 7.5, z0: 13, z1: 16 },
      { id: 'H', x0: 7.5, x1: 10.5, z0: 13, z1: 13 + hl },
    ];
    if (exit) {
      rects.push({ id: 'S', x0: 7.5, x1: 10.5, z0: 13 + hl, z1: 13 + hl + STAIRS, stairs: true });
    } else {
      rects.push({ id: 'C2', x0: 10.5, x1: 16.5, z0: 10 + hl, z1: 13 + hl });
      rects.push({ id: 'Lnext', x0: 16.5, x1: 19.5, z0: 10 + hl, z1: 26 + hl });
    }
    return { hl, exit, D: { x: 18, z: hl + 10 }, rects };
  }

  function rectById(lay, id) {
    for (const r of lay.rects) if (r.id === id) return r;
    return null;
  }

  function inRect(r, x, z, pad) {
    const p = pad || 0;
    return x >= r.x0 - p && x <= r.x1 + p && z >= r.z0 - p && z <= r.z1 + p;
  }

  function walkable(lay, x, z) {
    for (const r of lay.rects) if (inRect(r, x, z, 1e-6)) return true;
    return false;
  }

  /** True when a player of radius rad can stand at (x, z). */
  function canStand(lay, x, z, rad) {
    return walkable(lay, x - rad, z - rad) && walkable(lay, x + rad, z - rad) &&
      walkable(lay, x - rad, z + rad) && walkable(lay, x + rad, z + rad);
  }

  function floorY(lay, x, z) {
    if (!lay.exit) return 0;
    const s = rectById(lay, 'S');
    if (!s || !inRect(s, x, z)) return 0;
    const t = (z - (s.z0 + 1)) / (STAIRS - 3);
    return Math.max(0, Math.min(1, t)) * STAIR_RISE;
  }

  function reachedExit(lay, x, z) {
    return lay.exit && z > 13 + lay.hl + STAIRS - 2.2;
  }

  /**
   * Checks whether moving from prev to cur leaves the current loop.
   * Returns null, or { type: 'forward' | 'back', x, z, turn } where (x, z) is the
   * player's new position in the next loop frame and turn is added to the yaw.
   */
  function transition(lay, prev, cur, armed) {
    const hl = lay.hl;
    if (!lay.exit && prev.x < TRIG_FWD && cur.x >= TRIG_FWD && cur.z >= 9.5 + hl && cur.z <= 13.5 + hl) {
      return { type: 'forward', via: 'C2', x: cur.x - lay.D.x, z: cur.z - lay.D.z, turn: 0 };
    }
    if (armed && prev.x > TRIG_BACK && cur.x <= TRIG_BACK && cur.z >= 12.5 && cur.z <= 16.5) {
      return { type: 'back', via: 'C1', x: -cur.x, z: LOBBY - cur.z, turn: Math.PI };
    }
    if (prev.x > TRIG_START && cur.x <= TRIG_START && cur.z >= -0.5 && cur.z <= 3.5) {
      return { type: 'back', via: 'start', x: -9 - cur.x, z: 3 - cur.z, turn: Math.PI };
    }
    return null;
  }

  /** The rule of the game: turn back if and only if something is wrong. */
  function resolve(count, anomaly, type) {
    const correct = (type === 'back') === !!anomaly;
    return { correct, count: correct ? Math.min(count + 1, MAX_COUNT) : 0 };
  }

  // scare: 1 = unsettling, 2 = creepy, 3 = frightening. Deeper in a run, the frightening ones get likelier.
  const ANOMALIES = [
    { id: 'lights_off', he: 'האורות כבו', en: 'Lights out', scare: 2 },
    { id: 'light_red', he: 'מנורה אדומה', en: 'Red lamp', scare: 2 },
    { id: 'light_flicker', he: 'מנורה מהבהבת', en: 'Flickering lamp', scare: 1 },
    { id: 'poster_eyes', he: 'העיניים בפוסטר עוקבות אחריך', en: 'The poster is watching', scare: 2 },
    { id: 'poster_face', he: 'הפנים שלו על פוסטר', en: 'His face on a poster', scare: 2 },
    { id: 'poster_upside', he: 'פוסטר הפוך', en: 'Upside-down poster', scare: 1 },
    { id: 'poster_blank', he: 'פוסטר חסר', en: 'Missing poster', scare: 1 },
    { id: 'door_ajar', he: 'דלת פתוחה לחושך', en: 'Door ajar', scare: 2 },
    { id: 'door_extra', he: 'דלת שלא הייתה שם', en: 'An extra door', scare: 1 },

  function drawFace(ctx, x0, y0, w, h, smile) {
    ctx.save();
    ctx.translate(x0, y0);
    const g = ctx.createRadialGradient(w * 0.5, h * 0.48, w * 0.1, w * 0.5, h * 0.5, w * 0.75);
    g.addColorStop(0, '#e0b08a'); g.addColorStop(1, '#b98663');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(120,70,45,0.25)';
    ctx.fillRect(0, 0, w, h * 0.06);
    ctx.strokeStyle = 'rgba(120,75,50,0.35)'; ctx.lineWidth = w * 0.012;
    for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.moveTo(w * 0.32, h * (0.17 + i * 0.05)); ctx.quadraticCurveTo(w * 0.5, h * (0.15 + i * 0.05), w * 0.68, h * (0.17 + i * 0.05)); ctx.stroke(); }
    const browY = smile ? 0.26 : 0.33;
    ctx.strokeStyle = '#3a2c25'; ctx.lineCap = 'round'; ctx.lineWidth = w * 0.045;
    ctx.beginPath(); ctx.moveTo(w * 0.22, h * (browY + 0.02)); ctx.lineTo(w * 0.42, h * browY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w * 0.58, h * browY); ctx.lineTo(w * 0.78, h * (browY + 0.02)); ctx.stroke();
    const eyeW = smile ? 0.19 : 0.15, eyeH = smile ? 0.075 : 0.045;
    for (const cx of [0.32, 0.68]) {
      ctx.fillStyle = '#f4f1ea';
      ctx.beginPath(); ctx.ellipse(w * cx, h * 0.43, w * eyeW / 2, h * eyeH, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#20150f';
      ctx.beginPath(); ctx.arc(w * cx, h * 0.43, w * (smile ? 0.022 : 0.04), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5a3d2e'; ctx.lineWidth = w * 0.015;
      ctx.beginPath(); ctx.ellipse(w * cx, h * 0.43, w * eyeW / 2, h * eyeH, 0, Math.PI, Math.PI * 2); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(110,65,40,0.55)'; ctx.lineWidth = w * 0.02;
    ctx.beginPath(); ctx.moveTo(w * 0.5, h * 0.47); ctx.lineTo(w * 0.47, h * 0.6); ctx.lineTo(w * 0.53, h * 0.62); ctx.stroke();
    if (smile) {
      ctx.fillStyle = '#2a0808';
      ctx.beginPath(); ctx.moveTo(w * 0.08, h * 0.66); ctx.quadraticCurveTo(w * 0.5, h * 1.02, w * 0.92, h * 0.66); ctx.quadraticCurveTo(w * 0.5, h * 0.8, w * 0.08, h * 0.66); ctx.fill();
      ctx.fillStyle = '#f2efe4';
      for (let i = 0; i < 12; i++) {
        const t = (i + 0.5) / 12, x = w * (0.12 + t * 0.76);
        const yTop = h * (0.665 + 0.07 * Math.sin(t * Math.PI));
        ctx.fillRect(x - w * 0.026, yTop, w * 0.05, h * 0.06);
      }
      ctx.strokeStyle = '#7a2a22'; ctx.lineWidth = w * 0.02;
      ctx.beginPath(); ctx.moveTo(w * 0.08, h * 0.66); ctx.quadraticCurveTo(w * 0.5, h * 1.02, w * 0.92, h * 0.66); ctx.stroke();
    } else {
      ctx.strokeStyle = '#7b4a3a'; ctx.lineWidth = w * 0.03;
      ctx.beginPath(); ctx.moveTo(w * 0.37, h * 0.76); ctx.quadraticCurveTo(w * 0.5, h * 0.74, w * 0.63, h * 0.77); ctx.stroke();
      ctx.strokeStyle = 'rgba(110,65,40,0.35)'; ctx.lineWidth = w * 0.015;
      ctx.beginPath(); ctx.moveTo(w * 0.3, h * 0.62); ctx.quadraticCurveTo(w * 0.33, h * 0.72, w * 0.34, h * 0.78); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w * 0.7, h * 0.62); ctx.quadraticCurveTo(w * 0.67, h * 0.72, w * 0.66, h * 0.78); ctx.stroke();
    }
    ctx.restore();
  }

      b.quad([x0, H, z0], [x1 - x0, 0, z1 - z0], [0, -H, 0], n, [u0, 0], [u1 - u0, 0], [0, H], mat, Math.max(1, Math.ceil(len / 0.5)), 6);
      const o = 0.012;
      b.quad([x0 + n[0] * o, 0.12, z0 + n[2] * o], [x1 - x0, 0, z1 - z0], [0, -0.12, 0], n, [0, 0], [1, 0], [0, 1], baseMat, Math.max(1, Math.ceil(len / 1)), 1);
      b.quad([x0 + n[0] * o, 0.12, z0 + n[2] * o], [x1 - x0, 0, z1 - z0], [-n[0] * o, 0, -n[2] * o], [0, 1, 0], [0, 0], [1, 0], [0, 1], baseMat, 1, 1);
    };
    // Walls along X (between rows j-1 and j).
    for (let j = 0; j <= nz; j++) {
      const z = minZ + j * C;
      for (const dir of [1, -1]) {
        let start = -1;
        for (let i = 0; i <= nx; i++) {
          const a = A(i, j - 1), c = A(i, j);
          const isWall = i < nx && (dir === 1 ? (a === 1 && c === 0) : (a === 0 && c === 1));
          if (isWall && start < 0) start = i;
          if (!isWall && start >= 0) {
            emit(minX + start * C, z, minX + i * C, z, [0, 0, dir === 1 ? -1 : 1]);
            start = -1;
          }
        }
      }
    }
    // Walls along Z (between columns i-1 and i).
    for (let i = 0; i <= nx; i++) {
      const x = minX + i * C;
      for (const dir of [1, -1]) {
        let start = -1;
        for (let j = 0; j <= nz; j++) {
          const a = A(i - 1, j), c = A(i, j);
          const isWall = j < nz && (dir === 1 ? (a === 1 && c === 0) : (a === 0 && c === 1));
          if (isWall && start < 0) start = j;
          if (!isWall && start >= 0) {
            emit(x, minZ + start * C, x, minZ + j * C, [dir === 1 ? -1 : 1, 0, 0]);
            start = -1;
          }
        }
      }
    }
  }

  // ------------------------------------------------------------------ the world
  /**
   * spec: { anomaly, exit, seed }
   * returns { lay, packed, lights, decor, anomaly, exit }
   */
  E.buildWorld = function (spec) {
    const anomaly = spec.anomaly || null;
    const exit = !!spec.exit;
    const hl = anomaly === 'corridor_long' ? E.HALL_LONG : E.HALL;
    const lay = E.layout({ hl, exit });
    const rnd = E.mulberry32((spec.seed || 1) >>> 0);
    const T = E.TEX;
    const b = new Builder();
    const lights = [];
    const decor = { hl, eyes: [], clock: null, doors: [], men: {}, shadow: null };

    const mat = (layer, tint, extra) => Object.assign({ layer, tint: tint || [1, 1, 1] }, extra || {});
    const MAT = {
      floor: mat(T.floor, null, { spec: 0.5, ao: 'floor' }),
      ceil: mat(T.ceiling, null, { ao: 'ceil' }),
      wall: mat(T.wall, null, { spec: 0.32, ao: 'wall' }),
      base: mat(T.white, [0.2, 0.21, 0.22], { spec: 0.2 }),
      metal: mat(T.white, [0.74, 0.76, 0.77], { spec: 0.4 }),
      housing: mat(T.white, [0.86, 0.87, 0.86]),
      dark: mat(T.white, [0.012, 0.012, 0.014]),
      black: mat(T.white, [0.03, 0.03, 0.03]),
      frame: mat(T.white, [0.55, 0.57, 0.6], { spec: 0.3 }),
      red: mat(T.white, [0.62, 0.08, 0.07], { spec: 0.3 }),
      yellow: mat(T.white, [0.93, 0.74, 0.04]),
    };

    // Floors and ceilings.
    const ceilLow = anomaly === 'ceiling_low';
    for (const r of lay.rects) {
      if (r.stairs) continue;
      const w = r.x1 - r.x0, d = r.z1 - r.z0;
      b.quad([r.x0, 0, r.z0], [w, 0, 0], [0, 0, d], [0, 1, 0], [r.x0, r.z0], [w, 0], [0, d], MAT.floor, Math.ceil(w / 0.5), Math.ceil(d / 0.5));
      const ceil = (z0, z1, y) => b.quad([r.x0, y, z0], [w, 0, 0], [0, 0, z1 - z0], [0, -1, 0], [r.x0, z0], [w, 0], [0, z1 - z0], MAT.ceil, Math.ceil(w / 0.5), Math.ceil((z1 - z0) / 0.5));
      if (ceilLow && r.id === 'H') {
        ceil(r.z0, 23, E.CEIL); ceil(23, 35, 2.25); ceil(35, r.z1, E.CEIL);
        b.quad([r.x0, E.CEIL, 23], [w, 0, 0], [0, 2.25 - E.CEIL, 0], [0, 0, -1], [0, 0], [w, 0], [0, 0.75], MAT.wall, 6, 2);
        b.quad([r.x0, E.CEIL, 35], [w, 0, 0], [0, 2.25 - E.CEIL, 0], [0, 0, 1], [0, 0], [w, 0], [0, 0.75], MAT.wall, 6, 2);
      } else ceil(r.z0, r.z1, E.CEIL);
    }
    buildWalls(b, lay, MAT.wall, MAT.base);

    // ---------------------------------------------------------------- lamps
    function lamp(x, z, axis, o) {
      const opt = o || {};
      const y = opt.y || 2.94;
      const col = opt.col || LAMP;
      lights.push({ x, y: y - 0.06, z, axis, col, I: opt.I || 1, group: opt.group || 0 });
      const along = axis === 'z';
      b.box(x, y + 0.02, z, along ? 0.24 : 1.32, 0.06, along ? 1.32 : 0.24, MAT.housing);
      b.box(x, y - 0.03, z, along ? 0.09 : 1.22, 0.045, along ? 1.22 : 0.09,
        mat(T.white, col, { emis: [col[0] * 2.4, col[1] * 2.4, col[2] * 2.4], dynEmis: !!opt.group }));
    }
    lamp(-18, -28, 'z');
    lamp(-15, -27.5, 'x'); lamp(-12, -27.5, 'x');
    for (let z = -27; z <= 1; z += 4) lamp(-9, z, 'z');
    lamp(-6, 1.5, 'x'); lamp(-3, 1.5, 'x');
    for (const z of [2, 6, 10, 14]) lamp(0, z, 'z');
    lamp(3, 14.5, 'x'); lamp(6, 14.5, 'x');
    const hallLamps = [];
    for (let z = 15; z <= hl + 11; z += 4) hallLamps.push(z);
    const midLamps = hallLamps.slice(1, -1);
    const pickLamp = () => midLamps[1 + Math.floor(rnd() * (midLamps.length - 2))];
    const redLamp = anomaly === 'light_red' ? pickLamp() : null;
    const flickLamp = anomaly === 'light_flicker' ? pickLamp() : null;
    for (const z of hallLamps) {
      const mid = z !== hallLamps[0] && z !== hallLamps[hallLamps.length - 1];
      const o = {};
      if (anomaly === 'lights_off' && mid) o.group = 1;
      if (z === flickLamp) o.group = 1;
      if (z === redLamp) { o.col = RED; o.I = 1.15; }
      if (ceilLow && z > 23 && z < 35) o.y = 2.19;
      lamp(9, z, 'z', o);
    }
    if (!exit) {
      lamp(12, hl + 11.5, 'x'); lamp(15, hl + 11.5, 'x');
      for (const z of [2, 6, 10, 14]) lamp(18, hl + 10 + z, 'z');
    }

    // ---------------------------------------------------------------- tactile paving
    function tactilePath(pts, gaps) {
      const L = mat(T.tactileLine, null, { spec: 0.25 }), Dm = mat(T.tactileDot, null, { spec: 0.25 });
      for (let i = 0; i < pts.length - 1; i++) {
        const [ax, az] = pts[i], [bx, bz] = pts[i + 1];
        const len = Math.hypot(bx - ax, bz - az), dx = (bx - ax) / len, dz = (bz - az) / len;
        const s0 = i === 0 ? 0 : 0.3, s1 = len - (i === pts.length - 2 ? 0 : 0.3);
        const segs = [[s0, s1]];
        for (const g of (gaps || [])) if (g.seg === i) { segs.length = 0; segs.push([s0, g.from], [g.to, s1]); }
        for (const [a, c] of segs) {
          if (c - a < 0.05) continue;
          const cx = ax + dx * (a + c) / 2, cz = az + dz * (a + c) / 2, l = c - a;
          const rx = dz, rz = -dx;
          const org = [cx - rx * 0.15 + dx * l / 2, 0.005, cz - rz * 0.15 + dz * l / 2];
          b.quad(org, [rx * 0.3, 0, rz * 0.3], [-dx * l, 0, -dz * l], [0, 1, 0], [0, 0], [1, 0], [0, l / 0.3], L, 1, Math.max(1, Math.ceil(l / 1.5)));
        }
        if (i > 0) b.quad([ax - 0.3, 0.005, az - 0.3], [0.6, 0, 0], [0, 0, 0.6], [0, 1, 0], [0, 0], [2, 0], [0, 2], Dm);
      }
      for (const g of (gaps || [])) if (g.dots) for (const [x, z] of g.dots) b.quad([x - 0.3, 0.005, z - 0.3], [0.6, 0, 0], [0, 0, 0.6], [0, 1, 0], [0, 0], [2, 0], [0, 2], Dm);
    }
    const path = [[-18, -32], [-18, -27.5], [-9, -27.5], [-9, 1.5], [0, 1.5], [0, 14.5], [9, 14.5]];
    if (exit) path.push([9, hl + 13]); else path.push([9, hl + 11.5], [18, hl + 11.5], [18, hl + 26]);
    const gaps = [];
    if (anomaly === 'tactile_veer') {
      // Hallway segment index 6 runs from (9,14.5): gap between 24.8 and 31, a branch into the left wall.
      gaps.push({ seg: 6, from: 24.8 - 14.5 - 0.3, to: 31 - 14.5 + 0.3, dots: [[9, 24.8], [9, 31]] });
      const l = 9 - 0.3 - 7.5;

    }

    // ---------------------------------------------------------------- lobby decor
    function lobbyDecor(ox, oz) {
      const signMat = mat(T.sign, null, { emis: [0.42, 0.42, 0.42] });
      b.box(ox, 2.47, oz + 8, 2.2, 0.45, 0.07, mat(T.white, [0.35, 0.35, 0.36]), { nz: signMat });
      b.box(ox - 0.8, 2.85, oz + 8, 0.03, 0.31, 0.03, MAT.metal);
      b.box(ox + 0.8, 2.85, oz + 8, 0.03, 0.31, 0.03, MAT.metal);
      // Rules poster on the right wall, station map on the left wall.
      const rx = ox + 1.5;
      b.box(rx - 0.02, 1.55, oz + 9.5, 0.03, 1.05, 1.4, MAT.frame);
      b.panel([rx - 0.037, 1.55, oz + 9.5], [-1, 0, 0], 1.3, 0.95, mat(T.rules, null, { spec: 0.35 }));
      const lx = ox - 1.5;
      b.box(lx + 0.02, 1.6, oz + 6.5, 0.03, 0.9, 1.3, MAT.frame);
      b.panel([lx + 0.037, 1.6, oz + 6.5], [1, 0, 0], 1.2, 0.8, mat(T.map, null, { spec: 0.35 }));
    }
    lobbyDecor(0, 0);
    if (!exit) lobbyDecor(18, hl + 10);

    // ---------------------------------------------------------------- hallway decor
    const POSTER_Z = [20, 23.2, 26.4, 29.6, 32.8, 36];
    const others = [0, 1, 3, 4, 5];
    const special = others[Math.floor(rnd() * others.length)];
    const doorPick = Math.floor(rnd() * 3);

    function door(x, z, n, o) {
      const opt = o || {};
      const doorMat = mat(T.door, null, { spec: 0.18 });
      const r = [-n[2], 0, n[0]];
      // Frame
      b.box(x + n[0] * 0.03 + r[0] * 0.56, 1.1, z + n[2] * 0.03 + r[2] * 0.56, n[0] ? 0.06 : 0.08, 2.2, n[0] ? 0.08 : 0.06, MAT.frame);
      b.box(x + n[0] * 0.03 - r[0] * 0.56, 1.1, z + n[2] * 0.03 - r[2] * 0.56, n[0] ? 0.06 : 0.08, 2.2, n[0] ? 0.08 : 0.06, MAT.frame);
      b.box(x + n[0] * 0.03, 2.16, z + n[2] * 0.03, n[0] ? 0.06 : 1.2, 0.08, n[0] ? 1.2 : 0.06, MAT.frame);
      if (opt.ajar) {
        b.panel([x + n[0] * 0.012, 1.06, z + n[2] * 0.012], n, 1.04, 2.12, MAT.dark);
        // Hinged on the far side and swung past 90°, so the dark doorway faces the approaching player.
        const a = 1.75;
        const hx = x + n[0] * 0.02 - r[0] * 0.5, hz = z + n[2] * 0.02 - r[2] * 0.5;
        const fx = r[0] * Math.cos(a) + n[0] * Math.sin(a), fz = r[2] * Math.cos(a) + n[2] * Math.sin(a);
        const cx = hx + fx * 0.5, cz = hz + fz * 0.5;
        const nn = [fz, 0, -fx]; // panel normal (90° from its width)
        const face = nn[0] * n[0] + nn[2] * n[2] > 0 ? nn : [-nn[0], 0, -nn[2]];
        b.panel([cx + face[0] * 0.021, 1.05, cz + face[2] * 0.021], face, 1.0, 2.1, doorMat);
        b.panel([cx - face[0] * 0.021, 1.05, cz - face[2] * 0.021], [-face[0], 0, -face[2]], 1.0, 2.1, MAT.metal);

      }
      b.panel([x + n[0] * 0.02, 1.05, z + n[2] * 0.02], n, 1.0, 2.1, doorMat);
      const hx = x + n[0] * 0.06 + r[0] * 0.36, hz = z + n[2] * 0.06 + r[2] * 0.36;
      b.box(x + n[0] * 0.03 + r[0] * 0.36, 1.0, z + n[2] * 0.03 + r[2] * 0.36, n[0] ? 0.02 : 0.06, 0.18, n[0] ? 0.06 : 0.02, MAT.metal);
      b.box(hx - r[0] * 0.06, 1.04, hz - r[2] * 0.06, n[0] ? 0.04 : 0.14, 0.035, n[0] ? 0.14 : 0.04, MAT.metal);
    }

    function poster(x, z, n, layer, o) {
      const opt = o || {};
      b.box(x + n[0] * 0.012, 1.6, z + n[2] * 0.012, n[0] ? 0.024 : 0.9, 1.2, n[0] ? 0.9 : 0.024, MAT.frame);
      if (layer == null) return;
      b.panel([x + n[0] * 0.026, 1.6, z + n[2] * 0.026], n, 0.8, 1.1, mat(layer, null, { spec: 0.45 }), opt);
    }

    function hallDecor(ox, oz, an, main) {
      const LX = 7.5 + ox, RX = 10.5 + ox, Z = z => oz + z;

        if (an === 'poster_upside' && i === special) opt = { flipU: true, flipV: true };
        poster(LX, Z(pz), [1, 0, 0], layer, opt);
        if (i === 2) {
          const P = E.POSTER_EYES;
          for (const u of P.u) {
            const eye = { x: LX + 0.028, y: 1.6 + 0.55 - P.v * 1.1, z: Z(pz) - 0.4 + u * 0.8 };
            if (main && an === 'poster_eyes') decor.eyes.push(eye);
            else b.disc([eye.x + 0.004, eye.y, eye.z], [1, 0, 0], 0.036, 0.006, 14, mat(T.white, [0.06, 0.05, 0.05], { spec: 0.6 }));

      if (an === 'door_extra') door(LX, Z(34.4), [1, 0, 0]);
      // Right wall: doors, extinguisher, emergency sign, clock, vent.
      [21, 27, 34].forEach((dz, i) => {
        door(RX, Z(dz), [-1, 0, 0], { ajar: an === 'door_ajar' && i === doorPick });
        if (main) decor.doors.push({ x: RX, z: Z(dz) });
      });
      if (an !== 'extinguisher_missing') {
        b.box(RX - 0.07, 0.78, Z(24), 0.14, 0.66, 0.42, MAT.red, { nx: mat(T.extinguisher, null, { spec: 0.3 }) });
      }
      b.box(RX - 0.03, 2.43, Z(27), 0.06, 0.26, 0.6, mat(T.white, [0.9, 0.9, 0.9]),
        { nx: mat(T.exitGreen, null, { emis: [0.75, 0.75, 0.75] }) }, 0, { flipU: an === 'exit_sign_flip' });
      // Clock (hands are drawn as moving objects).
      const clock = { x: RX - 0.075, y: 2.2, z: Z(30.6) };
      b.disc([RX - 0.035, clock.y, clock.z], [-1, 0, 0], 0.25, 0.07, 24, mat(T.white, [0.08, 0.08, 0.08], { spec: 0.4 }));
      b.panel([RX - 0.072, clock.y, clock.z], [-1, 0, 0], 0.5, 0.5, mat(T.clock, null, { spec: 0.5 }));
      if (main) decor.clock = clock;
      // Vent
      const vz = Z(37.6);
      if (an === 'vent_eyes') b.panel([RX - 0.008, 2.5, vz], [-1, 0, 0], 0.56, 0.28, mat(T.ventEyes, null, { emis: [2.6, 2.6, 2.6] }));
      else b.panel([RX - 0.008, 2.5, vz], [-1, 0, 0], 0.56, 0.28, MAT.dark);
      b.panel([RX - 0.03, 2.5, vz], [-1, 0, 0], 0.62, 0.31, mat(T.vent, null, { spec: 0.2 }));
      if (!main) return;
      // Static anomalies on surfaces.
      if (an === 'handprints') {
        const hm = mat(T.handprint, null, { spec: 0.6 });
        [[29.0, 1.2, 0.2], [29.5, 1.65, -0.3], [30.0, 0.95, 0.1], [31.7, 1.45, 0.35], [32.2, 1.0, -0.15], [32.7, 1.7, 0.25]]
          .forEach(([z, y, rot]) => b.panel([RX - 0.006, y, Z(z)], [-1, 0, 0], 0.32, 0.32, hm, { rot }));
      }
      if (an === 'wall_stain') b.panel([LX + 0.006, 1.45, Z(28)], [1, 0, 0], 1.5, 1.5, mat(T.stain, null, { spec: 0.5 }));
      if (an === 'wall_face') b.panel([LX + 0.012, 1.55, Z(28)], [1, 0, 0], 1.3, 1.62, mat(T.wallFace, null, { spec: 0.2 }));
      if (an === 'wall_eyes') b.panel([RX - 0.006, 1.3, Z(32.2)], [-1, 0, 0], 2.8, 2.3, mat(T.wallEyes, null, { spec: 0.55 }));
      if (an === 'scrawl') b.panel([RX - 0.006, 1.55, Z(32.2)], [-1, 0, 0], 2.4, 1.2, mat(T.scrawl, null, { spec: 0.6 }));
      if (an === 'blood_pool') b.floorDecal(10.1, Z(27), 2.2, 2.8, 0, 1, mat(T.bloodPool, null, { spec: 1.1 }), 0.008);
      if (an === 'footprints') {
        const fm = mat(T.footprint, null, { spec: 0.7 });
        const ax = 9.7 + ox, az = Z(19.5), bx = LX + 0.25, bz = Z(24.8);
        const len = Math.hypot(bx - ax, bz - az), dx = (bx - ax) / len, dz = (bz - az) / len;
        for (let s = 0, k = 0; s < len; s += 0.55, k++) {
          const side = k % 2 ? 0.1 : -0.1;
          b.floorDecal(ax + dx * s + dz * side, az + dz * s - dx * side, 0.13, 0.27, dx, dz, fm, 0.007 + k * 0.0001);
        }
      }
    }
    hallDecor(0, 0, anomaly, true);
    hallDecor(-18, -42, null, false);

    // ---------------------------------------------------------------- dynamic anomaly anchors
    if (anomaly === 'shadow_figure') decor.shadow = { x: 8.3, z: hl + 9 };

    // ---------------------------------------------------------------- exit staircase
    if (exit) {
      const s = E.rectById(lay, 'S');
      const z0 = s.z0, run = (E.STAIRS - 3) / 30, rise = E.STAIR_RISE / 30;
      b.quad([7.5, 0, z0], [3, 0, 0], [0, 0, 1], [0, 1, 0], [7.5, z0], [3, 0], [0, 1], MAT.floor, 6, 2);
      const stepMat = mat(T.floor, [0.95, 0.95, 0.93], { spec: 0.3 });
      for (let k = 0; k < 30; k++) {
        const za = z0 + 1 + k * run, y = (k + 1) * rise;
        b.quad([7.5, y, za], [3, 0, 0], [0, 0, run], [0, 1, 0], [7.5, za], [3, 0], [0, run], stepMat, 3, 1);
        b.quad([7.5, y, za], [3, 0, 0], [0, -rise, 0], [0, 0, -1], [0, 0], [3, 0], [0, rise], stepMat, 3, 1);
        b.quad([7.5, y + 0.002, za], [3, 0, 0], [0, 0, 0.05], [0, 1, 0], [0, 0], [1, 0], [0, 1], MAT.yellow, 3, 1);
      }
      const top = z0 + E.STAIRS - 2;
      b.quad([7.5, E.STAIR_RISE, top], [3, 0, 0], [0, 0, 2], [0, 1, 0], [7.5, top], [3, 0], [0, 2], MAT.floor, 6, 4);
      const wallH = E.STAIR_RISE + E.CEIL + 0.6;
      const sideWall = (x, n) => b.quad([x, wallH, z0], [0, 0, E.STAIRS], [0, -wallH, 0], n, [z0, 0], [E.STAIRS, 0], [0, wallH], mat(T.wall, null, { spec: 0.3 }), 26, 15);
      sideWall(7.5, [1, 0, 0]); sideWall(10.5, [-1, 0, 0]);
      const cz = z0 + E.STAIRS - 2, nl = Math.hypot(E.STAIR_RISE, cz - z0);

      b.quad([7.5, E.CEIL + E.STAIR_RISE, cz], [3, 0, 0], [0, 0, 2], [0, -1, 0], [7.5, cz], [3, 0], [0, 2], MAT.ceil, 6, 4);
      b.quad([7.5, wallH, s.z1], [3, 0, 0], [0, -(wallH - E.STAIR_RISE), 0], [0, 0, -1], [0, 0], [1, 0], [0, 1], mat(T.daylight, [1, 1, 1], { emis: [3, 3, 3] }));
      for (const k of [3, 11, 19, 27]) {
        const z = z0 + 1 + k * run;

  const HAIR = [0.12, 0.11, 0.1], SHOE = [0.04, 0.04, 0.04], TIE = [0.09, 0.12, 0.26], CASE = [0.26, 0.15, 0.08];

      b.box(0.113, 0.13, 0, 0.03, 0.06, 0.045, m(SKIN));

      torso: build(b => {
        b.box(0, 1.2, 0, 0.44, 0.58, 0.24, m(SHIRT));
        b.box(0, 1.47, 0.02, 0.3, 0.05, 0.22, m(SHIRT));

        b.box(0, -0.83, 0.04, 0.12, 0.07, 0.27, m(SHOE, { spec: 0.4 }));
      }),
      arm: build(b => {
        b.box(0, -0.26, 0, 0.12, 0.56, 0.13, m(SHIRT));
        b.box(0, -0.6, 0, 0.08, 0.1, 0.09, m(SKIN));

        b.box(0, -0.26, 0, 0.12, 0.56, 0.13, m(SHIRT));
        b.box(0, -0.6, 0, 0.08, 0.1, 0.09, m(SKIN));
        b.box(0, -0.68, 0, 0.02, 0.05, 0.1, m([0.05, 0.04, 0.03]));
        b.box(0, -0.85, 0, 0.08, 0.28, 0.4, m(CASE, { spec: 0.35 }));

      pupil: build(b => b.disc([0, 0, 0], [1, 0, 0], 0.036, 0.006, 14, m([0.05, 0.04, 0.04], { spec: 0.6 }))),
      hourHand: build(b => b.box(0, 0.045, 0, 0.022, 0.13, 0.006, m([0.06, 0.06, 0.06]))),
      minuteHand: build(b => b.box(0, 0.075, 0, 0.015, 0.2, 0.006, m([0.06, 0.06, 0.06]))),
      secondHand: build(b => {

  const angleTo = (fx, fz, tx, tz) => Math.atan2(tx - fx, tz - fz); // heading that faces (tx,tz)

  /** Per-loop actor state. Returns events from update(): steps, caught, vanish, wave. */

    this.men = [];
    this.spawned = false;
    this.wave = null;

    this.shadow = world.decor.shadow ? Object.assign({ alive: true }, world.decor.shadow) : null;

  function newMan(x, z, heading) {

  }

  Actors.prototype.spawn = function () {
    if (this.spawned || this.world.exit) return;

    const an = this.an, hl = this.world.hl;
    if (an === 'man_follow') return;

      if (an === 'man_many') man.phase = 0;
      if (an === 'man_giant') man.scale = 1.45;
      if (an === 'man_ceiling') man.ceiling = true;
      if (an === 'man_smile') man.smile = true;
      if (an === 'man_backward') { man.backward = true; man.heading = 0; }

      if (an === 'man_stop') man.stopper = true;
      if (an === 'man_chase') man.chaser = true;

  /** p: player {x,z,y}; cam: {x,y,z,yaw,pitch}; ctx: { inView(x,y,z), armed } */

    const ev = [];

    const lay = this.world.lay, hl = this.world.hl;
    if (ctx.armed) this.spawn();
    const inHall = p.x > 7.5 && p.z > 13;

    for (const man of this.men) {
      if (!man.alive) continue;
      const dist = Math.hypot(man.x - p.x, man.z - p.z);
      let moving = 0;
      if (man.mode === 'walk') {
        if (man.stopper && inHall && dist < 7 && man.z > p.z) { man.mode = 'stop'; }
        else if (man.chaser && inHall && dist < 8.5 && man.z > p.z) { man.mode = 'pause'; man.timer = 0.8; ev.push({ type: 'stinger' }); }

      } else if (man.mode === 'pause') {
        man.heading = approach(man.heading, angleTo(man.x, man.z, p.x, p.z), dt * 6);

        man.x = pt.x; man.z = pt.z;
        man.heading = Math.atan2(pt.dx * dir, pt.dz * dir);

        if (Math.hypot(man.x - p.x, man.z - p.z) < 0.85) {
          this.caught = true;
          man.smile = true; man.scale = 1.22; man.killer = true; // the grin, and a lunge

        }

      if (man.stare && dist < 16) {
        const rel = wrapAngle(angleTo(man.x, man.z, p.x, p.z) - man.heading);
        man.headYaw = approach(man.headYaw, Math.max(-1.6, Math.min(1.6, rel)), dt * 5);
      }

        const stride = moving > 2 ? 0.55 : 0.36;

        p.pushZ = (p.pushZ || 0) + (p.z - man.z) * k;

    }

    // Someone behind you.
    if (this.an === 'man_follow' && inHall && !this.follower && p.z > 21) {
      const s = sPlayer - 5;
      const pt = E.routePoint(lay, s);
      if (!ctx.inView(pt.x, 1.2, pt.z)) { const f = newMan(pt.x, pt.z, 0); f.s = s; f.mode = 'follow'; this.follower = f; this.men.push(f); }

      const dist = Math.hypot(f.x - p.x, f.z - p.z);
      const seen = ctx.inView(f.x, 1.3, f.z) && dist < 18;
      if (seen && dist < 1.4) { f.alive = false; ev.push({ type: 'vanish' }); }

        const v = Math.max(-4.5, Math.min(4.5, ds * 2.5));

        const pt = E.routePoint(lay, f.s);
        f.x = pt.x; f.z = pt.z;

  /**
   * How threatening the loop is right now (0..1): drives the heartbeat, vignette and camera shake.
   * Only things the player can already see or hear count, so it never gives an anomaly away.

  Actors.prototype.danger = function (p) {

      if (man.mode === 'chase' || man.mode === 'pause') d = Math.max(d, 1 - dist / 14);

    r.drawObj(M.torso, base, light);
    r.drawObj(M.head, M4.chain(base, M4.translate(0, 1.53, 0), M4.rotZ(-man.headYaw), M4.rotX(-Math.PI / 2 - 0.55)), light);
    r.drawObj(M.arm, M4.chain(base, M4.translate(-0.285, 1.46, 0), M4.rotX(Math.PI + 0.8 + sw * 0.5)), light);
    r.drawObj(M.arm, M4.chain(base, M4.translate(0.285, 1.46, 0), M4.rotX(Math.PI + 0.8 - sw * 0.5)), light);
    r.drawObj(M.leg, M4.chain(base, M4.translate(-0.1, 0.86, 0), M4.rotX(-0.7 + sw * 0.35)), light);
    r.drawObj(M.leg, M4.chain(base, M4.translate(0.1, 0.86, 0), M4.rotX(-0.7 - sw * 0.35)), light);
  }

  function drawMan(r, M, man, world, dyn, tintOv) {
    if (man.crawl) { drawCrawler(r, M, man, world, dyn); return; }
    const sc = man.scale;
    const bob = man.moving ? Math.abs(Math.sin(man.phase)) * 0.03 : 0;
    const base = man.ceiling
      ? M4.chain(M4.translate(man.x, E.CEIL, man.z), M4.rotY(man.heading), M4.scale(sc, -sc, sc))
      : M4.chain(M4.translate(man.x, 0, man.z), M4.rotY(man.heading), M4.scale(sc, sc, sc));
    const light = tintOv ? { col: [0, 0, 0], dir: [0, 1, 0] } : E.sampleLight(world, man.x, man.ceiling ? 2.0 : 1.3, man.z, dyn);
    const dirSign = man.backward ? -1 : 1;
    const swing = man.moving ? Math.sin(man.phase) * 0.5 * dirSign : 0;
    r.drawObj(M.torso, M4.mul(base, M4.translate(0, bob, 0)), light, tintOv);
    r.drawObj(man.smile ? M.headSmile : M.head, M4.chain(base, M4.translate(0, 1.53 + bob, 0), M4.rotY(man.headYaw)), light, tintOv);
    r.drawObj(M.leg, M4.chain(base, M4.translate(-0.1, 0.86 + bob, 0), M4.rotX(swing)), light, tintOv);
    r.drawObj(M.leg, M4.chain(base, M4.translate(0.1, 0.86 + bob, 0), M4.rotX(-swing)), light, tintOv);
    r.drawObj(M.arm, M4.chain(base, M4.translate(-0.285, 1.46 + bob, 0), M4.rotX(-swing * 0.7)), light, tintOv);
    r.drawObj(M.armCase, M4.chain(base, M4.translate(0.285, 1.46 + bob, 0), M4.rotX(swing * 0.25)), light, tintOv);
  }

  /** cam: camera position for the poster eyes; dyn: flicker level; now: Date for the clock. */
  Actors.prototype.draw = function (r, M, cam, dyn, now) {
    const world = this.world;
    for (const man of this.men) if (man.alive) drawMan(r, M, man, world, dyn);
    if (this.shadow && this.shadow.alive) drawMan(r, M, { x: this.shadow.x, z: this.shadow.z, heading: Math.PI, headYaw: 0, scale: 1.05, moving: false }, world, dyn, [0, 0, 0]);

    const clock = world.decor.clock;
    if (clock) {
      const light = E.sampleLight(world, clock.x - 0.3, clock.y, clock.z, dyn);
      let h, mi, se;
      if (this.an === 'clock_spin') {
        const t = this.time;
        se = -t * 9; mi = -t * 2.6; h = -t * 0.35;
      } else {
        const s = now.getSeconds() + now.getMilliseconds() / 1000;
        se = (Math.floor(s) / 60) * Math.PI * 2;
        mi = ((now.getMinutes() + s / 60) / 60) * Math.PI * 2;
        h = (((now.getHours() % 12) + now.getMinutes() / 60) / 12) * Math.PI * 2;
      }
      const B = M4.chain(M4.translate(clock.x, clock.y, clock.z), M4.basis([0, 0, -1], [0, 1, 0], [-1, 0, 0]));
      r.drawObj(M.hourHand, M4.chain(B, M4.translate(0, 0, 0.004), M4.rotZ(-h)), light);
      r.drawObj(M.minuteHand, M4.chain(B, M4.translate(0, 0, 0.011), M4.rotZ(-mi)), light);
      r.drawObj(M.secondHand, M4.chain(B, M4.translate(0, 0, 0.018), M4.rotZ(-se)), light);
    }

    for (const eye of world.decor.eyes) {
      const dx = cam.x - eye.x, dy = cam.y - eye.y, dz = cam.z - eye.z, d = Math.hypot(dx, dy, dz) || 1;
      const oz = Math.max(-0.075, Math.min(0.075, dz / d * 0.11));
      const oy = Math.max(-0.03, Math.min(0.03, dy / d * 0.06));
      const light = E.sampleLight(world, eye.x + 0.4, eye.y, eye.z, dyn);
      r.drawObj(M.pupil, M4.translate(eye.x + 0.004, eye.y + oy, eye.z + oz), light);
    }

    if (this.wave) this.drawWave(r, M, dyn);
  };

  Actors.prototype.drawWave = function (r, M, dyn) {
    const lay = this.world.lay, hl = this.world.hl;
    const sH0 = E.routeS(lay, 9, 14.5);
    const t = this.time;
    const H = 2.3 + Math.sin(t * 3) * 0.08;
    const s = this.wave.s;
    const front = E.routePoint(lay, s);
    const sample = E.sampleLight(this.world, front.x, 1.6, front.z, dyn);
    const light = { col: sample.col, dir: sample.dir };
    const draw = (x0, x1, z0, z1, h) => {
      r.drawObj(M.cube, M4.chain(M4.translate((x0 + x1) / 2, h / 2, (z0 + z1) / 2), M4.scale(x1 - x0, h, z1 - z0)), light);
    };
    if (s >= sH0) {
      const zf = 14.5 + (s - sH0);
      draw(7.5, 10.5, zf, hl + 13, H);
      for (let i = 0; i < 10; i++) {
        const w = 0.3, x = 7.5 + i * w, wob = Math.sin(t * 7 + i * 1.7) * 0.3 + Math.sin(t * 11 + i * 0.6) * 0.12 - 0.25;
        draw(x, x + w, zf + wob - 0.6, zf + 0.15, H * (0.8 + 0.2 * Math.sin(t * 5 + i * 1.3)));
      }
    } else {
      draw(7.5, 10.5, 13, hl + 13, H);
      const xf = 9 - (sH0 - s);
      if (xf < 7.5) draw(xf, 7.5, 13, 16, H);
    }
  };

  E.Actors = Actors;
})(typeof window !== 'undefined' ? window : globalThis);

/* EXIT 8 — procedural sound with the Web Audio API (no audio files). */
(function (root) {
  'use strict';

  E.createAudio = function () {
    let ctx = null, master = null, noiseBuf = null, rumble = null, hum = null, drone = null, started = false;
    let volume = 0.8;

      master.gain.value = volume;
      master.connect(ctx.destination);

      const d = noiseBuf.getChannelData(0);

      const g1 = ctx.createGain(); g1.gain.value = 0.035;
      o1.connect(lp); lp.connect(g1); g1.connect(hum); o1.start();
      const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 100;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 6;
      const g2 = ctx.createGain(); g2.gain.value = 0.006;

    if (!m) { joy.style.display = 'none'; return; }
    joy.style.display = 'block';
    joy.style.left = m.x0 + 'px';
    joy.style.top = m.y0 + 'px';
    const dx = m.x - m.x0, dy = m.y - m.y0, d = Math.hypot(dx, dy), k = d > 50 ? 50 / d : 1;
    joy.firstElementChild.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    joy.classList.toggle('run', d > 47);
  }
  function enterTouchMode() {
    if (S.touchMode) return;
    S.touchMode = true;
    document.body.classList.add('touchmode');
  }
  canvas.addEventListener('touchstart', e => {
    enterTouchMode();
    if (S.mode !== 'playing') return;
    e.preventDefault();
    for (const tc of e.changedTouches) {
      if (tc.clientX < innerWidth * 0.45 && !S.touch.move) S.touch.move = { id: tc.identifier, x0: tc.clientX, y0: tc.clientY, x: tc.clientX, y: tc.clientY };
      else if (!S.touch.look) S.touch.look = { id: tc.identifier, x: tc.clientX, y: tc.clientY };
    }
    updateJoy();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    if (S.mode !== 'playing') return;
    e.preventDefault();
    for (const tc of e.changedTouches) {
      const m = S.touch.move, l = S.touch.look;
      if (m && tc.identifier === m.id) { m.x = tc.clientX; m.y = tc.clientY; }
      if (l && tc.identifier === l.id) { look(tc.clientX - l.x, tc.clientY - l.y, 0.0055); l.x = tc.clientX; l.y = tc.clientY; }
    }
    updateJoy();
  }, { passive: false });
  const endTouch = e => {
    for (const tc of e.changedTouches) {
      if (S.touch.move && tc.identifier === S.touch.move.id) S.touch.move = null;
      if (S.touch.look && tc.identifier === S.touch.look.id) S.touch.look = null;
    }
    updateJoy();
  };
  canvas.addEventListener('touchend', endTouch);
  canvas.addEventListener('touchcancel', endTouch);
  window.addEventListener('touchstart', enterTouchMode, { passive: true });
  $('#btnPauseTouch').addEventListener('click', pause);

  // ------------------------------------------------------------------ simulation
  function inView(x, y, z) {
    const c = S.cam;
    if (!c) return false;
    const dx = x - c.x, dy = y - c.y, dz = z - c.z, d = Math.hypot(dx, dy, dz);
    if (d < 0.05) return true;
    const fx = Math.sin(c.yaw) * Math.cos(c.pitch), fy = Math.sin(c.pitch), fz = Math.cos(c.yaw) * Math.cos(c.pitch);
    const [w, h] = R.size();
    const half = Math.min(1.45, Math.atan(Math.tan(c.fov / 2) * w / h) + 0.22);
    if ((dx * fx + dy * fy + dz * fz) / d < Math.cos(half)) return false;
    return E.lightVisible(S.loop.world.lay, c.x, c.z, x, z);
  }

  function updatePlay(dt) {
    const P = S.player, L = S.loop, lay = L.world.lay, K = S.keys;
    S.run.timeMs += dt * 1000;
    let f = 0, s = 0, turn = 0;
    if (K.KeyW || K.ArrowUp) f += 1;
    if (K.KeyS || K.ArrowDown) f -= 1;
    if (K.KeyD) s += 1;
    if (K.KeyA) s -= 1;
    if (K.ArrowLeft) turn -= 1;
    if (K.ArrowRight) turn += 1;
    let running = !!(K.ShiftLeft || K.ShiftRight);
    const m = S.touch.move;
    if (m) {
      const dx = (m.x - m.x0) / 50, dy = (m.y - m.y0) / 50, d = Math.hypot(dx, dy), k = d > 1 ? 1 / d : 1;
      f -= dy * k; s += dx * k;
      if (d > 0.94) running = true;
    }
    P.yaw += turn * 2.1 * dt * S.settings.sens;
    const fx = Math.sin(P.yaw), fz = Math.cos(P.yaw), rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
    let wx = fx * f + rx * s, wz = fz * f + rz * s;
    const wl = Math.hypot(wx, wz);
    if (wl > 1) { wx /= wl; wz /= wl; }
    const speed = running ? 3.6 : 1.85, k = Math.min(1, dt * 9);
    P.vx += (wx * speed - P.vx) * k;
    P.vz += (wz * speed - P.vz) * k;
    const prev = { x: P.x, z: P.z };
    const nx = P.x + P.vx * dt + (P.pushX || 0), nz = P.z + P.vz * dt + (P.pushZ || 0);
    P.pushX = P.pushZ = 0;
    if (E.canStand(lay, nx, P.z, RADIUS)) P.x = nx; else P.vx = 0;
    if (E.canStand(lay, P.x, nz, RADIUS)) P.z = nz; else P.vz = 0;
    const moved = Math.hypot(P.x - prev.x, P.z - prev.z);
    P.moving = moved / Math.max(dt, 1e-4);
    P.step += moved;
    if (P.step > (running ? 0.95 : 0.72)) { P.step = 0; audio.step(running); }
    P.bob += moved / 0.72 * Math.PI;

    if (P.x > E.ARM_X) L.armed = true;
    const tr = E.transition(lay, prev, P, L.armed);
    if (tr) {
      P.x = tr.x; P.z = tr.z;
      if (tr.turn) { P.yaw += tr.turn; P.vx = -P.vx; P.vz = -P.vz; }
      advance(tr.type);
      return;
    }
    if (E.reachedExit(lay, P.x, P.z)) { startEnding(); return; }

    const events = L.actors.update(dt, P, { armed: L.armed, inView });
    for (const ev of events) {
      if (ev.type === 'step') {
        const c = S.cam || { x: P.x, z: P.z, yaw: P.yaw };
        const dx = ev.x - c.x, dz = ev.z - c.z, d = Math.hypot(dx, dz) || 1;
        const pan = (dx * Math.cos(c.yaw) - dz * Math.sin(c.yaw)) / d;
        if (ev.crawl) audio.drag(d, pan); else audio.otherStep(d, pan, ev.run);
      } else if (ev.type === 'caught') caught(ev);
      else if (ev.type === 'stinger' || ev.type === 'waveStart') audio.stinger();
      else if (ev.type === 'vanish') audio.vanish();
    }
    const wave = L.actors.wave;
    audio.setRumble(wave ? Math.max(0, Math.min(1, 1 - wave.gap / 26)) * 0.55 : 0);
  }

  function caught(ev) {
    if (S.mode !== 'playing') return;
    S.mode = 'caught';
    S.modeT = 0;
    S.caughtBy = ev && ev.by;
    S.scare = ev && ev.by === 'man' && S.settings.jumpscares !== false ? { x: ev.x, z: ev.z } : null;
    if (S.scare) audio.jumpscare(); else audio.caught();
    audio.setRumble(0);
    audio.setDread(0);
  }

  const wrapAngle = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

  function updateCaught(dt) {
    S.modeT += dt;
    const a = S.modeT;
    S.danger = 0;
    if (S.scare) {
      // Whip round to face him, zoom into his face and shake. One flash (none in calm mode), then darkness.
      const P = S.player;
      P.yaw += wrapAngle(Math.atan2(S.scare.x - P.x, S.scare.z - P.z) - P.yaw) * Math.min(1, dt * 22);
      const hd = Math.max(0.3, Math.hypot(S.scare.x - P.x, S.scare.z - P.z));
      P.pitch += (Math.atan2(1.98 - EYE, hd) - P.pitch) * Math.min(1, dt * 22); // look up into his face
      S.zoom = Math.min(1, a / 0.2);
      S.shake = 1;
      for (const m of S.loop.actors.men) if (m.killer) m.headYaw = Math.sin(a * 70) * 0.2; // twitching head
      if (S.settings.reduceFlash) S.flash = [0.3, 0, 0, Math.min(1, a / 1.2)];
      else if (a < 0.1) S.flash = [1, 0.96, 0.92, a / 0.1 * 0.9];
      else if (a < 0.4) S.flash = [0.4, 0.02, 0.02, 0.9 - (a - 0.1) / 0.3 * 0.55];
      else S.flash = [0, 0, 0, Math.min(1, 0.35 + (a - 0.4) * 0.45)];
    } else {
      S.shake = 0.9;
      S.flash = a < 0.25 ? [0.55, 0.02, 0.02, a / 0.25 * 0.85] : [0, 0, 0, Math.min(1, 0.85 + (a - 0.25) * 0.4)];
    }
    if (a > (S.scare ? 2.3 : 1.9)) {
      const run = S.run;
      run.loops++; run.mistakes++; run.count = 0;
      if (S.loop.anomaly) { S.recent.push(S.loop.anomaly); if (S.recent.length > 8) S.recent.shift(); }
      setLoop(takeNext(false));
      updateSign();
      respawn();
      Object.assign(S, { mode: 'playing', zoom: 0, shake: 0, scare: null, caughtBy: null, hbT: 1, ambT: 10 });
      S.flash = [0, 0, 0, 1];
      S.fadeIn = 1;
      toast(t('caught'), 1800);
      schedulePrebuild();
    }
  }

  function startEnding() {
    S.mode = 'ending';
    S.modeT = 0;
    audio.exitChord();
    audio.setHum(0.2);
    audio.setDread(0);
  }
  function updateEnding(dt) {
    S.modeT += dt;
    const P = S.player;
    P.z = Math.min(P.z + 0.9 * dt, 13 + S.loop.world.hl + E.STAIRS - 0.5);
    S.flash = [1, 0.98, 0.94, Math.min(1, S.modeT / 2.2)];
    if (S.modeT > 2.6) showEnd();
  }

  function showEnd() {
    S.mode = 'end';
    if (document.pointerLockElement) document.exitPointerLock();
    const run = S.run;
    let isBest = false;
    if (S.best == null || run.timeMs < S.best) { S.best = run.timeMs; store.set('best', run.timeMs); isBest = true; }
    $('#stTime').textContent = E.formatTime(run.timeMs);
    $('#stLoops').textContent = String(run.loops);
    $('#stMistakes').textContent = String(run.mistakes);
    const best = $('#stBest');
    best.textContent = isBest ? t('newBest') : t('bestTime') + ': ' + E.formatTime(S.best);
    best.classList.toggle('newbest', isBest);
    const names = [...new Set(run.spotted)].map(id => (E.ANOMALIES.find(a => a.id === id) || {})[S.lang]).filter(Boolean);
    $('#stSpotted').textContent = names.length ? t('statFound') + ': ' + names.join(' · ') : '';
    show('end');
  }

  // ------------------------------------------------------------------ flicker
  function dynLevel() {
    const an = S.loop.anomaly, F = S.flick, now = S.time;
    if (an !== 'lights_off' && an !== 'light_flicker') return 1;
    const off = an === 'lights_off';
    if (S.settings.reduceFlash) return off ? 0.07 + 0.05 * Math.sin(now * 0.8) : 0.55 + 0.3 * Math.sin(now * 1.1);
    if (now > F.next) {
      F.until = now + (off ? 0.25 + Math.random() * 0.5 : 0.3 + Math.random() * 0.9);
      F.next = F.until + (off ? 2.5 + Math.random() * 4 : 0.8 + Math.random() * 2.2);
    }
    if (now < F.until) {
      if (now > F.hold) {
        F.hold = now + 0.04 + Math.random() * 0.1;
        const v = Math.random() < 0.5 ? (off ? 0.9 : 0.04) : (off ? 0.03 : 1);
        if (v !== F.val && now - S.crackleT > 0.05 && S.mode === 'playing') { audio.crackle(); S.crackleT = now; }
        F.val = v;
      }
      return F.val;
    }
    F.val = off ? 0.03 : 1;
    return F.val;
  }

  // ------------------------------------------------------------------ dread
  /** Heartbeat: always faint deep into a run, racing when something dangerous is near. */
  function tickHeart(dt) {
    const level = Math.max(S.danger, S.dreadSm * 0.45);
    S.pulse = Math.max(0, S.pulse - dt * 5);
    if (level < 0.12) return;
    S.hbT -= dt;
    if (S.hbT <= 0) {
      S.hbT = 60 / (52 + level * 95);
      audio.heartbeat(Math.min(1, 0.25 + level));
      S.pulse = 1;
    }
  }

  /** Paranoia: distant sounds that never mean anything. They happen in normal loops too. */
  function tickAmbient(dt) {
    S.ambT -= dt;
    if (S.ambT > 0) return;
    S.ambT = (16 - 9 * S.dreadSm) * (0.6 + Math.random() * 0.8);
    const kinds = ['thump', 'whisper', 'steps', 'scrape'];
    if (S.dreadSm > 0.35) kinds.push('breath', 'whisper');
    audio.ambient(kinds[Math.floor(Math.random() * kinds.length)], (Math.random() * 2 - 1) * 0.9);
  }

  // ------------------------------------------------------------------ render
  function dpr() {
    const d = window.devicePixelRatio || 1;
    return S.settings.quality === 'low' ? Math.min(d, 1) * 0.85 : Math.min(d, 2);
  }

  function render() {
    const P = S.player, L = S.loop;
    let cam;
    if (S.mode === 'menu' || S.mode === 'loading') {
      cam = { x: 0, y: EYE, z: 1.2, yaw: Math.sin(S.time * 0.13) * 0.22, pitch: 0.1 + Math.sin(S.time * 0.21) * 0.03, fov: FOV };
    } else {
      const bobAmt = reducedMotion ? 0 : Math.min(1, P.moving / 2);
      const bob = (Math.abs(Math.sin(P.bob)) - 0.5) * 0.05 * bobAmt;
      cam = { x: P.x, y: E.floorY(L.world.lay, P.x, P.z) + EYE + bob, z: P.z, yaw: P.yaw, pitch: P.pitch, fov: FOV * (1 - 0.42 * S.zoom) };
      const sh = S.shake * (reducedMotion || S.settings.reduceFlash ? 0.3 : 1);
      if (sh > 0.01) {
        const tt = S.time;
        cam.yaw += (Math.sin(tt * 47) + Math.sin(tt * 29 + 1)) * 0.012 * sh;
        cam.pitch += (Math.sin(tt * 53 + 2) + Math.sin(tt * 31)) * 0.01 * sh;
      }
    }
    S.cam = cam;
    const dyn = dynLevel();
    const spec = L.world.lights
      .map(l => ({ l, d: (l.x - cam.x) ** 2 + (l.z - cam.z) ** 2 }))
      .sort((a, b) => a.d - b.d).slice(0, 6)
      .map(({ l }) => ({ x: l.x, y: l.y, z: l.z, w: l.I * (l.group ? dyn : 1), col: l.col }));
    if (S.fadeIn && S.mode === 'playing') {
      S.fadeIn = Math.max(0, S.fadeIn - 1 / 60 * 1.4);
      S.flash = [0, 0, 0, S.fadeIn];
    } else if (S.mode === 'playing' || S.mode === 'menu' || S.mode === 'paused') S.flash = [0, 0, 0, 0];
    const dr = S.dreadSm, dg = S.danger, pulse = S.pulse * Math.max(dg, dr * 0.45);
    R.begin(cam, {
      time: S.time, dyn, spec, flash: S.flash,
      exposure: 1.32 - 0.36 * dr,
      fog: [0.010, 0.013 + 0.003 * dr, 0.012], fogD: 0.009 + 0.008 * dr,
      grain: 0.032 + 0.05 * dr + 0.03 * dg,
      vig: 0.85 + 0.8 * dr + 0.9 * dg + 0.5 * pulse,
      desat: 0.05 + 0.42 * dr + 0.25 * dg, grade: [0.86, 1, 0.9],
    });
    R.drawStatic(L.mesh);
    L.actors.draw(R, meshes, cam, dyn, new Date());
  }

  function frame(ms) {
    requestAnimationFrame(frame);
    const now = ms / 1000;
    const dt = S.freeze ? 0 : Math.min(0.05, Math.max(0, now - (S.lastT || now)));
    S.lastT = now;
    S.time += dt;
    R.resize(dpr());
    if (S.mode === 'playing') updatePlay(dt);
    else if (S.mode === 'caught') updateCaught(dt);
    else if (S.mode === 'ending') updateEnding(dt);
    const depth = S.run && (S.mode === 'playing' || S.mode === 'caught') ? S.run.count / E.MAX_COUNT : 0;
    S.dreadSm += (depth - S.dreadSm) * Math.min(1, dt * 0.6);
    if (S.mode === 'playing') {
      S.danger = S.loop.actors.danger(S.player);
      S.shake = S.danger * S.danger * 0.9;
      tickHeart(dt);
      tickAmbient(dt);
      audio.setDread(S.dreadSm);
    } else if (S.mode !== 'caught') {
      S.danger = 0; S.shake = 0; S.pulse = Math.max(0, S.pulse - dt * 4);
    }
    render();
  }

  // ------------------------------------------------------------------ overlays
  let currentOverlay = null;
  function openOverlay(id) {
    S.returnTo = S.mode === 'paused' ? 'pause' : S.mode === 'end' ? 'end' : 'menu';
    currentOverlay = id;
    if (id === 'codex') renderCodex();
    if (id === 'settings') syncSettings();
    show(id);
  }
  function closeOverlay() {
    currentOverlay = null;
    if (S.returnTo === 'menu') applyLang();
    show(S.returnTo);
  }

  function renderCodex() {
    const list = $('#codexList');
    list.innerHTML = '';
    E.ANOMALIES.forEach((a, i) => {
      const li = document.createElement('li');
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(i + 1).padStart(2, '0');
      const name = document.createElement('span');
      const known = S.found.has(a.id);
      name.textContent = known ? a[S.lang] : t('unknown');
      li.className = known ? (S.newlyFound.has(a.id) ? 'new' : '') : 'locked';
      li.append(n, name);
      list.appendChild(li);
    });
    $('#codexCount').textContent = t('foundCount', { n: S.found.size, total: E.ANOMALIES.length });
    $('#codexBar').style.width = (S.found.size / E.ANOMALIES.length * 100) + '%';
    $('#codexEmpty').style.display = S.found.size ? 'none' : 'block';
  }

  function syncSettings() {
    const st = S.settings;
    $('#optSens').value = st.sens; $('#outSens').textContent = st.sens.toFixed(1);
    $('#optVol').value = st.vol; $('#outVol').textContent = Math.round(st.vol * 100) + '%';
    $('#optQuality').value = st.quality;
    $('#optFlash').checked = !!st.reduceFlash;
    $('#optScare').checked = st.jumpscares !== false;
  }
  $('#optSens').addEventListener('input', e => { S.settings.sens = +e.target.value; syncSettings(); store.set('settings', S.settings); });
  $('#optVol').addEventListener('input', e => { S.settings.vol = +e.target.value; audio.setVolume(S.settings.vol); syncSettings(); store.set('settings', S.settings); });
  $('#optFlash').addEventListener('change', e => { S.settings.reduceFlash = e.target.checked; store.set('settings', S.settings); });
  $('#optScare').addEventListener('change', e => { S.settings.jumpscares = e.target.checked; store.set('settings', S.settings); });
  $('#optQuality').addEventListener('change', e => { S.settings.quality = e.target.value; store.set('settings', S.settings); uploadTextures(); });

  $('#btnStart').addEventListener('click', startGame);
  $('#btnAgain').addEventListener('click', startGame);
  $('#btnRestart').addEventListener('click', startGame);
  $('#btnResume').addEventListener('click', resume);
  $('#btnMenu').addEventListener('click', toMenu);
  $('#btnMenu2').addEventListener('click', toMenu);
  ['#btnCodex', '#btnCodex2', '#btnCodex3'].forEach(id => $(id).addEventListener('click', () => openOverlay('codex')));
  ['#btnSettings', '#btnSettings2'].forEach(id => $(id).addEventListener('click', () => openOverlay('settings')));
  $('#btnCodexBack').addEventListener('click', closeOverlay);
  $('#btnSettingsBack').addEventListener('click', closeOverlay);
  let resetArmedAt = 0;
  $('#btnCodexReset').addEventListener('click', () => {
    const btn = $('#btnCodexReset');
    if (Date.now() - resetArmedAt > 4000) {
      resetArmedAt = Date.now();
      btn.textContent = t('resetConfirm');
      setTimeout(() => { if (resetArmedAt && Date.now() - resetArmedAt >= 4000) btn.textContent = t('resetCodex'); }, 4100);
      return;
    }
    resetArmedAt = 0;
    btn.textContent = t('resetCodex');
    S.found.clear(); S.newlyFound.clear(); store.set('found', []); renderCodex();
  });
  $('#btnLang').addEventListener('click', () => {
    S.lang = S.lang === 'he' ? 'en' : 'he';
    store.set('lang', S.lang);
    applyLang();
  });

  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fatal(S.lang === 'he' ? 'הגרפיקה נעצרה. רענן את הדף כדי להמשיך.' : 'Graphics stopped. Reload the page to continue.'); });

  // ------------------------------------------------------------------ boot
  async function boot() {
    applyLang();
    if (!R) { fatal(t('noWebgl')); return; }
    await loadFonts();
    uploadTextures();
    meshes = E.createActorMeshes(R);
    setLoop(makeWorld(null, false));
    S.mode = 'menu';
    applyLang();
    show('menu');
    requestAnimationFrame(frame);
  }

  if (/[?&]debug\b/.test(location.search)) {
    window.EXIT8_DEBUG = {
      state: S,
      load(anomaly, exit) {
        if (!S.run) startGame();
        setLoop(makeWorld(anomaly || null, !!exit));
        return S.loop.world;
      },
      place(x, z, yaw, pitch) { Object.assign(S.player, { x, z, yaw: yaw || 0, pitch: pitch || 0, vx: 0, vz: 0 }); },
      step(seconds, keys) {
        const dt = 1 / 60;
        S.keys = Object.assign({}, keys || {});
        for (let i = 0; i < seconds * 60; i++) { S.time += dt; if (S.mode === 'playing') updatePlay(dt); else if (S.mode === 'caught') updateCaught(dt); }
        S.keys = {};
      },
      setCount(n) { S.run.count = n; updateSign(); },
      freeze(v) { S.freeze = !!v; },
      dread(v) { S.dreadSm = v; },
    };
  }

  boot();
})();
</script>
</body>
</html>
