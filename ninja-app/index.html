<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NINJA CIRCUIT">
<!-- @artifact-start -->
<title>Ninja Circuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Layout: one phone-width column; sticky header, fixed bottom tabs; full-screen overlays for flows (questionnaire, workout, course run, tests); bottom sheets for details */
  --bg:#0f1012;--bg2:#141518;--card:#18191d;--card2:#1e2025;--card3:#272a30;
  --line:rgba(255,255,255,.13);--line2:rgba(255,255,255,.26);
  --text:#f3f1ed;--muted:#a5a6ab;--dim:#80828a;
  --blue:#e9e6df;--blue-hi:#ffffff;--blue-soft:rgba(255,255,255,.08);
  --orange:#ff6a1a;--orange-hi:#ffb37a;--orange-soft:rgba(255,106,26,.14);--on-orange:#1a0700;
  --good:#3ddc97;--warn:#ffc145;--bad:#ff6b85;
  --f-ui:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Chakra Petch","Rubik",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --tabh:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:76px;scroll-padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px))}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .flip{transform:scaleX(-1)}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bgfx{display:none}
#app{position:relative;z-index:1;min-height:100%}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:620px;margin:auto;display:flex;align-items:center;gap:12px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;overflow:hidden;background:var(--card2);border:1px solid var(--line)}
.brand svg{width:132%;height:132%;flex:none}
.top h1{font-size:1.15rem;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-dot{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--dim);white-space:nowrap}
.sync-dot i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync-dot.cloud i{background:var(--good)}

/* Main column */
.wrap{max-width:620px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tabh) + 32px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}
.wrap>*{min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-size:1.05rem;font-weight:700}
.sec-h .act{font-size:.85rem;color:var(--blue-hi);background:none;border:0;cursor:pointer;min-height:44px;padding:0 4px}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--orange-hi)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{height:var(--tabh);display:grid;place-items:center;align-content:center;gap:3px;border:0;background:none;color:var(--dim);font-size:.7rem;font-weight:500;cursor:pointer;position:relative}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--blue-hi);font-weight:700}
.tab.on .ic{stroke-width:2.5}
.tab.on::before{content:"";position:absolute;top:6px;width:44px;height:30px;border-radius:999px;background:var(--blue-soft);z-index:-1}

/* Cards & bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.hero{background:var(--card2);border-color:var(--line2)}
.card.warm{background:var(--card2);border-color:rgba(255,122,46,.4)}
.row{display:flex;align-items:center;gap:12px}
.row>.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:2px 11px;border-radius:999px;font-size:.8rem;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--muted);white-space:nowrap}
.chip.blue{color:var(--blue-hi);border-color:rgba(255,255,255,.4);background:var(--blue-soft)}
.chip.orange{color:var(--orange-hi);border-color:rgba(255,138,61,.45);background:var(--orange-soft)}
.chip.good{color:var(--good);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.1)}
.chip .ic{width:15px;height:15px}
.pill-btn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
.pill-btn.on{background:var(--blue-soft);border-color:rgba(255,255,255,.55);color:var(--blue-hi);font-weight:600}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);color:var(--text);font-weight:600;font-size:.98rem;line-height:1.1;cursor:pointer;text-decoration:none;transition:transform .12s,background .2s,border-color .2s;text-align:center}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:rgba(255,255,255,.4)}
.btn.pri{background:var(--orange);color:var(--on-orange);border-color:transparent}
.btn.blue{background:var(--blue-soft);border-color:rgba(255,255,255,.45);color:var(--blue-hi)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{background:rgba(255,107,133,.1);border-color:rgba(255,107,133,.45);color:#ffb0bf}
.btn.block{width:100%}
.btn.lg{min-height:58px;font-size:1.08rem;border-radius:16px}
.btn.sm{min-height:44px;padding:0 14px;font-size:.88rem;border-radius:12px}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.btns>.btn.pri{background:var(--orange);color:var(--on-orange);border-color:transparent}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.icon-btn:hover{border-color:var(--line2)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}

.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--orange)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis .wide{grid-column:1/-1}
@media (min-width:480px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.t3{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.t3 .wide{grid-column:auto}}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days7 .pill-btn{padding:0;min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi b{display:block;font:700 1.45rem/1.15 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--text)}
.kpi span{font-size:.78rem;color:var(--muted)}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:start;color:inherit;cursor:pointer}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:.82rem;color:var(--muted);display:block}
.badge-ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-hi)}
.badge-ic.o{background:var(--orange-soft);color:var(--orange-hi)}
.badge-ic.g{background:rgba(61,220,151,.12);color:var(--good)}
.badge-ic.d{background:rgba(255,255,255,.06);color:var(--dim)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line2);border-radius:14px}
.note{font-size:.85rem;color:var(--muted);line-height:1.5}
.warnbox{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(255,193,69,.08);border:1px solid rgba(255,193,69,.35);color:#ffe2a3;font-size:.88rem}
.warnbox .ic{color:var(--warn);margin-top:2px}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;justify-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:.72rem;color:var(--dim)}
.wd b{font:600 .95rem/1 var(--f-mono);color:var(--muted)}
.wd .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed transparent}
.wd.plan .dot{border-color:rgba(255,255,255,.5)}
.wd.done .dot{background:var(--blue);border:0;color:#03121a}
.wd.done .dot .ic{width:14px;height:14px;stroke-width:3}
.wd.today{background:var(--blue-soft);color:var(--blue-hi)}
.wd.today b{color:var(--text)}

/* Session hero */
.sess-title{font-size:1.45rem;font-weight:800;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted);margin:8px 0 12px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .ic{width:16px;height:16px}

/* Overlays */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov .bgfx{position:fixed}
.ov-in{position:relative;z-index:1;max-width:560px;margin:auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.ov-top{display:flex;align-items:center;gap:10px;min-height:48px}
.ov-top .grow{flex:1;min-width:0;text-align:center;font-weight:600;font-size:.9rem;color:var(--muted)}
.spacer{flex:1}

/* Questionnaire */
.ob-prog{display:flex;gap:4px;flex:1}
.ob-prog i{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.12)}
.ob-prog i.on{background:var(--orange)}
.ob-q{display:grid;gap:8px}
.ob-q h2{font-size:1.6rem;font-weight:800}
.ob-q p{color:var(--muted)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;text-align:start;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:rgba(255,255,255,.45)}
.opt .ic{width:24px;height:24px;color:var(--blue-hi)}
.opt-t{flex:1;min-width:0;display:grid;gap:2px}
.opt-t b{font-weight:600}
.opt-t small{font-size:.82rem;color:var(--muted);line-height:1.35}
.opt .tick{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent}
.opt .tick .ic{width:14px;height:14px;stroke-width:3;color:inherit}
.opt.on{border-color:var(--orange);background:var(--orange-soft)}
.opt.on .tick{background:var(--blue);border-color:var(--blue);color:#03121a}
.lvnum{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;font:700 1rem/1 var(--f-mono);font-variant-numeric:tabular-nums;background:var(--blue-soft);color:var(--blue-hi)}
.lvnum.hi{background:var(--orange-soft);color:var(--orange-hi)}
.opt.on .lvnum{background:var(--blue);color:#03121a}
.opt.on .lvnum.hi{background:var(--orange);color:var(--on-orange)}
.field{display:grid;gap:8px}
.field>label,.field>.lbl{font-weight:600;font-size:.92rem}
.inp{width:100%;min-height:52px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);color:var(--text);font-size:1rem}
.inp:focus{border-color:var(--blue);outline:none}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;text-align:start;width:100%}
.check .box{width:24px;height:24px;flex:none;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent;margin-top:1px}
.check.on{border-color:var(--blue)}
.check.on .box{background:var(--blue);border-color:var(--blue);color:#03121a}
.check .box .ic{width:15px;height:15px;stroke-width:3}
.ob-nav{position:sticky;bottom:0;display:flex;gap:10px;padding-top:10px;background:var(--bg)}
.ob-nav .btn.pri{background:var(--orange);color:var(--on-orange);border-color:transparent}
.welcome{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:2vh}
.welcome .logo{width:min(64vw,260px);aspect-ratio:1;position:relative}
.welcome .logo>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wordmark{display:grid;justify-items:center;line-height:1;font-family:var(--f-display);font-weight:700;direction:ltr}
.wordmark .w1{font-size:clamp(2.6rem,12vw,3.4rem);letter-spacing:.06em;padding-left:.06em}
.wordmark .w2{font-size:clamp(.9rem,3.8vw,1.1rem);letter-spacing:.34em;padding-left:.34em;color:var(--orange);margin-top:6px}
.welcome h2{font-size:1.35rem;font-weight:700;margin-top:6px}
.welcome p{color:var(--muted);max-width:40ch}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.plan-days{display:grid;gap:8px}
.plan-day{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.plan-day .d{width:78px;flex:none;font:600 .85rem/1.25 var(--f-ui);color:var(--blue-hi)}

/* Sheets */
.sheet-bd{position:fixed;inset:0;z-index:60;background:rgba(1,3,8,.66);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease-out}
.sheet{width:min(100%,620px);max-height:90%;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;padding-top:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:sheetIn .26s cubic-bezier(.16,1,.3,1)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 8px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h2{flex:1;font-size:1.2rem;font-weight:700}
.sheet-body{display:grid;gap:14px}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:min(92vw,440px);padding:12px 16px;border-radius:14px;background:#272a30;border:1px solid var(--line2);box-shadow:0 14px 30px -10px rgba(0,0,0,.7);font-size:.92rem;display:flex;gap:10px;align-items:center;animation:fadeUp .2s ease-out}
.toast .ic{color:var(--good)}

/* Workout player */
.pl-prog{height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.pl-prog i{display:block;height:100%;background:var(--orange)}
.pl-block{font-size:.85rem;font-weight:600;color:var(--orange-hi)}
.pl-name{font-size:clamp(1.6rem,7vw,2.1rem);font-weight:800;line-height:1.15}
.pl-cue{color:var(--muted);font-size:.95rem;line-height:1.5}
.pl-row{display:flex;align-items:flex-start;gap:14px}
.pl-row>.grow{min-width:0;display:grid;gap:6px}
.tvid{position:relative;display:block;width:min(100%,240px);margin:0 auto;padding:0;border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:#000;aspect-ratio:9/16;cursor:pointer}
.tvid video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tvid-ic{position:absolute;inset:auto 8px 8px auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(5,7,13,.7);color:var(--text);opacity:0;transition:opacity .15s}
.tvid-ic .ic{width:16px;height:16px;fill:currentColor;stroke:none}
.tvid.paused .tvid-ic,.tvid:focus-visible .tvid-ic{opacity:1}
.tvid.thumb{width:72px;margin:0;flex:none;border-radius:12px}
.next-up>span{flex:1;min-width:0}
.next-up .tvid.thumb{width:64px}
.ring{position:relative;width:min(70vw,250px);aspect-ratio:1;margin:4px auto;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.1);stroke-width:7}
.ring .arc{fill:none;stroke:var(--blue);stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .1s linear}
.ring.rest .arc{stroke:var(--orange)}
.ring .big{font:700 clamp(3rem,15vw,4.2rem)/1 var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr}
.ring .lbl{position:absolute;bottom:22%;font-size:.85rem;color:var(--muted)}
.target{display:grid;justify-items:center;gap:6px;padding:12px 0}
.target .big{font:700 clamp(3.4rem,17vw,4.6rem)/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper .icon-btn{width:56px;height:56px;border-radius:16px}
.next-up{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.next-up b{color:var(--text);font-weight:600}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpe button{min-height:64px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;display:grid;place-items:center;align-content:center;gap:2px;font-size:.75rem;color:var(--muted);padding:6px 2px}
.rpe button b{font:700 1.15rem/1 var(--f-mono);color:var(--text)}

.run-obs{text-align:center;display:grid;gap:4px}
.run-obs b{font-size:1.5rem;font-weight:800}

.tap .ic{width:44px;height:44px;stroke-width:2.5;color:var(--blue-hi)}

.splits{display:grid;gap:4px}
.split{display:grid;grid-template-columns:22px 1fr auto 62px;gap:8px;align-items:center;min-height:34px;padding:0 10px;border-radius:10px;font-size:.9rem;color:var(--dim)}
.split.done{color:var(--text)}
.split.cur{background:var(--blue-soft);color:var(--text)}
.split .d{text-align:end;font-size:.8rem}
.up{color:var(--good)}.down{color:var(--orange-hi)}

.r-node .body{fill:#081226;stroke:var(--blue);stroke-width:1.8}
.r-node.start .body{fill:#0b2238;stroke:var(--blue-hi)}
.r-node.end .body{fill:#2a1206;stroke:var(--orange)}
.r-node .num{font:700 9.5px var(--f-mono);fill:#e8f4ff;pointer-events:none}
.r-node .lab{font:500 9px var(--f-ui);fill:#b3c7e2;pointer-events:none;paint-order:stroke;stroke:#050a16;stroke-width:3px;stroke-linejoin:round}
.obs-row{display:flex;align-items:center;gap:8px}
.obs-row .inp{min-height:48px;flex:1;min-width:0}

/* Charts */
.chart{display:block;width:100%;height:auto;direction:ltr}
.c-ax{font:500 9px var(--f-mono);fill:var(--dim)}
.c-lab{font:500 10px var(--f-ui);fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--blue)}
.test-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.test-row:last-child{border-bottom:0}
.test-row .grow{flex:1;min-width:0}
.test-row .v{font:700 1.1rem/1.2 var(--f-mono)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach>div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);min-width:0}
.ach>div.off{opacity:.45}
.ach b{display:block;font-size:.85rem}
.ach small{display:block;font-size:.72rem;color:var(--muted);line-height:1.3}
.ach .badge-ic{width:34px;height:34px;border-radius:10px}

/* Settings */
.set-row{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .grow{flex:1;min-width:0}
.switch{width:52px;height:32px;flex:none;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.1);position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:inset-inline-start .2s,background .2s}

.switch[aria-checked=true]::after{inset-inline-start:23px;background:var(--blue-hi)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:500}
.seg button.on{background:var(--blue-soft);color:var(--blue-hi);font-weight:700}


/* Logo */
.mk-star{transform-box:view-box;transform-origin:0 0}
.anim .mk-star{animation:starIn 1.4s cubic-bezier(.16,1,.3,1) .1s both}
@keyframes starIn{from{transform:rotate(-540deg) scale(.2);opacity:0}55%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{from{stroke-dashoffset:4}to{stroke-dashoffset:-46}}

@media (min-width:700px){.ring{width:270px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ═════════════════ Overlay rendering ═════════════════ */
function renderOv() {
  const root = $('#ov');
  const o = UI.ov;
  if (!o) { root.innerHTML = ''; return; }
  const html = o.kind === 'ob' ? vOb(o) : o.kind === 'player' ? vPlayer(o) : o.kind === 'runner' ? vRunner(o) : vTest(o);
  const st = root.firstElementChild ? root.firstElementChild.scrollTop : 0;
  root.innerHTML = `<div class="ov" role="dialog" aria-modal="true"><div class="bgfx"></div><div class="ov-in">${html}</div></div>`;
  if (o.kind === 'ob' && o.keepScroll) { root.firstElementChild.scrollTop = st; o.keepScroll = false; }
  setInert();
}

  if (b === 'p-note') { S.profile.strengthNote = e.target.value.trim().slice(0, 300); touchProfile(); }

  const days = P.days.map(d => DAYS_SHORT[lang][d]).join(' · ');
  return `<p class="note">${t('remS')}</p>
<div class="field"><label for="remTime">${t('remTimeL')}</label><input class="inp mono" id="remTime" data-bind="rem-time" type="time" value="${esc(time)}" dir="ltr" style="max-width:180px;text-align:center"><span class="note">${esc(days)}</span></div>
<div><button class="btn pri block" data-act="rem-ics">${ic('calendar')} ${t('remCal')}</button><p class="note" style="margin-top:6px">${t('remCalD')}</p></div>
${supported ? `<div class="set-row"><span class="grow"><b>${t('remBrowser')}</b><span class="note" style="display:block">${t('remBrowserD')}</span></span><button class="switch" role="switch" aria-checked="${live}" aria-label="${esc(t('remBrowser'))}" data-act="rem-toggle"></button></div>${perm === 'denied' ? `<p class="note" style="color:var(--bad)">${t('remDenied')}</p>` : ''}${live ? `<button class="btn sm" data-act="rem-test">${ic('bolt')} ${t('remTest')}</button>` : ''}` : `<p class="note">${inViewer() ? t('remViewer') : t('remNoSupport')}</p>`}`;
}
function remindAsk() {
  if (S.prefs.remindAsked || S.prefs.remindOn) return '';
  return `<section class="card"><div class="row"><span class="badge-ic o">${ic('clock')}</span><div class="grow"><h2 style="font-size:1.05rem">${t('remAsk')}</h2><p class="note">${t('remAskD')}</p></div></div><div class="btns" style="margin-top:12px"><button class="btn pri" data-act="rem-open">${t('remSet')}</button><button class="btn ghost" data-act="rem-later">${t('remLater')}</button></div></section>`;
}
// Saves a text file: through the viewer's download prompt inside Claude, or a normal browser download elsewhere.
async function saveFile(name, text, mime) {
  if (Caps.downloads) {
    try { const r = await Caps.downloads.save({ filename: name, data: text }); return !!r; }
    catch (e) { if (e && e.code === 'cancelled') return false; }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch (e) { return false; }
}
const icsEsc = x => String(x).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function icsFold(line) {
  const enc = new TextEncoder();
  if (enc.encode(line).length <= 75) return line;
  let out = '', cur = '', bytes = 0;
  for (const ch of line) { const b = enc.encode(ch).length; if (bytes + b > 75) { out += cur + '\r\n '; cur = ''; bytes = 1; } cur += ch; bytes += b; }
  return out + cur;
}
// One repeating weekly event per training day, in floating local time, with an alert 10 minutes before. Re-importing updates the same events (stable UIDs).
function buildICS() {
  const P = S.profile, W = weekInfo(), [hh, mm] = (S.prefs.remindTime || '18:00').split(':').map(Number);
  const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'], now = new Date();
  const loc = d => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
  const stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const url = /^https?:$/.test(location.protocol) ? location.href.split('#')[0] : '';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//NINJA CIRCUIT//1.0//HE', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  P.days.forEach((dow, i) => {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
    start.setDate(start.getDate() + (dow - start.getDay() + 7) % 7);
    if (start <= now) start.setDate(start.getDate() + 7);
    const end = new Date(start.getTime() + P.minutes * 60000);
    lines.push('BEGIN:VEVENT', `UID:ninja-circuit-${dow}@ninja-circuit`, `DTSTAMP:${stamp}`, `DTSTART:${loc(start)}`, `DTEND:${loc(end)}`, `RRULE:FREQ=WEEKLY;BYDAY=${BY[dow]}`,
      `SUMMARY:${icsEsc(t('icsTitle', { n: L(TPL[W.plan[i]].name) }))}`, `DESCRIPTION:${icsEsc(t('icsDesc'))}`);
    if (url) lines.push(`URL:${url}`);
    lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(t('icsAlarm'))}`, 'TRIGGER:-PT10M', 'END:VALARM', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
function todayNote() {
  const P = S.profile; if (!P) return null;
  const W = weekInfo(); if (W.next < 0) return null;
  const type = W.plan[W.next], sess = buildSession(P, type, W.week);
  return { title: t('remNotifTitle'), body: t('remNotifBody', { n: L(TPL[type].name), m: sess.est }) };
}
// Android only allows notifications through the service worker; desktop browsers also accept the plain constructor.
async function notify(title, body) {
  const opts = { body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'ninja-daily', lang, dir: lang === 'he' ? 'rtl' : 'ltr' };
  try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg && reg.active) { await reg.showNotification(title, opts); return true; } } catch (e) {}
  try { new Notification(title, opts); return true; } catch (e) { return false; }
}
let notifiedKey = '';
function checkReminder() {
  const P = S.profile;
  if (!P || !S.prefs.remindOn || inViewer() || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date(), key = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
  if (!P.days.includes(now.getDay())) return;
  const [hh, mm] = (S.prefs.remindTime || '18:00').split(':').map(Number), mins = now.getHours() * 60 + now.getMinutes(), at = hh * 60 + mm;
  if (mins < at || mins > at + 360) return;
  if (sessions().some(x => sameDay(x.ts, now))) return;
  let seen = notifiedKey; try { seen = localStorage.getItem('ninja-circuit-notified') || seen; } catch (e) {}
  if (seen === key) return;
  const n = todayNote(); if (!n) return;
  // Only mark the day as notified once the browser accepted it, so a failure (for example before the service worker is ready) is retried.
  notifiedKey = key;
  notify(n.title, n.body).then(ok => { if (ok) { try { localStorage.setItem('ninja-circuit-notified', key); } catch (e) {} } else notifiedKey = ''; });
}

/* ═════════════════ Boot ═════════════════ */
render();
setInterval(checkReminder, 30000); setTimeout(checkReminder, 1500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkReminder(); });
(async () => {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  connectCloud();
  try { Caps.downloads = await c.use('downloads'); } catch (e) {}
})();
})();
</script>
