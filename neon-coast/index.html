<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f1e">
<title>Neon Coast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Heebo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>

  <div id="hud" class="hud" hidden>
    <div class="hud-tr">
      <div class="money-wrap"><div id="money" class="money">$0</div><div id="moneyDelta" class="money-delta"></div></div>
      <div id="stars" class="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
      <div id="evade" class="evade"><i></i></div>
      <div class="weapon"><span id="weaponName"></span><b id="ammo"></b></div>
      <div id="clock" class="clock">14:00</div>
    </div>
    <div id="notify" class="notify"></div>
    <div id="missionTimer" class="mission-timer"></div>
    <div id="missionTitle" class="mission-title"></div>
    <div id="radioPopup" class="radio"></div>
    <div class="hud-bl">
      <canvas id="minimap"></canvas>
      <div class="bars"><div class="bar health"><i id="healthBar"></i></div><div class="bar armor"><i id="armorBar"></i></div></div>
      <div id="speedo" class="speedo"><b id="speed">0</b><span data-t="kmh"></span></div>
    </div>
    <div id="prompt" class="prompt"></div>
    <div id="objective" class="objective"></div>
    <div id="subtitle" class="subtitle"></div>
    <div id="crosshair" class="crosshair"></div>
    <div id="hurt" class="hurt"></div>
    <div id="missionResult" class="mission-result"><div class="title"></div><div class="sub"></div></div>
    <div id="overlay" class="overlay"><div class="big"></div><div class="sub"></div></div>
  </div>

  <div id="loading" class="screen loading"><div class="spinner"></div><p data-t="loading">טוען את העיר…</p></div>

  <div id="title" class="screen title" hidden>
    <div class="title-inner">
      <div class="logo" aria-label="Neon Coast">NEON<span>COAST</span></div>
      <p class="tagline" data-t="tagline"></p>
      <div class="menu">
        <button id="btnNew" class="btn primary" data-t="start"></button>
        <button id="btnContinue" class="btn" data-t="continue"></button>
        <button id="btnControls" class="btn ghost" data-t="controls"></button>
      </div>
      <div class="lang"><button class="btn small ghost" data-lang="he">עברית</button><button class="btn small ghost" data-lang="en">English</button></div>
      <div id="titleControls" class="controls-panel"><ul class="controls-list"></ul></div>
    </div>
  </div>

  <div id="pause" class="screen modal" hidden>
    <div class="panel pause-panel">
      <h2 data-t="paused"></h2>
      <div class="cols">
        <div class="menu col">
          <button id="btnResume" class="btn primary" data-t="resume"></button>
          <button id="btnSave" class="btn" data-t="save"></button>
          <button id="btnLoad" class="btn" data-t="load"></button>
          <button id="btnQuit" class="btn ghost" data-t="quit"></button>
        </div>
        <div class="settings">
          <h3 data-t="settings"></h3>
          <label><span data-t="quality"></span><select id="selQuality"></select></label>
          <label><span data-t="volume"></span><input id="rangeVolume" type="range" min="0" max="1" step="0.05"></label>
          <label><span>Mouse</span><input id="rangeSens" type="range" min="0.3" max="2.5" step="0.1"></label>
          <label><span data-t="language"></span><span class="lang"><button class="btn small ghost" data-lang="he">עברית</button><button class="btn small ghost" data-lang="en">English</button></span></label>
        </div>
        <div class="stats"><h3 data-t="ui.stats"></h3><ul id="stats"></ul></div>
        <div class="controls"><h3 data-t="controls"></h3><ul class="controls-list"></ul></div>
      </div>
    </div>
  </div>

  <div id="map" class="screen modal" hidden>
    <div class="panel map-panel">
      <div class="panel-head"><h2 data-t="map"></h2><button id="btnMapClose" class="btn small" data-t="close"></button></div>
      <canvas id="bigmap"></canvas>
      <ul id="legend" class="legend"></ul>
    </div>
  </div>

  <div id="shop" class="screen modal" hidden>
    <div class="panel shop-panel">
      <div class="panel-head"><h2 id="shopTitle"></h2><button id="btnShopClose" class="btn small" data-t="close"></button></div>
      <ul id="shopList" class="shop-list"></ul>
    </div>
  </div>

  <div id="touch" class="touch" hidden>
    <div class="stick"><div class="knob"></div></div>
    <div class="tbtns">
      <button data-btn="weapon">⇄</button><button data-btn="aim">◎</button><button data-btn="fire">●</button>
      <button data-btn="map">M</button><button data-btn="jump">⤒</button><button data-btn="run">»</button>
      <button data-btn="pause">II</button><button data-btn="enter">E</button><button data-btn="brake">▼</button>
    </div>
    <button class="tside" data-btn="radio">♪</button><button class="tside second" data-btn="horn">H</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
