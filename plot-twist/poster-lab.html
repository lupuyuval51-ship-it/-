<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Poster Lab · PLOT TWIST</title>
    <style>
      :root {
        --bg: #0d0c0b;
        --panel: #171513;
        --ink: #efe9df;
        --dim: #9a9187;
        --line: #2a2622;
        --accent: #ff5b1f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); }
      body { font: 14px/1.45 "Instrument Sans Variable", system-ui, sans-serif; padding: 28px 24px 64px; }
      header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 8px; }
      h1 { font: 600 28px/1.1 "Fraunces Variable", Georgia, serif; margin: 0; letter-spacing: -0.01em; }
      #status { font: 500 12px/1.4 "JetBrains Mono Variable", ui-monospace, monospace; color: var(--dim); letter-spacing: 0.04em; }
      section { margin-top: 30px; }
      h2 { font: 600 13px/1.2 "JetBrains Mono Variable", ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 4px; }
      .note { margin: 0 0 14px; color: var(--dim); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
      .card { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
      .poster { display: block; width: 100%; height: auto; aspect-ratio: 2 / 3; border-radius: 3px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.45); }
      figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding-top: 9px; }
      .name { flex: 1 1 auto; font-weight: 600; font-size: 12.5px; }
      .ms { font: 11px/1 "JetBrains Mono Variable", ui-monospace, monospace; color: var(--dim); }
      .download { font: 600 12px/1 "Instrument Sans Variable", system-ui, sans-serif; color: var(--bg); background: var(--ink); border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer; min-height: 32px; }
      .download:hover { background: var(--accent); }
      .download:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .download:disabled { opacity: 0.5; cursor: progress; }
      .matrix { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; max-width: 1180px; }
      .thumb { display: block; width: 100%; height: auto; aspect-ratio: 2 / 3; border-radius: 2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Poster Lab</h1>
      <span id="status">rendering…</span>
    </header>
    <main id="lab"></main>
    <script type="module" src="/src/poster/lab.ts"></script>
  </body>
</html>
