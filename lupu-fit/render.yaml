# UNTESTED draft. Set DATABASE_URL, ADMIN_USERNAMES and AI keys in the dashboard.
services:
  - type: web
    name: lupu-fit
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS   # optional, e.g. model-a,model-b
        sync: false
