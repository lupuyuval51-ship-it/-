/* ================================================================
   מנוע ה-WebGL עצמו
   ================================================================ */
const Scene3D = {
  ok: false, gl: null, prog: null, buf: null, count: 0, scene: null,
  yaw: 0, pitch: 0, cv: null, lastT: 0,
  /* השחקן עומד בחדר וזז בו: מיקום, כיוון מבט, ומקשים לחוצים */
  player: { x: 0, y: 1.55, z: -1, yaw: 0, pitch: 0 },
  keys: {}, drag: null, chapterSpawned: -1,

  init(canvas) {
    this.cv = canvas;
    let gl = null;
    try { gl = canvas.getContext("webgl", { antialias: true, alpha: false, depth: true }) ||
               canvas.getContext("experimental-webgl", { antialias: true, alpha: false, depth: true }); }
    catch (e) { gl = null; }
    if (!gl) return false;
    this.gl = gl;

    const vs = `
      attribute vec3 aPos; attribute vec3 aNorm; attribute vec3 aCol; attribute float aEmit;
      uniform mat4 uProj, uView;
      varying vec3 vPos, vNorm, vCol; varying float vEmit;
      void main(){
        vPos = aPos; vNorm = aNorm; vCol = aCol; vEmit = aEmit;
        gl_Position = uProj * uView * vec4(aPos, 1.0);
      }`;
    const fs = `
      precision mediump float;
      varying vec3 vPos, vNorm, vCol; varying float vEmit;
      uniform vec3 uLp[4], uLc[4]; uniform float uLr[4], uLi[4];
      uniform vec3 uAmb, uFog, uEye; uniform float uFogD, uGain;
      void main(){
        vec3 n = normalize(vNorm);
        vec3 alb = vCol * uGain;
        vec3 lit = uAmb * alb;
        for (int i = 0; i < 4; i++){
          vec3 d = uLp[i] - vPos;
          float dist = length(d);
          float att = max(0.0, 1.0 - dist / uLr[i]);
          att *= att * uLi[i];
          float lam = max(0.0, dot(n, d / max(dist, 0.001)));
          lit += alb * uLc[i] * (0.25 + 0.75 * lam) * att;
        }
        vec3 col = mix(lit, vCol, vEmit);
        float dc = length(vPos - uEye) * uFogD;
        col = mix(col, uFog, clamp(1.0 - exp(-dc * dc), 0.0, 1.0));
        gl_FragColor = vec4(col, 1.0);
      }`;
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
      return s;
    };
    const v = mk(gl.VERTEX_SHADER, vs), f = mk(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return false;
    const p = gl.createProgram();
    gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return false;
    this.prog = p;
    gl.useProgram(p);
    this.loc = {
      aPos: gl.getAttribLocation(p, "aPos"), aNorm: gl.getAttribLocation(p, "aNorm"),
      aCol: gl.getAttribLocation(p, "aCol"), aEmit: gl.getAttribLocation(p, "aEmit"),
      uProj: gl.getUniformLocation(p, "uProj"), uView: gl.getUniformLocation(p, "uView"),
      uLp: gl.getUniformLocation(p, "uLp"), uLc: gl.getUniformLocation(p, "uLc"),
      uLr: gl.getUniformLocation(p, "uLr"), uLi: gl.getUniformLocation(p, "uLi"),
      uAmb: gl.getUniformLocation(p, "uAmb"), uFog: gl.getUniformLocation(p, "uFog"),
      uFogD: gl.getUniformLocation(p, "uFogD"), uEye: gl.getUniformLocation(p, "uEye"),
      uGain: gl.getUniformLocation(p, "uGain")
    };
    this.buf = gl.createBuffer();
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    this.ok = true;
    return true;
  },

  /* בונים מחדש את הסצנה רק כשמשהו במצב המשחק השתנה */
  build(t) {
    if (!this.ok) return;
    const gl = this.gl;
    const scene = SCENES[gameState.chapter](t);
    this.scene = scene;
    const data = new Float32Array(scene.mesh.v);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
    this.count = data.length / 10;
  },

  /* בכניסה לפרק — השחקן מוצב בנקודת ההתחלה של הסצנה */
  spawn(scene) {
    const d = norm3(sub3(scene.look, scene.eye));
    this.player.x = scene.eye[0];
    this.player.y = scene.eye[1];
    this.player.z = scene.eye[2];
    this.player.yaw = Math.atan2(d[0], -d[2]);
    this.player.pitch = Math.max(-0.9, Math.min(0.9, Math.asin(d[1])));
    this.chapterSpawned = gameState.chapter;
  },

  /* הליכה: מקשים, קצב לפי זמן אמיתי, והתנגשות עם קירות ורהיטים */
  step(dt) {
    const s = this.scene;
    if (!s) return;
    const k = this.keys;
    const fwd = (k.w ? 1 : 0) - (k.s ? 1 : 0);
    const side = (k.d ? 1 : 0) - (k.a ? 1 : 0);
    const turn = (k.right ? 1 : 0) - (k.left ? 1 : 0);
    if (turn) this.player.yaw += turn * dt * 1.7;
    if (!fwd && !side) return;
    const sp = 1.9 * dt;
    const sy = Math.sin(this.player.yaw), cy = Math.cos(this.player.yaw);
    let nx = this.player.x + (sy * fwd + cy * side) * sp;
    let nz = this.player.z + (-cy * fwd + sy * side) * sp;
    const b = s.bounds;
    if (b) {
      nx = Math.max(b[0] + 0.35, Math.min(b[1] - 0.35, nx));
      nz = Math.max(b[2] + 0.35, Math.min(b[3] - 0.35, nz));
    }
    // חוסמים: לא עוברים דרך שולחן, כיסא או מסגרת
    (s.blockers || []).forEach(bl => {
      if (nx > bl[0] - 0.3 && nx < bl[1] + 0.3 && nz > bl[2] - 0.3 && nz < bl[3] + 0.3) {
        const dxl = Math.abs(nx - (bl[0] - 0.3)), dxr = Math.abs(nx - (bl[1] + 0.3));
        const dzb = Math.abs(nz - (bl[2] - 0.3)), dzf = Math.abs(nz - (bl[3] + 0.3));
        const m = Math.min(dxl, dxr, dzb, dzf);
        if (m === dxl) nx = bl[0] - 0.3; else if (m === dxr) nx = bl[1] + 0.3;
        else if (m === dzb) nz = bl[2] - 0.3; else nz = bl[3] + 0.3;
      }
    });
    this.player.x = nx; this.player.z = nz;
  },

  camera(t, stable) {
    const bob = (stable || gameState.reduceMotion) ? 0 : Math.sin(t * 1.4) * 0.010;
    const p = this.player;
    const eye = [p.x, p.y + bob, p.z];
    const cp = Math.cos(p.pitch);
    const dir = [Math.sin(p.yaw) * cp, Math.sin(p.pitch), -Math.cos(p.yaw) * cp];
    return { eye, tgt: [eye[0] + dir[0] * 4, eye[1] + dir[1] * 4, eye[2] + dir[2] * 4] };
  },

  /* גרירה = הבטה מסביב */
  lookBy(dx, dy) {
    this.player.yaw += dx * 0.005;
    this.player.pitch = Math.max(-0.75, Math.min(0.75, this.player.pitch - dy * 0.004));
  },

  draw(t) {
    if (!this.ok || !this.scene) return;
    const gl = this.gl, W = this.cv.width, H = this.cv.height;
    if (!W || !H) return;
    // התקדמות הליכה לפי הזמן שעבר מאז הפריים הקודם
    const dt = this.lastT ? Math.min(0.1, t - this.lastT) : 0;
    this.lastT = t;
    if (this.chapterSpawned !== gameState.chapter) this.spawn(this.scene);
    this.step(dt);

    gl.viewport(0, 0, W, H);
    const s = this.scene;
    gl.clearColor(s.fog[0], s.fog[1], s.fog[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(this.prog);

    const cam = this.camera(t);
    const proj = M4.persp(1.16, W / H, 0.05, 60);
    const view = M4.lookAt(cam.eye, cam.tgt, [0, 1, 0]);
    this.mvp = { proj, view, eye: cam.eye };
    const st = this.camera(t, true);
    this.mvpStable = { proj, view: M4.lookAt(st.eye, st.tgt, [0, 1, 0]) };

    const lp = [], lc = [], lr = [], li = [];
    for (let i = 0; i < 4; i++) {
      const L = s.lights[i];
      lp.push(L ? L.p[0] : 0, L ? L.p[1] : 0, L ? L.p[2] : 0);
      lc.push(L ? L.c[0] : 0, L ? L.c[1] : 0, L ? L.c[2] : 0);
      lr.push(L ? L.r : 1); li.push(L ? L.i : 0);
    }
    gl.uniformMatrix4fv(this.loc.uProj, false, new Float32Array(proj));
    gl.uniformMatrix4fv(this.loc.uView, false, new Float32Array(view));
    gl.uniform3fv(this.loc.uLp, new Float32Array(lp));
    gl.uniform3fv(this.loc.uLc, new Float32Array(lc));
    gl.uniform1fv(this.loc.uLr, new Float32Array(lr));
    gl.uniform1fv(this.loc.uLi, new Float32Array(li));
    // ההחשכה של הלילה מורידה את התאורה הסביבתית
    const k = Math.max(0.4, 1 - (gameState.dark + gameState.loopDark * 1.5) * 0.06);
    gl.uniform3fv(this.loc.uAmb, new Float32Array([s.ambient[0] * k, s.ambient[1] * k, s.ambient[2] * k]));
    gl.uniform1f(this.loc.uGain, 2.9);
    gl.uniform3fv(this.loc.uFog, new Float32Array(s.fog));
    gl.uniform1f(this.loc.uFogD, s.fogD);
    gl.uniform3fv(this.loc.uEye, new Float32Array(cam.eye));

    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    const stride = 10 * 4;
    gl.enableVertexAttribArray(this.loc.aPos);
    gl.vertexAttribPointer(this.loc.aPos, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(this.loc.aNorm);
    gl.vertexAttribPointer(this.loc.aNorm, 3, gl.FLOAT, false, stride, 12);
    gl.enableVertexAttribArray(this.loc.aCol);
    gl.vertexAttribPointer(this.loc.aCol, 3, gl.FLOAT, false, stride, 24);
    gl.enableVertexAttribArray(this.loc.aEmit);
    gl.vertexAttribPointer(this.loc.aEmit, 1, gl.FLOAT, false, stride, 36);
    gl.drawArrays(gl.TRIANGLES, 0, this.count);
  },

  /* הטלת נקודה תלת-ממדית לאחוזי מסך — כך אזורי החיפוש נשארים על החפצים */
  project(p) {
    if (!this.mvpStable) return null;
    const { proj, view } = this.mvpStable;
    const t = [
      view[0]*p[0] + view[4]*p[1] + view[8]*p[2] + view[12],
      view[1]*p[0] + view[5]*p[1] + view[9]*p[2] + view[13],
      view[2]*p[0] + view[6]*p[1] + view[10]*p[2] + view[14],
      view[3]*p[0] + view[7]*p[1] + view[11]*p[2] + view[15]
    ];
    const c = [
      proj[0]*t[0] + proj[4]*t[1] + proj[8]*t[2] + proj[12]*t[3],
      proj[1]*t[0] + proj[5]*t[1] + proj[9]*t[2] + proj[13]*t[3],
      proj[2]*t[0] + proj[6]*t[1] + proj[10]*t[2] + proj[14]*t[3],
      proj[3]*t[0] + proj[7]*t[1] + proj[11]*t[2] + proj[15]*t[3]
    ];
    if (c[3] <= 0.01) return null;
    return { x: (c[0] / c[3] * 0.5 + 0.5) * 100, y: (0.5 - c[1] / c[3] * 0.5) * 100 };
  },

  /* מפנה את המבט אל נקודה בחדר */
  aimAt(p) {
    const d = norm3(sub3(p, [this.player.x, this.player.y, this.player.z]));
    this.player.yaw = Math.atan2(d[0], -d[2]);
    this.player.pitch = Math.max(-0.75, Math.min(0.75, Math.asin(d[1])));
  },

  /* חזרה לנקודת ההתחלה של החדר */
  resetView() { if (this.scene) this.spawn(this.scene); }
};

/* ================================================================
   7. UI — מסכים, אזורי חיפוש, אינוונטר, ארכיון ומודאל
   ================================================================ */
const el = (id) => document.getElementById(id);
function make(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

/* ---- מעבר בין מסכים ---- */
function showScreen(name) {
  gameState.screen = name;
  el("screen-title").hidden = name !== "title";
  el("screen-game").hidden = name !== "game";
  el("screen-end").hidden = name !== "end";
}

/* ---- שורות הנרטיב: לעולם לא יותר משלוש ---- */
function say(lines, tone) {
  const box = el("say");
  clear(box);
  (lines || []).slice(0, 3).forEach(line => {
    const p = make("p", tone || "", line);
    box.appendChild(p);
  });
  FX.flicker(box);
}

/* ---- אזורי חיפוש בחדר ---- */
/* בתלת-ממד כל אזור חיפוש נצמד לנקודה בחדר ונע יחד עם המבט */
function placeHotspots3D() {
  const sc = Scene3D.scene;
  if (!sc || !sc.anchors) return;
  const nodes = el("hotspots").children;
  for (let i = 0; i < nodes.length; i++) {
    const a = sc.anchors[i];
    const b = nodes[i];
    const pt = a ? Scene3D.project(a) : null;
    if (!pt || pt.x < -10 || pt.x > 110 || pt.y < -10 || pt.y > 110) {
      // מחוץ לשדה הראייה: לא נראה ולא לחיץ, אבל עדיין אפשר להגיע אליו ב-Tab
      b.style.opacity = "0";
      b.style.pointerEvents = "none";
      continue;
    }
    b.style.opacity = "1";
    b.style.pointerEvents = "auto";
    const nx = (Math.round((pt.x - 6) * 4) / 4) + "%", ny = (Math.round((pt.y - 8) * 4) / 4) + "%";
    if (b.style.left !== nx) b.style.left = nx;
    if (b.style.top !== ny) b.style.top = ny;
    b.style.width = "12%";
    b.style.height = "16%";
  }
}

function renderHotspots() {
  const wrap = el("hotspots");
  clear(wrap);
  const ch = chapterData();
  const geo = HOTSPOTS[gameState.chapter];
  ch.hotspots.forEach((hs, i) => {
    const g = geo[i];
    const b = make("button", "hs");
    b.style.left = g.x + "%";
    b.style.top = g.y + "%";
    b.style.width = g.w + "%";
    b.style.height = g.h + "%";
    b.setAttribute("aria-label", TEXT.a11y.hotspot(hs.label));
    b.title = hs.label;
    const key = gameState.chapter + ":" + i;
    if (gameState.seenHotspots[key]) b.classList.add("seen");
    b.addEventListener("focus", () => {
      // רק ניווט מקלדת מזיז את המצלמה; לחיצת עכבר לא מקפיצה את המבט
      if (Room.mode !== "3d" || !Scene3D.scene) return;
      if (!b.matches(":focus-visible")) return;
      const a = Scene3D.scene.anchors[i];
      if (a) { Scene3D.aimAt(a); Room.paint(Room.last / 1000); }
    });
    b.addEventListener("click", () => {
      Audio_.click();
      gameState.seenHotspots[key] = true;
      b.classList.add("seen");
      say(hs.text);
      if (hs.question) addQuestion(hs.question);
      if (hs.item) addItem(hs.item);
    });
    wrap.appendChild(b);
  });
}

/* ---- תיאור החדר לקוראי מסך (כולל הדמות, כשהיא כבר קרובה) ---- */
function updateRoomDesc() {
  const ch = chapterData();
  const node = el("roomdesc");
  if (!node || !ch) return;
  node.textContent = TEXT.a11y.room(ch.roomDesc, gameState.monsterStep >= 1 ? ch.presence : "");
}

/* ---- אינוונטר ---- */
function renderInventory() {
  const wrap = el("invslots");
  clear(wrap);
  if (!gameState.inventory.length) {
    wrap.appendChild(make("span", "cap", TEXT.ui.bagEmpty));
    return;
  }
  gameState.inventory.forEach(name => {
    const b = make("button", "slot", name);
    b.setAttribute("aria-label", TEXT.a11y.itemBtn(name));
    b.addEventListener("click", () => {
      Audio_.click();
      const lines = TEXT.items[name] || [];
      openSheet(TEXT.ui.itemTitle(name), lines.map(l => make("p", null, l)));
    });
    wrap.appendChild(b);
  });
}

/* ---- מודאל כללי עם מלכודת פוקוס ---- */
let lastFocus = null;
function openSheet(title, nodes) {
  lastFocus = document.activeElement;
  el("sheet-title").textContent = title;
  const body = el("sheet-body");
  clear(body);
  (nodes || []).forEach(n => body.appendChild(n));
  el("veil").hidden = false;
  el("app").inert = true;
  el("btn-mute").inert = true;
  el("sheet-close").focus();
}
function closeSheet() {
  el("veil").hidden = true;
  el("app").inert = false;
  el("btn-mute").inert = false;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function trapFocus(e) {
  if (el("veil").hidden) return;
  if (e.key === "Escape") { closeSheet(); return; }
  if (e.key !== "Tab") return;
  const f = el("sheet").querySelectorAll("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])");
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ---- ארכיון השאלות ---- */
function openArchive() {
  Audio_.click();
  const nodes = [];
  if (!gameState.archive.length) {
    nodes.push(make("p", "empty", TEXT.ui.archiveEmpty));
  } else {
    const ol = make("ol");
    gameState.archive.forEach(q => ol.appendChild(make("li", null, q)));
    nodes.push(ol);
  }
  openSheet(TEXT.ui.archiveTitle, nodes);
}

/* ================================================================
   8. Puzzles — חמש החידות
   כל חידה בונה את הגוף שלה לתוך #pz-body ומחזירה פונקציית בדיקה.
   ================================================================ */
let currentCheck = null;   // הפונקציה שבודקת את התשובה בפרק הנוכחי

function buildPuzzle() {
  const ch = chapterData();
  el("pz-title").textContent = ch.puzzle;
  el("pz-ask").textContent = ch.pzAsk;
  const body = el("pz-body");
  const actions = el("pz-actions");
  clear(body); clear(actions);
  el("pz-feedback").textContent = "";
  el("pz-feedback").className = "feedback";

  const builder = [buildCh1, buildCh2, buildCh3, buildCh4, buildCh5][gameState.chapter];
  currentCheck = builder(body, actions, ch);

  // כפתור רמז — נפתח רק אחרי שלוש טעויות
  const locked = gameState.wrongCount[gameState.chapter] < 3;
  const hintBtn = make("button", "btn btn-ghost", locked ? TEXT.ui.hintLocked : TEXT.ui.hint);
  hintBtn.id = "btn-hint";
  hintBtn.disabled = locked;
  hintBtn.addEventListener("click", () => {
    Audio_.click();
    const lv = Math.min(gameState.hintLevel[gameState.chapter], ch.hints.length - 1);
    gameState.hintLevel[gameState.chapter] = lv + 1;
    const last = lv >= ch.hints.length - 1;
    setFeedback(TEXT.hintIntro + " " + ch.hints[lv] + (last ? " " + TEXT.ui.hintLast : ""), "");
  });
  actions.appendChild(hintBtn);
  const live = make("p", "sr", "");
  live.id = "hint-live";
  live.setAttribute("aria-live", "polite");
  actions.appendChild(live);
}

function setFeedback(txt, kind) {
  const f = el("pz-feedback");
  f.textContent = txt;
  f.className = "feedback" + (kind ? " " + kind : "");
}

/* תשובה שגויה: בלי מוות, בלי עונש. רק תגובה קצרה — והדמות מתקרבת. */
function wrongAnswer(customMsg) {
  const i = gameState.chapter, ch = chapterData();
  gameState.wrongCount[i]++;
  gameState.monsterStep++;
  Audio_.wrong();
  const msg = customMsg || ch.wrong[(gameState.wrongCount[i] - 1) % ch.wrong.length];
  setFeedback(msg, "bad");
  FX.flicker(el("room"));
  updateRoomDesc();
  // הרמז נפתח אחרי שלוש טעויות — ומוכרז, לא רק נראה
  const hb = el("btn-hint");
  if (hb && gameState.wrongCount[i] >= 3 && hb.disabled) {
    hb.disabled = false;
    hb.textContent = TEXT.ui.hint;
    const live = el("hint-live");
    if (live) live.textContent = TEXT.a11y.hintOpen;
  }
  Room.paint(Room.last / 1000);
}

/* פתרון: מתקדמים בהקלטה */
function solveChapter() {
  const i = gameState.chapter, ch = chapterData();
  if (gameState.solved[i]) return;
  gameState.solved[i] = true;
  Audio_.solve();
  FX.glitch(el("puzzle"));
  gameState.dark = Math.min(6, gameState.dark + 1);
  FX.applyDark();
  say([ch.solved[0], ch.solved[1]]);
  setFeedback(TEXT.recordingLabel + " " + ch.recording, "good");
  // אחרי הפתרון אי אפשר לדרוס בטעות את שורות הסיום
  el("hotspots").querySelectorAll("button").forEach(b => { b.disabled = true; });

  const actions = el("pz-actions");
  clear(actions);
  const next = make("button", "btn btn-main", TEXT.toNext);
  next.addEventListener("click", () => {
    Audio_.click();
    if (i >= TEXT.chapters.length - 1) endGame();
    else enterChapter(i + 1);
  });
  actions.appendChild(next);
  setTimeout(() => next.focus(), 0);
  // נועלים את שדות החידה
  el("pz-body").querySelectorAll("input,button").forEach(n => { n.disabled = true; });
}

/* ---------------- פרק 1: ספירת פסגות בגל הקול ---------------- */
function buildCh1(body, actions, ch) {
  const cv = make("canvas", "figure");
  cv.width = 900; cv.height = 260;
  cv.setAttribute("role", "img");
  cv.setAttribute("aria-label", TEXT.a11y.wave);
  body.appendChild(cv);
  body.appendChild(make("p", "cap", ch.pzCap));
  waveCanvas = cv;
  sizeWave(cv);

  const inp = make("input");
  inp.type = "text";
  inp.inputMode = "numeric";
  inp.maxLength = 4;
  inp.placeholder = ch.pzPlaceholder;
  inp.setAttribute("aria-label", TEXT.a11y.waveInput);
  const row = make("div", "row");
  row.appendChild(inp);
  body.appendChild(row);

  const ok = make("button", "btn", TEXT.ui.submit);
  ok.addEventListener("click", () => check());
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); check(); } });
  actions.appendChild(ok);

  function check() {
    Audio_.click();
    if (matches(inp.value, SOLUTIONS.ch1.accept)) solveChapter();
    else if (normalize(inp.value) === SOLUTIONS.ch1.reversed) wrongAnswer(ch.nearMiss);
    else wrongAnswer();
  }
  return check;
}

/* הקנבס של הגל נמדד לפי הרוחב שהוא באמת מקבל על המסך, כדי שהכיתוב יישאר קריא גם ב-360px */
let waveCanvas = null;
function sizeWave(cv) {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(300, Math.round((r.width || 900) * dpr));
  cv.width = w;
  cv.height = Math.round(w * 0.30);
  drawWave(cv, dpr);
}

/* ציור הגל: הערוץ העליון רועש, התחתון מסודר בקבוצות 7-3-1-9 */
function drawWave(cv, dpr) {
  const c = cv.getContext("2d"), W = cv.width, H = cv.height, mid = H * 0.46;
  const k = dpr || 1;
  c.fillStyle = "#08080a"; c.fillRect(0, 0, W, H);
  c.strokeStyle = "rgba(138,133,128,0.5)"; c.lineWidth = Math.max(1, W * 0.0015);
  c.beginPath(); c.moveTo(0, mid); c.lineTo(W, mid); c.stroke();

  // סימוני זמן — גודל הפונט נגזר מהרוחב המוצג בפועל
  const fpx = Math.min(18, Math.max(12, (W / k) * 0.035)) * k;
  c.fillStyle = "rgba(180,175,168,0.9)";
  c.font = Math.round(fpx) + "px system-ui, Arial, sans-serif";
  c.textAlign = "left"; c.textBaseline = "alphabetic";
  c.fillText("00:00", W * 0.012, H - fpx * 0.35);
  c.textAlign = "right"; c.fillText("00:33", W * 0.988, H - fpx * 0.35);
  c.strokeStyle = "rgba(138,133,128,0.2)";
  for (let i = 1; i < 12; i++) {
    const x = (W / 12) * i;
    c.beginPath(); c.moveTo(x, mid - H * 0.03); c.lineTo(x, mid + H * 0.03); c.stroke();
  }

  // ערוץ עליון — רציף, בלי קבוצות
  c.strokeStyle = "rgba(207,201,194,0.8)"; c.lineWidth = Math.max(1.5, W * 0.0026);
  let seed = 7;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  c.beginPath();
  for (let x = W * 0.02; x < W * 0.98; x += W * 0.0057) {
    const a = (0.25 + rnd() * 0.75) * (mid - H * 0.10);
    c.moveTo(x, mid - 2); c.lineTo(x, mid - 2 - a * 0.55);
  }
  c.stroke();

  // ערוץ תחתון — ארבע קבוצות מופרדות בבירור: 7, 3, 1, 9, פרושות על כל הרוחב
  c.strokeStyle = "rgba(204,34,34,0.95)"; c.lineWidth = Math.max(3, W * 0.0072); c.lineCap = "round";
  const groups = SOLUTIONS.ch1.groups;
  const gapIn = W * 0.0315, gapOut = W * 0.088;
  let x = W * 0.055;
  groups.forEach((n, gi) => {
    for (let j = 0; j < n; j++) {
      const h = (H - mid - fpx * 1.6) * (0.55 + ((j * 7 + gi * 3) % 5) * 0.09);
      c.beginPath(); c.moveTo(x, mid + H * 0.015); c.lineTo(x, mid + H * 0.015 + h); c.stroke();
      x += (j < n - 1) ? gapIn : gapOut;
    }
  });
}

/* ---------------- פרק 2: חידת הלוגיקה ---------------- */
function buildCh2(body, actions, ch) {
  const tbl = make("table", "board");
  const thead = make("thead"), trh = make("tr");
  ch.board.head.forEach(h => trh.appendChild(make("th", null, h)));
  thead.appendChild(trh); tbl.appendChild(thead);
  const tb = make("tbody");
  ch.board.rows.forEach(r => {
    const tr = make("tr");
    r.forEach(cell => tr.appendChild(make("td", null, cell)));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  body.appendChild(tbl);

  const ul = make("ul", "clues");
  ch.clues.forEach(cl => ul.appendChild(make("li", null, cl)));
  body.appendChild(ul);
  body.appendChild(make("p", "cap", ch.pzCap));

  const grid = make("div", "name-grid");
  ch.board.rows.forEach((r, i) => {
    const b = make("button", "btn", r[1]);
    b.setAttribute("aria-label", TEXT.a11y.chooseName(r[1]));
    b.addEventListener("click", () => {
      Audio_.click();
      if (i === SOLUTIONS.ch2.rowIndex) solveChapter(); else wrongAnswer();
    });
    grid.appendChild(b);
  });
  body.appendChild(grid);
  return null;
}

/* ---------------- פרק 3: אותיות לפי חותמות הזמן ---------------- */
function buildCh3(body, actions, ch) {
  const ul = make("ul", "chapters");
  ul.id = "chapter-list";
  ch.chapters.forEach(cp => {
    const li = make("li");
    li.appendChild(make("span", "ts", cp.ts));
    li.appendChild(make("span", null, cp.name));
    ul.appendChild(li);
  });
  body.appendChild(ul);
  body.appendChild(make("p", "cap", ch.pzCap));

  const inp = make("input");
  inp.type = "text";
  inp.placeholder = ch.pzPlaceholder;
  inp.setAttribute("aria-label", ch.pzAsk);
  const row = make("div", "row");
  row.appendChild(inp);
  body.appendChild(row);

  const ok = make("button", "btn", TEXT.ui.submit);
  ok.addEventListener("click", () => check());
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); check(); } });
  actions.appendChild(ok);

  function check() {
    Audio_.click();
    if (matches(inp.value, SOLUTIONS.ch3.accept)) solveChapter(); else wrongAnswer();
  }
  return check;
}

/* ---------------- פרק 4: ההקלטה ההפוכה + מפת 4x4 ---------------- */
function buildCh4(body, actions, ch) {
  let flipped = false;

  body.appendChild(make("p", "cap", TEXT.a11y.subtitle));
  const sub = make("p", null, [...ch.phrase].reverse().join(""));
  sub.id = "sub-line";
  body.appendChild(sub);

  const row = make("div", "row");
  const play = make("button", "btn", ch.playLabel);
  play.addEventListener("click", () => { Audio_.click(); Audio_.playPhrase(flipped); });
  const flip = make("button", "btn", ch.flipLabel);
  flip.setAttribute("aria-pressed", "false");
  flip.addEventListener("click", () => {
    Audio_.click();
    flipped = !flipped;
    flip.setAttribute("aria-pressed", String(flipped));
    sub.textContent = flipped ? ch.phrase : [...ch.phrase].reverse().join("");
    Audio_.playPhrase(flipped);
  });
  row.appendChild(play); row.appendChild(flip);
  body.appendChild(row);
  body.appendChild(make("p", "cap", ch.pzCap));

  // מפת המסדרון — תמיד משמאל לימין כדי שלא יהיה ספק מה זה "ימינה"
  const wrap = make("div", "mapwrap");
  wrap.appendChild(make("p", "cap", ch.mapForward));
  const grid = make("div", "mapgrid");
  grid.setAttribute("role", "group");
  grid.setAttribute("aria-label", TEXT.a11y.map);
  for (let r = 1; r <= 4; r++) {
    for (let cN = 1; cN <= 4; cN++) {
      const isStart = (r === SOLUTIONS.ch4.start.r && cN === SOLUTIONS.ch4.start.c);
      const b = make("button", "cell" + (isStart ? " start" : ""), isStart ? ch.mapHere : "");
      b.setAttribute("aria-label", TEXT.a11y.cell(r, cN, isStart));
      b.addEventListener("click", () => {
        Audio_.click();
        if (r === SOLUTIONS.ch4.target.r && cN === SOLUTIONS.ch4.target.c) solveChapter();
        else wrongAnswer();
      });
      grid.appendChild(b);
    }
  }
  wrap.appendChild(grid);
  wrap.appendChild(make("p", "cap", ch.mapEntrance));
  body.appendChild(wrap);
  return null;
}

/* ---------------- פרק 5: השאלה שלא נשאלה ---------------- */
function buildCh5(body, actions, ch) {
  const inp = make("input");
  inp.type = "text";
  inp.placeholder = ch.pzPlaceholder;
  inp.setAttribute("aria-label", ch.pzAsk);
  const row = make("div", "row");
  row.appendChild(inp);
  body.appendChild(row);
  body.appendChild(make("p", "cap", ch.pzCap));

  const ok = make("button", "btn", TEXT.ui.submit);
  ok.addEventListener("click", () => check());
  const arch = make("button", "btn btn-ghost", TEXT.ui.archive);
  arch.addEventListener("click", openArchive);
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); check(); } });
  actions.appendChild(ok);
  actions.appendChild(arch);

  function check() {
    Audio_.click();
    if (matches(inp.value, SOLUTIONS.ch5.accept)) { solveChapter(); return; }
    const inArchive = gameState.archive.some(q => normalize(q) === normalize(inp.value));
    wrongAnswer(inArchive ? ch.wrongInArchive : null);
  }
  return check;
}

/* ================================================================
   9. Boot — זרימת הפרקים, הטיימר, הסיום והאירועים
   ================================================================ */

/* ---- כניסה לפרק ---- */
let secretTimer = 0;
function enterChapter(i) {
  gameState.chapter = i;
  gameState.monsterStep = 0;
  gameState.secretShown = false;
  const ch = TEXT.chapters[i];
  addQuestion(ch.question);
  el("chapline").textContent = TEXT.ui.chapLabel(i + 1, ch.name);

  // בפרק הראשון, מההרצה השנייה ואילך, שורה אחת משתנה
  const intro = ch.intro.slice();
  if (i === 0 && gameState.runs > 1 && ch.introAlt) {
    intro[0] = ch.introAlt.replace("{n}", String(gameState.nightNumber));
  }
  say(intro);

  renderHotspots();
  buildPuzzle();
  renderInventory();
  updateRoomDesc();
  FX.applyDark();
  Room.resize();
  // פוקוס לכותרת הפרק, כדי שמשתמשי מקלדת לא יתחילו כל פרק מתחילת המסמך
  const h = el("game-h1");
  h.textContent = TEXT.ui.chapLabel(i + 1, ch.name);
  setTimeout(() => h.focus(), 0);

  // ההסתרה העדינה: פעם אחת בכל פרק, בלי הודעה
  clearTimeout(secretTimer);
  secretTimer = setTimeout(applySecret, 8000 + Math.random() * 12000);
}

/* שינוי קטן ברקע, בלי להסב אליו תשומת לב */
function applySecret() {
  if (gameState.screen !== "game") return;
  gameState.secretShown = true;
  // בחדר העריכה נוסף צ'פטר שישי לרשימה
  const ch = chapterData();
  if (ch.secretChapter) {
    const ul = el("chapter-list");
    if (ul && !ul.dataset.secret) {
      ul.dataset.secret = "1";
      const li = make("li");
      li.appendChild(make("span", "ts", ch.secretChapter.ts));
      li.appendChild(make("span", null, ch.secretChapter.name));
      ul.appendChild(li);
    }
  }
  Room.paint(Room.last / 1000);
}

/* ---- הטיימר: יורד, מתאפס, ולא נגמר לעולם ---- */
let tickRaf = 0;
function startTick() {
  cancelAnimationFrame(tickRaf);
  gameState.lastTick = 0;
  tickRaf = requestAnimationFrame(tickTimer);
}
function tickTimer(now) {
  if (!gameState.running) { tickRaf = 0; return; }
  if (!gameState.lastTick) gameState.lastTick = now;
  const dt = (now - gameState.lastTick) / 1000;
  if (dt >= 1) {
    const whole = Math.floor(dt);
    gameState.lastTick += whole * 1000;
    gameState.timeLeft -= whole;
    // לא נגמר. מתאפס, והחדר מחשיך עוד דרגה. גם אם הלשונית הייתה ברקע שעה.
    let reset = false;
    while (gameState.timeLeft <= 0) {
      gameState.timeLeft += 45 * 60;
      gameState.loops++;
      gameState.loopDark = Math.min(4, gameState.loopDark + 1);
      reset = true;
    }
    if (reset) {
      FX.applyDark();
      Audio_.beat(6);
      FX.flicker(el("timer"));
    }
    paintTimer();
  }
  tickRaf = requestAnimationFrame(tickTimer);
}
function paintTimer() {
  const m = Math.floor(gameState.timeLeft / 60), s = gameState.timeLeft % 60;
  el("timer").textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

/* ---- התחלה ---- */
function startGame() {
  Audio_.init();
  Audio_.resume();
  showScreen("game");
  gameState.running = true;
  gameState.lastTick = 0;
  paintTimer();
  Room.init();
  enterChapter(0);
  startTick();
  window.setTimeout(() => Room.resize(), 60);
}

/* ---- סיום: הטוויסט, ואז מסך שחור ---- */
let endTimers = [];
function clearEndTimers() { endTimers.forEach(clearTimeout); endTimers = []; }

function endGame() {
  gameState.running = false;
  cancelAnimationFrame(tickRaf); tickRaf = 0;
  clearTimeout(secretTimer);
  clearEndTimers();
  showScreen("end");
  const wrap = el("end-reveal");
  clear(wrap);
  el("end-black").hidden = true;
  el("end-last").textContent = TEXT.ending.last;
  el("btn-again").textContent = TEXT.ending.again;
  el("end-h1").focus();

  const lines = TEXT.ending.reveal;
  const toBlack = () => {
    clear(wrap);
    el("end-black").hidden = false;
    el("btn-again").focus();
  };

  if (gameState.reduceMotion) {
    // בלי אנימציה: שלוש השורות מוצגות מיד ונשארות עד שהשחקן ממשיך
    lines.forEach(line => wrap.appendChild(make("p", null, line)));
    const go = make("button", "btn btn-main", TEXT.ui.endContinue);
    go.addEventListener("click", () => { Audio_.click(); toBlack(); });
    wrap.appendChild(go);
    setTimeout(() => go.focus(), 0);
    return;
  }
  lines.forEach((line, i) => {
    endTimers.push(setTimeout(() => {
      wrap.appendChild(make("p", "fadein", line));
      if (i === lines.length - 1) endTimers.push(setTimeout(toBlack, 2600));
    }, i * 1900));
  });
}

/* ---- שוב: אותו לילה, מספר אחר ---- */
function restart() {
  Audio_.click();
  Audio_.resume();
  clearEndTimers();
  clearTimeout(secretTimer);
  gameState.runs++;
  gameState.nightNumber = 45 + gameState.runs;
  gameState.chapter = 0;
  gameState.solved = [false, false, false, false, false];
  gameState.inventory = [];
  gameState.archive = [];
  gameState.seenHotspots = {};
  gameState.wrongCount = [0, 0, 0, 0, 0];
  gameState.hintLevel = [0, 0, 0, 0, 0];
  gameState.timeLeft = 45 * 60;
  gameState.monsterStep = 0;
  gameState.secretShown = false;
  gameState.lastTick = 0;
  gameState.dark = 0;
  gameState.loopDark = Math.min(4, gameState.loopDark + 1);   // החושך לא מתאפס
  gameState.running = true;
  showScreen("game");
  paintTimer();
  FX.applyDark();
  enterChapter(0);
  startTick();
}

/* ---- אירועים ואתחול ---- */
function boot() {
  const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
  gameState.reduceMotion = mq.matches;
  if (mq.addEventListener) mq.addEventListener("change", e => {
    gameState.reduceMotion = e.matches;
    if (e.matches) FX.stopMotion();
    else { FX.initGrain(); FX.startRandomFlicker(); Room.init(); }
  });

  // מסך פתיחה
  el("ttl-main").textContent = TEXT.title.main;
  el("ttl-sub").textContent = TEXT.title.sub;
  el("ttl-line").textContent = TEXT.title.line;
  el("ttl-foot").textContent = TEXT.title.foot;
  el("btn-start").textContent = TEXT.title.start;
  el("btn-cw").textContent = TEXT.title.cw;
  el("btn-archive").textContent = TEXT.ui.archive;
  el("btn-mute").textContent = TEXT.ui.mute;
  el("sheet-close").textContent = TEXT.ui.close;
  el("bag-label").textContent = TEXT.ui.bag;

  FX.initGrain();
  FX.applyDark();
  FX.startRandomFlicker();

  el("btn-start").addEventListener("click", () => { Audio_.init(); Audio_.click(); startGame(); });
  el("btn-cw").addEventListener("click", () => {
    Audio_.click();
    openSheet(TEXT.contentWarning.title, TEXT.contentWarning.body.map(l => make("p", null, l)));
  });
  el("btn-archive").addEventListener("click", openArchive);
  el("btn-again").addEventListener("click", restart);
  el("sheet-close").addEventListener("click", () => { Audio_.click(); closeSheet(); });
  el("veil").addEventListener("click", (e) => { if (e.target === el("veil")) closeSheet(); });
  document.addEventListener("keydown", trapFocus);

  const mute = el("btn-mute");
  mute.addEventListener("click", () => {
    const next = !gameState.muted;
    Audio_.init();
    Audio_.setMuted(next);
    mute.setAttribute("aria-pressed", String(next));
    mute.textContent = next ? TEXT.ui.unmute : TEXT.ui.mute;
    if (!next) Audio_.click();
  });

  // כל מחווה של המשתמש מחזירה את האודיו אם הדפדפן השהה אותו
  ["pointerdown", "keydown"].forEach(ev =>
    document.addEventListener(ev, () => Audio_.resume(), { passive: true }));

  /* ---- תנועה בחדר: גרירה מסובבת את המבט, מקשים מהלכים ---- */
  const roomEl = el("room");
  roomEl.addEventListener("pointerdown", (e) => {
    if (Room.mode !== "3d") return;
    if (e.target.closest("button")) return;      // לחיצה על אזור חיפוש או על כפתור הליכה
    Scene3D.drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
  });
  roomEl.addEventListener("pointermove", (e) => {
    const d = Scene3D.drag;
    if (!d || d.id !== e.pointerId) return;
    Scene3D.lookBy(e.clientX - d.x, e.clientY - d.y);
    d.x = e.clientX; d.y = e.clientY;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
    roomEl.addEventListener(ev, (e) => { if (Scene3D.drag && Scene3D.drag.id === e.pointerId) Scene3D.drag = null; }));

  const KEYMAP = { KeyW: "w", ArrowUp: "w", KeyS: "s", ArrowDown: "s",
                   KeyA: "a", KeyD: "d", ArrowLeft: "left", ArrowRight: "right" };
  const typing = () => {
    const a = document.activeElement;
    return !el("veil").hidden || (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"));
  };
  document.addEventListener("keydown", (e) => {
    if (Room.mode !== "3d" || gameState.screen !== "game" || typing()) return;
    const k = KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    Scene3D.keys[k] = true;
  });
  document.addEventListener("keyup", (e) => {
    const k = KEYMAP[e.code];
    if (k) Scene3D.keys[k] = false;
  });
  window.addEventListener("blur", () => { Scene3D.keys = {}; Scene3D.drag = null; });

  // כפתורי הליכה למסכי מגע
  const hold = (id, key) => {
    const b = el(id);
    const on = (e) => { e.preventDefault(); Scene3D.keys[key] = true; };
    const off = () => { Scene3D.keys[key] = false; };
    b.addEventListener("pointerdown", on);
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, off));
    b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") on(e); });
    b.addEventListener("keyup", off);
  };
  hold("walk-fwd", "w");
  hold("walk-back", "s");
  el("walk-reset").addEventListener("click", () => { Audio_.click(); Scene3D.resetView(); });

  window.addEventListener("resize", () => {
    FX.resize(); Room.resize();
    if (waveCanvas && waveCanvas.isConnected) sizeWave(waveCanvas);
  });
  window.addEventListener("orientationchange", () => setTimeout(() => {
    FX.resize(); Room.resize();
    if (waveCanvas && waveCanvas.isConnected) sizeWave(waveCanvas);
  }, 200));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) Audio_.resume(); });

  renderInventory();
  paintTimer();
}

document.addEventListener("DOMContentLoaded", boot);
</script>
