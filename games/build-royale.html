<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Build Royale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,600;0,800;1,900&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD pinned to the four corners; menus float as one skewed card over the live island. Single dark look by choice. */
:root {
  --night: #0b1636;
  --panel: rgba(9, 18, 46, 0.74);
  --panel-solid: #101f4a;
  --ink: #f4f7ff;
  --muted: #a9b6d9;
  --volt: #ffd23f;
  --volt-deep: #b3790a;
  --storm: #9b4dff;
  --hp: #57e06a;
  --shield: #3bb8ff;
  --danger: #ff4d5e;
  --font: 'Rubik', 'Segoe UI', system-ui, -apple-system, 'Arial Hebrew', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--font); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
body.playing #game { cursor: none; }
button { font-family: var(--font); }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; font-variant-numeric: tabular-nums; }
#topright { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; width: 180px; display: grid; gap: 6px; }
#minimap { width: 180px; height: 180px; border-radius: 14px; border: 2px solid rgba(255,255,255,.35); display: block; background: #1d5f92; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
#stats { display: flex; gap: 6px; justify-content: flex-end; direction: ltr; }
.stat { display: flex; align-items: center; gap: 5px; background: var(--panel); padding: 4px 9px; border-radius: 8px; font-weight: 800; font-size: 15px; }
.stat svg { width: 15px; height: 15px; fill: var(--ink); stroke: var(--ink); }
#storminfo { background: var(--panel); border-radius: 8px; padding: 5px 9px; font-size: 13px; font-weight: 600; text-align: center; }
#storminfo.hot { background: rgba(110, 40, 200, .8); }
#killfeed { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; display: flex; flex-direction: column; gap: 4px; max-width: min(46vw, 420px); }
.kf { display: flex; align-items: center; gap: 7px; background: rgba(0,0,0,.5); padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; animation: kfin .25s ease-out; transition: opacity .6s; }
.kf b { font-weight: 800; }
.kf .me { color: var(--volt); }
.kf svg { width: 30px; height: 15px; fill: #fff; flex: none; }
.kf.fade { opacity: 0; }
@keyframes kfin { from { transform: translateY(-6px); opacity: 0; } }

#crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#crosshair i { position: absolute; background: #fff; box-shadow: 0 0 2px rgba(0,0,0,.9); }
#crosshair i:nth-child(1), #crosshair i:nth-child(2) { width: 2px; height: 8px; left: -1px; }
#crosshair i:nth-child(3), #crosshair i:nth-child(4) { height: 2px; width: 8px; top: -1px; }
#crosshair b { position: absolute; width: 3px; height: 3px; left: -1.5px; top: -1.5px; background: #fff; border-radius: 50%; box-shadow: 0 0 2px #000; }
#crosshair.build i { background: var(--shield); }
#hitmark { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
#hitmark::before, #hitmark::after { content: ''; position: absolute; left: 12px; top: -2px; width: 2px; height: 30px; background: linear-gradient(#fff 0 30%, transparent 30% 70%, #fff 70%); }
#hitmark::before { transform: rotate(45deg); } #hitmark::after { transform: rotate(-45deg); }
#hitmark.on { animation: hm .18s ease-out; }
#hitmark.head::before, #hitmark.head::after { background: linear-gradient(var(--volt) 0 30%, transparent 30% 70%, var(--volt) 70%); }
@keyframes hm { 0% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0; transform: scale(1); } }
#dmgdir { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; opacity: 0; transition: opacity .5s; }
#dmgdir::before { content: ''; position: absolute; left: 50%; top: 0; width: 70px; height: 18px; margin-left: -35px; border-radius: 50% 50% 0 0; border-top: 6px solid var(--danger); filter: drop-shadow(0 0 4px var(--danger)); }
#dmgdir.on { opacity: .95; transition: none; }
#centermsg { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); text-align: center; font-weight: 900; font-style: italic; font-size: clamp(20px, 3.4vw, 34px); text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 18px rgba(0,0,0,.4); opacity: 0; white-space: nowrap; }
#centermsg.on { animation: cm 2.6s ease-out forwards; }
#centermsg.elim { color: var(--volt); }
#centermsg.storm { color: #d9b8ff; }
#centermsg.win { color: var(--volt); font-size: clamp(36px, 7vw, 72px); }
@keyframes cm { 0% { opacity: 0; transform: translateX(-50%) scale(1.25); } 10% { opacity: 1; transform: translateX(-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
#prompt { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); background: var(--panel); padding: 7px 14px; border-radius: 10px; font-weight: 700; font-size: 15px; display: none; white-space: nowrap; }
#prompt kbd { display: inline-block; background: var(--volt); color: #1a1300; border-radius: 5px; padding: 0 7px; font: 800 13px var(--font); margin-inline-end: 6px; }
#prompt.on { display: block; }
#progress { position: absolute; left: 50%; top: calc(50% + 46px); width: 170px; margin-left: -85px; height: 12px; background: rgba(0,0,0,.55); border-radius: 6px; overflow: hidden; }
#progfill { height: 100%; width: 0; background: var(--volt); }
#progtext { position: absolute; inset: -20px 0 auto; text-align: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000; }
#harvest { position: absolute; left: calc(50% + 24px); top: calc(50% - 30px); font-weight: 800; font-size: 15px; color: #fff; text-shadow: 0 2px 2px rgba(0,0,0,.7); opacity: 0; direction: ltr; }
#harvest.on { animation: hv .7s ease-out; }
@keyframes hv { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-22px); } }

#vitals { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(300px, 38vw); display: grid; gap: 5px; direction: ltr; }
.bar { position: relative; height: 20px; background: rgba(0,0,0,.55); border-radius: 4px; overflow: hidden; transform: skewX(-14deg); }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 100%; transition: width .18s; }
.bar.hp > i { background: linear-gradient(90deg, #2fb34a, var(--hp)); }
.bar.sh > i { background: linear-gradient(90deg, #1b84d6, var(--shield)); }
.bar > span { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 10px; font-weight: 800; font-size: 14px; transform: skewX(14deg); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.bar.sh { height: 14px; } .bar.sh > span { font-size: 11px; }

#loadout { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: end; direction: ltr; }
#hotbar { display: flex; gap: 6px; }
.slot { width: 62px; height: 62px; border-radius: 9px; background: rgba(10,16,40,.62); border: 2px solid rgba(255,255,255,.16); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .12s; pointer-events: auto; }
.slot.sel { transform: translateY(-8px); border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
.slot .k { position: absolute; top: 2px; left: 5px; font-size: 10px; font-weight: 800; opacity: .75; }
.slot .n { position: absolute; bottom: 2px; right: 5px; font-size: 11px; font-weight: 800; }
.slot svg { width: 44px; height: 22px; fill: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
#ammo { font-weight: 900; font-size: 26px; font-style: italic; text-shadow: 0 2px 3px rgba(0,0,0,.6); min-height: 30px; }
#ammo small { font-size: 15px; opacity: .75; font-style: normal; }
#mats { display: flex; gap: 5px; }
.mat { display: flex; align-items: center; gap: 5px; background: var(--panel); border-radius: 7px; padding: 4px 8px; font-weight: 800; font-size: 13px; border: 2px solid transparent; }
.mat i { width: 13px; height: 13px; border-radius: 3px; display: inline-block; }
.mat.sel { border-color: var(--volt); }
.mat.bump { animation: bump .3s; }
@keyframes bump { 50% { transform: scale(1.15); } }
#buildbar { display: flex; gap: 5px; }
.bp { background: var(--panel); border-radius: 7px; padding: 4px 9px; font-size: 12px; font-weight: 700; border: 2px solid transparent; }
.bp kbd { font: 800 11px var(--font); color: var(--volt); margin-inline-end: 4px; }
.bp.sel { border-color: var(--shield); background: rgba(30, 110, 200, .7); }
#dmgnums { position: absolute; inset: 0; overflow: hidden; }
.dn { position: absolute; left: 0; top: 0; font-weight: 900; font-size: 20px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.55); will-change: transform, opacity; display: none; direction: ltr; }
.dn.head { color: var(--volt); font-size: 24px; }
.dn.shield { color: #8fd8ff; }
#stormfx { position: fixed; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(ellipse at center, rgba(130,50,255,.12) 30%, rgba(110,30,220,.55) 100%); opacity: 0; transition: opacity .5s; }
#stormfx.on { opacity: 1; }
#hurtfx { position: fixed; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(ellipse at center, transparent 55%, rgba(255,40,60,.5) 100%); opacity: 0; transition: opacity .35s; }
#hurtfx.on { opacity: 1; transition: none; }
#scope { position: fixed; inset: 0; pointer-events: none; z-index: 4; display: none; background: radial-gradient(circle at center, transparent 0 min(34vh, 34vw), rgba(0,0,0,.92) calc(min(34vh, 34vw) + 2px)); }
#scope::before, #scope::after { content: ''; position: absolute; background: rgba(0,0,0,.85); }
#scope::before { left: 0; right: 0; top: 50%; height: 1px; }
#scope::after { top: 0; bottom: 0; left: 50%; width: 1px; }
#scope.on { display: block; }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; background: radial-gradient(ellipse at 50% 40%, rgba(11,22,54,.15), rgba(4,8,24,.72)); }
.card { width: min(440px, 100%); max-height: 100%; overflow: auto; background: rgba(12, 24, 60, .86); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 22px; box-shadow: 0 24px 70px rgba(0,0,0,.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: grid; gap: 14px; touch-action: pan-y; }
.logo { margin: 0; font-weight: 900; font-style: italic; font-size: clamp(42px, 10vw, 66px); line-height: .88; letter-spacing: -0.02em; text-transform: uppercase; transform: skewX(-8deg); direction: ltr; text-align: center; }
.logo span { display: block; }
.logo .a { color: #fff; text-shadow: 0 5px 0 #2a3f8f, 0 0 34px rgba(155,77,255,.7); }
.logo .b { color: var(--volt); text-shadow: 0 5px 0 var(--volt-deep), 0 0 30px rgba(255,210,63,.35); }
.tag { margin: 0; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.45; text-wrap: balance; }
.btn { font: 800 19px var(--font); padding: 14px 18px; border-radius: 12px; border: 0; cursor: pointer; background: var(--volt); color: #1a1300; transform: skewX(-6deg); box-shadow: 0 5px 0 var(--volt-deep); text-transform: uppercase; letter-spacing: .02em; }
.btn:active { transform: skewX(-6deg) translateY(3px); box-shadow: 0 2px 0 var(--volt-deep); }
.btn.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,.35); font-size: 16px; }
.row { display: grid; gap: 7px; }
.row > label, .row > .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 9px 6px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer; }
.seg button.on { background: var(--volt); color: #1a1300; border-color: var(--volt); }
input[type=range] { width: 100%; accent-color: var(--volt); }
details { background: rgba(255,255,255,.05); border-radius: 10px; padding: 8px 12px; }
summary { cursor: pointer; font-weight: 700; font-size: 14px; }
.keys { list-style: none; margin: 10px 0 2px; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.keys li { display: flex; justify-content: space-between; gap: 10px; }
.keys kbd { font: 800 12px var(--font); background: rgba(255,255,255,.12); border-radius: 5px; padding: 1px 7px; direction: ltr; white-space: nowrap; }
.place { font-weight: 900; font-style: italic; font-size: 76px; line-height: 1; text-align: center; color: var(--volt); text-shadow: 0 5px 0 var(--volt-deep); direction: ltr; }
.endtitle { margin: 0; text-align: center; font-weight: 900; font-style: italic; font-size: 32px; text-transform: uppercase; }
.endsub { margin: 0; text-align: center; color: var(--muted); }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip { background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; }
.btnrow { display: grid; gap: 10px; }
#toast { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); background: var(--panel); padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; z-index: 30; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; }
#err { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 18px; z-index: 50; background: var(--night); }

/* ---------- Touch ---------- */
#touchLayer { position: fixed; inset: 0; z-index: 4; }
#touchui { position: fixed; inset: 0; z-index: 6; pointer-events: none; direction: ltr; }
#joy { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); display: none; }
#joy.on { display: block; }
#joyknob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.55); }
.tb { position: absolute; pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(10,20,50,.55); color: #fff; font-weight: 800; font-size: 12px; touch-action: none; }
.tb.on { background: var(--shield); border-color: #fff; }
.tb.big { width: 92px; height: 92px; font-size: 16px; background: rgba(255,77,94,.55); }
.tb.big.place { background: rgba(59,184,255,.6); }
#tFire { right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); }
#tJump { right: calc(126px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#tReload { right: calc(126px + env(safe-area-inset-right, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
#tAim { right: calc(198px + env(safe-area-inset-right, 0px)); bottom: calc(54px + env(safe-area-inset-bottom, 0px)); }
#tBuild { right: calc(270px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#tUse { right: calc(270px + env(safe-area-inset-right, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: rgba(255,210,63,.6); color: #1a1300; }
#tPieces { position: absolute; right: calc(160px + env(safe-area-inset-right, 0px)); bottom: calc(164px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; pointer-events: none; }
#tPieces .tb { position: static; width: 54px; height: 54px; font-size: 11px; }
#tPause { left: 50%; margin-left: -22px; top: calc(8px + env(safe-area-inset-top, 0px)); width: 44px; height: 44px; font-size: 14px; }
body.touch #topright { width: 128px; }
body.touch #minimap { width: 128px; height: 128px; }
body.touch #vitals { left: calc(14px + env(safe-area-inset-left, 0px)); width: min(220px, 28vw); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
body.touch #loadout { right: auto; left: 50%; transform: translateX(-50%); top: calc(58px + env(safe-area-inset-top, 0px)); bottom: auto; justify-items: center; }
body.touch #hotbar { order: -1; }
body.touch .slot { width: 50px; height: 50px; } body.touch .slot svg { width: 36px; }
body.touch #ammo { font-size: 18px; min-height: 0; }
body.touch #buildbar { display: none; }
body.touch #killfeed { max-width: 34vw; } body.touch .kf { font-size: 11px; }
body.touch #prompt { top: 40%; }
body.touch #centermsg { top: 42%; font-size: clamp(16px, 3vw, 24px); }
body.touch #storminfo { font-size: 11px; padding: 3px 6px; }
body.touch .stat { font-size: 13px; padding: 3px 7px; }
#rotate { position: fixed; inset: 0; z-index: 60; background: var(--night); display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 20px; font-weight: 800; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
@media (max-height: 460px) { .card { padding: 14px; gap: 10px; } .logo { font-size: 40px; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Build Royale"></canvas>
<div id="touchLayer" hidden></div>
<div id="stormfx"></div>
<div id="hurtfx"></div>
<div id="scope"></div>
<div id="hud" hidden>
  <div id="killfeed"></div>
  <div id="topright">
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="stats">
      <span class="stat"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4.5"/><path d="M3.5 22c0-5 3.8-8.5 8.5-8.5s8.5 3.5 8.5 8.5z"/></svg><b id="alive">20</b></span>
      <span class="stat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke-width="2.5"/><path d="M11 1h2v6h-2zM11 17h2v6h-2zM1 11h6v2H1zM17 11h6v2h-6z" stroke="none"/></svg><b id="kills">0</b></span>
    </div>
    <div id="storminfo"></div>
  </div>
  <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hitmark"></div>
  <div id="dmgdir"></div>
  <div id="harvest"></div>
  <div id="centermsg"></div>
  <div id="prompt"></div>
  <div id="progress" hidden><div id="progfill"></div><span id="progtext"></span></div>
  <div id="vitals">
    <div class="bar sh"><i id="shfill"></i><span id="shtext">0</span></div>
    <div class="bar hp"><i id="hpfill"></i><span id="hptext">100</span></div>
  </div>
  <div id="loadout">
    <div id="buildbar"></div>
    <div id="mats"></div>
    <div id="ammo"></div>
    <div id="hotbar"></div>
  </div>
  <div id="dmgnums"></div>
</div>
<div id="touchui" hidden>
  <div id="joy"><div id="joyknob"></div></div>
  <button class="tb big" id="tFire" type="button"></button>
  <button class="tb" id="tJump" type="button"></button>
  <button class="tb" id="tAim" type="button"></button>
  <button class="tb" id="tReload" type="button"></button>
  <button class="tb" id="tBuild" type="button"></button>
  <button class="tb" id="tUse" type="button" hidden></button>
  <div id="tPieces" hidden>
    <button class="tb" type="button" data-p="wall"></button>
    <button class="tb" type="button" data-p="floor"></button>
    <button class="tb" type="button" data-p="ramp"></button>
    <button class="tb" type="button" id="tMat"></button>
  </div>
  <button class="tb" id="tPause" type="button" aria-label="Pause">II</button>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1 class="logo"><span class="a">Build</span><span class="b">Royale</span></h1>
    <p class="tag" data-i18n="tagline"></p>
    <button class="btn" id="playBtn" type="button" data-i18n="play"></button>
    <div class="row">
      <span class="lbl" data-i18n="difficulty"></span>
      <div class="seg" id="diffSeg">
        <button type="button" data-v="easy"></button>
        <button type="button" data-v="normal"></button>
        <button type="button" data-v="hard"></button>
      </div>
    </div>
    <div class="row">
      <label for="sens" data-i18n="sensitivity"></label>
      <input type="range" id="sens" min="0.3" max="3" step="0.1" value="1">
    </div>
    <div class="row">
      <span class="lbl" data-i18n="language"></span>
      <div class="seg" id="langSeg">
        <button type="button" data-v="he">עברית</button>
        <button type="button" data-v="en">English</button>
      </div>
    </div>
    <details id="ctlBox"><summary data-i18n="controls"></summary><ul class="keys" id="keysList"></ul></details>
  </div>
</div>

<div id="pause" class="overlay" hidden>
  <div class="card">
    <h2 class="endtitle" data-i18n="paused"></h2>
    <div class="row">
      <label for="sens2" data-i18n="sensitivity"></label>
      <input type="range" id="sens2" min="0.3" max="3" step="0.1" value="1">

$('hotbar').addEventListener('touchstart', (e) => { const s = e.target.closest('.slot'); if (s && game.state === 'playing' && player.inv[+s.dataset.i]) { e.preventDefault(); selectSlot(player, +s.dataset.i); } }, { passive: false });

/* ---------- menus ---------- */
function applyLang() {
  const t = T();
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'he' ? 'rtl' : 'ltr';
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t[el.dataset.i18n];
  for (const b of $('diffSeg').children) { b.textContent = t.diff[b.dataset.v]; b.classList.toggle('on', b.dataset.v === settings.diff); b.setAttribute('aria-pressed', b.dataset.v === settings.diff); }
  for (const b of $('langSeg').children) { b.classList.toggle('on', b.dataset.v === LANG); b.setAttribute('aria-pressed', b.dataset.v === LANG); }
  const list = touchMode ? t.keysTouch : t.keysDesk;
  $('keysList').innerHTML = ''; for (const [k, v] of list) { const li = document.createElement('li'); const kb = document.createElement('kbd'); kb.textContent = k; const sp = document.createElement('span'); sp.textContent = v; li.append(sp, kb); $('keysList').appendChild(li); }
  $('rotate').textContent = t.rotate;
  if (player) player.name = t.me;
  mmStaticDirty = true;
  if (game.state !== 'menu') buildHudStatic();
}
$('playBtn').addEventListener('click', () => startGame());
$('againBtn').addEventListener('click', () => { $('end').hidden = true; startGame(); });
$('endMenuBtn').addEventListener('click', () => toMenu());
$('resumeBtn').addEventListener('click', () => resumeGame());
$('quitBtn').addEventListener('click', () => toMenu());
$('pause').addEventListener('click', (e) => { if (e.target === $('pause')) resumeGame(); });
$('diffSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; settings.diff = b.dataset.v; store.set('diff', settings.diff); applyLang(); });
$('langSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; LANG = b.dataset.v; settings.lang = LANG; store.set('lang', LANG); applyLang(); });
for (const id of ['sens', 'sens2']) $(id).addEventListener('input', (e) => { settings.sens = +e.target.value; store.set('sens', settings.sens); $('sens').value = $('sens2').value = settings.sens; });
$('sens').value = settings.sens;

/* =========================================================
   MAIN LOOP
   ========================================================= */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (game.state === 'playing') update(dt);
  else if (game.state === 'over') { update(dt); }
  else if (game.state === 'paused') { updateCamera(0); }
  else { updateCamera(dt); updateLoot(dt); updateFx(dt); }
  renderer.render(scene, camera);
}
window.addEventListener('resize', resize);
newWorld(); freshWorld = true;
applyLang(); resize();
requestAnimationFrame(frame);

window.__BR = { game, get player() { return player; }, get chars() { return chars; }, get storm() { return storm; }, get pieces() { return pieces; }, get loot() { return loot; }, get chests() { return chests; }, startGame, tryBuild, buildSpec, canPlace, update, ray: raycastWorld, renderStats() { renderer.render(scene, camera); return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; }, jumpFromBus, setBuild, selectSlot, fireWeapon, addItem, applyDamage, toMenu, bus };
})();
