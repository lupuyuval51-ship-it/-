# Version of the LUPU-FIT Android app (device mode). This file is the only place it is set.
# Raise versionCode by at least 1 for every upload to Google Play (Play rejects a versionCode it has
# already seen). versionCode 1 was the Trusted Web Activity build with the same package id
# (android-twa/), so this app starts at 2.
# build-release.sh can override both for one build: --version-code N --version-name X.Y.Z
versionCode=2
versionName=1.0.0
