# LUPU-FIT Android (Trusted Web Activity) settings.
# The app opens https://<host><startPath> full screen. The site must serve
# https://<host>/.well-known/assetlinks.json listing this package and the signing
# certificate fingerprint(s) (the server does this from ANDROID_APP_PACKAGE and
# ANDROID_CERT_SHA256), otherwise Chrome shows an address bar.
#
# Override any value on the command line: ./build-aab.sh --host app.your-domain.com
host=lupu-fit.example
startPath=/
packageId=com.lupufit.app
appName=LUPU-FIT
launcherName=LUPU-FIT
versionCode=1
versionName=1.0.0
