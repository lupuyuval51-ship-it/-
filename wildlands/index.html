<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ארץ פרא</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: the live world fills the screen; a single dusk-lit panel floats over it. */
:root{
  color-scheme:dark;
  --night:#0b1512;      /* deep forest shadow, page ground */
  --panel:rgba(12,22,19,.78);
  --moss:#8fbf6a;       /* accent: sunlit moss */
  --moss-ink:#10200d;
  --bone:#eef2e6;       /* text */
  --mist:#a9b8ac;       /* secondary text */
  --line:rgba(238,242,230,.16);
  --display:"Suez One","Frank Ruhl Libre","David",Georgia,serif;
  --body:"Heebo","Assistant","Segoe UI",Arial,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#water-tint{position:absolute;inset:0;background:rgba(10,70,95,.35);pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;pointer-events:none;opacity:.85}
#cross::before,#cross::after{content:"";position:absolute;background:var(--bone);mix-blend-mode:difference}
#cross::before{left:8px;top:2px;width:2px;height:14px}
#cross::after{left:2px;top:8px;width:14px;height:2px}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));font-size:12px;color:var(--bone);text-shadow:0 1px 3px #000;direction:ltr;font-variant-numeric:tabular-nums;pointer-events:none;opacity:.85}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;direction:ltr;padding:5px;background:rgba(8,14,12,.55);border:1px solid var(--line);border-radius:6px;max-width:calc(100% - 24px)}
.slot{width:46px;height:46px;flex:0 1 46px;min-width:0;padding:0;border:2px solid transparent;border-radius:4px;background:none;cursor:pointer;position:relative}
.slot canvas{width:100%;height:100%;display:block;border-radius:2px}
.slot.on{border-color:var(--moss);box-shadow:0 0 0 1px var(--moss-ink) inset}
.slot:focus-visible{outline:2px solid var(--bone);outline-offset:1px}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:14px;padding:4px 12px;border-radius:4px;background:rgba(8,14,12,.6);pointer-events:none;transition:opacity .4s;opacity:0;white-space:nowrap}
/* touch controls */
.tbtn{position:absolute;width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:rgba(8,14,12,.45);color:var(--bone);font:500 13px var(--body);padding:0}
.tbtn:active,.tbtn.on{background:rgba(143,191,106,.45)}
#t-jump{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#t-place{right:calc(92px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#t-fly{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(158px + env(safe-area-inset-bottom,0px));width:50px;height:50px;font-size:12px}
#t-menu{right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:44px;height:44px;font-size:16px}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(8,14,12,.3);pointer-events:none}
#stick i{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(238,242,230,.45)}
/* menu */
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(6,12,10,.25),rgba(6,12,10,.7));padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;touch-action:pan-y}
#panel{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 26px 20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:16px;margin:auto}
#panel h1{font:400 clamp(40px,11vw,60px)/1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
#panel h1 span{color:var(--moss)}
#tag{margin:0;color:var(--mist);font-size:15px;line-height:1.5}
#play{font:700 19px var(--body);padding:14px;border:0;border-radius:6px;background:var(--moss);color:var(--moss-ink);cursor:pointer}
#play:hover{filter:brightness(1.08)}
#play:disabled{opacity:.6;cursor:progress}
button:focus-visible,input:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--moss)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--moss)}
.row output{min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
#keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;color:var(--mist);margin:0;border-top:1px solid var(--line);padding-top:14px}
#keys dt{color:var(--bone);font-weight:500;direction:ltr;text-align:start;unicode-bidi:plaintext}
#keys dd{margin:0}
.ghost{font:500 13px var(--body);background:none;color:var(--mist);border:1px solid var(--line);border-radius:5px;padding:7px 10px;cursor:pointer}
.ghost:hover{color:var(--bone);border-color:var(--mist)}
.ghost.warn{color:#f0b29a;border-color:#f0b29a}
#foot{display:flex;gap:8px;flex-wrap:wrap}
#err{color:#f0b29a;font-size:14px;margin:0}
</style>
</head>
<body>
<div id="app" dir="rtl">
  <canvas id="gl"></canvas>
  <div id="water-tint" hidden></div>
  <div id="cross" hidden></div>
  <div id="hud" hidden></div>
  <div id="toast"></div>
  <div id="hotbar" hidden></div>
  <div id="touch" hidden>
    <div id="stick" hidden><i></i></div>
    <button class="tbtn" id="t-jump" data-i18n="tJump"></button>
    <button class="tbtn" id="t-place" data-i18n="tPlace"></button>
    <button class="tbtn" id="t-fly" data-i18n="tFly"></button>
    <button class="tbtn" id="t-menu" aria-label="menu">II</button>
  </div>
  <div id="menu">
    <div id="panel">
      <h1><span data-i18n="title1"></span> <span data-i18n="title2" style="color:inherit"></span></h1>
      <p id="tag" data-i18n="tag"></p>
      <p id="err" hidden></p>
      <button id="play" disabled></button>
      <div class="row"><label for="opt-dist" data-i18n="dist"></label><input id="opt-dist" type="range" min="4" max="12" step="1"><output id="opt-dist-v"></output></div>
      <div class="row"><label for="opt-shadow" data-i18n="shadows"></label><input id="opt-shadow" type="checkbox"></div>
      <dl id="keys"></dl>
      <div id="foot">
        <button class="ghost" id="lang"></button>
        <button class="ghost" id="newworld" data-i18n="newWorld"></button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
// ───────────────────────── i18n ─────────────────────────
const STR={
 he:{title1:'ארץ',title2:'פרא',tag:'עולם פתוח של קוביות עם אור אמיתי: צללים, מים, עננים ומחזור יום ולילה. חופרים, בונים ומטיילים.',
  play:'שחק',resume:'המשך',loading:'בונה עולם…',dist:'מרחק ראייה',shadows:'צללים',newWorld:'עולם חדש',confirmNew:'למחוק את העולם? לחץ שוב',
  lang:'English',tJump:'קפיצה',tPlace:'הנח',tFly:'תעופה',noGL:'הדפדפן הזה לא תומך ב-WebGL2, ולכן המשחק לא יכול לרוץ כאן.',
  flyOn:'תעופה פעילה',flyOff:'תעופה כבויה',lampOn:'פנס דולק',lampOff:'פנס כבוי',
  keys:[['W A S D','תנועה'],['Space','קפיצה / שחייה / עלייה'],['Shift','ריצה'],['קליק שמאלי','שבירת קובייה'],['קליק ימני','הנחת קובייה'],['1–9 / גלגלת','בחירת קובייה'],['F','תעופה'],['L','פנס'],['T','קידום השעה'],['Esc','תפריט']],
  keysTouch:[['צד שמאל','ג׳ויסטיק תנועה'],['גרירה בצד ימין','הסתכלות'],['הקשה','שבירת קובייה'],['הנח','הנחת קובייה']],
  blocks:['אדמה','דשא','אבן','לבני אבן','קרשים','גזע','עלים','חול','שלג']},
 en:{title1:'Wild',title2:'Lands',tag:'An open block world with real light: shadows, water, clouds and a day-night cycle. Dig, build and wander.',
  play:'Play',resume:'Resume',loading:'Building world…',dist:'View distance',shadows:'Shadows',newWorld:'New world',confirmNew:'Delete this world? Click again',
  lang:'עברית',tJump:'Jump',tPlace:'Place',tFly:'Fly',noGL:'This browser does not support WebGL2, so the game cannot run here.',
  flyOn:'Flying on',flyOff:'Flying off',lampOn:'Lantern on',lampOff:'Lantern off',
  keys:[['W A S D','Move'],['Space','Jump / swim / ascend'],['Shift','Sprint'],['Left click','Break block'],['Right click','Place block'],['1–9 / wheel','Pick block'],['F','Fly'],['L','Lantern'],['T','Advance time'],['Esc','Menu']],
  keysTouch:[['Left side','Movement stick'],['Drag right side','Look'],['Tap','Break block'],['Place','Place block']],
  blocks:['Dirt','Grass','Stone','Stone bricks','Planks','Log','Leaves','Sand','Snow']}
};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const $=id=>document.getElementById(id);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const opts=Object.assign({lang:'he',dist:isTouch?5:7,shadows:true},lsGet('wl_opts',{}));
let T=STR[opts.lang]||STR.he;
let ready=false,playing=false;
function applyLang(){
  T=STR[opts.lang]||STR.he;
  $('app').dir=opts.lang==='he'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=T[e.dataset.i18n];});
  $('lang').textContent=T.lang;
  $('play').textContent=!ready?T.loading:(everPlayed?T.resume:T.play);
  const dl=$('keys');dl.textContent='';
  (isTouch?T.keysTouch:T.keys).forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd);});
}
let everPlayed=false;

// ───────────────────────── math ─────────────────────────
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hash2(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function hash3(x,y,z,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,2147483647)+Math.imul(s,1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function noise2(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function noise3(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),fx=x-xi,fy=y-yi,fz=z-zi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),w=fz*fz*(3-2*fz);
  const n=(dz)=>{const a=hash3(xi,yi,zi+dz,s),b=hash3(xi+1,yi,zi+dz,s),c=hash3(xi,yi+1,zi+dz,s),d=hash3(xi+1,yi+1,zi+dz,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};
  const n0=n(0),n1=n(1);return n0+(n1-n0)*w;}
function fbm2(x,y,oct,s){let a=.5,sum=0,n=0;for(let o=0;o<oct;o++){sum+=a*noise2(x,y,s+o*31);n+=a;a*=.5;x*=2.02;y*=2.02;}return sum/n;}
// periodic noise for tileable textures
function pnoise(x,y,px,py,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const x0=((xi%px)+px)%px,x1=(x0+1)%px,y0=((yi%py)+py)%py,y1=(y0+1)%py;
  const a=hash2(x0,y0,s),b=hash2(x1,y0,s),c=hash2(x0,y1,s),d=hash2(x1,y1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function pfbm(u,v,fu,fv,oct,s){let a=.5,sum=0,n=0;for(let o=0;o<oct;o++){sum+=a*pnoise(u*fu,v*fv,fu,fv,s+o*17);n+=a;a*=.5;fu*=2;fv*=2;}return sum/n;}
function mat4mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];}return o;}
function perspective(fovy,asp,n,f){const t=1/Math.tan(fovy/2),o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function ortho(l,r,b,t,n,f){const o=new Float32Array(16);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o;}
function viewFromBasis(r,u,b,e){/* rows r,u,b ; b = backward */const o=new Float32Array(16);
  o[0]=r[0];o[4]=r[1];o[8]=r[2];o[12]=-(r[0]*e[0]+r[1]*e[1]+r[2]*e[2]);
  o[1]=u[0];o[5]=u[1];o[9]=u[2];o[13]=-(u[0]*e[0]+u[1]*e[1]+u[2]*e[2]);
  o[2]=b[0];o[6]=b[1];o[10]=b[2];o[14]=-(b[0]*e[0]+b[1]*e[1]+b[2]*e[2]);o[15]=1;return o;}
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};

// ───────────────────────── blocks ─────────────────────────
const AIR=0,GRASS=1,DIRT=2,STONE=3,SAND=4,WATER=5,LOG=6,LEAVES=7,PLANKS=8,BRICKS=9,SNOW=10,GRAVEL=11,PINE=12,TALLGRASS=13,FLOWER=14;
const L_GRASS=0,L_GSIDE=1,L_DIRT=2,L_STONE=3,L_SAND=4,L_SNOW=5,L_BARK=6,L_LOGTOP=7,L_LEAVES=8,L_PLANKS=9,L_BRICKS=10,L_GRAVEL=11,L_PINE=12,L_TGRASS=13,L_FLOWER=14,NLAYERS=15;
const TEX=[];// [top,side,bottom]
TEX[GRASS]=[L_GRASS,L_GSIDE,L_DIRT];TEX[DIRT]=[L_DIRT,L_DIRT,L_DIRT];TEX[STONE]=[L_STONE,L_STONE,L_STONE];TEX[SAND]=[L_SAND,L_SAND,L_SAND];
TEX[LOG]=[L_LOGTOP,L_BARK,L_LOGTOP];TEX[LEAVES]=[L_LEAVES,L_LEAVES,L_LEAVES];TEX[PLANKS]=[L_PLANKS,L_PLANKS,L_PLANKS];TEX[BRICKS]=[L_BRICKS,L_BRICKS,L_BRICKS];
TEX[SNOW]=[L_SNOW,L_SNOW,L_SNOW];TEX[GRAVEL]=[L_GRAVEL,L_GRAVEL,L_GRAVEL];TEX[PINE]=[L_PINE,L_PINE,L_PINE];TEX[TALLGRASS]=[L_TGRASS,L_TGRASS,L_TGRASS];TEX[FLOWER]=[L_FLOWER,L_FLOWER,L_FLOWER];
const OPQ=new Uint8Array(16),SOLID=new Uint8Array(16),AOC=new Uint8Array(16),LEAF=new Uint8Array(16),PLANT=new Uint8Array(16);
[GRASS,DIRT,STONE,SAND,LOG,PLANKS,BRICKS,SNOW,GRAVEL].forEach(i=>{OPQ[i]=SOLID[i]=AOC[i]=1;});
[LEAVES,PINE].forEach(i=>{SOLID[i]=AOC[i]=LEAF[i]=1;});PLANT[TALLGRASS]=PLANT[FLOWER]=1;
const PERBLOCK=new Uint8Array(NLAYERS);[L_GSIDE,L_LOGTOP,L_LEAVES,L_PINE,L_PLANKS,L_BRICKS].forEach(i=>PERBLOCK[i]=1);
const HOTBAR=[DIRT,GRASS,STONE,BRICKS,PLANKS,LOG,LEAVES,SAND,SNOW];

// ───────────────────────── textures ─────────────────────────
const TS=256;
function genTextures(){
  const layers=[];const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
  const make=fn=>{const d=new Uint8Array(TS*TS*4);for(let py=0;py<TS;py++)for(let px=0;px<TS;px++){const r=fn((px+.5)/TS,(py+.5)/TS,px,py),i=(py*TS+px)*4;d[i]=clamp(r[0],0,255);d[i+1]=clamp(r[1],0,255);d[i+2]=clamp(r[2],0,255);d[i+3]=clamp(r[3]*255,0,255);}return d;};
  const grassCol=(u,v,f1)=>{const n=pfbm(u,v,f1,f1,4,1),f=pfbm(u,v,f1*8,f1*8,2,2),m=n*.55+f*.45;let c=mix3([40,62,28],[86,112,50],sstep(.25,.75,m));const d=pfbm(u,v,f1/2,f1/2,3,3);c=mix3(c,[104,106,58],sstep(.56,.72,d)*.4);return [c[0],c[1],c[2],f];};
  const dirtCol=(u,v,f1)=>{const n=pfbm(u,v,f1,f1,4,5),f=pfbm(u,v,f1*6,f1*6,3,6),p=pfbm(u,v,f1*3,f1*3,2,9);let c=mix3([78,56,38],[132,100,70],sstep(.2,.8,n*.5+f*.5));let h=f*.7;if(p>.66){const k=sstep(.66,.72,p);c=mix3(c,[146,136,122],k*.8);h+=k*.3;}return [c[0],c[1],c[2],h];};
  layers[L_GRASS]=make((u,v)=>grassCol(u,v,8));
  layers[L_DIRT]=make((u,v)=>dirtCol(u,v,8));
  layers[L_GSIDE]=make((u,v)=>{const edge=.74+pfbm(u,v,16,1,3,41)*.2;const blade=pfbm(u,v,48,4,2,42);const k=sstep(edge-.06*blade-.03,edge,v);const d=dirtCol(u,v,4),g=grassCol(u,v,4);const c=mix3(d,g,k);return [c[0]*(1-.25*k*(1-sstep(edge,edge+.1,v))),c[1]*(1-.2*k*(1-sstep(edge,edge+.1,v))),c[2],lerp(d[3],g[3]*.6+.4,k)];});
  layers[L_STONE]=make((u,v)=>{const n=pfbm(u,v,4,4,5,11),f=pfbm(u,v,32,32,3,12),cr=Math.abs(pfbm(u,v,6,6,4,13)-.5),st=pfbm(u,v,3,12,3,14);let c=mix3([84,84,82],[156,153,146],sstep(.2,.8,n*.5+f*.3+st*.2));c=mix3(c,[120,108,92],sstep(.55,.75,st)*.3);const k=sstep(0,.018,cr);c=[c[0]*(.45+.55*k),c[1]*(.45+.55*k),c[2]*(.45+.55*k)];return [c[0],c[1],c[2],(n*.5+f*.3)*k+.1*k];});
  layers[L_SAND]=make((u,v,px,py)=>{const n=pfbm(u,v,6,6,3,15),g=hash2(px,py,16),rp=.5+.5*Math.sin(6.2832*(v*18+pfbm(u,v,4,4,2,17)*2.5));const c=mix3([180,160,116],[218,200,156],n*.55+g*.3+rp*.15);return [c[0],c[1],c[2],rp*.3+g*.4+n*.3];});
  layers[L_SNOW]=make((u,v,px,py)=>{const n=pfbm(u,v,6,6,4,18),g=hash2(px,py,19);const c=mix3([214,224,238],[252,253,255],n*.7+g*.3);return [c[0],c[1],c[2],n*.7+g*.15];});

// ───────────────────────── render ─────────────────────────
function resize(){const dpr=Math.min(window.devicePixelRatio||1,isTouch?1.5:2),w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
function planes(m){const pl=[];const row=i=>[m[i],m[4+i],m[8+i],m[12+i]];const r3=row(3);for(let i=0;i<3;i++){const r=row(i);pl.push(r3.map((v,k)=>v+r[k]),r3.map((v,k)=>v-r[k]));}return pl;}
function boxVisible(pl,x0,y0,z0,x1,y1,z1){for(const p of pl){if(p[0]*(p[0]>0?x1:x0)+p[1]*(p[1]>0?y1:y0)+p[2]*(p[2]>0?z1:z0)+p[3]<0)return false;}return true;}
function setCommon(P_,sun,time){gl.useProgram(P_.p);const u=P_.u;if(u.uSunDir)gl.uniform3fv(u.uSunDir,sun);if(u.uTime)gl.uniform1f(u.uTime,time);if(u.uExposure)gl.uniform1f(u.uExposure,1.0);}
const visible=[];
function render(time,menuOrbit){
  resize();const W=canvas.width,Hh=canvas.height,asp=W/Hh;
  const th=(dayTime-.25)*Math.PI*2;const sun=norm([Math.cos(th),Math.sin(th),.38*Math.cos(th*.5+.4)+.25]);
  const sh=sun[1],dayK=sstep(-.12,.25,sh);
  let lightDir,lightCol;
  if(sh>-.04){const k=sstep(-.04,.14,sh),w=sstep(0,.35,sh);lightDir=sun;lightCol=[2.35*k,lerp(.5,.95,w)*2.35*k,lerp(.24,.84,w)*2.35*k];}
  else{const k=sstep(.04,.22,-sh)*.16;lightDir=[-sun[0],-sun[1],-sun[2]];lightCol=[.4*k,.52*k,.8*k];}
  const amb=[lerp(.012,.27,dayK),lerp(.017,.37,dayK),lerp(.034,.54,dayK)];
  const waterFog=[.01+.03*dayK,.02+.16*dayK,.035+.24*dayK];
  const eye=[player.x,player.y+EYE,player.z];const yaw=player.yaw+menuOrbit,cp=Math.cos(player.pitch);
  const fwd=[Math.sin(yaw)*cp,Math.sin(player.pitch),-Math.cos(yaw)*cp],right=[Math.cos(yaw),0,Math.sin(yaw)],up=cross(right,fwd);
  const fov=70*Math.PI/180,far=(opts.dist+2)*CS*1.6;
  const VP=mat4mul(perspective(fov,asp,.08,far),viewFromBasis(right,up,[-fwd[0],-fwd[1],-fwd[2]],eye));
  const pl=planes(VP);const under=player.headWater?1:0;
  // visible set
  visible.length=0;const R=opts.dist,pcx=Math.floor(player.x/CS),pcz=Math.floor(player.z/CS);
  for(const c of chunks.values()){if(!c.mesh)continue;if(Math.max(Math.abs(c.cx-pcx),Math.abs(c.cz-pcz))>R)continue;visible.push(c);}
  gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.depthMask(true);gl.disable(gl.BLEND);
  // shadow pass
  let shadowMat=null;const shadowOn=opts.shadows&&(lightCol[0]+lightCol[1]+lightCol[2])>.01;
  if(shadowOn){
    const Ld=lightDir,r0=norm(cross(Math.abs(Ld[1])>.95?[1,0,0]:[0,1,0],Ld)),u0=cross(Ld,r0);const HS=84,tex=2*HS/SM;
    const cxl=Math.round((r0[0]*eye[0]+r0[1]*eye[1]+r0[2]*eye[2])/tex)*tex,cyl=Math.round((u0[0]*eye[0]+u0[1]*eye[1]+u0[2]*eye[2])/tex)*tex,czl=Ld[0]*eye[0]+Ld[1]*eye[1]+Ld[2]*eye[2];
    shadowMat=mat4mul(ortho(cxl-HS,cxl+HS,cyl-HS,cyl+HS,-(czl+170),-(czl-170)),viewFromBasis(r0,u0,Ld,[0,0,0]));
    gl.bindFramebuffer(gl.FRAMEBUFFER,shadowFB);gl.viewport(0,0,SM,SM);gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1.5,3);
    setCommon(pDepth,sun,time);gl.uniformMatrix4fv(pDepth.u.uVP,false,shadowMat);gl.uniform1i(pDepth.u.uTex,0);
    for(const c of visible){if(!c.mesh.o)continue;const dx=c.cx*CS+8-eye[0],dz=c.cz*CS+8-eye[2];if(dx*dx+dz*dz>(HS*1.5+12)*(HS*1.5+12))continue;
      gl.uniform3f(pDepth.u.uOffset,c.cx*CS,0,c.cz*CS);gl.bindVertexArray(c.mesh.o.vao);gl.drawElements(gl.TRIANGLES,c.mesh.o.count,gl.UNSIGNED_INT,0);}
    gl.disable(gl.POLYGON_OFFSET_FILL);gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }
  gl.viewport(0,0,W,Hh);gl.clear(gl.DEPTH_BUFFER_BIT|gl.COLOR_BUFFER_BIT);
  // sky
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);setCommon(pSky,sun,time);const tn=Math.tan(fov/2);
  gl.uniform3fv(pSky.u.uFwd,fwd);gl.uniform3fv(pSky.u.uRight,right);gl.uniform3fv(pSky.u.uUp,up);gl.uniform3fv(pSky.u.uCamPos,eye);gl.uniform2f(pSky.u.uTan,tn*asp,tn);gl.uniform1f(pSky.u.uUnder,under);gl.uniform3fv(pSky.u.uWaterFog,waterFog);
  gl.bindVertexArray(skyVAO);gl.drawArrays(gl.TRIANGLES,0,3);gl.enable(gl.DEPTH_TEST);gl.depthMask(true);
  // terrain + water share most uniforms
  const fogFar=opts.dist*CS;
  const setScene=Pg=>{setCommon(Pg,sun,time);const u=Pg.u;gl.uniformMatrix4fv(u.uVP,false,VP);gl.uniform3fv(u.uCam,eye);gl.uniform1f(u.uFogFar,fogFar);gl.uniform1f(u.uUnder,under);gl.uniform3fv(u.uWaterFog,waterFog);
    gl.uniform3fv(u.uLightDir,lightDir);gl.uniform3fv(u.uLightCol,lightCol);gl.uniform3fv(u.uAmbient,amb);gl.uniform1i(u.uShadow,1);gl.uniform1f(u.uShadowOn,shadowOn?1:0);if(shadowMat)gl.uniformMatrix4fv(u.uShadowMat,false,shadowMat);};
  setScene(pTerrain);gl.uniform1i(pTerrain.u.uTex,0);gl.uniform1f(pTerrain.u.uLantern,lampOn?1:0);
  const vis2=[];
  for(const c of visible){const x0=c.cx*CS,z0=c.cz*CS;if(!boxVisible(pl,x0,0,z0,x0+CS,c.maxY+1,z0+CS))continue;vis2.push(c);if(!c.mesh.o)continue;
    gl.uniform3f(pTerrain.u.uOffset,x0,0,z0);gl.bindVertexArray(c.mesh.o.vao);gl.drawElements(gl.TRIANGLES,c.mesh.o.count,gl.UNSIGNED_INT,0);}
  // outline
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  if(target&&playing){gl.useProgram(pLine.p);gl.uniformMatrix4fv(pLine.u.uVP,false,VP);gl.uniform3f(pLine.u.uOffset,target.x,target.y,target.z);gl.bindVertexArray(lineVAO);gl.drawArrays(gl.LINES,0,24);}
  // water
  gl.depthMask(false);gl.disable(gl.CULL_FACE);setScene(pWater);
  for(const c of vis2){if(!c.mesh.w)continue;gl.uniform3f(pWater.u.uOffset,c.cx*CS,0,c.cz*CS);gl.bindVertexArray(c.mesh.w.vao);gl.drawElements(gl.TRIANGLES,c.mesh.w.count,gl.UNSIGNED_INT,0);}
  gl.depthMask(true);gl.disable(gl.BLEND);gl.bindVertexArray(null);
}

// ───────────────────────── UI & input ─────────────────────────
const hotbarEl=$('hotbar');
function buildHotbar(){
  const tmp=document.createElement('canvas');tmp.width=tmp.height=TS;const tc=tmp.getContext('2d');
  HOTBAR.forEach((id,i)=>{const b=document.createElement('button');b.className='slot';b.id='slot-'+i;const cv=document.createElement('canvas');cv.width=cv.height=64;
    const layer=TEX[id][id===GRASS?1:id===LOG?1:0],src=texLayers[layer],img=tc.createImageData(TS,TS);
    for(let p=0;p<TS*TS*4;p+=4){img.data[p]=src[p];img.data[p+1]=src[p+1];img.data[p+2]=src[p+2];img.data[p+3]=LEAF[id]?(src[p+3]>96?255:40):255;}
    tc.putImageData(img,0,0);const c2=cv.getContext('2d');c2.translate(0,64);c2.scale(1,-1);const s=PERBLOCK[layer]?TS:TS/2;c2.drawImage(tmp,0,0,s,s,0,0,64,64);
    b.appendChild(cv);b.addEventListener('click',e=>{e.stopPropagation();select(i);});b.addEventListener('touchstart',e=>{e.stopPropagation();},{passive:true});hotbarEl.appendChild(b);});
}
let toastT=0;
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity=0;},1100);}
function select(i){sel=(i+9)%9;hotbarEl.querySelectorAll('.slot').forEach((e,k)=>{e.classList.toggle('on',k===sel);e.setAttribute('aria-label',T.blocks[k]);});if(playing)toast(T.blocks[sel]);}
let lockFallback=isTouch;
function setPlaying(v){playing=v;if(v)everPlayed=true;$('menu').hidden=v;$('cross').hidden=!v;$('hud').hidden=!v;hotbarEl.hidden=!v;$('touch').hidden=!(v&&isTouch);if(!v){for(const k in keys)keys[k]=false;moveX=moveZ=0;touchJump=false;saveWorld();applyLang();}}
function start(){if(!ready)return;setPlaying(true);if(!lockFallback){try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{lockFallback=true;});}catch(e){lockFallback=true;}}}
function pause(){if(document.pointerLockElement)document.exitPointerLock();setPlaying(false);}
$('play').addEventListener('click',start);
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&playing&&!lockFallback)setPlaying(false);});
document.addEventListener('pointerlockerror',()=>{lockFallback=true;});
function toggleFly(){player.fly=!player.fly;player.vy=0;toast(player.fly?T.flyOn:T.flyOff);$('t-fly').classList.toggle('on',player.fly);}
window.addEventListener('keydown',e=>{
  if(!playing){return;}
  if(e.code==='Escape'||e.code==='KeyP'){pause();return;}
  keys[e.code]=true;
  if(e.code.startsWith('Digit')){const n=+e.code.slice(5);if(n>=1&&n<=9)select(n-1);}
  if(e.code==='KeyF'&&!e.repeat)toggleFly();
  if(e.code==='KeyL'&&!e.repeat){lampOn=!lampOn;toast(lampOn?T.lampOn:T.lampOff);}
  if(e.code==='KeyT')dayTime=(dayTime+.04)%1;
  if(['Space','ArrowUp','ArrowDown','Tab'].includes(e.code))e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function look(dx,dy,s){player.yaw+=dx*s;player.pitch=clamp(player.pitch-dy*s,-1.55,1.55);}
let held=-1,heldT=0,dragMoved=0,dragBtn=-1;
canvas.addEventListener('mousedown',e=>{if(!playing)return;
  if(document.pointerLockElement===canvas){held=e.button;heldT=0;if(e.button===0)breakBlock();else if(e.button===2)placeBlock();}
  else if(lockFallback){dragBtn=e.button;dragMoved=0;}
  else start();});
window.addEventListener('mouseup',e=>{held=-1;if(dragBtn>=0&&playing&&lockFallback&&dragMoved<6){if(dragBtn===0)breakBlock();else if(dragBtn===2)placeBlock();}dragBtn=-1;});
window.addEventListener('mousemove',e=>{if(!playing)return;if(document.pointerLockElement===canvas)look(e.movementX,e.movementY,.0023);else if(dragBtn>=0){dragMoved+=Math.abs(e.movementX)+Math.abs(e.movementY);look(e.movementX,e.movementY,.004);}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('wheel',e=>{if(playing)select(sel+(e.deltaY>0?1:-1));},{passive:true});
// touch
let stickId=-1,stickO=[0,0],lookId=-1,lookP=[0,0],lookStart=0,lookMoved=0;
const stickEl=$('stick');
canvas.addEventListener('touchstart',e=>{if(!playing)return;e.preventDefault();for(const t of e.changedTouches){
  if(t.clientX<innerWidth*.4&&stickId<0){stickId=t.identifier;stickO=[t.clientX,t.clientY];stickEl.hidden=false;stickEl.style.left=(t.clientX-60)+'px';stickEl.style.top=(t.clientY-60)+'px';stickEl.firstElementChild.style.transform='';}
  else if(lookId<0){lookId=t.identifier;lookP=[t.clientX,t.clientY];lookStart=performance.now();lookMoved=0;}}},{passive:false});
canvas.addEventListener('touchmove',e=>{if(!playing)return;e.preventDefault();for(const t of e.changedTouches){
  if(t.identifier===stickId){let dx=(t.clientX-stickO[0])/50,dy=(t.clientY-stickO[1])/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}moveX=dx;moveZ=-dy;stickEl.firstElementChild.style.transform=`translate(${dx*36}px,${dy*36}px)`;}
  else if(t.identifier===lookId){const dx=t.clientX-lookP[0],dy=t.clientY-lookP[1];lookMoved+=Math.abs(dx)+Math.abs(dy);look(dx,dy,.006);lookP=[t.clientX,t.clientY];}}},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches){if(t.identifier===stickId){stickId=-1;moveX=moveZ=0;stickEl.hidden=true;}else if(t.identifier===lookId){lookId=-1;if(playing&&lookMoved<12&&performance.now()-lookStart<300){target=raycast();breakBlock();}}}};
canvas.addEventListener('touchend',tEnd);canvas.addEventListener('touchcancel',tEnd);
const hold=(id,down,upf)=>{const el=$(id);el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();down();},{passive:false});if(upf){el.addEventListener('touchend',e=>{e.preventDefault();upf();});el.addEventListener('touchcancel',upf);}};
hold('t-jump',()=>{touchJump=true;},()=>{touchJump=false;});hold('t-place',()=>{target=raycast();placeBlock();});hold('t-fly',toggleFly);hold('t-menu',pause);
$('t-menu').addEventListener('click',pause);
// options
const distEl=$('opt-dist'),shEl=$('opt-shadow');distEl.value=opts.dist;$('opt-dist-v').textContent=opts.dist;shEl.checked=opts.shadows;
distEl.addEventListener('input',()=>{opts.dist=+distEl.value;$('opt-dist-v').textContent=opts.dist;lsSet('wl_opts',opts);});
shEl.addEventListener('change',()=>{opts.shadows=shEl.checked;lsSet('wl_opts',opts);});
$('lang').addEventListener('click',()=>{opts.lang=opts.lang==='he'?'en':'he';lsSet('wl_opts',opts);applyLang();select(sel);});
let nwArmed=0;
$('newworld').addEventListener('click',()=>{const b=$('newworld');if(Date.now()-nwArmed<4000){try{localStorage.removeItem('wl_mods');localStorage.removeItem('wl_player');localStorage.removeItem('wl_seed');}catch(e){}saveWorld=()=>{};location.reload();return;}nwArmed=Date.now();b.textContent=T.confirmNew;b.classList.add('warn');setTimeout(()=>{b.textContent=T.newWorld;b.classList.remove('warn');},4000);});
window.addEventListener('pagehide',()=>saveWorld());

// ───────────────────────── loop ─────────────────────────
buildHotbar();applyLang();select(0);
let last=performance.now(),fpsA=60,orbit=0,hudT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;frameNo++;fpsA=lerp(fpsA,1/Math.max(dt,.001),.05);
  updateWorld(ready?7:14);
  if(!ready&&meshedNear>=neededNear){
    if(!placed){const x=Math.floor(player.x),z=Math.floor(player.z);let y=H-1;while(y>1&&!SOLID[getBlock(x,y,z)]&&getBlock(x,y,z)!==WATER)y--;player.y=y+1.01;placed=true;}
    ready=true;$('play').disabled=false;applyLang();
  }
  if(playing){
    dayTime=(dayTime+dt/780)%1;physics(dt);target=raycast();
    if(held>=0){heldT+=dt;if(heldT>.22){heldT=0;if(held===0)breakBlock();else if(held===2)placeBlock();}}
    orbit=0;
    hudT+=dt;if(hudT>.25){hudT=0;const hr=dayTime*24,hh=Math.floor(hr),mm=Math.floor((hr-hh)*60);$('hud').textContent=`${Math.floor(player.x)}, ${Math.floor(player.y)}, ${Math.floor(player.z)}  ·  ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}  ·  ${Math.round(fpsA)} fps`;}
  }else if(!matchMedia('(prefers-reduced-motion: reduce)').matches)orbit+=dt*.05;
  $('water-tint').hidden=!player.headWater;
  render(now/1000,orbit);
}
window.__wl={terrain,getBlock,raycast,breakBlock,placeBlock,SEA,setTarget:()=>{target=raycast();return target;},player,chunks,opts,setTime:t=>{dayTime=t;},start,get ready(){return ready;}};
requestAnimationFrame(frame);
})();
</script>
