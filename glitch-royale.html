    console.error(err);
    errorCount++;
    if (errorCount > 25) { cancelAnimationFrame(raf); fatal(t('error.generic')); }
  }
  if (debugEl && renderer) {
    const st = renderer.stats || {};
    const cost = draws !== drew ? `${st.drawCalls ?? '?'} dc · ${st.vertices ?? '?'} v` : 'still';
    debugEl.textContent = `${Math.round(1 / Math.max(dt, 1e-3))} fps · ${cost} · ${mode}`;
  }
}

function tickAttract(dt) {
  // Reduce motion: the title background holds still (fixed angle, no bob) instead of orbiting.
  const still = !!settings.reduceMotion;
  const a = still ? 0.7 : clock * 0.045;
  const R = game.world.islandRadius * 1.15;
  camera.eye = [Math.sin(a) * R, still ? 78 : 78 + Math.sin(clock * 0.2) * 6, Math.cos(a) * R];
  camera.target = [0, 4, 0];
  camera.fov = fovFor(1.0);
  draw();
  void dt;
}

function tickPlaying(dt) {
  if (renderer && renderer.contextLost) { pause(); return; }   // never run the match blind
  const inp = input.poll();
  if (inp.pause) { pause(); return; }
  if (inp.map) setMap(!mapOpen);
  const p = game.player;

  look.yaw += inp.lookDX || 0;
  look.pitch = clamp(look.pitch + (inp.lookDY || 0), -1.2, 1.2);
  if (input.isTouch && (inp.fire || inp.aim)) aimAssist(dt);

  const pi = p.input;
  pi.moveX = inp.moveX || 0;
  pi.moveZ = inp.moveZ || 0;
  pi.yaw = look.yaw;
  pi.pitch = look.pitch;
  pi.sprint = !!inp.sprint;
  pi.aim = !!inp.aim && !mapOpen;
  pi.fire = !!inp.fire && !mapOpen;
  pi.interact = !!inp.interact;
  if (inp.jump) pi.jump = true;
  if (inp.reload) pi.reload = true;
  if (inp.heal) pi.heal = true;
  if (inp.ability) pi.ability = true;
  if (inp.slot >= 0) pi.slot = inp.slot;
  else if (pendingSlot >= 0) pi.slot = pendingSlot;
  pendingSlot = -1;
  if (inp.cycle) pi.cycle = inp.cycle;

  updateCamera(dt);
  computeAim();
  stepGame(game, dt);
  handleEvents();
  updateHud();
  draw();
  trackPerf(dt);
  if (game.result) beginOutro();
}

function tickOutro(dt) {
  // Once the end screen is up the match is over: no hidden simulation (or its sounds) behind it,
  // and its near-opaque backdrop keeps the frozen last outro frame, redrawn only when needed.
  if (endShown) { if (sceneDirty) draw(); return; }
  outroT += dt;
  clearPlayerInput();
  stepGame(game, mode === 'deathcam' ? dt * 0.55 : dt);
  handleEvents(true);
  const a = outroYaw + outroT * 0.32, R = 6.5 + Math.min(outroT, 8) * 0.7, h = 2.6 + Math.min(outroT, 8) * 0.55;
  camera.eye = [outroCenter[0] - Math.sin(a) * R, outroCenter[1] + h, outroCenter[2] + Math.cos(a) * R];
  const gh = game.world.heightAt(camera.eye[0], camera.eye[2]) + 0.6;
  if (camera.eye[1] < gh) camera.eye[1] = gh;
  camera.target = [outroCenter[0], outroCenter[1] + 1.1, outroCenter[2]];
  camera.fov = fovFor(1.0);
  draw();
  if (!endShown && outroT > (mode === 'victorycam' ? VICTORY_CAM : DEATH_CAM)) showEnd();
}

// --------------------------------------------------------- pad on screens ----
// With a gamepad the screens (menu, drop select, pause, settings, help, end) work without a mouse:
// D-pad / left stick up-down moves the focus between the top screen's buttons, A presses the focused
// one, B goes back exactly like Esc, and Start on the pause screens does the same (Resume).
function screenPad() {
  const pad = input.pollPad ? input.pollPad() : null;
  if (!pad || !(pad.a || pad.b || pad.start || pad.move)) return;
  away = false;                                    // pad activity: the player is here
  const scr = document.querySelector('.gr-screen');
  if (!scr || scr.hidden) return;
  if (pad.b || (pad.start && scr.classList.contains('gr-screen--pause'))) {
    // The same path as the Esc key: hud.js resumes, goes back or cancels the quit question.
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', bubbles: true, cancelable: true }));
    return;
  }
  const list = [...scr.querySelectorAll('button, input')].filter(e => !e.disabled && e.tabIndex >= 0 && e.type !== 'range' &&
    e.getClientRects().length > 0 && getComputedStyle(e).visibility !== 'hidden');
  if (!list.length) return;
  const i = list.indexOf(document.activeElement);
  const focus = e => { try { e.focus({ focusVisible: true }); } catch { e.focus(); } };   // show the ring, even after a mouse click
  if (pad.move) focus(list[i < 0 ? (pad.move > 0 ? 0 : list.length - 1) : (i + pad.move + list.length) % list.length]);
  else if (pad.a) { if (i >= 0) list[i].click(); else focus(scr.querySelector('[data-autofocus]') || list[0]); }
}

// ---------------------------------------------------------------- camera ----
function fovFor(zoom) {
  const aspect = Math.max(0.3, viewport.width / Math.max(1, viewport.height));
  const v = 2 * Math.atan(Math.tan(HFOV / 2) / aspect);
  return clamp(v, 0.95, 1.45) / Math.max(1, zoom);
}

function activeWeapon(ch) {
  return ch.inv && ch.inv.slots ? ch.inv.slots[ch.inv.active] : null;
}

function updateCamera(dt) {
  const p = game.player, world = game.world;
  const dropping = p.phase === 'drop';
  const aiming = !!p.input.aim && !dropping && p.alive;
  const w = activeWeapon(p);
  const zoom = aiming ? ((w && WEAPONS[w.type] && WEAPONS[w.type].zoom) || 1.25) : 1;
  cam.dist = damp(cam.dist, dropping ? 7.5 : aiming ? 1.85 : 3.4, 9, dt);
  cam.fov = damp(cam.fov || fovFor(1), fovFor(zoom), 12, dt);
  const dir = dirFrom(look.yaw, look.pitch), r = rightOf(look.yaw);
  // Stair steps move the feet up in a single frame; ease the camera height while walking so
  // climbing looks smooth (snap when airborne, dropping or after a big jump in height).
  const pivotTarget = p.pos[1] + (dropping ? 2.4 : 1.62);
  if (dropping || !p.onGround || !(Math.abs(cam.pivotY - pivotTarget) < 1.6)) cam.pivotY = pivotTarget;
  else cam.pivotY = damp(cam.pivotY, pivotTarget, 14, dt);
  // r2-shoulder: the pivot (the crosshair ray's origin) never sits inside a wall or a Prism Barrier on
  // the right: a level ray from the body axis at pivot height bounds the offset. It shrinks at once and
  // grows back eased, so walking along a wall or past posts does not jitter. None while dropping.
  if (dropping) cam.shoulder = NaN;
  else {
    const room = shoulderRoom(game, p.pos[0], cam.pivotY, p.pos[2], r[0], r[2], SHOULDER);
    cam.shoulder = !(cam.shoulder <= room) ? room : damp(cam.shoulder, room, SHOULDER_EASE, dt);
  }
  const shoulder = dropping ? 0 : cam.shoulder;
  const pivot = [p.pos[0] + r[0] * shoulder, cam.pivotY, p.pos[2] + r[2] * shoulder];
  const back = [-dir[0], -dir[1], -dir[2]];
  let d = cam.dist;
  const hit = world.raycast(pivot, back, d + 0.35);
  if (hit) d = Math.max(0.3, hit.t - 0.35);
  const eye = [pivot[0] + back[0] * d, pivot[1] + back[1] * d, pivot[2] + back[2] * d];
  const gh = world.heightAt(eye[0], eye[2]) + 0.25;
  if (eye[1] < gh) eye[1] = gh;
  if (shake > 0 && !settings.reduceMotion) {
    const s = shake * 0.07;
    eye[0] += (Math.sin(clock * 91) + Math.sin(clock * 37)) * s;
    eye[1] += (Math.sin(clock * 73) + Math.sin(clock * 53)) * s;
  }
  shake = Math.max(0, shake - dt * 3.5);
  cam.pivot = pivot;
  cam.dir = dir;
  cam.eyeDist = d;
  camera.eye = eye;
  camera.target = [eye[0] + dir[0] * 10, eye[1] + dir[1] * 10, eye[2] + dir[2] * 10];
  camera.fov = cam.fov;
}

/** Crosshair ray from the shoulder pivot (on the camera ray) → what the player is aiming at. */
function computeAim() {
  const o = cam.pivot, dir = cam.dir, p = game.player;
  let best = 400;
  const wh = game.world.raycast(o, dir, best);
  if (wh) best = wh.t;
  const bh = hitTestBarriers(game, o, dir, best);
  if (bh) best = bh.t;
  const ch = hitTestCharacters(game, o, dir, best, p.id);
  if (ch) best = ch.t;
  const a = game.aim;
  a.origin = o;
  a.dir = dir;
  a.dist = best;
  a.point = [o[0] + dir[0] * best, o[1] + dir[1] * best, o[2] + dir[2] * best];
}

/** Light touch-screen aim assist: gentle pull toward an enemy close to the crosshair. */
function aimAssist(dt) {
  const p = game.player;
  if (!p.alive || p.phase !== 'ground') return;
  const eye = cam.pivot;
  let best = null, bestAng = 0.075;
  for (const ch of game.characters) {
    if (!ch.alive || ch === p) continue;
    const dx = ch.pos[0] - eye[0], dy = ch.pos[1] + 1.15 - eye[1], dz = ch.pos[2] - eye[2];
    const d = Math.hypot(dx, dy, dz);
    if (d > 75 || d < 1.5) continue;
    const yawT = yawTo(dx, dz), pitchT = Math.atan2(dy, Math.hypot(dx, dz));
    const ang = Math.hypot(angleDiff(look.yaw, yawT), pitchT - look.pitch);
    if (ang < bestAng) { bestAng = ang; best = { yawT, pitchT, ch }; }
  }
  if (!best) return;
  if (assist.id !== best.ch.id || clock - assist.t > 0.25) {
    assist = { id: best.ch.id, t: clock, los: game.world.lineOfSight(eye, [best.ch.pos[0], best.ch.pos[1] + 1.2, best.ch.pos[2]]) };
  }
  if (!assist.los) return;
  const k = 1 - Math.exp(-3.2 * dt);
  look.yaw += angleDiff(look.yaw, best.yawT) * k * 0.5;
  look.pitch += (best.pitchT - look.pitch) * k * 0.35;
}

function trackPerf(dt) {
  if (perf.warned || settings.quality !== 'high') return;
  perf.acc += dt;
  perf.frames++;
  if (perf.acc >= 4) {
    const avg = perf.acc / perf.frames;
    perf.slow = avg > 0.045 ? perf.slow + 1 : 0;
    perf.acc = 0;
    perf.frames = 0;
    if (perf.slow >= 2) { perf.warned = true; hud.toast(t('toast.lowFps')); }
  }
}

// ---------------------------------------------------------------- events ----
function byId(id) {
  if (id == null) return null;
  for (const c of game.characters) if (c.id === id) return c;
  return null;
}

function panFor(pos) {
  const rel = angleDiff(look.yaw, yawTo(pos[0] - camera.eye[0], pos[2] - camera.eye[2]));
  return clamp(Math.sin(rel), -1, 1);
}

function handleEvents(outro = false) {
  const p = game.player, pid = p.id;
  for (const e of game.events) {
    e.playerId = pid;
    e.mine = e.by === pid;
    e.me = e.target === pid || e.victim === pid;
    if (e.by != null) e.byName = (byId(e.by) || {}).name;
    if (e.victim != null) e.victimName = (byId(e.victim) || {}).name;
    if (e.target != null) e.targetName = (byId(e.target) || {}).name;
    if (!outro || e.type === 'elim' || e.type === 'zone') hud.event(e);
    playSound(e);
    if (outro || e.type !== 'hit') continue;
    if (e.by === pid && e.target !== pid) {
      const tg = byId(e.target);
      if (tg) {
        const s = renderer.project([tg.pos[0], tg.pos[1] + 2.05, tg.pos[2]]);
        if (s && s.visible) {
          const kind = e.head ? 'head' : (e.toShield > 0 && e.toShield >= (e.amount || 0) * 0.5 ? 'shield' : 'hp');
          hud.damageNumber(s.x + (Math.random() - 0.5) * 28, s.y, Math.max(1, Math.round(e.amount || 0)), kind);
        }
      }
    }
    if (e.target === pid && e.weapon !== 'zone') {
      shake = Math.min(1, shake + (e.amount || 10) / 45);
      const src = byId(e.by);
      if (src) hud.damageDirection(angleDiff(look.yaw, yawTo(src.pos[0] - p.pos[0], src.pos[2] - p.pos[2])));
    }
  }
}

function playSound(e) {
  const pid = game.player.id, pos = e.pos;
  const dist = pos ? Math.hypot(pos[0] - camera.eye[0], pos[1] - camera.eye[1], pos[2] - camera.eye[2]) : 0;
  const pan = pos ? panFor(pos) : 0;
  const mine = e.by === pid;
  switch (e.type) {
    case 'shot': audio.play(e.weapon, mine ? { vol: 0.85 } : { dist, pan }); break;
    case 'hit':
      if (mine && e.target !== pid) audio.play(e.head ? 'head' : 'hit');
      else if (e.target === pid && e.weapon !== 'zone') audio.play(e.toShield > 0 ? 'shieldHit' : 'hit', { vol: 0.75 });
      break;
    case 'shieldBreak': if (e.target === pid || mine) audio.play('shieldBreak'); break;
    case 'elim': audio.play('elim', mine || e.victim === pid ? {} : { dist, pan, vol: 0.6 }); break;
    case 'pickup': if (mine) audio.play(e.kind === 'weapon' ? 'weapon' : 'pickup'); break;
    case 'crate': audio.play('crate', mine ? {} : { dist, pan }); break;
    case 'vaultStart': audio.play('vaultStart', mine ? {} : { dist, pan }); break;
    case 'vault': audio.play('vault', mine ? {} : { dist, pan }); break;
    case 'barrier': audio.play('barrier', mine ? {} : { dist, pan }); break;
    case 'barrierBreak': audio.play('barrierBreak', { dist, pan }); break;
    case 'reload': if (mine) audio.play('reload'); break;
    case 'empty': if (mine) audio.play('empty'); break;
    case 'jump': if (mine) audio.play('jump'); break;
    case 'pad': audio.play('pad', mine ? {} : { dist, pan }); break;
    case 'land': if (mine) audio.play('land'); break;
    case 'heal': if (mine) audio.play('heal'); break;
    case 'healed': if (mine) audio.play('healed'); break;
    case 'zone': audio.play('zoneWarn'); break;
    default: break;
  }
}

// ------------------------------------------------------------------- HUD ----
function progress(remaining, total) {
  return total > 0 ? clamp(1 - remaining / total, 0, 1) : 0;
}

function updateHud() {
  const p = game.player, z = game.zone, tm = p.timers;
  const slots = p.inv.slots.map(w => (w ? { type: w.type, level: w.level, mag: w.mag, magSize: magSize(w.type, w.level) } : null));
  const inter = p.alive && p.phase === 'ground' ? findInteractable(game, p) : null;
  let prompt = null;
  if (inter) {
    const holding = tm.useTarget === inter.target && (tm.useKind === 'crate' || tm.useKind === 'vault');
    prompt = { kind: inter.kind, progress: holding ? progress(tm.use, tm.useTotal) : 0 };
    if (inter.kind === 'weapon' && inter.target.weapon) prompt.weapon = { type: inter.target.weapon.type, level: inter.target.weapon.level };
  }
  const healing = HEAL_KINDS.includes(tm.useKind);
  const dist = zoneDistance(z, p.pos[0], p.pos[2]);
  const w = activeWeapon(p);
  const aiming = !!p.input.aim && p.phase === 'ground';
  const moving = Math.hypot(p.vel[0], p.vel[2]) > 1;
  let spread = 0.02;
  try { spread = w ? spreadFor(w.type, aiming, moving) : 0.02; } catch { /* keep default */ }
  const gap = clamp(Math.tan(spread) / Math.tan(camera.fov / 2) * (viewport.height / 2), 4, 90);
  const snap = {
    hp: p.hp, maxHp: p.maxHp, shield: p.shield, maxShield: p.maxShield,
    slots, active: p.inv.active, energy: p.inv.energy,
    items: { repair: p.inv.repair, cell: p.inv.cell, mega: p.inv.mega },
    reload: tm.reload > 0 ? progress(tm.reload, tm.reloadTotal) : -1,
    channel: healing ? { kind: tm.useKind, progress: progress(tm.use, tm.useTotal) } : null,
    prompt,
    alive: game.aliveCount, total: game.totalCount, elims: p.stats.elims,
    zone: {
      phase: Math.min(z.phase + 1, ZONE_PHASES.length), phases: ZONE_PHASES.length, state: z.state, timeLeft: Math.max(0, z.timer),
      outside: dist > 0, distOutside: Math.max(0, dist), center: z.center, radius: z.radius, target: z.target
    },
    player: { x: p.pos[0], z: p.pos[2], yaw: look.yaw, dropping: p.phase === 'drop', altitude: Math.max(0, p.pos[1] - game.world.heightAt(p.pos[0], p.pos[2])) },
    vaults: game.world.vaults.map(v => ({ x: v.x, z: v.z, state: v.state })),
    ability: { ready: tm.ability <= 0, cooldown01: clamp(tm.ability / 10, 0, 1) },
    aiming, spread: gap, zoom: aiming && w && WEAPONS[w.type] ? WEAPONS[w.type].zoom : 1
  };
  hud.update(snap);
  input.setContext({
    interact: prompt ? { label: t(`prompt.${prompt.kind}Short`) } : null,
    canHeal: (p.inv.cell > 0 && p.shield < p.maxShield) || (p.inv.mega > 0 && p.shield < p.maxShield) || (p.inv.repair > 0 && p.hp < p.maxHp),
    abilityReady: tm.ability <= 0, abilityCooldown01: clamp(tm.ability / 10, 0, 1),
    aiming, dropping: p.phase === 'drop'
  });
}

// ---------------------------------------------------------------- render ----
function draw() {
  const r = renderer, g = game;
  sceneDirty = false;
  draws++;
  r.beginFrame();
  const camPos = camera.eye;
  // perf-2: bots, pickups, props and Glitch-wall pieces wholly outside the view are not built. The
  // planes come from the camera exactly as r.render(camera) below uses it (it is final by now).
  const view = cullView ? r.frustum(camera) : null;
  if (g.state !== 'setup') {
    for (const ch of g.characters) {
      if (!ch.alive) continue;
      if (ch === g.player && mode === 'playing' && cam.eyeDist < 0.8) continue;
      drawCharacter(r.dyn, r.fx, ch, g, camPos, r.glow, view);
    }
  }
  drawPickups(r.dyn, r.glow, r.fx, g, camPos, view);
  drawWorldProps(r.dyn, r.glow, r.fx, g, camPos, view);
  drawProjectiles(r.glow, g, camPos, r.fx);
  drawBarriers(r.dyn, r.fx, r.glow, g);
  drawEffects(r.dyn, r.glow, g, camPos);
  if (g.state !== 'setup') drawZone(r.fx, r.glow, g.zone, g.time, camPos, view);
  env.time = clock;
  r.render(camera, env);
}

// ------------------------------------------------------------- QA hooks ----
// Small, read-mostly hooks used by automated browser tests (and handy for debugging).
function exposeQaHooks() {
  window.glitchRoyale = {
    get mode() { return mode; },
    get game() { return game; },
    get settings() { return settings; },
    get stats() { return stats; },
    /** Frames drawn so far (the still screens draw only when the canvas needs it). */
    get draws() { return draws; },
    renderer: () => renderer,
    play: d => play(d),
    drop: pt => { if (mode !== 'dropselect') return; if (hud.closeScreens) hud.closeScreens(); beginMatch(pt || null); },
    pause, resume,
    look: (yaw, pitch) => { look.yaw = yaw; look.pitch = pitch; },
    /** View culling on (default) / off; redraws the current state at once (same clock) → that frame's stats. */
    cull: on => { cullView = on !== false; if (game) draw(); return { ...renderer.stats }; },
    camera: () => ({ eye: camera.eye.slice(), target: camera.target.slice(), fov: camera.fov, dist: cam.dist, eyeDist: cam.eyeDist, pivot: cam.pivot.slice(), shoulder: cam.shoulder, look: { ...look } })
  };
}
return { boot };
})();

__m.main.boot(document.getElementById('app'));
