<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Glitch Royale — an original battle royale that runs right in your browser. Drop onto Glitch Island, loot, outlast the Glitch and be the last byte standing.">
<title>Glitch Royale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312102a'/%3E%3Cpath d='M18 20h28v8H26v8h12v-4h8v12H18z' fill='%233ee6ff'/%3E%3Cpath d='M22 24h28v8H30v8h12v-4h8v12H22z' fill='%23ff4fd8' opacity='.75'/%3E%3C/svg%3E">
<style>/* Glitch Royale — all CSS (inlined into the single HTML file by build.mjs).
   Layers inside .gr-root: canvas (0) · .gr-input touch controls (20) · .gr-hud (30: play HUD,
   full map, screens). Text flows with the document direction (Hebrew RTL default) through logical
   properties; game-critical placement (joystick left, fire right, map north-up) stays physical. */

/* ------------------------------------------------------------------ base -- */
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #0d0b22;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
.gr-root {
  --font: "Rubik", "Assistant", "Heebo", "Segoe UI", system-ui, sans-serif;
  --panel: rgba(18, 16, 42, 0.72);
  --panel-solid: #15122f;
  --panel-hi: rgba(38, 32, 84, 0.9);
  --line: rgba(255, 255, 255, 0.14);
  --line-strong: rgba(255, 255, 255, 0.3);
  --muted: rgba(228, 224, 255, 0.76);
  --ink: #1a1438;
  --magenta: #ff4fd8;
  --cyan: #3ee6ff;
  --gold: #ffd23f;
  --gold-ledge: #b07d0e;
  --lime: #7cff6b;
  --violet: #b98cff;
  --rose: #ff8ab8;
  --radius: 14px;
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --ss: var(--sal);
  --se: var(--sar);
  --edge: 14px;
  --mini: 150px;
  --lift: 0px;
  position: fixed;
  inset: 0;
  overflow: hidden;
  color: #fff;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.3;
  background: #0d0b22;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
[dir="rtl"] .gr-root, .gr-root[dir="rtl"], .gr-hud[dir="rtl"] { --ss: var(--sar); --se: var(--sal); }
.gr-hud[dir="ltr"] { --ss: var(--sal); --se: var(--sar); }
.gr-root.gr-touch-mode { --mini: 110px; --edge: 8px; }
.gr-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
  outline: none;
  touch-action: none;
}
.gr-root [hidden] { display: none !important; }
.gr-root svg { display: block; }
.gr-root svg .ink { fill: var(--ink); }
.gr-ico { display: inline-flex; flex: none; }
.gr-ico svg { width: 1.25em; height: 1.25em; fill: currentColor; }
.gr-root :focus { outline: none; }
.gr-root :focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.gr-root button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
@media (max-height: 520px), (max-width: 520px) {
  .gr-root { font-size: 14px; }
}

/* ----------------------------------------------------------- HUD layers -- */
.gr-hud { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.gr-play { position: absolute; inset: 0; }
.gr-key {
  display: inline-grid;
  place-items: center;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  font: 800 0.78rem/1 var(--font);
  box-shadow: 0 2px 0 #8d87bd;
  white-space: nowrap;
}
.gr-key.is-off { opacity: 0.45; }

/* top bar: alive · elims · Glitch */
.gr-top {
  position: absolute;
  top: calc(var(--sat) + var(--edge));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: stretch;
  gap: 8px;
}
.gr-chip, .gr-zone {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 42px;
  padding: 0 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  white-space: nowrap;
}
.gr-chip .gr-ico svg, .gr-zone .gr-ico svg { width: 20px; height: 20px; }
.gr-chip--alive { color: var(--cyan); }
.gr-chip--elims { color: var(--magenta); }
.gr-chip__v { color: #fff; font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.gr-chip__l { color: var(--muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; }
.gr-chip--elims.is-bump { animation: gr-bump 0.5s ease-out; }
.gr-zone { color: var(--violet); }
.gr-zone__txt { display: flex; flex-direction: column; line-height: 1.08; }
.gr-zone__phase { color: var(--muted); font-size: 0.68rem; font-weight: 700; }
.gr-zone__label { color: #fff; font-size: 0.84rem; font-weight: 700; }
.gr-zone__time { color: #fff; font-size: 1.3rem; font-weight: 800; min-width: 3.1ch; text-align: center; font-variant-numeric: tabular-nums; }
.gr-zone.is-shrink {
  background: linear-gradient(90deg, rgba(92, 30, 160, 0.85), rgba(150, 40, 140, 0.82));
  border-color: rgba(205, 160, 255, 0.85);
  color: #fff;
  animation: gr-zone-pulse 1.2s ease-in-out infinite;
}
.gr-zone.is-final .gr-zone__label { color: var(--gold); }

/* kill feed */
.gr-feed {
  position: absolute;
  top: calc(var(--sat) + var(--edge));
  inset-inline-start: calc(var(--ss) + var(--edge));
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  max-width: min(440px, 36vw);
}
.gr-feed__line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 8px;
  padding: 5px 10px;
  border-radius: 10px;
  border-inline-start: 4px solid transparent;
  background: var(--panel);
  font-size: 0.86rem;
  font-weight: 600;
  animation: gr-feed-in 0.25s ease-out;
  transition: opacity 0.4s;
}
.gr-feed__line.is-mine { border-inline-start-color: var(--gold); background: rgba(70, 52, 8, 0.82); }
.gr-feed__line.is-me { border-inline-start-color: var(--magenta); background: rgba(72, 14, 64, 0.82); }
.gr-feed__line.is-out { opacity: 0; }
.gr-feed__name { font-weight: 800; }
.gr-feed__line.is-mine .gr-feed__name, .gr-feed__line.is-me .gr-feed__name { color: #fff; }
.gr-feed__w { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 0.76rem; }
.gr-feed__w svg { width: 34px; height: 13px; fill: currentColor; }
.gr-feed__zone { color: var(--violet); }
.gr-feed__zone svg { width: 15px; height: 15px; }
/* Desktop (mouse): the feed never reaches the centred top bar, and each elimination stays one line (a long one
   ends in an ellipsis: the weapon goes first, then the names) instead of wrapping into a tall column. 270 px =
   half the widest top bar (496 px: Hebrew, Glitch countdown, two-digit counts) + an 8 px gap + the 14 px edge;
   narrow windows below. The touch feed has its own place (touch HUD layout). */
.gr-root:not(.gr-touch-mode) .gr-feed { max-width: min(440px, 36vw, calc(50% - 270px)); }
.gr-root:not(.gr-touch-mode) .gr-feed__line { display: block; max-width: 100%; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr-root:not(.gr-touch-mode) .gr-feed__w, .gr-root:not(.gr-touch-mode) .gr-feed__zone { margin-inline-start: 8px; vertical-align: middle; }

/* minimap */
.gr-mini {
  position: absolute;
  top: calc(var(--sat) + var(--edge));
  inset-inline-end: calc(var(--se) + var(--edge));
  width: var(--mini);
  height: var(--mini);
  padding: 0;
  margin: 0;
  border: 3px solid #120f2b;
  border-radius: 16px;
  outline: 1px solid var(--line-strong);
  outline-offset: 0;
  background: #1d5f8f;
  overflow: hidden;
  pointer-events: none;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  cursor: pointer;
}
.gr-mini__cv { width: 100%; height: 100%; display: block; }
.gr-mini__n {
  position: absolute;
  top: 3px;
  left: 50%;
  transform: translateX(-50%);
  padding: 0 6px;
  border-radius: 6px;
  background: rgba(18, 15, 43, 0.85);
  color: #fff;
  font-size: 0.66rem;
  font-weight: 800;
  line-height: 1.5;
}

/* centre: crosshair · hit marker · damage arcs */
.gr-center { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.gr-center.is-off .gr-cross, .gr-center.is-off .gr-hitmark { display: none; }
.gr-cross { --gap: 14px; position: absolute; left: 0; top: 0; }
.gr-cross i { position: absolute; display: block; background: #fff; border-radius: 1px; box-shadow: 0 0 0 1px rgba(14, 10, 36, 0.75); }
.gr-cross__t, .gr-cross__b { width: 2px; height: 10px; left: -1px; top: -5px; }
.gr-cross__t { transform: translateY(calc(-1 * var(--gap) - 5px)); }
.gr-cross__b { transform: translateY(calc(var(--gap) + 5px)); }
.gr-cross__l, .gr-cross__r { width: 10px; height: 2px; left: -5px; top: -1px; }
.gr-cross__l { transform: translateX(calc(-1 * var(--gap) - 5px)); }
.gr-cross__r { transform: translateX(calc(var(--gap) + 5px)); }
.gr-root .gr-cross__d { width: 4px; height: 4px; left: -2px; top: -2px; border-radius: 50%; }
.gr-root .gr-cross__o {
  display: none;
  width: calc(var(--gap) * 2);
  height: calc(var(--gap) * 2);
  left: calc(-1 * var(--gap));
  top: calc(-1 * var(--gap));
  background: none;
  border: 2px solid rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(14, 10, 36, 0.45), inset 0 0 0 1px rgba(14, 10, 36, 0.45);
  box-sizing: border-box;
}
.gr-cross.is-scatter .gr-cross__o { display: block; }
.gr-cross.is-aim .gr-cross__d { background: var(--gold); width: 6px; height: 6px; left: -3px; top: -3px; }
.gr-hitmark { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transform: rotate(45deg); }
.gr-hitmark i { position: absolute; display: block; background: #fff; border-radius: 1px; box-shadow: 0 0 0 1px rgba(14, 10, 36, 0.7); }
.gr-hitmark__a, .gr-hitmark__b { width: 3px; height: 9px; left: -1.5px; }
.gr-hitmark__a { top: -19px; }
.gr-hitmark__b { top: 10px; }
.gr-hitmark__c, .gr-hitmark__d { width: 9px; height: 3px; top: -1.5px; }
.gr-hitmark__c { left: -19px; }
.gr-hitmark__d { left: 10px; }
.gr-hitmark.is-shield i { background: var(--cyan); }
.gr-hitmark.is-head i { background: var(--gold); }
.gr-hitmark.is-kill i { background: var(--magenta); width: 4px; }
.gr-hitmark.is-kill .gr-hitmark__c, .gr-hitmark.is-kill .gr-hitmark__d { width: 12px; height: 4px; }
.gr-hitmark.is-kill .gr-hitmark__a, .gr-hitmark.is-kill .gr-hitmark__b { height: 12px; }
.gr-hitmark.is-break i { background: var(--cyan); }
.gr-arc { position: absolute; left: -100px; top: -100px; width: 200px; height: 200px; opacity: 0; }
.gr-arc svg { width: 100%; height: 100%; overflow: visible; }
.gr-arc path { fill: none; stroke: #ff5fb4; stroke-width: 9; stroke-linecap: round; filter: drop-shadow(0 0 2px rgba(80, 10, 60, 0.9)); }

/* under the crosshair: reload · callout · prompt · channel */
.gr-below {
  position: absolute;
  left: 50%;
  top: calc(50% + 42px);
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: max-content;
  max-width: 92vw;
}
.gr-reload { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 800; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
.gr-reload__track { display: block; width: 92px; height: 5px; border-radius: 3px; background: rgba(18, 16, 42, 0.7); overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25); }
.gr-reload__bar { display: block; height: 100%; background: #fff; transform-origin: 0 50%; transform: scaleX(0); }
[dir="rtl"] .gr-reload__bar { transform-origin: 100% 50%; }
.gr-callout {
  display: none;
  white-space: nowrap;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border-radius: 999px;
  background: rgba(70, 12, 62, 0.86);
  border: 2px solid var(--magenta);
  font-weight: 800;
}
.gr-callout.is-on { display: flex; animation: gr-callout 2.2s ease-out both; }
.gr-callout__name { color: var(--magenta); }
.gr-callout__n { color: var(--gold); font-weight: 900; }
.gr-prompt { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.gr-prompt__txt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 16px 5px 6px;
  padding-inline: 6px 16px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-weight: 700;
  font-size: 0.98rem;
  white-space: nowrap;
}
.gr-prompt__w { color: var(--tier, #fff); font-weight: 800; }
.gr-prompt__lv { display: inline-block; margin-inline-start: 2px; padding: 0 5px; border-radius: 5px; background: var(--tier, #fff); color: var(--ink); font-size: 0.75rem; font-weight: 900; }
.gr-prompt__sub { padding: 1px 10px; border-radius: 999px; background: rgba(18, 16, 42, 0.8); font-size: 0.8rem; font-weight: 800; color: var(--gold); }
.gr-keyring { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; flex: none; }
.gr-keyring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.gr-keyring .bg { fill: none; stroke: rgba(255, 255, 255, 0.16); stroke-width: 3; }
.gr-keyring .fg { fill: none; stroke: var(--gold); stroke-width: 3.6; stroke-dasharray: 100; stroke-dashoffset: 100; stroke-linecap: round; }
.gr-prompt.is-hold .gr-keyring .bg { stroke: rgba(255, 210, 63, 0.35); }
.gr-prompt:not(.is-progress) .gr-keyring .fg { visibility: hidden; }
.gr-keyring__cap {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: #fff;
  color: var(--ink);
  font-size: 0.92rem;
  font-weight: 900;
  box-shadow: 0 2px 0 #8d87bd;
}
.gr-keyring__cap svg { width: 18px; height: 18px; fill: currentColor; }
.gr-root.gr-touch-mode .gr-keyring__cap { background: var(--gold); box-shadow: 0 2px 0 var(--gold-ledge); }
.gr-channel {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 230px;
  padding: 8px 14px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--lime);
}
.gr-channel--cell { color: var(--cyan); }
.gr-channel--mega { color: #9cc2ff; }
.gr-channel__ico svg { width: 30px; height: 30px; fill: currentColor; }
.gr-channel__mid { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.gr-channel__l { color: #fff; font-weight: 800; font-size: 0.9rem; }
.gr-channel__track { display: block; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
.gr-channel__bar { display: block; height: 100%; background: currentColor; transform-origin: 0 50%; transform: scaleX(0); }
[dir="rtl"] .gr-channel__bar { transform-origin: 100% 50%; }
.gr-channel__hint { color: var(--muted); font-size: 0.68rem; }

/* top-centre stack: outside warning · banner · toasts */
.gr-topstack {
  position: absolute;
  top: calc(var(--sat) + var(--edge) + 54px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: max-content;
  max-width: 94vw;
}
.gr-vignette {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.4s;
  background: radial-gradient(ellipse closest-side, rgba(120, 40, 255, 0) 55%, rgba(125, 40, 255, 0.34) 82%, rgba(150, 30, 240, 0.7) 100%);
}
.gr-vignette.is-on { opacity: 1; animation: gr-vignette 1.6s ease-in-out infinite; }
/* hit flash at the screen edges (kid-friendly colours: hot pink for health, cyan for shield) */
.gr-hurt { position: absolute; inset: 0; opacity: 0; }
.gr-hurt.is-hp { background: radial-gradient(ellipse closest-side, rgba(255, 60, 150, 0) 62%, rgba(255, 60, 150, 0.4) 88%, rgba(255, 40, 140, 0.72) 100%); }
.gr-hurt.is-shield { background: radial-gradient(ellipse closest-side, rgba(62, 230, 255, 0) 64%, rgba(62, 230, 255, 0.34) 88%, rgba(62, 230, 255, 0.62) 100%); }
.gr-hurt.is-zone { background: radial-gradient(ellipse closest-side, rgba(150, 60, 255, 0) 58%, rgba(150, 60, 255, 0.4) 86%, rgba(170, 50, 255, 0.72) 100%); }
.gr-outside {
  padding: 8px 20px;
  border-radius: var(--radius);
  background: rgba(58, 18, 110, 0.88);
  border: 2px solid rgba(200, 150, 255, 0.9);
  text-align: center;
  animation: gr-pop 0.3s ease-out;
}
.gr-outside__t { font-size: 1.1rem; font-weight: 900; }
.gr-outside__d { font-size: 0.9rem; font-weight: 700; color: #ece0ff; }
.gr-banner { display: none; text-align: center; max-width: 92vw; }
.gr-banner.is-on { display: block; animation: gr-banner-in 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
.gr-banner.is-leaving { animation: gr-banner-out 0.32s ease-in both; }
.gr-banner__t {
  font-size: clamp(1.6rem, 4.2vw, 2.8rem);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: 0.01em;
  text-shadow: -2px 0 var(--magenta), 2px 0 var(--cyan), 0 4px 0 rgba(14, 10, 36, 0.9);
}
.gr-banner__s {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 14px;
  border-radius: 999px;
  background: var(--panel);
  font-size: clamp(0.88rem, 1.8vw, 1.05rem);
  font-weight: 700;
}
.gr-toasts { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.gr-toast {
  padding: 6px 16px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-size: 0.88rem;
  font-weight: 700;
  animation: gr-toast-in 0.25s ease-out both;
  transition: opacity 0.35s, transform 0.35s;
}
.gr-toast--loot { border-color: rgba(255, 210, 63, 0.55); }
.gr-toast--warn { border-color: rgba(255, 79, 216, 0.75); background: rgba(70, 14, 62, 0.88); }
.gr-toast.is-out { opacity: 0; transform: translateY(-6px); }

/* drop altitude meter */
.gr-alt {
  position: absolute;
  top: 50%;
  inset-inline-start: calc(var(--ss) + var(--edge) + 6px);
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 108px;
  padding: 10px 6px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
}
.gr-alt__l { color: var(--muted); font-size: 0.72rem; font-weight: 800; }
.gr-alt__track { position: relative; width: 12px; height: 150px; border-radius: 6px; background: rgba(255, 255, 255, 0.14); }
.gr-alt__fill { position: absolute; inset: 0; border-radius: 6px; background: linear-gradient(to top, var(--cyan), var(--magenta)); transform-origin: 50% 100%; }
.gr-alt__mark { position: absolute; left: 50%; width: 26px; height: 4px; border-radius: 2px; background: #fff; transform: translate(-50%, 50%); box-shadow: 0 0 0 1px rgba(14, 10, 36, 0.6); }
.gr-alt__v { font-size: 1.05rem; font-weight: 900; }
.gr-alt__hint { color: var(--muted); font-size: 0.66rem; text-align: center; line-height: 1.2; }

/* vitals */
.gr-vitals {
  position: absolute;
  bottom: calc(var(--sab) + var(--edge) + 2px);
  inset-inline-start: calc(var(--ss) + var(--edge) + 2px);
  width: 300px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
}
.gr-bar { display: flex; align-items: center; gap: 8px; }
.gr-bar__ico svg { width: 18px; height: 18px; }
.gr-bar--hp .gr-bar__ico { color: var(--lime); }
.gr-bar--shield .gr-bar__ico { color: var(--cyan); }
.gr-bar__track { position: relative; flex: 1; height: 13px; border-radius: 7px; background: rgba(5, 4, 18, 0.6); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
.gr-bar--hp .gr-bar__track { height: 18px; border-radius: 9px; }
.gr-bar__fill, .gr-bar__ghost { position: absolute; inset: 0; display: block; transform-origin: 0 50%; transform: scaleX(0); }
[dir="rtl"] .gr-bar__fill, [dir="rtl"] .gr-bar__ghost { transform-origin: 100% 50%; }
.gr-bar__ghost { background: rgba(255, 255, 255, 0.78); transition: transform 0.45s ease 0.2s; }
.gr-bar--hp .gr-bar__fill { background: linear-gradient(#b2ffa6, #5be84b); }
.gr-bar--shield .gr-bar__fill { background: linear-gradient(#93f3ff, #22c4ee); }
.gr-bar__seg { position: absolute; inset: 0; display: block; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 2px), rgba(18, 16, 42, 0.75) calc(25% - 2px) 25%); }
.gr-bar__num { min-width: 2.6ch; text-align: end; font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.gr-bar.is-low .gr-bar__track { animation: gr-low 0.9s ease-in-out infinite; }
.gr-bar.is-low .gr-bar__num { color: var(--rose); }
.gr-bar.is-zero .gr-bar__num { color: var(--muted); }

/* weapon slots + energy (always 1-2-3 left to right, like the number keys) */
.gr-slots {
  position: absolute;
  bottom: calc(var(--sab) + var(--edge) + 2px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
  gap: 8px;
  direction: ltr;
}
.gr-slot {
  --tier: #ebf0f5;
  position: relative;
  display: grid;
  place-items: center;
  width: 94px;
  height: 64px;
  padding: 0;
  margin: 0;
  border-radius: 12px;
  border: 2px solid rgba(255, 255, 255, 0.14);
  background: var(--panel);
  color: var(--tier);
  pointer-events: none;
  transition: transform 0.15s ease, background 0.15s;
  cursor: pointer;
}
.gr-slot.is-active { transform: translateY(-6px); border-color: var(--tier); background: var(--panel-hi); box-shadow: 0 5px 0 rgba(0, 0, 0, 0.45); }
.gr-slot__icon { margin-top: -4px; }
.gr-slot__icon svg { width: 64px; height: 24px; fill: currentColor; }
.gr-slot__key { position: absolute; top: 3px; left: 6px; color: var(--muted); font-size: 0.68rem; font-weight: 800; }
.gr-slot__lv { position: absolute; top: 4px; right: 5px; padding: 0 4px; border-radius: 5px; background: var(--tier); color: var(--ink); font-size: 0.6rem; font-weight: 900; line-height: 1.4; }
.gr-slot.is-empty .gr-slot__lv { display: none; }
.gr-slot__mag { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; color: #fff; font-size: 0.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.gr-slot.is-lowmag .gr-slot__mag { color: var(--gold); }
.gr-slot.is-lowmag .gr-slot__mag::after { content: " !"; }
.gr-slot.is-empty { border-style: dashed; color: var(--muted); }
.gr-slot.is-empty .gr-slot__mag { color: var(--muted); font-weight: 600; top: 50%; bottom: auto; transform: translateY(-50%); }
.gr-slot__reload { position: absolute; left: 8px; right: 8px; bottom: 1px; height: 3px; display: none; border-radius: 2px; background: #fff; transform-origin: 0 50%; transform: scaleX(var(--p, 0)); }
.gr-slot.is-reloading .gr-slot__reload { display: block; }
.gr-energy {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  width: 64px;
  height: 64px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--gold);
}
.gr-energy .gr-ico svg { width: 20px; height: 20px; }
.gr-energy__v { color: #fff; font-size: 1.02rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.gr-energy__l { color: var(--muted); font-size: 0.6rem; font-weight: 700; }

/* items + Prism Barrier */
.gr-gear {
  position: absolute;
  bottom: calc(var(--sab) + var(--edge) + 2px);
  inset-inline-end: calc(var(--se) + var(--edge) + 2px);
  display: flex;
  align-items: flex-end;
  gap: 12px;
}
.gr-items { position: relative; display: flex; gap: 6px; padding: 8px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); }
.gr-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; width: 48px; height: 50px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); }
.gr-item .gr-ico svg { width: 24px; height: 24px; }
.gr-item--repair { color: var(--lime); }
.gr-item--cell { color: var(--cyan); }
.gr-item--mega { color: #9cc2ff; }
.gr-item__v { color: #fff; font-size: 0.95rem; font-weight: 800; }
.gr-item.is-zero { opacity: 0.38; }
.gr-item.is-next { background: rgba(255, 210, 63, 0.14); box-shadow: inset 0 0 0 2px var(--gold); }
.gr-items__key { position: absolute; top: -10px; inset-inline-end: -8px; }
.gr-ability { position: relative; display: flex; flex-direction: column; align-items: center; }
.gr-ability__ring {
  --cd: 0;
  position: relative;
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: conic-gradient(rgba(6, 5, 20, 0.78) calc(var(--cd) * 360deg), rgba(255, 79, 216, 0.16) 0);
  border: 2px solid var(--line-strong);
  color: rgba(255, 79, 216, 0.6);
}
.gr-ability.is-ready .gr-ability__ring { border-color: var(--magenta); color: var(--magenta); box-shadow: 0 0 0 4px rgba(255, 79, 216, 0.2); }
.gr-ability__ico svg { width: 28px; height: 28px; }
.gr-ability__s { position: absolute; color: #fff; font-size: 1.15rem; font-weight: 900; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
.gr-ability__key { position: absolute; bottom: -9px; }

/* floating damage numbers */
.gr-dmg { position: absolute; inset: 0; overflow: hidden; }
.gr-num {
  position: absolute;
  left: 0;
  top: 0;
  opacity: 0;
  color: #fff;
  font-size: 1.3rem;
  font-weight: 900;
  white-space: nowrap;
  text-shadow: 0 2px 0 rgba(14, 10, 36, 0.9), 0 0 2px #000;
  will-change: transform, opacity;
}
.gr-num--shield { color: var(--cyan); font-style: italic; }
.gr-num--head { color: var(--gold); font-size: 1.7rem; }
.gr-num--head::after { content: "!"; }

/* full map */
.gr-map {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);
  background: rgba(8, 6, 24, 0.66);
  pointer-events: none;
}
.gr-touch-mode .gr-map { pointer-events: auto; }
.gr-map__panel { display: flex; flex-direction: column; gap: 10px; max-height: 100%; padding: 14px; border-radius: 20px; background: rgba(18, 16, 42, 0.9); border: 1px solid var(--line); }
.gr-map__head { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.gr-map__title { margin: 0; font-size: 1.25rem; font-weight: 900; }
.gr-map__hint { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.85rem; }
.gr-iconbtn {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  padding: 0;
  border-radius: 14px;
  border: 2px solid var(--line-strong);
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  cursor: pointer;
}
.gr-iconbtn svg { width: 22px; height: 22px; fill: currentColor; }
.gr-map__close { display: none; margin-inline-start: auto; }
.gr-touch-mode .gr-map__close { display: grid; }
.gr-map__body { display: flex; align-items: flex-start; gap: 16px; }
.gr-map__frame {
  position: relative;
  flex: none;
  width: min(calc(100vh - 130px), calc(100vw - 300px));
  aspect-ratio: 1;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid rgba(62, 230, 255, 0.45);
  direction: ltr;
}
.gr-map__cv { width: 100%; height: 100%; display: block; }
.gr-map__labels { position: absolute; inset: 0; pointer-events: none; }
.gr-maplabel {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 2px 8px;
  border-radius: 8px;
  background: rgba(18, 16, 42, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-size: 0.78rem;
  font-weight: 800;
  white-space: nowrap;
}
/* hud.js declutter: a label that would overlap a neighbour moves above or below its point */
.gr-maplabel.is-above { transform: translate(-50%, calc(-100% - 4px)); }
.gr-maplabel.is-below { transform: translate(-50%, 4px); }
.gr-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; min-width: 190px; font-size: 0.86rem; font-weight: 600; }
.gr-legend__i { display: flex; align-items: center; gap: 10px; }
.gr-legend__i small { color: var(--muted); font-size: 0.78rem; }
.gr-legend__sw { display: block; flex: none; width: 18px; height: 18px; box-sizing: border-box; }
.sw-you { background: var(--gold); clip-path: polygon(50% 0, 100% 100%, 50% 76%, 0 100%); }
.sw-zone { border: 2px solid #d9b8ff; border-radius: 50%; }
.sw-next { border: 2px dashed #fff; border-radius: 50%; }
.sw-glitch { background: rgba(150, 70, 255, 0.65); border-radius: 4px; }
.sw-vault { background: var(--cyan); border: 2px solid #120f2b; transform: rotate(45deg) scale(0.72); }
.sw-vault--hack { background: var(--magenta); box-shadow: 0 0 0 3px rgba(255, 79, 216, 0.35); }
.sw-vault--open { background: transparent; border-color: rgba(235, 232, 255, 0.85); }

/* --------------------------------------------------------------- screens -- */
.gr-screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  padding: calc(var(--sat) + 18px) calc(var(--sar) + 18px) calc(var(--sab) + 18px) calc(var(--sal) + 18px);
  overflow: auto;
  pointer-events: auto;
  /* scrolling only: no pinch-zoom (iOS ignores user-scalable=no, and a zoom started here would carry
     into the match, where touch-action: none leaves no way back) and no double-tap zoom */
  touch-action: pan-x pan-y;
  box-sizing: border-box;
}
.gr-screen > * { margin: auto; flex: none; }
.gr-screen--menu { background: linear-gradient(90deg, rgba(13, 11, 34, 0.94) 0%, rgba(13, 11, 34, 0.7) 40%, rgba(13, 11, 34, 0.08) 78%); }
[dir="rtl"] .gr-screen--menu, .gr-hud[dir="rtl"] .gr-screen--menu { background: linear-gradient(270deg, rgba(13, 11, 34, 0.94) 0%, rgba(13, 11, 34, 0.7) 40%, rgba(13, 11, 34, 0.08) 78%); }
.gr-screen--pause { background: rgba(9, 7, 26, 0.6); }
.gr-screen--drop, .gr-screen--end { background: radial-gradient(circle at 50% 28%, rgba(46, 30, 104, 0.94), rgba(9, 7, 24, 0.97) 70%); }

/* buttons */
.gr-btn {
  appearance: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 50px;
  padding: 10px 20px;
  border-radius: var(--radius);
  border: 2px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  font: 800 1.02rem/1.1 var(--font);
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
  transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s;
  touch-action: pan-x pan-y;   /* as .gr-screen: no pinch-zoom */
  text-align: center;
}
.gr-btn:hover { background: rgba(255, 255, 255, 0.15); }
.gr-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5); }
.gr-btn__ico svg { width: 1.25em; height: 1.25em; fill: currentColor; }
[dir="rtl"] .gr-ico--back svg, .gr-hud[dir="rtl"] .gr-ico--back svg { transform: scaleX(-1); }
.gr-btn--primary { background: var(--gold); color: var(--ink); border-color: #ffe48a; box-shadow: 0 4px 0 var(--gold-ledge); }
.gr-btn--primary:hover { background: #ffdd63; }
.gr-btn--primary:active { box-shadow: 0 1px 0 var(--gold-ledge); }
.gr-btn:disabled, .gr-btn:disabled:hover { opacity: 0.42; filter: saturate(0.35); cursor: not-allowed; box-shadow: none; transform: none; }
.gr-btn--primary:focus-visible { outline-color: #fff; }
.gr-btn--xl { min-height: 62px; padding: 12px 30px; border-radius: 16px; font-size: 1.32rem; }
.gr-btn--ghost { background: rgba(18, 16, 42, 0.7); }
.gr-btn--danger { background: rgba(80, 14, 46, 0.55); border-color: rgba(255, 120, 170, 0.75); color: #ffd0e2; box-shadow: 0 4px 0 rgba(60, 6, 30, 0.8); }

/* logo */
.gr-logo { align-self: flex-start; margin: 0; display: flex; flex-direction: column; align-items: flex-start; font-size: clamp(2.6rem, 6.2vw, 4.7rem); font-weight: 900; line-height: 0.92; letter-spacing: 0.02em; }
.gr-logo__w { position: relative; display: block; color: #fff; text-shadow: -3px 0 var(--magenta), 3px 0 var(--cyan), 0 5px 0 rgba(10, 8, 30, 0.95); }
.gr-logo__w + .gr-logo__w { color: var(--gold); margin-top: 0.04em; }
.gr-logo__w::after {
  content: attr(data-text);
  position: absolute;
  left: 0;
  top: 0;
  color: inherit;
  text-shadow: -4px 0 var(--cyan), 4px 0 var(--magenta);
  clip-path: inset(40% 0 38% 0);
  transform: translateX(6px);
  opacity: 0;
  animation: gr-glitch 3.4s steps(1, end) infinite;
}
.gr-logo__w + .gr-logo__w::after { animation-delay: 1.3s; clip-path: inset(18% 0 60% 0); }
.gr-logo::after {
  content: "";
  display: block;
  width: 72%;
  height: 6px;
  margin-top: 0.22em;
  border-radius: 3px;
  background: repeating-linear-gradient(90deg, var(--magenta) 0 18px, var(--cyan) 18px 36px, var(--gold) 36px 54px);
}

/* menu */
.gr-menu {
  position: relative;
  width: 100%;
  max-width: 1240px;
  height: 100%;
  display: grid;
  grid-template-columns: minmax(300px, 430px) 1fr;
  grid-template-rows: 1fr auto auto 1fr;
  grid-template-areas: ". ." "brand ." "act ." "stats stats";
  gap: 22px;
}
.gr-menu__brand { grid-area: brand; display: flex; flex-direction: column; gap: 10px; }
.gr-menu__local { font-size: 1.35rem; font-weight: 800; color: #fff; opacity: 0.92; }
.gr-menu__tag { margin: 0; color: var(--muted); font-size: 1.02rem; font-weight: 600; }
.gr-menu__act { grid-area: act; display: flex; flex-direction: column; gap: 14px; }
.gr-menu__row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gr-menu__fs { position: absolute; top: 0; inset-inline-end: 0; background: rgba(18, 16, 42, 0.7); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5); }
.gr-field { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.gr-field__l { padding: 0; color: var(--muted); font-size: 0.8rem; font-weight: 800; letter-spacing: 0.04em; }
.gr-field__desc { margin: 0; color: var(--muted); font-size: 0.86rem; min-height: 1.2em; }
.gr-stats { grid-area: stats; justify-self: end; align-self: end; min-width: 320px; padding: 12px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.gr-stats__title { margin: 0 0 8px; color: var(--muted); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em; }
.gr-stats__grid { margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.gr-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.gr-stat__ico { color: var(--cyan); }
.gr-stat__ico svg { width: 22px; height: 22px; }
.gr-stat dd { order: 1; margin: 0; }
.gr-stat__l { order: 2; color: var(--muted); font-size: 0.7rem; font-weight: 700; }
.gr-stat__v { font-size: 1.35rem; font-weight: 900; }

/* segmented control (native radios) */
.gr-seg { display: flex; gap: 4px; padding: 4px; border-radius: 15px; background: rgba(5, 4, 18, 0.55); border: 1px solid var(--line); }
.gr-seg__opt { position: relative; flex: 1; display: block; cursor: pointer; }
.gr-seg__opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.gr-seg__t { display: grid; place-items: center; min-height: 48px; padding: 0 12px; border-radius: 11px; color: var(--muted); font-weight: 800; transition: background 0.15s, color 0.15s; }
.gr-seg__opt:hover .gr-seg__t { color: #fff; }
.gr-seg__opt input:checked + .gr-seg__t { background: var(--cyan); color: var(--ink); box-shadow: 0 3px 0 #1d8ea3; }
.gr-seg__opt input:focus-visible + .gr-seg__t { outline: 3px solid var(--gold); outline-offset: 2px; }

/* range */
.gr-range { display: flex; align-items: center; gap: 12px; }
.gr-range__in { --p: 50%; -webkit-appearance: none; appearance: none; flex: 1; height: 48px; margin: 0; background: transparent; cursor: pointer; }
.gr-range__in::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--cyan) var(--p), rgba(255, 255, 255, 0.18) var(--p)); }
[dir="rtl"] .gr-range__in::-webkit-slider-runnable-track { background: linear-gradient(270deg, var(--cyan) var(--p), rgba(255, 255, 255, 0.18) var(--p)); }
.gr-range__in::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.45); }
.gr-range__in::-moz-range-track { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.18); }
.gr-range__in::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--cyan); }
.gr-range__in::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
.gr-range__in:focus-visible { outline: none; }
.gr-range__in:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--gold); }
.gr-range__in:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px var(--gold); }
.gr-range__v { min-width: 4.4ch; font-weight: 800; text-align: end; font-variant-numeric: tabular-nums; }

/* switch (native checkbox) */
.gr-switch { position: relative; display: inline-flex; align-items: center; min-height: 48px; cursor: pointer; justify-self: start; }
.gr-switch__in { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.gr-switch__ui { position: relative; display: block; width: 60px; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, 0.16); border: 2px solid rgba(255, 255, 255, 0.25); box-sizing: border-box; transition: background 0.15s; }
.gr-switch__ui::after {
  content: "";
  position: absolute;
  top: 3px;
  inset-inline-start: 3px;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #fff;
  color: var(--ink);
  font-size: 15px;
  font-weight: 900;
  line-height: 24px;
  text-align: center;
  transition: inset-inline-start 0.15s;
}
.gr-switch__in:checked + .gr-switch__ui { background: var(--cyan); border-color: var(--cyan); }
.gr-switch__in:checked + .gr-switch__ui::after { content: "✓"; inset-inline-start: 29px; }
.gr-switch__in:focus-visible + .gr-switch__ui { outline: 3px solid var(--gold); outline-offset: 3px; }

/* cards (pause, settings, help) */
.gr-card {
  width: min(560px, 100%);
  max-height: 100%;
  overflow: auto;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 22px 24px;
  border-radius: 22px;
  background: rgba(20, 17, 46, 0.95);
  border: 1px solid var(--line);
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
}
.gr-card__title { margin: 0; font-size: 1.65rem; font-weight: 900; }
.gr-card__text { margin: 0; color: var(--muted); font-size: 1rem; }
.gr-card__notice { color: #fff; padding: 10px 12px; border-radius: 12px; background: rgba(70, 14, 62, 0.72); border: 1px solid var(--magenta); font-weight: 600; }
.gr-card__stack { display: flex; flex-direction: column; gap: 12px; }
.gr-card__foot { position: sticky; bottom: -22px; display: flex; justify-content: flex-end; gap: 10px; margin: 0 -24px -22px; padding: 12px 24px 16px; background: linear-gradient(rgba(20, 17, 46, 0), rgba(20, 17, 46, 0.96) 30%); }
.gr-card__foot .gr-btn { min-width: 150px; }
.gr-card--pause { width: min(420px, 100%); }
.gr-card--pause .gr-card__title { text-align: center; }
.gr-card--help { width: min(1020px, 100%); }
.gr-form { display: flex; flex-direction: column; gap: 12px; }
.gr-form__row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(200px, 1.15fr);
  grid-template-areas: "l c" "d c";
  column-gap: 18px;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.gr-form__row:last-child { border-bottom: 0; padding-bottom: 0; }
.gr-form__l { grid-area: l; font-weight: 800; }
.gr-form__desc { grid-area: d; color: var(--muted); font-size: 0.8rem; }
.gr-form__row > :last-child { grid-area: c; }

/* how to play */
.gr-help { display: flex; flex-direction: column; gap: 12px; }
.gr-help__goal { margin: 0; color: #f2efff; font-size: 1rem; line-height: 1.45; }
.gr-help__cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.gr-help__sec { padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07); }
/* on a touch device the touch section comes first (first column, or top when the columns stack on
   phones); keyboard and gamepad follow */
.gr-touch-mode .gr-help__sec.is-touch { order: -1; }
.gr-help__h { margin: 0 0 8px; color: var(--cyan); font-size: 1rem; font-weight: 900; }
.gr-help__dl { margin: 0; display: flex; flex-direction: column; gap: 3px; }
.gr-help__dl .gr-key { height: 20px; min-width: 20px; font-size: 0.72rem; }
.gr-help__row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.gr-help__row dt { font-size: 0.86rem; font-weight: 600; }
.gr-help__row dd { margin: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; }
.gr-help__list { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; line-height: 1.45; }
.gr-help__tips .gr-help__list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
.gr-help__tips { padding: 12px 14px; border-radius: 14px; background: rgba(255, 210, 63, 0.07); border: 1px solid rgba(255, 210, 63, 0.22); }
.gr-help__tips .gr-help__h { color: var(--gold); }

/* drop select */
.gr-drop {
  width: 100%;
  max-width: 1120px;
  display: grid;
  grid-template-columns: auto minmax(230px, 300px);
  grid-template-areas: "head head" "map side";
  gap: 14px 26px;
  align-items: center;
  justify-content: center;
}
.gr-drop__head { grid-area: head; text-align: center; }
.gr-drop__title { margin: 0; font-size: clamp(1.4rem, 3vw, 2.1rem); font-weight: 900; }
.gr-drop__hint { margin: 4px 0 0; color: var(--muted); font-weight: 600; }
.gr-drop__map {
  grid-area: map;
  position: relative;
  width: min(calc(100vh - 150px), calc(100vw - 400px));
  aspect-ratio: 1;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid rgba(62, 230, 255, 0.5);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
  cursor: crosshair;
  direction: ltr;
}
.gr-drop__cv { width: 100%; height: 100%; display: block; }
.gr-poi {
  position: absolute;
  transform: translate(-50%, 6px);
  min-height: 32px;
  padding: 3px 10px;
  border-radius: 10px;
  border: 2px solid rgba(255, 255, 255, 0.45);
  background: rgba(18, 16, 42, 0.84);
  color: #fff;
  font: 800 0.8rem/1.1 var(--font);
  white-space: nowrap;
  cursor: pointer;
}
.gr-poi::before { content: ""; position: absolute; inset: -9px -5px; }
.gr-poi::after { content: ""; position: absolute; left: 50%; top: -9px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(18, 16, 42, 0.85); }
.gr-poi:hover { border-color: #fff; }
.gr-poi[aria-pressed="true"] { background: var(--cyan); border-color: #c8f8ff; color: var(--ink); }
/* hud.js declutter: a label that would overlap a neighbour (or the pin) flips above its dot */
.gr-poi.is-above { transform: translate(-50%, calc(-100% - 6px)); }
.gr-poi.is-above::after { top: auto; bottom: -9px; }
/* A drop-select label may also sit beside its dot (the drop map is direction: ltr, so these are physical). */
.gr-poi.is-right { transform: translate(6px, -50%); }
.gr-poi.is-right::after { left: -12px; top: 50%; margin: -4px 0 0; }
.gr-poi.is-left { transform: translate(calc(-100% - 6px), -50%); }
.gr-poi.is-left::after { left: auto; right: -12px; top: 50%; margin: -4px 0 0; }
/* Phone-sized maps (drop-select or full map under ~420 px: phones, portrait tablets, small windows) use
   smaller label text. The POI tap target stays 50 px tall (32 px min-height + the ::before extension);
   the touch full map is smaller still (0.68rem, touch HUD below). */
@media (max-width: 819px), (max-height: 569px) {
  .gr-poi, .gr-maplabel { font-size: 0.72rem; }
}
.gr-pin { position: absolute; width: 34px; height: 46px; transform: translate(-50%, -100%); pointer-events: none; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.5)); z-index: 2; }
.gr-pin svg { width: 100%; height: 100%; }
.gr-pin.is-drop { animation: gr-pin-drop 0.38s cubic-bezier(0.3, 1.6, 0.5, 1); }
.gr-pin__ring { position: absolute; width: 16%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed rgba(255, 210, 63, 0.95); pointer-events: none; animation: gr-spin 8s linear infinite; }
.gr-drop__warn { position: absolute; transform: translate(-50%, -140%); padding: 4px 10px; border-radius: 8px; background: rgba(70, 14, 62, 0.94); border: 1px solid var(--magenta); font-size: 0.82rem; font-weight: 800; white-space: nowrap; pointer-events: none; z-index: 3; }
.gr-drop__side { grid-area: side; display: flex; flex-direction: column; align-items: stretch; gap: 14px; text-align: center; }
.gr-count { position: relative; display: grid; place-items: center; width: 124px; height: 124px; margin: 0 auto; }
.gr-count > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.gr-count .bg { fill: rgba(18, 16, 42, 0.85); stroke: rgba(255, 255, 255, 0.14); stroke-width: 3; }
.gr-count .fg { fill: none; stroke: var(--gold); stroke-width: 3.6; stroke-dasharray: 100; stroke-dashoffset: 0; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }
.gr-count__v { position: relative; font-size: 2.7rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.gr-drop__where { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--muted); }
.gr-drop__where.is-set { color: #fff; }
.gr-drop__auto { margin: 0; color: var(--muted); font-size: 0.86rem; }

/* end */
.gr-end { position: relative; z-index: 1; width: 100%; max-width: 920px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
.gr-end__hero { display: flex; flex-direction: column; align-items: center; }
.gr-end__title {
  margin: 0;
  color: var(--gold);
  font-size: clamp(2rem, 6.4vw, 4.2rem);
  font-weight: 900;
  line-height: 1.02;
  text-shadow: -3px 0 var(--magenta), 3px 0 var(--cyan), 0 6px 0 rgba(10, 8, 30, 0.95);
  animation: gr-win 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) both;
}
.gr-end__sub { margin: 10px 0 0; color: var(--muted); font-size: 1.12rem; font-weight: 700; }
.gr-end__place { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
.gr-end__n { font-size: clamp(3.4rem, 10vw, 6.2rem); font-weight: 900; line-height: 1; text-shadow: -3px 0 var(--magenta), 3px 0 var(--cyan), 0 6px 0 rgba(10, 8, 30, 0.95); }
.gr-end__of { color: var(--muted); font-size: 1.35rem; font-weight: 800; }
.gr-end__by { margin: 8px 0 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-size: 1.18rem; font-weight: 700; }
.gr-end__killer { color: var(--magenta); font-weight: 900; }
.gr-end__w { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.gr-end__w svg { width: 42px; height: 16px; fill: currentColor; }
.gr-end__best { margin-top: 12px; padding: 4px 16px; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 900; }
.gr-end__stats { margin: 0; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.gr-tile {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas: "i v" "i l";
  align-items: center;
  column-gap: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  text-align: start;
}
.gr-tile__ico { grid-area: i; color: var(--cyan); }
.gr-tile__ico svg { width: 30px; height: 30px; }
.gr-tile dd { grid-area: v; margin: 0; }
.gr-tile__l { grid-area: l; color: var(--muted); font-size: 0.78rem; font-weight: 700; }
.gr-tile__v { font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.gr-end__acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.gr-end--win .gr-tile { border-color: rgba(255, 210, 63, 0.3); }
.gr-confetti { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.gr-confetti i { position: absolute; top: -24px; width: 9px; height: 15px; border-radius: 2px; animation: gr-confetti 3s linear infinite; }

/* -------------------------------------------------------- touch controls -- */
.gr-input { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.gr-touch {
  position: absolute;
  inset: 0;
  display: none;
  pointer-events: auto;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.gr-input.is-touch.is-enabled .gr-touch { display: block; }
.gr-tbtn {
  --s: 56px;
  --x: 100px;
  --y: 100px;
  position: absolute;
  right: calc(var(--sar) + var(--x) - var(--s) / 2);
  bottom: calc(var(--sab) + var(--lift) + var(--y) - var(--s) / 2);
  display: grid;
  place-items: center;
  width: var(--s);
  height: var(--s);
  padding: 0;
  margin: 0;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.55);
  background: rgba(18, 16, 42, 0.55);
  color: #fff;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.06s ease, background 0.1s;
}
.gr-tbtn__ico svg { width: calc(var(--s) * 0.44); height: calc(var(--s) * 0.44); fill: currentColor; }
.gr-tbtn__l {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 2px;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
  text-shadow: 0 1px 2px #000, 0 0 3px #000;
  opacity: 0.92;
  pointer-events: none;
}
.gr-tbtn.is-down { transform: scale(0.92); background: rgba(255, 255, 255, 0.3); }
.gr-tbtn.is-hidden { display: none; }
.gr-tbtn--fire { --s: 92px; --x: 76px; --y: 84px; border: 3px solid var(--magenta); background: rgba(255, 79, 216, 0.3); }
.gr-tbtn--fire .gr-tbtn__l { display: none; }
.gr-tbtn--fire.is-down { background: rgba(255, 79, 216, 0.6); }
.gr-tbtn--aim { --s: 60px; --x: 180px; --y: 138px; }
.gr-tbtn--aim.is-on { background: var(--cyan); border-color: #c8f8ff; color: var(--ink); }
.gr-tbtn--jump { --s: 64px; --x: 66px; --y: 200px; }
.gr-tbtn--reload { --s: 52px; --x: 168px; --y: 232px; }
.gr-tbtn--heal { --s: 52px; --x: 198px; --y: 44px; color: var(--lime); }
.gr-tbtn--heal.is-off { opacity: 0.38; }
.gr-tbtn--ability { --s: 54px; --x: 252px; --y: 96px; color: var(--magenta); border-color: var(--magenta); }
.gr-tbtn--ability.is-cooling { color: rgba(255, 79, 216, 0.5); border-color: rgba(255, 255, 255, 0.35); background: conic-gradient(rgba(6, 5, 20, 0.82) calc(var(--cd, 0) * 360deg), rgba(255, 79, 216, 0.22) 0); }
.gr-tbtn__cd { position: absolute; color: #fff; font-size: 16px; font-weight: 900; text-shadow: 0 1px 2px #000; }
.gr-tbtn--interact {
  --s: 74px;
  --x: 276px;
  --y: 196px;
  grid-template-rows: auto auto;
  align-content: center;
  gap: 1px;
  background: var(--gold);
  border-color: #fff3c4;
  color: var(--ink);
  box-shadow: 0 4px 0 var(--gold-ledge);
  animation: gr-pop 0.25s ease-out;
}
.gr-tbtn--interact .gr-tbtn__ico svg { width: 30px; height: 30px; }
.gr-tbtn--interact .gr-tbtn__l { position: static; transform: none; margin: 0; font-size: 11px; color: var(--ink); text-shadow: none; }
.gr-tbtn--interact.is-down { background: #ffe27a; }
.gr-tbtn--map, .gr-tbtn--pause {
  --s: 48px;
  left: auto;
  right: calc(var(--sar) + var(--edge) + var(--mini) + 8px);
  bottom: auto;
  top: calc(var(--sat) + var(--edge));
  border-radius: 14px;
}
.gr-tbtn--map { top: calc(var(--sat) + var(--edge) + 56px); }
.gr-tbtn--map .gr-tbtn__l, .gr-tbtn--pause .gr-tbtn__l { display: none; }
.gr-input.is-dropping .gr-tbtn:not(.gr-tbtn--map):not(.gr-tbtn--pause) { display: none; }
.gr-joy { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.gr-joy.is-idle { left: calc(var(--sal) + max(92px, 14vw)); top: auto; bottom: calc(var(--sab) + var(--lift) + max(92px, 26vh)); opacity: 0.5; }
.gr-joy__base { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); background: radial-gradient(circle, rgba(18, 16, 42, 0.12) 0 38%, rgba(18, 16, 42, 0.5) 72%); box-sizing: border-box; }
.gr-joy__knob { position: absolute; left: -27px; top: -27px; width: 54px; height: 54px; border-radius: 50%; background: rgba(255, 255, 255, 0.88); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.gr-joy.is-sprint .gr-joy__base { border-color: var(--gold); }
.gr-joy.is-sprint .gr-joy__knob { background: var(--gold); }
.gr-joy__sprint { position: absolute; left: 0; top: -90px; transform: translateX(-50%); display: none; padding: 2px 10px; border-radius: 999px; background: var(--gold); color: var(--ink); font-size: 12px; font-weight: 900; white-space: nowrap; }
.gr-joy.is-sprint .gr-joy__sprint { display: block; }
.gr-lockhint {
  position: absolute;
  left: 50%;
  top: calc(50% - 96px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-weight: 700;
  white-space: nowrap;
  animation: gr-breathe 2.2s ease-in-out infinite;
}
.gr-lockhint__ico svg { width: 20px; height: 20px; fill: currentColor; }

/* hide the in-game crosshair + prompts while menus own the input (pause, outro) */
.gr-root:not(.gr-input-on) .gr-center, .gr-root:not(.gr-input-on) .gr-below { visibility: hidden; }

/* ------------------------------------------------------ touch HUD layout -- */
/* On touch the panels follow the physical controls (joystick left, buttons right), identical in
   Hebrew and English; text inside them still flows with the language. */
.gr-touch-mode .gr-mini { pointer-events: auto; border-radius: 14px; left: auto; right: calc(var(--sar) + var(--edge)); }
.gr-touch-mode .gr-slot { pointer-events: auto; width: 60px; height: 50px; }
.gr-touch-mode .gr-slot__icon svg { width: 44px; height: 17px; }
.gr-touch-mode .gr-slot__key, .gr-touch-mode .gr-items__key, .gr-touch-mode .gr-ability { display: none; }
.gr-touch-mode .gr-slot__mag { font-size: 0.72rem; bottom: 2px; }
.gr-touch-mode .gr-slot__lv { top: 2px; right: 3px; }
.gr-touch-mode .gr-energy { width: 48px; height: 50px; }
.gr-touch-mode .gr-energy__l { display: none; }
.gr-touch-mode .gr-slots { gap: 6px; bottom: calc(var(--sab) + var(--edge)); }
.gr-touch-mode .gr-vitals { width: 200px; padding: 6px 9px; gap: 4px; box-sizing: border-box; top: calc(var(--sat) + var(--edge)); bottom: auto; left: calc(var(--sal) + var(--edge)); right: auto; }
.gr-touch-mode .gr-bar__track { height: 9px; }
.gr-touch-mode .gr-bar--hp .gr-bar__track { height: 12px; }
.gr-touch-mode .gr-bar__num { font-size: 0.86rem; }
.gr-touch-mode .gr-bar__ico svg { width: 14px; height: 14px; }
.gr-touch-mode .gr-gear { top: calc(var(--sat) + var(--edge) + 64px); bottom: auto; left: calc(var(--sal) + var(--edge)); right: auto; }
.gr-touch-mode .gr-items { padding: 4px; gap: 4px; }
.gr-touch-mode .gr-item { flex-direction: row; gap: 3px; width: auto; height: 30px; padding: 0 7px; }
.gr-touch-mode .gr-item .gr-ico svg { width: 16px; height: 16px; }
.gr-touch-mode .gr-item__v { font-size: 0.84rem; }
.gr-touch-mode .gr-chip, .gr-touch-mode .gr-zone { height: 34px; padding: 0 9px; gap: 5px; }
.gr-touch-mode .gr-chip__l { display: none; }
.gr-touch-mode .gr-chip__v, .gr-touch-mode .gr-zone__time { font-size: 1.05rem; }
.gr-touch-mode .gr-feed { top: calc(var(--sat) + var(--edge) + 106px); left: calc(var(--sal) + var(--edge)); right: auto; max-width: 42vw; }
.gr-touch-mode .gr-hud[dir="rtl"] .gr-feed { align-items: flex-end; }
.gr-touch-mode .gr-feed__line { font-size: 0.74rem; padding: 3px 8px; }
.gr-touch-mode .gr-feed__line:nth-last-child(n + 4) { display: none; }
.gr-touch-mode .gr-feed__w svg { width: 26px; height: 10px; }
.gr-touch-mode .gr-topstack { top: calc(var(--sat) + var(--edge) + 42px); }
.gr-touch-mode .gr-alt { width: 84px; padding: 8px 4px; left: auto; right: calc(var(--sar) + var(--edge) + 6px); }
.gr-touch-mode .gr-alt__track { height: 90px; }
.gr-touch-mode .gr-below { top: calc(50% + 34px); gap: 6px; }
.gr-touch-mode .gr-prompt__txt { font-size: 0.86rem; padding-block: 3px; }
.gr-touch-mode .gr-keyring { width: 36px; height: 36px; }
.gr-touch-mode .gr-keyring__cap { width: 28px; height: 28px; }
.gr-touch-mode .gr-keyring__cap svg { width: 20px; height: 20px; }
.gr-touch-mode .gr-channel { min-width: 0; padding: 5px 10px; gap: 8px; }
.gr-touch-mode .gr-channel__ico svg { width: 22px; height: 22px; }
.gr-touch-mode .gr-channel__hint { display: none; }
.gr-touch-mode .gr-callout { padding: 3px 12px; font-size: 0.84rem; }
.gr-touch-mode .gr-banner__t { font-size: clamp(1.3rem, 5.4vmin, 1.9rem); }
.gr-touch-mode .gr-banner__s { margin-top: 4px; font-size: 0.82rem; }
.gr-touch-mode .gr-outside { padding: 5px 14px; }
.gr-touch-mode .gr-outside__t { font-size: 0.95rem; }
.gr-touch-mode .gr-outside__d { font-size: 0.8rem; }
.gr-touch-mode .gr-maplabel { padding: 1px 6px; font-size: 0.68rem; }
.gr-touch-mode .gr-tbtn--map, .gr-touch-mode .gr-tbtn--pause { left: auto; right: calc(var(--sar) + var(--edge) + var(--mini) + 8px); }

/* Touch, landscape. Physical like the controls (same in Hebrew and English). Sizes from the widest down:
   every landscape · ≤ 900 px wide · ≤ 440 px tall (phones) · ≤ 350 px tall (browser bars showing) ·
   ≤ 760 px wide (iPhone SE/8, 360-px Androids). Bottom-based --y offsets use 100% (the visible layer),
   never 100vh, which on iOS ignores the toolbars. */
@media (orientation: landscape) {
  .gr-touch-mode .gr-alt { top: calc(50% + 36px); }
  .gr-touch-mode .gr-slots { left: 46%; }
  /* banner + toasts stay between the vitals panel (left) and PAUSE / MAP (right); long lines wrap */
  .gr-touch-mode .gr-topstack { max-width: calc(100% - 2 * (max(var(--sal), var(--sar)) + 220px)); }
}
/* The full Glitch chip does not fit beside the vitals and PAUSE / MAP (in Hebrew its countdown would sit
   under the vitals): the chip shows only the clock and the countdown. */
@media (orientation: landscape) and (max-width: 900px) {
  .gr-touch-mode .gr-zone__txt { display: none; }
}
/* Phones in landscape. Smaller minimap with MAP beside PAUSE, and the right-thumb cluster packed so no
   button's circle reaches another button or the minimap (RELOAD / MAP / PAUSE, JUMP / minimap) at any
   height down to ~300 px. INTERACT stays above the stack under the crosshair, BARRIER moves in beside
   HEAL, and the stack (prompt · heal channel) is tighter so both fit above the weapon slots from 360 px
   tall. */
@media (orientation: landscape) and (max-height: 440px) {
  .gr-root.gr-touch-mode { --mini: 92px; }
  .gr-touch-mode .gr-tbtn--map { top: calc(var(--sat) + var(--edge)); right: calc(var(--sar) + var(--edge) + var(--mini) + 62px); }
  .gr-tbtn--fire { --s: 84px; --x: 70px; --y: 74px; }
  .gr-tbtn--jump { --s: 56px; --x: 62px; --y: min(176px, calc(100% - var(--sat) - var(--sab) - 146px)); }
  .gr-tbtn--reload { --s: 48px; --x: 150px; --y: min(214px, calc(100% - var(--sat) - var(--sab) - 92px)); }
  .gr-tbtn--aim { --s: 54px; --x: 162px; --y: min(128px, calc(100% - var(--sat) - var(--sab) - 170px)); }
  .gr-tbtn--ability { --x: 236px; --y: 112px; }   /* raised: its label clears HEAL and the slot row */
  .gr-tbtn--interact { --y: max(196px, calc(50% + 9px)); }
  /* drop: the altitude meter hangs under the minimap (the buttons are hidden while dropping) */
  .gr-touch-mode .gr-alt { top: calc(var(--sat) + var(--edge) + var(--mini) + 14px); transform: none; }
  .gr-touch-mode .gr-alt__track { height: 70px; }
  /* centred under the crosshair, but a long prompt (weapon swap) grows leftwards instead of onto
     BARRIER: its right edge stops 8 px before BARRIER's circle (--x 236 + 27 px radius) */
  .gr-touch-mode .gr-below { gap: 4px; transform: translateX(min(-50%, calc(50vw - var(--sar) - 271px - 100%))); }
  .gr-touch-mode .gr-keyring { width: 32px; height: 32px; }

<script type="module">const __m = Object.create(null);

// ============================== src/math.js ==============================
__m["math"] = (() => {
// Glitch Royale — shared math (DOM-free, importable from Node tests).
//
// Conventions (see docs/arena/ARCHITECTURE.md):
//   * Y is up, right-handed, units are meters / seconds / radians.
//   * Heading ("yaw"): 0 faces -Z ("north"), +PI/2 faces +X ("east").
//     Turning right INCREASES yaw. Pitch: positive looks up.
//   * Vectors are plain arrays [x, y, z]; matrices are column-major Float32Array(16)
//     exactly like WebGL / gl-matrix expect.

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

const lerp = (a, b, t) => a + (b - a) * t;

  return a + angleDiff(a, b) * (1 - Math.exp(-rate * dt));

/** Unit vector to the right of heading `yaw`, on the XZ plane. */

/** Unit view direction for a yaw/pitch pair. */

  const c = Math.cos(pitch);

/** Pitch that faces the direction (dx, dy, dz). */
const pitchTo = (dx, dy, dz) => Math.atan2(dy, Math.hypot(dx, dz));

// ---------------------------------------------------------------- vec3 ----
const v3 = {
  make: (x = 0, y = 0, z = 0) => [x, y, z],
  copy: a => [a[0], a[1], a[2]],
  set(o, x, y, z) { o[0] = x; o[1] = y; o[2] = z; return o; },
  add(a, b, o = [0, 0, 0]) { o[0] = a[0] + b[0]; o[1] = a[1] + b[1]; o[2] = a[2] + b[2]; return o; },
  sub(a, b, o = [0, 0, 0]) { o[0] = a[0] - b[0]; o[1] = a[1] - b[1]; o[2] = a[2] - b[2]; return o; },
  scale(a, s, o = [0, 0, 0]) { o[0] = a[0] * s; o[1] = a[1] * s; o[2] = a[2] * s; return o; },
  /** o = a + b * s */
  addScaled(a, b, s, o = [0, 0, 0]) { o[0] = a[0] + b[0] * s; o[1] = a[1] + b[1] * s; o[2] = a[2] + b[2] * s; return o; },
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross(a, b, o = [0, 0, 0]) {
    const x = a[1] * b[2] - a[2] * b[1], y = a[2] * b[0] - a[0] * b[2], z = a[0] * b[1] - a[1] * b[0];

  dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
  dist2(a, b) { const x = a[0] - b[0], y = a[1] - b[1], z = a[2] - b[2]; return x * x + y * y + z * z; },

  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  identity(o) { o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  perspective(o, fovy, aspect, near, far) {

/** Axis-aligned cover wall / fence from (ax, az) to (bx, bz) (one of the deltas must be 0). */
function addWallLine(ctx, ax, az, bx, bz, h, thick, col, kind, capCol) {
  const x0 = Math.min(ax, bx) - (ax === bx ? thick / 2 : 0), x1 = Math.max(ax, bx) + (ax === bx ? thick / 2 : 0);
  const z0 = Math.min(az, bz) - (az === bz ? thick / 2 : 0), z1 = Math.max(az, bz) + (az === bz ? thick / 2 : 0);
  const g = minTerrain(ctx, x0, z0, x1, z1) - 0.3, top = terrainHeight(ctx.T, (x0 + x1) / 2, (z0 + z1) / 2) + h;
  addSolid(ctx, x0, g, z0, x1, top, z1, col, 0, kind || 'wall');
  if (capCol) addPanel(ctx, 2, x0, top + 0.01, z0, x1, top + 0.01, z1, capCol, capCol === C.cyan || capCol === C.magenta ? 0.9 : 0);

    // plank seams on both faces
    const along = ax === bx ? 'z' : 'x', len = along === 'x' ? x1 - x0 : z1 - z0;
    for (let a = 0.35; a < len - 0.1; a += 0.5) {
      if (along === 'x') {
        addPanel(ctx, 5, x0 + a, g + 0.35, z0 - 0.015, x0 + a + 0.05, top - 0.05, z0 - 0.015, shade3(col, 0.75), 0);
        addPanel(ctx, 4, x0 + a, g + 0.35, z1 + 0.015, x0 + a + 0.05, top - 0.05, z1 + 0.015, shade3(col, 0.75), 0);
      } else {
        addPanel(ctx, 1, x0 - 0.015, g + 0.35, z0 + a, x0 - 0.015, top - 0.05, z0 + a + 0.05, shade3(col, 0.75), 0);
        addPanel(ctx, 0, x1 + 0.015, g + 0.35, z0 + a, x1 + 0.015, top - 0.05, z0 + a + 0.05, shade3(col, 0.75), 0);
      }
    }
  }
  occRect(ctx, x0 - 0.6, z0 - 0.6, x1 + 0.6, z1 + 0.6);
  return top;
}
function addLamp(ctx, x, z, col, y) {
  const g = y != null ? y : minTerrain(ctx, x - 0.12, z - 0.12, x + 0.12, z + 0.12) - 0.2, top = (y != null ? y : terrainHeight(ctx.T, x, z)) + 3.3;

  addVis(ctx, x - 0.36, top + 0.42, z - 0.36, x + 0.36, top + 0.52, z + 0.36, C.dark, 0, { cast: false });

}
/** Glowing crystal: stacked boxes (colliders) with high emissive. */
function addCrystal(ctx, x, z, s, col, y) {
  const g = y == null ? minTerrain(ctx, x - 0.5 * s, z - 0.5 * s, x + 0.5 * s, z + 0.5 * s) - 0.3 : y;
  const h1 = 2.6 * s + 0.3, w1 = 0.9 * s;
  addSolid(ctx, x - w1 / 2, g, z - w1 / 2, x + w1 / 2, g + h1, z + w1 / 2, col, 0.85, 'crystal');

  occRect(ctx, x - w1, z - w1, x + w1, z + w1);
}

// =========================================================== POI terrain ==
const QUAY_Z = 14;   // docks: local z of the quay face (local +Z points out to sea)

/** Plateau heights and terrain stamps for every POI (run before any geometry is placed). */
function preparePois(ctx) {
  const T = ctx.T, base = ctx.base;
  for (const p of ctx.pois) {
    let sum = 0, n = 0;
    for (let a = 0; a < 8; a++) for (const rr of [0, 0.45, 0.85]) { sum += base.at(p.x + Math.cos(a * TAU / 8) * p.r * rr, p.z + Math.sin(a * TAU / 8) * p.r * rr); n++; }
    let ph = clamp(sum / n, 2.4, 11.5);
    if (p.type === 'docks') ph = 1.7;
    if (p.type === 'satellite') ph = base.at(p.x, p.z) - 0.6;
    if (p.type === 'quarry') ph = Math.max(ph, 9.5);
    p.h = ph;
    p.rot = p.type === 'docks' ? p.rot : ctx.rng.int(0, 3);
  }
  // All circular plateaus are blended in ONE pass: each lattice vertex moves toward a weighted
  // mix of the plateau heights (weights^8, so inside a plateau core its own height wins exactly)
  // by the strongest influence. Neighbouring blend zones therefore never tilt another core.
  const FLAT = { core: [37, 54], village: [37, 55], servers: [33, 48], quarry: [36, 52], satellite: [15, 28], pines: [20, 40] };
  const plats = ctx.pois.filter(p => FLAT[p.type]).map(p => ({ x: p.x, z: p.z, r0: FLAT[p.type][0], r1: FLAT[p.type][1], h: p.h, k: p.type === 'pines' ? 0.6 : 1 }));
  for (let j = 0; j <= T.n; j++) {
    const z = -WORLD_HALF + j * T.cell;
    for (let i = 0; i <= T.n; i++) {
      const x = -WORLD_HALF + i * T.cell;
      let wMax = 0, num = 0, den = 0;
      for (const q of plats) {
        const dx = x - q.x, dz = z - q.z;
        if (dx * dx + dz * dz >= q.r1 * q.r1) continue;
        const w = q.k * (1 - smoothstep(q.r0, q.r1, Math.sqrt(dx * dx + dz * dz)));
        if (w <= 0) continue;
        const w8 = (w * w) * (w * w) * (w * w) * (w * w);
        if (w > wMax) wMax = w;
        num += w8 * q.h; den += w8;
      }
      if (wMax > 0) { const k = j * T.s + i; T.h[k] += (num / den - T.h[k]) * wMax; }
    }
  }
  for (const p of ctx.pois) {
    const ph = p.h;
    if (p.type === 'pines') planPines(ctx, p);
    if (p.type === 'quarry') {
      // terraced pit: rings at -2.5 / -5 / -7.2 m with steep (still walkable) banks
      applyStamp(T, {
        kind: 'circle', x: p.x, z: p.z, r0: 21, r1: 21.5, mode: 'fn',
        fn: (x, z, h) => {
          const d = Math.hypot(x - p.x, z - p.z);
          const depth = 2.5 * (1 - smoothstep(18.5, 20.5, d)) + 2.5 * (1 - smoothstep(13.0, 15.0, d)) + 2.2 * (1 - smoothstep(7.0, 9.0, d));
          return ph - depth;
        }
      });
    }
    if (p.type === 'docks') {
      const F = makeFrame(p.x, p.z, p.rot), cell = T.cell;
      applyStamp(T, {
        kind: 'circle', x: p.x, z: p.z, r0: 70, r1: 70, mode: 'fn',
        fn: (x, z, h) => {
          const l = F.local(x, z), ax = Math.abs(l[0]), lz = l[1];
          if (lz <= QUAY_Z - cell) {
            const w = 1 - smoothstep(0, 14, Math.hypot(Math.max(ax - 29, 0), Math.max(-31 - lz, 0)));
            return h + (1.7 - h) * w;
          }
          // seaward of the quay: a dredged basin; the quay block hides the one sloped lattice row
          if (ax <= 25) return Math.min(h, -1.9);
          const wl = 1 - smoothstep(25, 33, ax);
          return Math.min(h, h + (-1.9 - h) * wl);
        }
      });
    }
  }
}

/** Up to n spots of the requested levels (in order) from a building. */
function takeSpots(info, levels, n) {
  const out = [];
  for (const lv of levels) for (const s of info.spots) if (s.level === lv && !s.used && out.length < n && !out.includes(s)) out.push(s);
  return out;
}

/** Flattens the ground under a planned building (footprint + one lattice cell) at height h. */
function stampFoot(ctx, foot, h) {
  const m = ctx.T.cell + 0.6;
  const st = { kind: 'rect', x0: foot[0] - m, z0: foot[1] - m, x1: foot[2] + m, z1: foot[3] + m, blend: 5, h, mode: 'set' };
  applyStamp(ctx.T, st);
  ctx.pads.push({ ...st, blend: 0 });
}
/** Re-applies every building / jump-pad core exactly, so later neighbouring blends cannot tilt them. */
function reflattenPads(ctx) {
  for (const st of ctx.pads) applyStamp(ctx.T, st);
}
/** Pixel Pines sits on gently smoothed natural ground; its cabins get their own flat pads. */
function planPines(ctx, p) {
  const F = makeFrame(p.x, p.z, p.rot);
  const defs = [
    { r: [-5, -16, 5, -8], o: { floors: 2, stairs: 'in', doors: [{ side: 'w' }, { side: 'e' }] } },
    { r: [8, 2, 17, 8], o: { floors: 1, stairs: 'out', outSide: 's', doors: [{ side: 'n' }, { side: 'w' }] } },
    { r: [-17, 0, -10, 6], o: { floors: 1, doors: [{ side: 'e' }] } },
    { r: [-4, 14, 2, 20], o: { floors: 1, doors: [{ side: 'n' }] } }
  ];
  const cc = F.pt(0, 0);
  p.clearH = terrainHeight(ctx.T, cc[0], cc[1]);
  applyStamp(ctx.T, { kind: 'circle', x: cc[0], z: cc[1], r0: 5.5, r1: 10, h: p.clearH, mode: 'set' });
  for (const d of defs) {
    const w = F.rect(d.r[0], d.r[1], d.r[2], d.r[3]);
    d.h = terrainHeight(ctx.T, (w[0] + w[2]) / 2, (w[1] + w[3]) / 2);
    stampFoot(ctx, buildingFoot({ x0: w[0], z0: w[1], x1: w[2], z1: w[3], stairs: d.o.stairs }), d.h);
  }
  p.plan = defs;
}
