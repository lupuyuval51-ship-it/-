  res.toHp = Math.min(target.hp, dmg - res.toShield);
  target.hp -= res.toHp;
  if (target.hp <= 1e-6) { target.hp = 0; res.killed = true; }

  if (target.timers) target.timers.hurt = 0.25;
  target.hurtShield = res.toShield > 0 && res.toHp <= 0;
  if (by && by !== target) {
    target.lastHitBy = by.id;
    target.lastHitAt = game.time;
    if (by.stats) {
      by.stats.damage += res.toShield + res.toHp;
      by.stats.hits++;
      if (head) by.stats.heads++;
    }
  }
  game.emit('hit', { target: target.id, by: by ? by.id : null, amount: dmg, toShield: res.toShield, head, pos, killed: res.killed, weapon });
  if (hadShield && target.shield <= 0 && res.toShield > 0) {
    const chest = [target.pos[0], target.pos[1] + 1.15, target.pos[2]];
    game.emit('shieldBreak', { target: target.id, pos: chest, by: by ? by.id : null });
    spawnEffect(game, 'shieldBreak', chest, { follow: target });
  } else if (res.toShield > 0) {
    spawnEffect(game, 'shieldHit', pos);
  } else if (!glitch) {
    const nx = pos[0] - target.pos[0], nz = pos[2] - target.pos[2], l = Math.hypot(nx, nz) || 1;
    spawnEffect(game, 'spark', pos, { color: HP_SPARK, small: true, normal: [nx / l, 0.35, nz / l] });
  }
  if (res.killed) eliminate(game, target, by, weapon || 'zone');
  return res;
}

/** Stops whatever the character was channeling; a vault it was hacking becomes 'ready' again. */
function releaseUse(game, ch) {
  const tm = ch.timers;
  if (!tm) return;
  const v = tm.useTarget;
  if (tm.useKind === 'vault' && v && v.state === 'hacking' && v.hacker === ch.id) {
    v.state = 'ready';
    v.hacker = null;
    v.pausedAt = game.time;
  }
  tm.useKind = null;
  tm.useTarget = null;
  tm.use = 0;
  tm.useTotal = 0;
}

/**
 * De-rezzes `target`: alive=false, placement = aliveCount before the decrement, stats, killedBy,
 * ALL weapons + items + energy dropped as scattered pickups, de-rez effect, 'elim' event.
 */
function eliminate(game, target, by, weapon) {
  if (!target || !target.alive) return;
  const killer = by && typeof by === 'object' ? by : findChar(game, typeof by === 'number' ? by : null);
  const credit = killer && killer !== target ? killer : null;
  const alive = Number.isFinite(game.aliveCount) && game.aliveCount > 0 ? game.aliveCount : countAlive(game);
  const placement = Math.max(1, alive);
  releaseUse(game, target);
  target.alive = false;
  target.hp = 0;
  target.placement = placement;
  target.eliminatedAt = game.time;
  target.killedBy = credit ? credit.id : null;
  target.killedWeapon = weapon || null;
  if (credit && credit.stats) credit.stats.elims++;
  const pos = [target.pos[0], target.pos[1], target.pos[2]];
  dropInventory(game, target, pos);
  spawnEffect(game, 'derez', pos, { colors: [target.color || [1, 1, 1], target.accent || [0.4, 0.9, 1], target.visor || [0.4, 1, 0.9]] });
  game.emit('elim', { victim: target.id, by: credit ? credit.id : null, weapon: weapon || null, pos, placement });
  game.aliveCount = Math.max(0, alive - 1);
}

function dropInventory(game, ch, pos) {
  const inv = ch.inv;
  if (!inv) return;
  const specs = [];
  for (const w of inv.slots) if (w) specs.push({ kind: 'weapon', weapon: w });
  if (inv.energy > 0) specs.push({ kind: 'energy', amount: inv.energy });
  for (const k of ['repair', 'cell', 'mega']) if (inv[k] > 0) specs.push({ kind: k, amount: inv[k] });
  const n = specs.length, a0 = game.rng ? game.rng.next() * TAU : 0;
  for (let i = 0; i < n; i++) {
    const a = a0 + (i / n) * TAU, sp = 1.4 + (game.rng ? game.rng.next() : 0.5) * 1.4;
    spawnPickup(game, specs[i], [pos[0], pos[1] + 0.9, pos[2]], [Math.cos(a) * sp, 4.2, Math.sin(a) * sp]);
  }
  inv.slots = [null, null, null];
  inv.energy = 0; inv.repair = 0; inv.cell = 0; inv.mega = 0;
}

// ----------------------------------------------------------------- pickups ----
/**
 * Spawns a pickup from a loot spec ({kind:'weapon', weapon:{type,level[,mag,uid]}} or {kind, amount}).
 * pickup = { id, kind, weapon?, amount?, pos (resting point = feet level), vel, born, settled }.
 */
function spawnPickup(game, spec, pos, vel) {
  if (!spec || !pos) return null;
  const kind = spec.kind;
  if (kind !== 'weapon' && !ITEMS[kind]) return null;
  const pk = {
    id: game.nextId(), kind, pos: [pos[0], pos[1], pos[2]], vel: vel ? [vel[0], vel[1], vel[2]] : [0, 0, 0],
    born: game.time, settled: false
  };
  if (kind === 'weapon') {
    const w = spec.weapon || {};
    if (w.uid != null && isWeaponType(w.type) && w.mag != null) pk.weapon = w;
    else {
      pk.weapon = makeWeapon(w.type, w.level);
      if (Number.isFinite(w.mag)) pk.weapon.mag = clamp(Math.round(w.mag), 0, magSize(pk.weapon.type, pk.weapon.level));
    }
  } else {
    pk.amount = Math.max(1, Math.round(Number(spec.amount) || 1));
  }
  if (!game.pickups) game.pickups = [];
  game.pickups.push(pk);
  return pk;
}

// --------------------------------------------------------------- hit tests ----
/**
 * Nearest live character (not `ignoreId`) hit by the ray within maxT. dir should be unit length
 * (t is in units of dir). → { ch, t, head } | null
 */
function hitTestCharacters(game, origin, dir, maxT, ignoreId) {
  let best = null, bestT = maxT, bestHead = false;
  const ox = origin[0], oy = origin[1], oz = origin[2], dx = dir[0], dy = dir[1], dz = dir[2];
  const dd = dx * dx + dy * dy + dz * dz || 1;
  for (const ch of game.characters) {
    if (!ch.alive || ch.id === ignoreId) continue;
    const px = ch.pos[0], py = ch.pos[1], pz = ch.pos[2];
    // Quick reject: distance from the ray to the character's centre must be < 1.3 m.
    const cx = px - ox, cy = py + 0.95 - oy, cz = pz - oz;
    const along = (cx * dx + cy * dy + cz * dz) / dd;
    if (along < -1.4 || along > bestT + 1.4) continue;
    const qx = cx - dx * along, qy = cy - dy * along, qz = cz - dz * along;
    if (qx * qx + qy * qy + qz * qz > 1.69) continue;
    const tb = rayCylinderY(origin, dir, px, pz, HITBOX.radius, py, py + HITBOX.top, bestT);
    SCR_C[0] = px; SCR_C[1] = py + HITBOX.headY; SCR_C[2] = pz;
    const th = raySphere(origin, dir, SCR_C, HITBOX.headR, bestT);
    if (th >= 0 && (tb < 0 || th < tb) && th <= bestT) { best = ch; bestT = th; bestHead = true; }
    else if (tb >= 0 && tb <= bestT) { best = ch; bestT = tb; bestHead = false; }
  }
  return best ? { ch: best, t: bestT, head: bestHead } : null;
}

/** Ray vs barrier oriented box (local frame: X = right, Z = back). → { barrier, t, normal } | null */
function hitTestBarriers(game, origin, dir, maxT) {
  let best = null, bestT = maxT;
  const bars = game.barriers;
  if (!bars || !bars.length) return null;
  let nx = 0, ny = 0, nz = 0;
  for (const b of bars) {
    if (!b.alive) continue;
    const c = Math.cos(b.yaw), s = Math.sin(b.yaw);
    const rx = origin[0] - b.pos[0], rz = origin[2] - b.pos[2];
    SCR_O[0] = rx * c + rz * s; SCR_O[1] = origin[1] - b.pos[1]; SCR_O[2] = -rx * s + rz * c;
    SCR_D[0] = dir[0] * c + dir[2] * s; SCR_D[1] = dir[1]; SCR_D[2] = -dir[0] * s + dir[2] * c;
    SCR_MIN[0] = -b.w / 2; SCR_MIN[1] = -BARRIER.skirt; SCR_MIN[2] = -b.d / 2;
    SCR_MAX[0] = b.w / 2; SCR_MAX[1] = b.h; SCR_MAX[2] = b.d / 2;
    const t = rayAabb(SCR_O, SCR_D, SCR_MIN, SCR_MAX, bestT, SCR_N);
    if (t >= 0 && t <= bestT) {
      best = b; bestT = t;
      // local normal → world
      nx = SCR_N[0] * c - SCR_N[2] * s; ny = SCR_N[1]; nz = SCR_N[0] * s + SCR_N[2] * c;
    }
  }
  return best ? { barrier: best, t: bestT, normal: [nx, ny, nz] } : null;
}

// ------------------------------------------------------------- projectiles ----
/** Spawns ONE projectile (one per pellet) flying along unit `dir`. Emits nothing. */
function spawnProjectile(game, owner, weapon, origin, dir, shotId) {
  const type = weapon && WEAPONS[weapon.type] ? weapon.type : 'zapper';
  const def = WEAPONS[type], level = clamp((weapon && weapon.level) | 0, 1, 4) || 1, tier = TIERS[level];
  const l = Math.hypot(dir[0], dir[1], dir[2]) || 1;
  const d = [dir[0] / l, dir[1] / l, dir[2] / l];
  const p = {
    id: game.nextId(), owner: owner ? owner.id : null, by: owner || null, shot: shotId || 0,
    type, level, pos: [origin[0], origin[1], origin[2]], prev: [origin[0], origin[1], origin[2]], origin: [origin[0], origin[1], origin[2]],
    dir: d, vel: [d[0] * def.speed, d[1] * def.speed, d[2] * def.speed], speed: def.speed,
    traveled: 0, range: def.range, damage: def.damage * tier.dmg, head: def.headMul, color: tier.color, alive: true, born: game.time
  };
  game.projectiles.push(p);
  return p;
}

function queueHit(p, ch, t, head) {
  const dmg = damageAt(p.type, p.level, p.traveled, head);
  const x = p.pos[0], y = p.pos[1], z = p.pos[2];
  for (const h of pending) {
    if (h.shot && h.shot === p.shot && h.ch === ch) { h.dmg += dmg; h.head = h.head || head; return; }
  }
  pending.push({ shot: p.shot, ch, by: p.by, type: p.type, dmg, head, pos: [x, y, z] });
  void t;
}

/**
 * Moves projectiles; each step segment-tests the world (raycast), barriers and characters (not
 * the owner) and resolves the nearest hit: damage (merged per shot+target), barrier hp, sparks.
 */
function updateProjectiles(game, dt) {
  const list = game.projectiles;
  if (!list || !list.length) return;
  const world = game.world;
  pending.length = 0;
  for (const p of list) {
    if (!p.alive) continue;
    const step = Math.min(p.speed * dt, p.range - p.traveled);
    p.prev[0] = p.pos[0]; p.prev[1] = p.pos[1]; p.prev[2] = p.pos[2];
    if (!(step > 0)) { killProjectile(game, p); continue; }
    let tHit = step, kind = 0, normal = null, target = null, head = false, barrier = null;
    const wh = world && world.raycast ? world.raycast(p.pos, p.dir, step) : null;
    if (wh && wh.t <= tHit) { tHit = Math.max(0, wh.t); kind = 1; normal = wh.normal; }
    const bh = hitTestBarriers(game, p.pos, p.dir, tHit);
    if (bh) { tHit = bh.t; kind = 2; barrier = bh.barrier; normal = bh.normal; }
    const ch = hitTestCharacters(game, p.pos, p.dir, tHit, p.owner);
    if (ch) { tHit = ch.t; kind = 3; target = ch.ch; head = ch.head; }
    p.pos[0] += p.dir[0] * tHit; p.pos[1] += p.dir[1] * tHit; p.pos[2] += p.dir[2] * tHit;
    p.traveled += tHit;
    if (kind === 3) {
      queueHit(p, target, tHit, head);
      killProjectile(game, p);
    } else if (kind === 2) {
      damageBarrier(game, barrier, damageAt(p.type, p.level, p.traveled, false));
      spawnEffect(game, 'spark', p.pos, { normal, color: p.color, small: p.type === 'scatter' });
      killProjectile(game, p);
    } else if (kind === 1) {
      spawnEffect(game, 'spark', p.pos, { normal: normal || [0, 1, 0], color: p.color, small: p.type === 'scatter' });
      killProjectile(game, p);
    } else if (p.traveled >= p.range - 1e-6) {
      killProjectile(game, p);
    }
  }
  // Apply merged hits after the loop (a pellet volley = one hit event).
  for (const h of pending) {
    if (!h.ch.alive) continue;
    applyDamage(game, h.ch, h.dmg, { by: h.by, weapon: h.type, head: h.head, pos: h.pos });
  }
  pending.length = 0;
  let w = 0;
  for (let i = 0; i < list.length; i++) if (list[i].alive) list[w++] = list[i];
  list.length = w;
}

function killProjectile(game, p) {
  if (!p.alive) return;
  p.alive = false;
  if (p.type === 'rail') spawnEffect(game, 'beam', p.origin, { to: p.pos, color: p.color });
}

/**
 * Energy bolts in the tier colour: a streak with a white-hot core and a soft camera-facing head (so
 * bolts flying away from the camera still read); the rail draws a beam from its muzzle.
 * Optional args: camPos (defaults to game.aim.origin, the player's camera pivot) and fx — when the
 * alpha-blended builder is given, the coloured halo goes there so the hue survives bright
 * backgrounds, and only the core stays additive.
 */
function drawProjectiles(glow, game, camPos, fx) {
  const list = game.projectiles;
  if (!list) return;
  const cam = camPos || (game.aim && game.aim.origin) || null;
  const halo = fx || glow, ha = fx ? 0.7 : 0.9;
  for (const p of list) {
    if (!p.alive) continue;
    const c = p.color, x = p.pos[0], y = p.pos[1], z = p.pos[2];
    if (cam) {
      // Soft round head; smaller right in front of the camera, full size further out.
      const dc = Math.hypot(x - cam[0], y - cam[1], z - cam[2]), k = clamp(dc / 12, 0.3, 1);
      const hs = (p.type === 'rail' ? 0.3 : p.type === 'scatter' ? 0.13 : 0.22) * k;
      billboardBasis(cam, x, y, z, BBP);
      bbHex(halo, BBP, x, y, z, hs, c[0], c[1], c[2], fx ? 0.55 : 0.6, 0);
      bbDiamond(glow, BBP, x, y, z, hs * 0.38, 1, 1, 1, 0.7);
    }
    if (p.type === 'rail') {
      const o = p.origin;
      streak(halo, o[0], o[1], o[2], x, y, z, 0.24, c[0], c[1], c[2], 0.6, 0.35);
      streak(glow, o[0], o[1], o[2], x, y, z, 0.06, 1, 1, 1, 0.95, 0.6);
      continue;
    }
    const scatter = p.type === 'scatter';
    const L = Math.min(p.traveled + 0.15, scatter ? 1.1 : 2.4), d = p.dir;
    const w = scatter ? 0.12 : p.type === 'zapper' ? 0.2 : 0.17;
    streak(halo, x - d[0] * L, y - d[1] * L, z - d[2] * L, x, y, z, w, c[0], c[1], c[2], ha, 0);
    const L2 = L * 0.55;
    streak(glow, x - d[0] * L2, y - d[1] * L2, z - d[2] * L2, x, y, z, w * 0.35, 0.5 + c[0] * 0.5, 0.5 + c[1] * 0.5, 0.5 + c[2] * 0.5, 1, 0);
  }
}

// ---------------------------------------------------------------- barriers ----
/** Raises a Prism Barrier 2 m in front of `owner`, aligned to its yaw. Emits 'barrier'. */
function spawnBarrier(game, owner) {
  const yaw = owner.yaw || 0, fx = Math.sin(yaw), fz = -Math.cos(yaw);
  const cx = owner.pos[0] + fx * BARRIER.ahead, cz = owner.pos[2] + fz * BARRIER.ahead;
  let y = owner.pos[1];
  const world = game.world;
  if (world && typeof world.groundAt === 'function') {
    const g = world.groundAt(cx, cz, owner.pos[1] + 0.6, 0.3);
    if (Number.isFinite(g) && Math.abs(g - owner.pos[1]) < 1.6) y = g;
  }
  const b = {
    id: game.nextId(), owner: owner.id, pos: [cx, y, cz], yaw, w: BARRIER.w, h: BARRIER.h, d: BARRIER.d,
    hp: BARRIER.hp, maxHp: BARRIER.hp, born: game.time, life: BARRIER.life, alive: true, flash: 0
  };
  if (!game.barriers) game.barriers = [];
  game.barriers.push(b);
  game.emit('barrier', { by: owner.id, pos: [cx, y + 1.3, cz] });
  spawnEffect(game, 'barrierUp', b.pos, { yaw, w: b.w, h: b.h });
  return b;
}

/** Damages a barrier; breaks it (effect + 'barrierBreak') at 0 hp. */
function damageBarrier(game, b, amount) {
  if (!b || !b.alive) return;
  b.hp -= Math.max(0, amount || 0);
  b.flash = 1;
  if (b.hp <= 0) breakBarrier(game, b);
}

function breakBarrier(game, b) {
  b.alive = false;
  b.hp = 0;
  spawnEffect(game, 'barrierBreak', b.pos, { yaw: b.yaw, w: b.w, h: b.h });
  game.emit('barrierBreak', { pos: [b.pos[0], b.pos[1] + 1.3, b.pos[2]], owner: b.owner });
}

/** Lifetime / flash timers; expired barriers dissolve quietly (no 'barrierBreak'). */
function updateBarriers(game, dt) {
  const list = game.barriers;
  if (!list || !list.length) return;
  let w = 0;
  for (let i = 0; i < list.length; i++) {
    const b = list[i];
    if (b.alive) {
      b.flash = Math.max(0, b.flash - dt * 5);
      if (game.time - b.born >= b.life) {
        b.alive = false;
        spawnEffect(game, 'barrierBreak', b.pos, { yaw: b.yaw, w: b.w, h: b.h, scale: 0.4 });
      }
    }
    if (b.alive) list[w++] = b;
  }
  list.length = w;
}

/** Pushes a character out of every barrier it overlaps (both sides) and stops velocity into it. */
function pushOutOfBarriers(game, ch) {
  const list = game.barriers;
  if (!list || !list.length) return false;
  let pushed = false;
  for (const b of list) {
    if (!b.alive) continue;
    const dx = ch.pos[0] - b.pos[0], dz = ch.pos[2] - b.pos[2];
    if (dx * dx + dz * dz > 9) continue;
    if (ch.pos[1] >= b.pos[1] + b.h - 0.05 || ch.pos[1] + (ch.height || 1.8) <= b.pos[1] - BARRIER.skirt) continue;
    const c = Math.cos(b.yaw), s = Math.sin(b.yaw);
    const lx = dx * c + dz * s, lz = -dx * s + dz * c;
    const push = pushCircleOutOfRect(lx, lz, ch.radius || 0.42, -b.w / 2, -b.d / 2, b.w / 2, b.d / 2);
    if (!push) continue;
    const wx = push[0] * c - push[1] * s, wz = push[0] * s + push[1] * c;
    ch.pos[0] += wx; ch.pos[2] += wz;
    const l = Math.hypot(wx, wz);
    if (l > 1e-6) {
      const nx = wx / l, nz = wz / l, vn = ch.vel[0] * nx + ch.vel[2] * nz;
      if (vn < 0) { ch.vel[0] -= vn * nx; ch.vel[2] -= vn * nz; }
    }
    pushed = true;
  }
  return pushed;
}

// Barrier drawing: emissive frame (dyn), translucent prism panel (fx), facet lines + cracks (glow).
function bv(mb, b, c, s, lx, ly, lz, nx, nz, col, a) {
  mb.rawVertex(b.pos[0] + lx * c - lz * s, b.pos[1] + ly, b.pos[2] + lx * s + lz * c, nx, 0, nz, col[0], col[1], col[2], a);
}
function bline(mb, b, c, s, x0, y0, x1, y1, z, width, col, a) {
  const ax = b.pos[0] + x0 * c - z * s, az = b.pos[2] + x0 * s + z * c, bx = b.pos[0] + x1 * c - z * s, bz = b.pos[2] + x1 * s + z * c;
  streak(mb, ax, b.pos[1] + y0, az, bx, b.pos[1] + y1, bz, width, col[0], col[1], col[2], a, a);
}

function drawBarriers(dyn, fx, glow, game) {
  const list = game.barriers;
  if (!list) return;
  const time = game.time;
  for (const b of list) {
    if (!b.alive) continue;
    const age = time - b.born, left = b.life - age, hpk = clamp(b.hp / b.maxHp, 0, 1);
    const grow = smoothstep(0, 0.25, age), H = b.h * grow, hw = b.w / 2;
    // Flicker when damaged or about to expire.
    const tick = Math.floor(time * 18);
    const unstable = Math.max(1 - hpk * 1.6, left < 1.6 ? 1 - left / 1.6 : 0);
    const off = unstable > 0 && hash2(tick, b.id, 0x3b) < unstable * 0.55;
    const fade = clamp(left / 0.5, 0, 1);
    const glowK = (off ? 0.25 : 1) * fade, flash = b.flash;
    const c = Math.cos(b.yaw), s = Math.sin(b.yaw), nx = -s, nz = c;
    // Frame (opaque, emissive): posts, top bar, base.
    dyn.push().translate(b.pos[0], b.pos[1], b.pos[2]).rotateYaw(b.yaw);
    const e = 0.35 + 0.6 * glowK;
    dyn.box(-hw, H / 2, 0, 0.14, H, 0.34, BARRIER_COL, e);
    dyn.box(hw, H / 2, 0, 0.14, H, 0.34, BARRIER_COL, e);
    if (grow > 0.2) dyn.box(0, H - 0.06, 0, b.w + 0.14, 0.12, 0.3, BARRIER_EDGE, e);
    dyn.box(0, -0.08, 0, b.w + 0.3, 0.2, 0.46, [0.16, 0.22, 0.34], 0.1);
    dyn.pop();
    if (H < 0.05) continue;
    // Panel: translucent cyan, brighter on hits; slightly thinner as hp drops.
    const pa = (0.2 + 0.22 * flash + 0.12 * hpk) * fade * (off ? 0.45 : 1);
    const col = BARRIER_COL;
    for (const z of [-0.06, 0.06]) {
      bv(fx, b, c, s, -hw, 0, z, nx, nz, col, pa * 1.3); bv(fx, b, c, s, hw, 0, z, nx, nz, col, pa * 1.3); bv(fx, b, c, s, hw, H, z, nx, nz, col, pa * 0.7);
      bv(fx, b, c, s, -hw, 0, z, nx, nz, col, pa * 1.3); bv(fx, b, c, s, hw, H, z, nx, nz, col, pa * 0.7); bv(fx, b, c, s, -hw, H, z, nx, nz, col, pa * 0.7);
    }
    // Prism facets: a zig-zag of light lines across the panel.

  if (ch.phase !== 'ground') { tm.burstLeft = 0; tm.trigger = 0; return; }
  if (pressed) tm.trigger = 0.15;
  // Burst continuation (keeps going after the trigger is released).
  if (tm.burstLeft > 0) {
    tm.burstGap -= dt;
    while (tm.burstLeft > 0 && tm.burstGap <= 0) {
      if (w.mag <= 0) { tm.burstLeft = 0; break; }
      fireShot(game, ch, w, def);
      tm.burstLeft--;
      tm.burstGap += def.burstGap;
    }
  }
  if (inp.fire) {
    tm.hold += dt;
    if (tm.useKind) releaseUse(game, ch);               // firing cancels heals and interactions
    if (w.mag <= 0) {
      if (tm.reload <= 0 && tm.burstLeft <= 0) {
        if (canReload(ch, w)) startReload(game, ch, w);   // auto-reload when firing an empty mag
        else if (pressed || tm.emptyCue <= 0) {
          game.emit('empty', { by: ch.id, pos: [ch.pos[0], ch.pos[1] + 1.2, ch.pos[2]] });
          tm.emptyCue = 0.6;
        }
      }
    } else if (tm.fire <= 0 && tm.burstLeft <= 0 && (def.auto || tm.trigger > 0 || tm.hold >= def.holdRepeat)) {
      if (tm.reload > 0) cancelReload(ch);                // firing interrupts a reload while rounds remain
      pullTrigger(game, ch, w, def);
    }
  } else {
    tm.hold = 0;
    // A quick tap made while the weapon was still cycling fires as soon as it is ready.
    if (tm.trigger > 0 && tm.fire <= 0 && tm.burstLeft <= 0 && w.mag > 0 && tm.reload <= 0 && !tm.useKind) pullTrigger(game, ch, w, def);
  }
}

function pullTrigger(game, ch, w, def) {
  const tm = ch.timers;
  // Carry the sub-frame remainder while the trigger stays held so the fire rate is frame-rate exact.
  const carry = ch.prevFire ? clamp(tm.fire, -0.034, 0) : 0;
  tm.fire = def.interval + carry;
  tm.trigger = 0;
  tm.hold = 0;
  fireShot(game, ch, w, def);
  if (def.burst > 1) { tm.burstLeft = Math.min(def.burst - 1, w.mag); tm.burstGap = def.burstGap; }
}

/** Direction from `o` toward what the character aims at (player: crosshair point, bot: eye ray). */
function aimDirection(game, ch, o, def, out) {
  let tx, ty, tz;
  const a = game.aim;
  if (ch.isPlayer && a && a.point && Number.isFinite(a.point[0] + a.point[1] + a.point[2])) {
    tx = a.point[0]; ty = a.point[1]; tz = a.point[2];
    const dx = tx - o[0], dy = ty - o[1], dz = tz - o[2], L = Math.hypot(dx, dy, dz), ad = a.dir;
    const ahead = !ad || dx * ad[0] + dy * ad[1] + dz * ad[2] > 0.2 * L;
    if (L > 0.75 && ahead) { out[0] = dx / L; out[1] = dy / L; out[2] = dz / L; return out; }
    if (ad) { const l = Math.hypot(ad[0], ad[1], ad[2]) || 1; out[0] = ad[0] / l; out[1] = ad[1] / l; out[2] = ad[2] / l; return out; }
  }
  // Bots: the eye ray picks the point; the bolt leaves the muzzle toward it.
  const e = eyePos(ch, SCR_EYE), d = dirFrom(ch.yaw, ch.pitch);
  let dist = def.range;
  const hit = hitTestCharacters(game, e, d, def.range, ch.id);
  if (hit) dist = hit.t;
  const w = game.world;
  if (w && typeof w.raycast === 'function') { const wh = w.raycast(e, d, dist); if (wh && wh.t < dist) dist = wh.t; }
  dist = Math.max(dist, 2);
  tx = e[0] + d[0] * dist; ty = e[1] + d[1] * dist; tz = e[2] + d[2] * dist;
  const dx = tx - o[0], dy = ty - o[1], dz = tz - o[2], L = Math.hypot(dx, dy, dz) || 1;
  out[0] = dx / L; out[1] = dy / L; out[2] = dz / L;
  return out;
}

/**
 * r2-pointblank: the level sweep (SCR_MO, SCR_MD) reaches the enemy `hc` before any wall or barrier: the
 * bolt starts 5 cm before that hit (on the free part of the sweep) and flies at the enemy's chest.
 */
function pointBlank(hc) {
  const k = Math.max(0, hc.t - 0.05), e = hc.ch.pos, f = SCR_FROM, d = SCR_DIR;
  f[0] = SCR_MO[0] + SCR_MD[0] * k; f[1] = SCR_MO[1]; f[2] = SCR_MO[2] + SCR_MD[2] * k;
  const dx = e[0] - f[0], dy = e[1] + 1.15 - f[1], dz = e[2] - f[2], L = Math.hypot(dx, dy, dz) || 1;
  d[0] = dx / L; d[1] = dy / L; d[2] = dz / L;
}

/**
 * r2-pointblank, the human's case: the shoulder camera turns the body away from an enemy pressed against
 * it, so the barrel passes beside or beyond it. → the enemy under the crosshair when the muzzle `o` cannot
 * aim at the crosshair point (behind the muzzle or within 0.75 m of it: aimDirection's fallback), else null.
 */
function crosshairEnemyAtMuzzle(game, ch, o) {
  const a = game.aim, ad = a && a.dir;
  if (!ad || !a.origin || !a.point || !Number.isFinite(a.dist + a.point[0] + a.point[1] + a.point[2])) return null;
  const dx = a.point[0] - o[0], dy = a.point[1] - o[1], dz = a.point[2] - o[2], L = Math.hypot(dx, dy, dz);
  if (L > 0.75 && dx * ad[0] + dy * ad[1] + dz * ad[2] > 0.2 * L) return null;
  const hc = hitTestCharacters(game, a.origin, ad, a.dist + 0.3, ch.id);
  return hc ? hc.ch : null;
}

function fireShot(game, ch, w, def) {
  if (w.mag <= 0) return;
  w.mag--;
  const rng = game.rng, shotId = game.nextId();
  const o = muzzlePos(ch, SCR_MUZZLE);   // muzzle flash + 'shot' event position
  let from = o, dir = null;              // where the bolt starts; its direction when fixed below
  {
    // a raised barrel (jump + look up under a roof) must not poke up through a slab: a vertical sweep
    // from inside the body to the muzzle height clamps the muzzle below the first ceiling / floor slab
    const by = ch.pos[1] + 1.4, up = o[1] - by;
    if (Math.abs(up) > 0.05) {
      SCR_MO[0] = ch.pos[0]; SCR_MO[1] = by; SCR_MO[2] = ch.pos[2];
      SCR_MD[0] = 0; SCR_MD[1] = up > 0 ? 1 : -1; SCR_MD[2] = 0;
      const t = obstacleT(game, SCR_MO, SCR_MD, Math.abs(up));
      if (t < Math.abs(up)) o[1] = by + SCR_MD[1] * Math.max(0, t - 0.05);
    }
  }
  {
    // the barrel must not poke through a wall / Prism Barrier: start the bolt at the obstacle
    SCR_MO[0] = ch.pos[0]; SCR_MO[1] = o[1]; SCR_MO[2] = ch.pos[2];
    const mx = o[0] - SCR_MO[0], mz = o[2] - SCR_MO[2], ml = Math.hypot(mx, mz);
    if (ml > 1e-3) {
      SCR_MD[0] = mx / ml; SCR_MD[1] = 0; SCR_MD[2] = mz / ml;
      const t = obstacleT(game, SCR_MO, SCR_MD, ml);
      // r2-pointblank: the same sweep crosses an enemy pressed against the shooter (bots and the human)
      const hc = hitTestCharacters(game, SCR_MO, SCR_MD, t, ch.id);
      if (hc && hc.t < t) { pointBlank(hc); from = SCR_FROM; dir = SCR_DIR; }
      else if (t < ml) {
        const k = Math.max(0, t - 0.05); o[0] = SCR_MO[0] + SCR_MD[0] * k; o[2] = SCR_MO[2] + SCR_MD[2] * k;
        // r2-aim: only the barrel is blocked (door jamb, building corner) — the human's bolt leaves the
        // camera pivot along the crosshair ray when the body reaches the pivot; the flash stays at the
        // clamped muzzle. The crosshair ray stops at walls and barriers, so nothing passes through them.
        if (ch.isPlayer && pivotReachable(game, ch)) {
          from = SCR_FROM; from[0] = game.aim.origin[0]; from[1] = game.aim.origin[1]; from[2] = game.aim.origin[2];
        }
      }
    }
  }
  if (!dir && from === o && ch.isPlayer) {
    // r2-pointblank, human: the crosshair is on an enemy the barrel passes beside — sweep the level line
    // from the body axis toward that enemy instead (same rules: only up to the first wall / barrier).
    const e = crosshairEnemyAtMuzzle(game, ch, o);
    const dx = e ? e.pos[0] - ch.pos[0] : 0, dz = e ? e.pos[2] - ch.pos[2] : 0, l = Math.hypot(dx, dz);
    if (l > 1e-3) {
      SCR_MO[0] = ch.pos[0]; SCR_MO[1] = o[1]; SCR_MO[2] = ch.pos[2];
      SCR_MD[0] = dx / l; SCR_MD[1] = 0; SCR_MD[2] = dz / l;
      const t = obstacleT(game, SCR_MO, SCR_MD, l);
      const hc = hitTestCharacters(game, SCR_MO, SCR_MD, t, ch.id);
      if (hc && hc.t < t) { pointBlank(hc); from = SCR_FROM; dir = SCR_DIR; }
    }
  }
  if (!dir) dir = aimDirection(game, ch, from, def, SCR_DIR);
  const moving = Math.hypot(ch.vel[0], ch.vel[2]) > 1;
  let spread = spreadFor(w.type, !!ch.input.aim, moving);
  if (!ch.onGround) spread *= 1.35;
  // Orthonormal basis around dir.
  let ux = -dir[2], uz = dir[0];
  let ul = Math.hypot(ux, uz);
  if (ul < 1e-4) { ux = 1; uz = 0; ul = 1; }
  ux /= ul; uz /= ul;
  const vx = dir[1] * uz, vy = dir[2] * ux - dir[0] * uz, vz = -dir[1] * ux;
  const n = def.pellets, rot = rng.next() * TAU;
  for (let i = 0; i < n; i++) {
    let r, ang;
    if (n > 1) {
      // Scatter pattern: one centre pellet + a jittered ring — consistent, readable spread.
      if (i === 0) { r = 0.15 * rng.next(); ang = rng.next() * TAU; }
      else { r = 0.62 + 0.3 * (rng.next() - 0.5); ang = rot + ((i - 1) / (n - 1)) * TAU + (rng.next() - 0.5) * 0.4; }
    } else {
      r = Math.sqrt(rng.next()); ang = rng.next() * TAU;
    }
    const off = Math.tan(spread * r), ca = Math.cos(ang) * off, sa = Math.sin(ang) * off;
    SCR_PD[0] = dir[0] + ux * ca + vx * sa;
    SCR_PD[1] = dir[1] + vy * sa;
    SCR_PD[2] = dir[2] + uz * ca + vz * sa;
    spawnProjectile(game, ch, w, from, SCR_PD, shotId);
  }
  ch.stats.shots++;
  ch.lastShotAt = game.time;
  ch.anim.recoil = 1;
  ch.anim.fireFlash = 1;
  ch.anim.aim = Math.max(ch.anim.aim, 0.85);
  const pos = [o[0], o[1], o[2]];
  game.emit('shot', { by: ch.id, weapon: w.type, level: w.level, pos });
  spawnEffect(game, 'muzzle', pos, { dir: [dir[0], dir[1], dir[2]], color: tierColor(w.level) });
}

// --------------------------------------------------------------- items ----
/** Which consumable the heal button uses right now (null = nothing useful). */
function bestHealKind(ch) {
  const inv = ch.inv;
  if (ch.shield < ch.maxShield) {
    if (ch.shield <= 50 && inv.mega > 0) return 'mega';
    if (inv.cell > 0) return 'cell';
    if (inv.mega > 0) return 'mega';
  }
  if (ch.hp < ch.maxHp && inv.repair > 0) return 'repair';
  return null;
}

function updateItems(game, ch, dt) {
  const inp = ch.input, tm = ch.timers;
  if (inp.heal && ch.phase === 'ground' && !HEAL_KINDS.includes(tm.useKind)) {
    const kind = bestHealKind(ch);
    if (kind) {
      if (tm.useKind) releaseUse(game, ch);
      cancelReload(ch);
      tm.burstLeft = 0;
      tm.useKind = kind;
      tm.use = tm.useTotal = ITEMS[kind].time;
      tm.useTarget = null;
      game.emit('heal', { by: ch.id, kind, pos: [ch.pos[0], ch.pos[1] + 1.2, ch.pos[2]] });
    }
  }
  if (!HEAL_KINDS.includes(tm.useKind)) return;
  tm.use -= dt;
  if (tm.use > 0) return;
  const kind = tm.useKind, it = ITEMS[kind], inv = ch.inv;
  if (inv[kind] > 0) {
    inv[kind]--;
    if (it.heal) ch.hp = Math.min(ch.maxHp, ch.hp + it.heal);
    if (it.shield) ch.shield = Math.min(ch.maxShield, ch.shield + it.shield);
    game.emit('healed', { by: ch.id, kind, pos: [ch.pos[0], ch.pos[1] + 1.2, ch.pos[2]] });
    spawnEffect(game, 'heal', ch.pos, { color: it.color, follow: ch });
  }
  releaseUse(game, ch);
}

// --------------------------------------------------------- interaction ----
/**
 * Nearest interactable within 2.4 m whose direction is within ~70° of facing (or within 1.2 m
 * regardless): unopened crates, ready vaults (or the vault this character is hacking), weapon
 * pickups. → { kind:'crate'|'vault'|'weapon', target, dist } | null
 */
function findInteractable(game, ch) {
  if (!ch || !ch.alive || ch.phase !== 'ground') return null;
  const world = game.world, px = ch.pos[0], py = ch.pos[1], pz = ch.pos[2];
  const fx = Math.sin(ch.yaw), fz = -Math.cos(ch.yaw), R = INTERACT.range, close = INTERACT.close, cone = INTERACT.coneCos;
  let best = null, bestD = Infinity, kind = null, ty = 0;
  const test = (tx, tyy, tz, dyMax) => {
    const dx = tx - px, dz = tz - pz, d2 = dx * dx + dz * dz;
    if (d2 > R * R || d2 >= bestD * bestD || Math.abs(tyy - py) > dyMax) return -1;
    const d = Math.sqrt(d2);
    if (d > close && dx * fx + dz * fz < cone * d) return -1;
    return d;
  };
  for (const pk of game.pickups) {
    if (pk.kind !== 'weapon' || pk.taken) continue;
    if (pk.droppedBy === ch.id && game.time - pk.born < 0.4) continue;   // no instant swap-back loops
    const d = test(pk.pos[0], pk.pos[1], pk.pos[2], 1.7);   // r2-vault: reaches a 1.6 m vault top (floors are ≥ 3.2 m apart)
    if (d >= 0) { best = pk; bestD = d; kind = 'weapon'; ty = pk.pos[1] + 0.5; }
  }
  if (world) {
    for (const c of world.crates || []) {
      if (c.opened) continue;
      const d = test(c.x, c.y, c.z, 1.7);
      if (d >= 0) { best = c; bestD = d; kind = 'crate'; ty = c.y + 0.5; }
    }
    for (const v of world.vaults || []) {
      if (!(v.state === 'ready' || (v.state === 'hacking' && v.hacker === ch.id))) continue;
      const d = test(v.x, v.y, v.z, 1.8);
      if (d >= 0) { best = v; bestD = d; kind = 'vault'; ty = v.y + 1.0; }
    }
  }
  if (!best) return null;
  if (world && typeof world.lineOfSight === 'function' && bestD > 0.95) {
    // Aim at the near face of crates / vaults (their own collider must not block the check).
    const bx = kind === 'weapon' ? best.pos[0] : best.x, bz = kind === 'weapon' ? best.pos[2] : best.z;
    const dx = px - bx, dz = pz - bz, l = Math.hypot(dx, dz) || 1, inset = kind === 'weapon' ? 0 : 0.68;
    SCR_A[0] = px; SCR_A[1] = py + (ch.eyeHeight || 1.55); SCR_A[2] = pz;
    SCR_B[0] = bx + (dx / l) * inset; SCR_B[1] = ty; SCR_B[2] = bz + (dz / l) * inset;
    if (!world.lineOfSight(SCR_A, SCR_B)) return null;
  }
  return { kind, target: best, dist: bestD };
}

function updateInteraction(game, ch, dt) {
  const inp = ch.input, tm = ch.timers;
  const pressed = !!inp.interact && !ch.prevInteract;
  if (ch.phase !== 'ground') return;
  if (tm.useKind === 'crate' || tm.useKind === 'vault') {
    const t = tm.useTarget;
    let ok = !!inp.interact && !!t;
    if (ok) {
      const dx = t.x - ch.pos[0], dz = t.z - ch.pos[2];
      ok = dx * dx + dz * dz <= INTERACT.cancel * INTERACT.cancel && Math.abs(t.y - ch.pos[1]) < 2;
      if (ok && tm.useKind === 'crate') ok = !t.opened;
      if (ok && tm.useKind === 'vault') ok = t.state === 'hacking' && t.hacker === ch.id;
    }
    if (!ok) { releaseUse(game, ch); return; }
    tm.use -= dt;
    if (tm.useKind === 'vault') t.progress = clamp(1 - tm.use / tm.useTotal, 0, 1);
    if (tm.use <= 0) {
      const kind = tm.useKind;
      tm.useKind = null; tm.useTarget = null; tm.use = 0; tm.useTotal = 0;
      if (kind === 'crate') openCrate(game, ch, t); else openVault(game, ch, t);
    }
    return;
  }
  if (!inp.interact) return;
  if (HEAL_KINDS.includes(tm.useKind)) {
    if (!pressed) return;
    releaseUse(game, ch);                                    // a new interact press cancels a heal
  }
  const it = findInteractable(game, ch);
  if (!it) return;
  if (it.kind === 'weapon') {
    if (pressed) pickupWeapon(game, ch, it.target);         // instant, on the press frame only
    return;
  }
  cancelReload(ch);
  tm.burstLeft = 0;
  if (it.kind === 'crate') {
    tm.useKind = 'crate'; tm.useTarget = it.target; tm.use = tm.useTotal = INTERACT.crate;
  } else {
    const v = it.target;
    // Partial progress survives a short interruption, decaying slowly.
    const kept = v.progress > 0 && v.pausedAt != null ? Math.max(0, v.progress - (game.time - v.pausedAt) * INTERACT.vaultDecay) : 0;
    v.state = 'hacking'; v.hacker = ch.id; v.progress = kept; v.pausedAt = null;
    tm.useKind = 'vault'; tm.useTarget = v; tm.useTotal = INTERACT.vault; tm.use = INTERACT.vault * (1 - kept);
    game.emit('vaultStart', { by: ch.id, vaultId: v.id, pos: [v.x, v.y + 1, v.z] });
  }
}

function popLoot(game, specs, x, y, z, towardX, towardZ, speed, up) {
  const n = specs.length, base = Math.atan2(towardZ, towardX);
  for (let i = 0; i < n; i++) {
    const a = base + (n > 1 ? (i / (n - 1) - 0.5) * 1.9 : 0) + (game.rng.next() - 0.5) * 0.25;
    const sp = speed * (0.75 + 0.5 * game.rng.next());
    spawnPickup(game, specs[i], [x, y, z], [Math.cos(a) * sp, up * (0.85 + 0.3 * game.rng.next()), Math.sin(a) * sp]);
  }
}

function openCrate(game, ch, crate) {
  crate.opened = true;
  crate.openedAt = game.time;
  crate.openedBy = ch.id;
  const pos = [crate.x, crate.y + 1.0, crate.z];
  game.emit('crate', { by: ch.id, pos });
  spawnEffect(game, 'crateOpen', pos);
  popLoot(game, rollLoot(game.rng, 'crate'), crate.x, crate.y + 1.05, crate.z, ch.pos[0] - crate.x, ch.pos[2] - crate.z, 2.4, 4.8);
}

function openVault(game, ch, v) {
  v.state = 'open';
  v.progress = 1;
  v.hacker = null;
  v.openedAt = game.time;
  v.openedBy = ch.id;
  const pos = [v.x, v.y + 1.7, v.z];
  game.emit('vault', { by: ch.id, vaultId: v.id, pos });
  spawnEffect(game, 'vaultOpen', pos);
  // r2-vault: the loot pops from the vault's edge on the opener's side (0.6 m out), so it does not
  // fall back onto the 1.6 m top; from the centre when a wall is that close (never inside one). From the
  // edge the sideways pop is 2.2 m/s instead of 3.0, so the loot still lands about 2.2 m from the vault.
  const tx = ch.pos[0] - v.x, tz = ch.pos[2] - v.z, base = Math.atan2(tz, tx);
  SCR_A[0] = v.x; SCR_A[1] = v.y + 1.7; SCR_A[2] = v.z;
  SCR_B[0] = Math.cos(base); SCR_B[1] = 0; SCR_B[2] = Math.sin(base);
  const blocked = game.world && game.world.raycast ? game.world.raycast(SCR_A, SCR_B, 0.6 + 0.12) : null;
  const edge = blocked ? 0 : 0.6;
  popLoot(game, rollLoot(game.rng, 'vault'), v.x + SCR_B[0] * edge, v.y + 1.7, v.z + SCR_B[2] * edge, tx, tz, edge ? 2.2 : 3.0, 5.6);
}

function removePickup(game, pk) {
  const i = game.pickups.indexOf(pk);
  if (i >= 0) game.pickups.splice(i, 1);
  pk.taken = true;
}

/** Takes a weapon pickup: empty slot first, otherwise swaps with (and drops) the active weapon. */
function pickupWeapon(game, ch, pk) {
  if (!pk || pk.kind !== 'weapon' || pk.taken) return false;
  const inv = ch.inv;
  let slot = inv.slots[inv.active] == null ? inv.active : inv.slots.indexOf(null);
  if (slot < 0) {
    slot = inv.active;
    const old = inv.slots[slot];
    if (old) {
      const fx = Math.sin(ch.yaw), fz = -Math.cos(ch.yaw);
      const dropped = spawnPickup(game, { kind: 'weapon', weapon: old }, [ch.pos[0] + fx * 0.3, ch.pos[1] + 0.9, ch.pos[2] + fz * 0.3], [fx * 1.6, 3.2, fz * 1.6]);
      if (dropped) dropped.droppedBy = ch.id;
    }
  }
  inv.slots[slot] = pk.weapon;
  removePickup(game, pk);
  if (slot !== inv.active) switchTo(game, ch, slot);
  else { cancelReload(ch); ch.timers.burstLeft = 0; ch.anim.swap = 1; ch.timers.fire = Math.max(ch.timers.fire, 0.2); }
  game.emit('pickup', { by: ch.id, kind: 'weapon', weapon: pk.weapon.type, level: pk.weapon.level, pos: [pk.pos[0], pk.pos[1] + 0.5, pk.pos[2]] });
  return true;
}

/** Energy / Patch Kits / cells within 1.3 m are collected automatically up to the carry caps. */
function autoCollect(game, ch) {
  if (ch.phase !== 'ground') return;
  const list = game.pickups, inv = ch.inv, R2 = COLLECT_RADIUS * COLLECT_RADIUS;
  for (let i = list.length - 1; i >= 0; i--) {
    const pk = list[i];
    if (pk.kind === 'weapon' || game.time - pk.born < 0.3) continue;
    const dx = pk.pos[0] - ch.pos[0], dz = pk.pos[2] - ch.pos[2];
    if (dx * dx + dz * dz > R2 || Math.abs(pk.pos[1] - ch.pos[1]) > 1.7) continue;   // r2-vault: as findInteractable
    const room = ITEMS[pk.kind].max - inv[pk.kind];
    if (room <= 0) continue;
    const take = Math.min(room, pk.amount);
    inv[pk.kind] += take;
    pk.amount -= take;

function updateAnim(game, ch, dt) {
  const an = ch.anim, tm = ch.timers, v = ch.vel, inp = ch.input;
  const hs = hypot2(v[0], v[2]);

  if (ch.onGround) an.walk = (an.walk + dt * hs * (TAU / 3.1)) % (TAU * 64);
  an.recoil = Math.max(0, an.recoil - dt * 6.5);
  an.fireFlash = Math.max(0, an.fireFlash - dt * 12);
  an.land = Math.max(0, an.land - dt * 3.2);
  an.swap = Math.max(0, an.swap - dt * 4);

  const aimPose = ch.phase === 'ground' && (inp.aim || inp.fire || game.time - ch.lastShotAt < 0.55) && !healing && !reaching && tm.reload <= 0;
  an.aim = damp(an.aim, aimPose ? 1 : 0, 16, dt);
  an.channel = damp(an.channel, healing ? 1 : 0, 12, dt);
  an.reach = damp(an.reach, reaching ? 1 : 0, 12, dt);

}

// ------------------------------------------------------------- pickups ----
/** Pop / bounce / settle physics for pickups (the hover and bob are purely visual). */
function updatePickups(game, dt) {
  const list = game.pickups;
  if (!list || !list.length || !(dt > 0)) return;
  const world = game.world, water = world && Number.isFinite(world.waterLevel) ? world.waterLevel : -Infinity;
  for (const pk of list) {
    if (pk.settled) continue;
    const p = pk.pos, v = pk.vel;
    v[1] -= 20 * dt;
    const hx = v[0] * dt, hz = v[2] * dt, hl = hypot2(hx, hz);
    if (hl > 1e-5 && world && typeof world.raycast === 'function') {
      SCR_A[0] = p[0]; SCR_A[1] = p[1] + 0.3; SCR_A[2] = p[2];
      SCR_B[0] = hx / hl; SCR_B[1] = 0; SCR_B[2] = hz / hl;
      let hit = world.raycast(SCR_A, SCR_B, hl + 0.25);
      if (!hit) {
        // r2-pickray: a low ray too, for walls / stair blocks whose top lies between p and p + 0.3 (a roof
        // parapet, a step) — above the 0.05 m the floor test steps up. Box colliders only: slopes are the
        // floor test's job, as before.
        SCR_A[1] = p[1] + 0.05;
        const low = world.raycast(SCR_A, SCR_B, hl + 0.25);
        if (low && low.collider) hit = low;
      }
      if (hit) { v[0] *= -0.3; v[2] *= -0.3; } else { p[0] += hx; p[2] += hz; }
    } else { p[0] += hx; p[2] += hz; }
    const yBefore = p[1];
    p[1] += v[1] * dt;
    let floor = 0;
    if (world && typeof world.groundAt === 'function') floor = world.groundAt(p[0], p[2], Math.max(p[1], yBefore), 0.12, 0.05);
    else if (world && typeof world.heightAt === 'function') floor = world.heightAt(p[0], p[2]);
    if (!Number.isFinite(floor)) floor = 0;
    const rest = Math.max(floor, water);
    if (p[1] <= rest) {
      p[1] = rest;
      if (v[1] < -2.5) { v[1] *= -0.28; v[0] *= 0.55; v[2] *= 0.55; }
      else { v[0] = v[1] = v[2] = 0; pk.settled = true; }
    }
    if (!Number.isFinite(p[0] + p[1] + p[2])) { p[0] = 0; p[2] = 0; p[1] = rest || 0; v[0] = v[1] = v[2] = 0; pk.settled = true; }
  }
}

/** Height of the blob shadow under (x, y, z): the support below (radius 0.25) or the water surface. */
function shadowGround(game, x, y, z) {
  const w = game.world;

}

  const g = shadowGround(game, x, y, z);

  softDisc(fx, x, g + 0.05, z, r * (0.6 + 0.4 * k), 10, SHADOW[0], SHADOW[1], SHADOW[2], a * k, 0);
  return g;
}

/**
 * Draws one character: robot rig + held weapon + blob shadow (+ data-chute while dropping).
 * LOD: full < 26 m, simplified < 90 m, 3-box silhouette < 220 m, nothing beyond (distances are
 * divided by the player's sight zoom). Optional 6th arg `glow`: when given, chute edges and the
 * backpack halo go to the additive pass; otherwise they are drawn translucent into `fx`.
 * Optional 7th arg `view` (renderer.frustum planes, perf-2): a bot wholly outside it is skipped;
 * the human player is never culled.
 */
function drawCharacter(dyn, fx, ch, game, camPos, glow, view) {
  if (!ch || !ch.alive) return;
  const d = camDist(camPos, ch.pos) / lodZoom(game);
  if (d > LOD.far) return;
  if (view && !ch.isPlayer && ch !== game.player && !characterVisible(view, ch, game, !(d > LOD.mid))) return;
  const g = glow || fx;
  if (d > LOD.mid) { drawFarCharacter(dyn, fx, ch); return; }
  const ground = shadowFor(fx, game, ch.pos[0], ch.pos[1], ch.pos[2], 0.55, 0.42);
  if (ch.isPlayer && ch.phase === 'drop') drawLandingMarker(fx, g, ch, ground, game.time);
  if (d > LOD.near) { drawMidCharacter(dyn, fx, g, ch, game); return; }
  drawFullCharacter(dyn, fx, g, ch, game, camPos, !!glow);
}

  softDisc(fx, ch.pos[0], ground + 0.08, ch.pos[2], 0.35, 8, v[0], v[1], v[2], 0.6 * k, 0.1);
  streak(g, ch.pos[0], ground + 0.1, ch.pos[2], ch.pos[0], ch.pos[1], ch.pos[2], 0.05, v[0], v[1], v[2], 0, 0.35);

function drawFarCharacter(dyn, fx, ch) {

  dyn.push().translate(x, y, z).rotateYaw(ch.yaw);
  dyn.box(0, 0.45, 0, 0.42, 0.9, 0.26, DARK, 0);
  dyn.box(0, 1.18, 0, 0.62, 0.56, 0.4, ch.color, 0.15);
  dyn.box(0, 1.64, 0, 0.46, 0.38, 0.42, ch.visor, 0.55);
  dyn.pop();
  if (ch.anim.chute > 0.05) canopySimple(fx, null, ch, ch.anim.chute);
}

function canopySimple(fx, g, ch, k) {
  const x = ch.pos[0], y = ch.pos[1], z = ch.pos[2], R = 1.6 * k, v = ch.visor;
  for (let i = 0; i < 6; i++) {
    const a0 = (i / 6) * TAU + 0.52, a1 = ((i + 1) / 6) * TAU + 0.52;
    const x0 = x + Math.cos(a0) * R, z0 = z + Math.sin(a0) * R, x1 = x + Math.cos(a1) * R, z1 = z + Math.sin(a1) * R;
    fx.rawVertex(x, y + 3.8, z, 0, 1, 0, v[0], v[1], v[2], 0.5 * k);
    fx.rawVertex(x0, y + 3.1, z0, 0, 1, 0, v[0], v[1], v[2], 0.3 * k);
    fx.rawVertex(x1, y + 3.1, z1, 0, 1, 0, v[0], v[1], v[2], 0.3 * k);
    if (g) streak(g, x0, y + 3.1, z0, x1, y + 3.1, z1, 0.07, v[0], v[1], v[2], 0.8 * k, 0.8 * k);
  }
}

function drawMidCharacter(dyn, fx, g, ch, game) {
  const an = ch.anim, s = clamp(an.speed / MOVE.sprint, 0, 1), ph = an.walk;
  const sw = Math.sin(ph) * 0.6 * s * (1 - an.chute);
  const hurt = clamp(ch.timers.hurt / 0.25, 0, 1);
  mixInto(C_BODY, ch.color, ch.hurtShield ? CELL_CYAN : WHITE, hurt * 0.7);
  dyn.push().translate(ch.pos[0], ch.pos[1], ch.pos[2]).rotateYaw(ch.yaw);
  // legs + arms as single beams
  for (const side of [-1, 1]) {
    set3(J.tmp, side * 0.15, 0.86, 0);
    set3(J.tgL, side * 0.15, 0.08, -Math.sin(sw * side) * 0.4);
    dyn.beam(J.tmp, J.tgL, 0.2, DARK, 0);
    set3(J.tmp, side * 0.38, 1.38, 0);
    const up = an.chute > 0.5;
    set3(J.tgR, side * (up ? 0.5 : 0.42), up ? 2.0 : 0.88, up ? 0.04 : Math.sin(sw * side) * 0.3);
    dyn.beam(J.tmp, J.tgR, 0.16, C_BODY, hurt * 0.6);
  }
  dyn.box(0, 1.2, 0, 0.62, 0.56, 0.4, C_BODY, hurt * 0.6);
  dyn.box(0, 1.2, 0.29, 0.44, 0.44, 0.2, ch.accent, 0.1);
  dyn.box(0, 1.64, 0, 0.46, 0.38, 0.42, C_BODY, hurt * 0.6);
  dyn.box(0, 1.66, -0.205, 0.38, 0.12, 0.06, ch.visor, 1);
  const w = activeWeapon(ch);
  if (w && an.chute < 0.5 && an.channel < 0.5 && an.reach < 0.5) {
    dyn.push().translate(0.25, 1.05 + 0.3 * an.aim, -0.33).rotateX(lerp(HIP_PITCH, ch.pitch, an.aim));
    drawWeaponModel(dyn, w.type, w.level, 1);
    dyn.pop();
  }
  dyn.pop();
  if (an.chute > 0.05) canopySimple(fx, g, ch, an.chute);
}

function drawFullCharacter(dyn, fx, g, ch, game, camPos, realGlow) {
  const an = ch.anim, tm = ch.timers, time = game.time;
  const dropK = an.chute, aimK = an.aim, chanK = an.channel, reachK = an.reach, landK = an.land;
  const groundPhase = ch.phase === 'ground';
  const s = clamp(an.speed / MOVE.sprint, 0, 1) * (ch.onGround ? 1 : 0.25) * (1 - dropK);
  const airK = groundPhase && !ch.onGround ? clamp(tm.airTime * 6, 0, 1) * (1 - dropK) : 0;
  const reloadK = tm.reload > 0 && tm.reloadTotal > 0 ? Math.sin(Math.PI * clamp(1 - tm.reload / tm.reloadTotal, 0, 1)) : 0;
  const w = activeWeapon(ch), M = MODEL[w ? w.type : 'zapper'] || MODEL.zapper;
  const showWeapon = !!w && dropK < 0.5 && chanK < 0.5 && reachK < 0.5;
  const ph = an.walk, sinP = Math.sin(ph), cosP = Math.cos(ph);
  const breath = Math.sin(time * 2.1 + ch.id) * 0.008;
  const bob = (Math.abs(sinP) * 0.07 - 0.035) * s * (1 - 0.6 * aimK) - landK * 0.16 + breath;
  const lean = (0.17 * s * (1 - aimK) + 0.08 * landK) * (1 - dropK);
  // Colours with the hurt flash (white for hp, cyan for shield hits).
  const hurt = clamp(tm.hurt / 0.25, 0, 1), flash = ch.hurtShield ? CELL_CYAN : WHITE, em = hurt * 0.7;
  mixInto(C_BODY, ch.color, flash, hurt * 0.75);
  mixInto(C_HEAD, mixInto(C_TMP, ch.color, WHITE, 0.12), flash, hurt * 0.75);
  mixInto(C_LIMB, scaleInto(C_TMP, ch.color, 0.72), flash, hurt * 0.6);
  mixInto(C_ACC, ch.accent, flash, hurt * 0.5);
  scaleInto(C_ACCD, ch.accent, 0.72);
  const visor = ch.visor;

  dyn.push().translate(ch.pos[0], ch.pos[1], ch.pos[2]).rotateYaw(ch.yaw);
  if (dropK > 0.01) {
    // Hang under the canopy: swing like a pendulum against the steering direction.
    const roll = (-an.leanX * 0.38 + Math.sin(time * 1.7 + ch.id) * 0.05) * dropK, pitch = an.leanZ * 0.3 * dropK;
    dyn.translate(0, 3.0, 0).rotateZ(roll).rotateX(-pitch).translate(0, -3.0, 0);
  }

  // ---- legs (root frame) ----
  for (let i = 0; i < 2; i++) {
    const side = i === 0 ? -1 : 1, hip = i === 0 ? J.hipL : J.hipR, knee = i === 0 ? J.kneeL : J.kneeR, ank = i === 0 ? J.ankL : J.ankR;
    const sw = i === 0 ? sinP : -sinP, swing = i === 0 ? cosP : -cosP;
    let th = sw * 0.72 * s, kn = -(0.06 + Math.max(0, swing) * 1.05) * s - 0.05 * (1 - s);
    // airborne tuck, data-chute dangle, landing crouch
    th = lerp(th, i === 0 ? 0.55 : -0.2, airK); kn = lerp(kn, i === 0 ? -1.1 : -0.55, airK);
    const dangle = Math.sin(time * 1.9 + ch.id + i * 1.3) * 0.12;
    th = lerp(th, (i === 0 ? 0.28 : 0.06) + dangle, dropK); kn = lerp(kn, i === 0 ? -0.55 : -0.3, dropK);
    th += 0.55 * landK; kn -= 1.1 * landK;
    set3(hip, side * 0.15, 0.86 + bob, 0);
    legFK(hip, th, kn, knee, ank);
    dyn.beam(hip, knee, 0.2, C_BODY, em);
    dyn.beam(knee, ank, 0.17, C_LIMB, em * 0.8);
    dyn.box(knee[0], knee[1], knee[2], 0.21, 0.12, 0.2, JOINT, 0);
    dyn.push().translate(ank[0], ank[1], ank[2]).rotateX(-(th + kn) * 0.55);
    dyn.box(0, -0.045, -0.06, 0.2, 0.11, 0.32, DARK, 0);
    dyn.pop();
  }

  // ---- torso frame ----
  dyn.push().translate(0, PELVIS_Y + bob, 0).rotateX(-lean);
  dyn.box(0, 0, 0, 0.44, 0.2, 0.3, DARK, 0);
  dyn.box(0, 0.3, 0, 0.62, 0.48, 0.4, C_BODY, em);
  dyn.box(0, 0.3, 0, 0.56, 0.54, 0.34, C_BODY, em);
  dyn.box(0, 0.38, -0.205, 0.16, 0.12, 0.03, visor, 0.75);
  for (const side of [-1, 1]) dyn.box(side * 0.39, 0.53, 0, 0.21, 0.13, 0.32, C_ACC, em * 0.5);
  // backpack with a pulsing core
  const pulse = 0.65 + 0.35 * Math.sin(time * 3.2 + ch.id);
  dyn.box(0, 0.3, 0.29, 0.44, 0.46, 0.2, C_ACCD, em * 0.4);
  dyn.box(0, 0.3, 0.395, 0.17, 0.22, 0.04, visor, pulse);
  if (realGlow && camPos) {
    const cw = dyn.apply(0, 0.3, 0.42);
    billboardBasis(camPos, cw[0], cw[1], cw[2], BBX);
    bbHex(g, BBX, cw[0], cw[1], cw[2], 0.2, visor[0], visor[1], visor[2], 0.4 * pulse, 0);
  }
  // head
  dyn.push().translate(0, 0.56, 0).rotateX(ch.pitch * 0.45 * (1 - dropK) - 0.15 * dropK);
  dyn.box(0, 0.16, 0, 0.46, 0.36, 0.42, C_HEAD, em);
  dyn.box(0, 0.16, 0, 0.4, 0.42, 0.36, C_HEAD, em);
  dyn.box(0, 0.18, -0.205, 0.38, 0.12, 0.06, visor, 1);
  const wob = Math.sin(time * 9 + ch.id) * 0.02 * (s + airK + dropK * 2);
  set3(J.tmp, 0.12, 0.36, 0.05); set3(J.item, 0.15 + wob, 0.58, 0.09 - wob);
  dyn.beam(J.tmp, J.item, 0.035, DARK, 0);
  dyn.box(J.item[0], J.item[1], J.item[2], 0.085, 0.085, 0.085, visor, 1);
  dyn.pop();

  // ---- weapon frame (torso space) ----
  const pitch = ch.pitch;
  const hipG = J.tgL, aimG = J.tgR;
  set3(hipG, HIP_GRIP[0], HIP_GRIP[1] - PELVIS_Y + sinP * 0.02 * s, HIP_GRIP[2]);
  rotXAdd(set3(J.tmp, AIM_PIVOT[0], AIM_PIVOT[1] - PELVIS_Y, AIM_PIVOT[2]), pitch, AIM_OFF[1], AIM_OFF[2], aimG);
  const G = J.grip;
  G[0] = lerp(hipG[0], aimG[0], aimK); G[1] = lerp(hipG[1], aimG[1], aimK); G[2] = lerp(hipG[2], aimG[2], aimK);
  let wp = lerp(HIP_PITCH, pitch, aimK) + an.recoil * 0.18 * M.kick - reloadK * 0.42 - an.swap * 0.9;
  G[1] -= an.swap * 0.22 + reloadK * 0.06;
  // recoil pushes the weapon back along the barrel
  const kb = an.recoil * 0.06 * M.kick;
  G[1] -= Math.sin(wp) * kb; G[2] += Math.cos(wp) * kb;
  const F = J.fore;
  rotXAdd(G, wp, -0.02, -M.fore, F);

  // ---- arms (IK to hand targets) ----
  for (let i = 0; i < 2; i++) {
    const side = i === 0 ? -1 : 1, S = i === 0 ? J.shL : J.shR, E = i === 0 ? J.elL : J.elR, H = i === 0 ? J.haL : J.haR;
    set3(S, side * 0.37, 0.48, 0);
    // free swinging hand
    const swingZ = (i === 0 ? sinP : -sinP) * 0.3 * s;
    let hx = side * 0.42, hy = -0.08 + Math.abs(swingZ) * 0.15, hz = swingZ;
    // airborne: arms out
    hx = lerp(hx, side * 0.52, airK); hy = lerp(hy, 0.2, airK); hz = lerp(hz, -0.05, airK);
    // weapon hands
    if (showWeapon) {
      if (i === 1) { hx = G[0]; hy = G[1]; hz = G[2]; }
      else if (!M.oneHand) { hx = F[0] - 0.02; hy = F[1] - 0.03; hz = F[2]; }
      else if (aimK > 0.01) { hx = lerp(hx, G[0] - 0.07, aimK); hy = lerp(hy, G[1] - 0.05, aimK); hz = lerp(hz, G[2] + 0.01, aimK); }
      if (i === 0 && reloadK > 0.01) {
        rotXAdd(G, wp, -0.14 - Math.sin(time * 13) * 0.03, -0.12, J.tmp);
        hx = lerp(hx, J.tmp[0] - 0.03, reloadK); hy = lerp(hy, J.tmp[1], reloadK); hz = lerp(hz, J.tmp[2], reloadK);
      }
    }
    // item channel: both hands hold the item in front of the chest
    if (chanK > 0.01) { hx = lerp(hx, side * 0.11, chanK); hy = lerp(hy, 0.22 + Math.sin(time * 4) * 0.02, chanK); hz = lerp(hz, -0.36, chanK); }
    // hacking / opening: busy typing hands
    if (reachK > 0.01) {
      const typ = Math.sin(time * 16 + i * 2.1) * 0.03;
      hx = lerp(hx, side * 0.17, reachK); hy = lerp(hy, 0.33 + typ, reachK); hz = lerp(hz, -0.52, reachK);
    }
    // data-chute: hands up holding the lines
    if (dropK > 0.01) { hx = lerp(hx, side * 0.5, dropK); hy = lerp(hy, 1.1, dropK); hz = lerp(hz, 0.04, dropK); }
    set3(J.tmp, hx, hy, hz);
    const poleZ = 0.75 - 0.65 * Math.max(aimK, chanK, reachK);
    solveArm(S, J.tmp, L_UPPER, L_FORE, side * 0.65, -0.55, poleZ, E, H);
    dyn.beam(S, E, 0.15, C_BODY, em);
    dyn.beam(E, H, 0.14, C_LIMB, em * 0.8);
    dyn.box(E[0], E[1], E[2], 0.15, 0.13, 0.15, JOINT, 0);
    dyn.box(H[0], H[1], H[2], 0.13, 0.12, 0.13, DARK, 0);
    const hw = dyn.apply(H[0], H[1], H[2]), out = HAND_W[i];
    out[0] = hw[0]; out[1] = hw[1]; out[2] = hw[2];
  }

  // ---- held weapon ----
  if (showWeapon) {
    dyn.push().translate(G[0], G[1], G[2]).rotateX(wp).rotateZ(reloadK * 0.4);
    drawWeaponModel(dyn, w.type, w.level, 0);
    dyn.pop();
  }
  // ---- item in hands while channeling ----
  if (chanK > 0.3 && HEAL_KINDS.includes(tm.useKind)) {
    const prog = tm.useTotal > 0 ? 1 - tm.use / tm.useTotal : 0;
    dyn.push().translate(0, 0.27, -0.42).rotateY(Math.sin(time * 3) * 0.3).scale(0.8 + 0.08 * Math.sin(prog * 20));
    drawItemModel(dyn, tm.useKind, 0);
    dyn.pop();
  }
  dyn.pop(); // torso
  dyn.pop(); // root

  if (dropK > 0.02) drawChute(fx, g, ch, time, dropK, camPos);
}

/** Hexagonal translucent data-chute canopy with glowing edges, ribs, lines and running data bits. */
function drawChute(fx, g, ch, time, k, camPos) {
  const an = ch.anim, e = smoothstep(0, 1, k);
  const roll = (-an.leanX * 0.38 + Math.sin(time * 1.7 + ch.id) * 0.05) * k, pitch = an.leanZ * 0.3 * k;
  fx.push().translate(ch.pos[0], ch.pos[1], ch.pos[2]).rotateYaw(ch.yaw).translate(0, 3.0, 0).rotateZ(roll).rotateX(-pitch).translate(0, -3.0, 0);
  const R = 1.65 * (0.35 + 0.65 * e), v = ch.visor, a = ch.accent;
  const breathe = 1 + Math.sin(time * 2.4 + ch.id) * 0.03;
  const apex = fx.apply(0, 3.85, 0), rim = [], skirt = [], mid = [];
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * TAU + Math.PI / 6, c = Math.cos(ang), s = Math.sin(ang);
    rim.push(fx.apply(c * R * breathe, 3.12, s * R * breathe));
    skirt.push(fx.apply(c * R * 1.05, 2.88, s * R * 1.05));
    mid.push(fx.apply(c * R * 0.55, 3.6, s * R * 0.55));
  }
  fx.pop();
  const al = e;
  for (let i = 0; i < 6; i++) {
    const j = (i + 1) % 6, A = rim[i], B = rim[j], col = i & 1 ? mixInto(C_TMP, v, a, 0.3) : a;
    fx.rawVertex(apex[0], apex[1], apex[2], 0, 1, 0, col[0], col[1], col[2], 0.5 * al);
    fx.rawVertex(A[0], A[1], A[2], 0, 1, 0, col[0], col[1], col[2], 0.3 * al);
    fx.rawVertex(B[0], B[1], B[2], 0, 1, 0, col[0], col[1], col[2], 0.3 * al);
    const S0 = skirt[i], S1 = skirt[j];
    fx.rawVertex(A[0], A[1], A[2], 0, 1, 0, col[0], col[1], col[2], 0.22 * al);
    fx.rawVertex(B[0], B[1], B[2], 0, 1, 0, col[0], col[1], col[2], 0.22 * al);
    fx.rawVertex(S1[0], S1[1], S1[2], 0, 1, 0, col[0], col[1], col[2], 0.06 * al);
    fx.rawVertex(A[0], A[1], A[2], 0, 1, 0, col[0], col[1], col[2], 0.22 * al);
    fx.rawVertex(S1[0], S1[1], S1[2], 0, 1, 0, col[0], col[1], col[2], 0.06 * al);
    fx.rawVertex(S0[0], S0[1], S0[2], 0, 1, 0, col[0], col[1], col[2], 0.06 * al);
    // glowing edges (tinted alpha layer + additive core) + ribs + inner hex
    streak(fx, A[0], A[1], A[2], B[0], B[1], B[2], 0.11, a[0], a[1], a[2], 0.85 * al, 0.85 * al);
    streak(g, A[0], A[1], A[2], B[0], B[1], B[2], 0.05, v[0], v[1], v[2], 0.9 * al, 0.9 * al);
    streak(g, apex[0], apex[1], apex[2], A[0], A[1], A[2], 0.045, v[0], v[1], v[2], 0.4 * al, 0.6 * al);
    const M0 = mid[i], M1 = mid[j];
    streak(g, M0[0], M0[1], M0[2], M1[0], M1[1], M1[2], 0.035, a[0], a[1], a[2], 0.45 * al, 0.45 * al);
  }
  // suspension lines to the hands
  for (let i = 0; i < 4; i++) {
    const rp = rim[[2, 3, 5, 0][i]], h = HAND_W[i < 2 ? 0 : 1];
    streak(g, h[0], h[1], h[2], rp[0], rp[1], rp[2], 0.02, v[0], v[1], v[2], 0.35 * al, 0.5 * al);
  }
  // data bits running up the ribs
  if (camPos) {
    billboardBasis(camPos, apex[0], apex[1], apex[2], BBX);
    for (let i = 0; i < 3; i++) {
      const f = (time * 0.7 + i / 3 + ch.id * 0.13) % 1, A = rim[(i * 2 + (ch.id & 1)) % 6];
      const x = A[0] + (apex[0] - A[0]) * f, y = A[1] + (apex[1] - A[1]) * f, z = A[2] + (apex[2] - A[2]) * f;
      bbQuad(g, BBX, x, y, z, 0.07, 0.07, 1, 1, 1, 0.9 * al * Math.sin(f * Math.PI));
    }
  }
}

// -------------------------------------------------------------- pickups ----
/**
 * Floating, spinning, bobbing pickups with a tier / item coloured glow ring and a blob shadow.
 * Optional `view` (renderer.frustum planes, perf-2): skip pickups wholly outside it (else behind()).
 */
function drawPickups(dyn, glow, fx, game, camPos, view) {
  const list = game.pickups;
  if (!list || !list.length) return;
  if (!view) setupView(game, camPos);
  const zoom = lodZoom(game), time = game.time;
  for (const pk of list) {
    const p = pk.pos, d = camDist(camPos, p) / zoom;
    if (d > 125) continue;
    const isW = pk.kind === 'weapon', lv = isW ? pk.weapon.level : 1;
    // Model, rings, shadow and glow fit 1.2 m about pos + 0.45 m; with the LV3+ light pillar (up to
    // pos + 3.6 m) 2.15 m about pos + 1.75 m.
    if (view ? !(isW && lv >= 3 ? sphereVisible(view, p[0], p[1] + 1.75, p[2], 2.15) : sphereVisible(view, p[0], p[1] + 0.45, p[2], 1.2))
      : behind(p[0], p[2], 1)) continue;
    const col = isW ? tierColor(lv) : ITEM_RING[pk.kind] || WHITE;
    if (d > 70) {
      if (isW && lv >= 3) lightPillar(fx, glow, p, col, 3.6, 0.3);
      continue;
    }
    const bob = pk.settled ? Math.sin(time * 2.3 + pk.id * 1.7) * 0.07 : 0;
    const y = p[1] + (pk.settled ? 0.5 : 0.25) + bob, spin = time * 1.5 + pk.id;
    const pulse = 0.75 + 0.25 * Math.sin(time * 3 + pk.id);
    if (d > 26) {
      dyn.push().translate(p[0], y, p[2]).rotateY(spin);
      if (isW) drawWeaponModel(dyn, pk.weapon.type, lv, 1); else drawItemModel(dyn, pk.kind, 1);
      dyn.pop();
      flatRing(fx, p[0], p[1] + 0.045, p[2], 0.42, 0.58, 8, col[0], col[1], col[2], 0.55 + 0.25 * pulse, 0.55 + 0.25 * pulse);
      if (isW && lv >= 3) lightPillar(fx, glow, p, col, 3.6, 0.22);
      continue;
    }
    softDisc(fx, p[0], p[1] + 0.04, p[2], 0.36, 10, SHADOW[0], SHADOW[1], SHADOW[2], 0.32, 0);
    dyn.push().translate(p[0], y, p[2]).rotateY(spin);
    if (isW) {
      dyn.push().scale(1.3).translate(0, -0.03, -((MODEL[pk.weapon.type] || MODEL.zapper).mid));
      drawWeaponModel(dyn, pk.weapon.type, lv, 0);
      dyn.pop();
    } else {
      dyn.push().scale(1.2);
      drawItemModel(dyn, pk.kind, 0);
      dyn.pop();
    }
    dyn.pop();
    // Tier colour twice: alpha-blended (keeps magenta magenta on bright grass) + additive glow on top.
    flatRing(fx, p[0], p[1] + 0.045, p[2], 0.4, 0.58, 14, col[0], col[1], col[2], 0.7, 0.7);
    flatRing(glow, p[0], p[1] + 0.05, p[2], 0.45, 0.53, 14, col[0], col[1], col[2], 0.7 * pulse, 0.7 * pulse);
    softDisc(glow, p[0], p[1] + 0.045, p[2], 0.62, 10, col[0], col[1], col[2], 0.12 * pulse, 0);
    if (isW && lv >= 3) lightPillar(fx, glow, p, col, 3.2, lv === 4 ? 0.22 : 0.16);
  }
}

/** Vertical loot beam: tinted alpha layer (true colour on any background) + thin additive core. */
function lightPillar(fx, glow, p, col, h, w) {
  streak(fx, p[0], p[1] + 0.1, p[2], p[0], p[1] + h, p[2], w, col[0], col[1], col[2], 0, 0.5);
  streak(glow, p[0], p[1] + 0.1, p[2], p[0], p[1] + h * 0.8, p[2], w * 0.35, col[0], col[1], col[2], 0, 0.6);
}

// ----------------------------------------------------------- world props ----
/**
 * Supply Cubes, Data Vaults and jump pads (all state dependent, drawn every frame).
 * Optional `view` (renderer.frustum planes, perf-2): skip props wholly outside it (else behind()).

/**

// =============================================================== update ====

/** Rate-limited, damped turning toward (yaw, pitch). */

// ------------------------------------------------------------ route follow ----
/** Advances along the route; returns the waypoint to steer to (or null when at the goal). */

/**

      b.interactAt = -1;

// ------------------------------------------------------------ steering ----
/** Knee ray (+ head ray) classification: none / low (jump it) / tall (go around). */

/** Whisker steering toward (tx, tz): detours along walls, jumps low obstacles, avoids water and the Glitch. */

  b.ringI = (k + 1) % 3;

  if (b.stuck === 1) { b.wantJump = true; b.detour = -b.detour || (b.rng.chance(0.5) ? 1 : -1); b.detourAt = now; }

// ------------------------------------------------------------- fighting ----
/** Fight movement: keep the weapon's preferred range, strafe, dodge; returns [tx, tz, speed]. */
function fightMove(game, ch, b, T, m, vis) {
  const now = game.time, D = b.diff, rng = b.rng;
  const px = ch.pos[0], pz = ch.pos[2];
  const ex = vis ? T.pos[0] : m.x, ez = vis ? T.pos[2] : m.z;
  let ux = ex - px, uz = ez - pz;

  let fwd = 0;

  const pushy = b.persona.aggro > 0.62 || (T.hp + T.shield) < (ch.hp + ch.shield) * 0.7 || d < 14;
  if (d > pref * 1.35) fwd = pushy ? 1 : 0.12;

  else fwd = (d - pref) / pref * 0.8;

/** Humanlike aim at T: lead, a wandering error that shrinks while tracking, rate-limited turning. */

  // ---------------------------------------------------------------- world --
  function setWorld(world) {
    S.world = world || null;
    S.half = (world && world.half) || 180;
    S.pois = (world && world.pois) || [];
    S.map = buildMapImage(world);

  /** 512² stylised copy of world.minimap (crisp pixels + a faint data grid). */
  function buildMapImage(world) {
    const mm = world && world.minimap;
    if (!mm || !mm.pixels || !mm.size) return null;
    try {
      const src = document.createElement('canvas');
      src.width = src.height = mm.size;
      const sctx = src.getContext('2d');
      const data = mm.pixels instanceof Uint8ClampedArray ? mm.pixels : new Uint8ClampedArray(mm.pixels);
      sctx.putImageData(new ImageData(data, mm.size, mm.size), 0, 0);
      const p = data;
      S.ocean = `rgb(${p[0]},${p[1]},${p[2]})`;
      const N = 512, out = document.createElement('canvas');
      out.width = out.height = N;
      const c = out.getContext('2d');
      c.imageSmoothingEnabled = false;
      c.drawImage(src, 0, 0, N, N);
      // data grid every 30 m
      const step = (30 / (2 * S.half)) * N;
      c.strokeStyle = 'rgba(62,230,255,0.13)';
      c.lineWidth = 1;
      c.beginPath();
      for (let x = N / 2 % step; x < N; x += step) { c.moveTo(Math.round(x) + 0.5, 0); c.lineTo(Math.round(x) + 0.5, N); }
      for (let y = N / 2 % step; y < N; y += step) { c.moveTo(0, Math.round(y) + 0.5); c.lineTo(N, Math.round(y) + 0.5); }
      c.stroke();
      return out;
    } catch (err) {
      console.warn('hud: minimap image failed', err);
      return null;
    }
  }

  // -------------------------------------------------------------- minimap --
  function sizeMinimap() {
    const css = mini.clientWidth || (touch ? 110 : 150);
    const dpr = Math.min(2, window.devicePixelRatio || 1), px = Math.round(css * dpr);
    if (miniCv.width !== px) { miniCv.width = px; miniCv.height = px; }
  }
  const toCanvas = (x, z, cx, cz, s, W, H) => [W / 2 + (x - cx) * s, H / 2 + (z - cz) * s];

  function drawZoneLayer(ctx, s, W, H, cx, cz, snap, scale) {
    const z = snap.zone;
    if (!z || !z.center) return;
    const [zx, zy] = toCanvas(z.center[0], z.center[1], cx, cz, s, W, H);
    const zr = Math.max(0, z.radius * s);
    ctx.save();
    ctx.fillStyle = 'rgba(150, 70, 255, 0.36)';
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(zx, zy, zr, 0, TAU);
    ctx.fill('evenodd');
    ctx.lineWidth = 2.2 * scale;
    ctx.strokeStyle = '#d9b8ff';
    ctx.beginPath(); ctx.arc(zx, zy, zr, 0, TAU); ctx.stroke();
    if (z.target && z.target.center && z.state !== 'final') {
      const [tx, ty] = toCanvas(z.target.center[0], z.target.center[1], cx, cz, s, W, H);
      ctx.setLineDash([6 * scale, 5 * scale]);
      ctx.lineWidth = 1.8 * scale;
      ctx.strokeStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(tx, ty, Math.max(1.5 * scale, z.target.radius * s), 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    // guide line from the player to the safe zone while outside it
    if (z.outside && snap.player) {
      const [px, py] = toCanvas(snap.player.x, snap.player.z, cx, cz, s, W, H);
      const dx = zx - px, dy = zy - py, d = Math.hypot(dx, dy) || 1;
      const reach = Math.max(0, d - zr);
      ctx.setLineDash([4 * scale, 4 * scale]);
      ctx.lineWidth = 2 * scale;
      ctx.strokeStyle = '#7CFF6B';
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + (dx / d) * reach, py + (dy / d) * reach); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
  function drawVaults(ctx, s, W, H, cx, cz, vaults, scale, t0) {
    if (!vaults) return;
    for (const v of vaults) {
      const [x, y] = toCanvas(v.x, v.z, cx, cz, s, W, H);
      if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
      const r = 5.2 * scale;
      ctx.beginPath();
      ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath();
      ctx.lineWidth = 1.6 * scale;
      if (v.state === 'open') {
        ctx.strokeStyle = 'rgba(235,232,255,0.75)'; ctx.stroke();
      } else {
        ctx.fillStyle = v.state === 'hacking' ? '#ff4fd8' : '#3ee6ff';
        ctx.strokeStyle = '#120f2b';
        ctx.fill(); ctx.stroke();
        if (v.state === 'hacking') {
          const k = (t0 / 700) % 1;
          ctx.strokeStyle = `rgba(255,79,216,${1 - k})`;
          ctx.beginPath(); ctx.arc(x, y, r + k * 7 * scale, 0, TAU); ctx.stroke();
        }
      }
    }
  }
  function drawPlayer(ctx, x, y, yaw, scale, cone) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(yaw || 0);
    if (cone) {
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, cone);
      g.addColorStop(0, 'rgba(255,255,255,0.32)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, cone, -Math.PI / 2 - 0.62, -Math.PI / 2 + 0.62); ctx.closePath(); ctx.fill();
    }
    const r = 7 * scale;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.25); ctx.lineTo(r * 0.85, r * 0.85); ctx.lineTo(0, r * 0.4); ctx.lineTo(-r * 0.85, r * 0.85); ctx.closePath();
    ctx.fillStyle = '#ffd23f';
    ctx.strokeStyle = '#120f2b';
    ctx.lineWidth = 2 * scale;
    ctx.lineJoin = 'round';
    ctx.stroke(); ctx.fill();
    ctx.restore();
  }
  function drawMinimap(snap) {
    const W = miniCv.width, H = miniCv.height, ctx = miniCtx;
    if (!W || !ctx) return;
    const p = snap.player || { x: 0, z: 0, yaw: 0 };
    const s = W / MINI_VIEW, scale = W / 150;
    ctx.fillStyle = S.ocean;
    ctx.fillRect(0, 0, W, H);

    }

  // ------------------------------------------------------- label declutter --
  // POI labels sit at their map point with a fixed text size, so on phone-sized maps neighbours
  // overlap. Once laid out, every label is measured at each anchor (default and the style.css
  // alternatives .is-above / .is-below, and beside the dot: .is-right / .is-left), then a small exact
  // search (7 labels × 3-4 anchors) picks the combination with the least label-over-label area plus
  // area outside the map box or under the drop pin. Each moved label costs a token 1 px², so labels
  // that fit stay where they are (an anchor style.css does not define measures as the default and is
  // skipped). Drop-select labels are buttons whose tap target reaches `tap` px further ([x, y]:
  // the .gr-poi::before inset): among layouts with the same visible overlap, the one whose grown tap
  // areas overlap least wins (a tie-break: it never buys a tap area with a visible overlap).
  const LABELS = { poi: ['.gr-poi', ['is-above', 'is-right', 'is-left'], [5, 9]], map: ['.gr-maplabel', ['is-above', 'is-below'], null] };
  const declutterQueue = new Map();
  let declutterRaf = 0;
  function declutterSoon(box, kind) {
    declutterQueue.set(box, kind);
    if (declutterRaf || typeof requestAnimationFrame !== 'function') return;
    declutterRaf = requestAnimationFrame(() => {
      declutterRaf = 0;
      for (const [b, k] of declutterQueue) declutter(b, LABELS[k][0], LABELS[k][1], LABELS[k][2]);
      declutterQueue.clear();
    });
  }
  function declutter(box, sel, alts, tap) {
    if (!box.isConnected) return;
    const bb = box.getBoundingClientRect();
    if (!bb.width) return;                     // hidden (map closed): runs again when it opens
    const els = [...box.querySelectorAll(sel)], opts = [null, ...alts];
    const rects = els.map(e => opts.map(c => {
      for (const a of alts) e.classList.remove(a);
      if (c) e.classList.add(c);
      return e.getBoundingClientRect();
    }));
    const cross = (r, q) => {
      const w = Math.min(r.right, q.right) - Math.max(r.left, q.left), hh = Math.min(r.bottom, q.bottom) - Math.max(r.top, q.top);
      return w > 1 && hh > 1 ? w * hh : 0;
    };
    // The drop pin is an obstacle too: it stands above its point, where an .is-above label would sit.
    // Use its final spot (left/top = the point, tip at the bottom centre): it may still be mid-drop.
    const pins = [...box.querySelectorAll('.gr-pin')].filter(p => !p.hidden).map(p => {
      const x = bb.left + (parseFloat(p.style.left) / 100) * bb.width, y = bb.top + (parseFloat(p.style.top) / 100) * bb.height;
      return { left: x - p.offsetWidth / 2, right: x + p.offsetWidth / 2, top: y - p.offsetHeight, bottom: y };
    });
    // Visible areas weigh VIS each; with a tap extension the overlap of the grown boxes is added at
    // weight 1, so it only decides between layouts that look equally good.
    const VIS = tap ? 1e6 : 1;
    const taps = tap ? rects.map(rs => rs.map(r => ({ left: r.left - tap[0], right: r.right + tap[0], top: r.top - tap[1], bottom: r.bottom + tap[1] }))) : null;
    const pair = (i, o, j, oj) => VIS * cross(rects[i][o], rects[j][oj]) + (taps ? cross(taps[i][o], taps[j][oj]) : 0);
    const own = rects.map(rs => rs.map((r, o) => VIS * (r.width * r.height - cross(r, bb) + pins.reduce((a, q) => a + cross(r, q), 0)) + (o ? 1 : 0)));
    const same = (r, q) => r.left === q.left && r.top === q.top && r.right === q.right && r.bottom === q.bottom;
    const skip = rects.map(rs => rs.map((r, o) => o > 0 && same(r, rs[0])));
    // branch and bound over the anchors, default first; the visit budget keeps any label count bounded
    let pick = els.map(() => 0), best = Infinity, budget = 50000;
    const cur = pick.slice();
    const walk = (i, acc) => {
      if (acc >= best || budget-- <= 0) return;
      if (i === els.length) { best = acc; pick = cur.slice(); return; }
      for (let o = 0; o < opts.length; o++) {
        if (skip[i][o]) continue;
        let c = acc + own[i][o];
        for (let j = 0; j < i; j++) c += pair(i, o, j, cur[j]);
        cur[i] = o;
        walk(i + 1, c);
      }
      cur[i] = 0;
    };
    walk(0, 0);
    els.forEach((e, i) => {
      for (const a of alts) e.classList.remove(a);
      if (opts[pick[i]]) e.classList.add(opts[pick[i]]);
    });
  }

  // ------------------------------------------------------------- full map --
  function buildMapLabels() {
    mapLabels.textContent = '';
    const size = 2 * S.half;
    for (const poi of S.pois) {
      const l = h('span', 'gr-maplabel', mapLabels, t(poi.nameKey));
      l.style.left = `${((poi.x + S.half) / size) * 100}%`;
      l.style.top = `${((poi.z + S.half) / size) * 100}%`;
    }
    if (S.mapOpen) declutterSoon(mapLabels, 'map');
    legend.textContent = '';
    const row = (cls, key, extra) => {
      const li = h('li', 'gr-legend__i', legend);
      h('i', 'gr-legend__sw ' + cls, li);
      const sp = h('span', null, li, t(key));
      if (extra) h('small', null, sp, ` · ${t(extra)}`);
    };
    row('sw-you', 'map.legendYou');
    row('sw-zone', 'map.legendZone');
    row('sw-next', 'map.legendNext');

  function damageNumber(x, y, amount, kind) {

    numNext = (numNext + 1) % nums.length;
    const el = slot.el;
