# Render Blueprint for LUPU-FIT (the app lives in lupifit/). Render reads this file from the repository root.
# Step-by-step guide (plain language, Hebrew): lupifit/docs/deploy-render.md
# Alternative on one free VM with Docker Compose (Oracle Cloud Always Free): lupifit/docs/deploy-oracle.md
# Reference: https://render.com/docs/blueprint-spec
#
# Creates ONE web service that builds lupifit/Dockerfile and serves the web app + API over HTTPS at
# https://<name>.onrender.com. The database is NOT created here: paste a PostgreSQL connection string
# (a free Neon database, see the guide) when Render asks for DATABASE_URL.
# No secrets are stored in this file: SESSION_SECRET is generated by Render, the others are typed into
# the Render Dashboard, and the phone-notification (VAPID) keys are created by the app and kept in the database.
services:
  - type: web
    name: lupu-fit
    runtime: docker
    # No rootDir on purpose: Render's docs disagree on how it combines with these two paths, so both are
    # given from the repository root (this repository also holds unrelated projects).
    dockerfilePath: ./lupifit/Dockerfile
    dockerContext: ./lupifit
    # Only changes to the app trigger a new deploy.
    buildFilter:
      paths:
        - lupifit/**
      ignoredPaths:
        - lupifit/android/**
        - lupifit/docs/**
        - lupifit/e2e/**
    region: frankfurt
    # free: no cost, but the instance sleeps after 15 minutes without visits; the next visit waits about
    # a minute while it wakes up, and the phone-reminder job inside the server only runs while it is awake
    # (reminders due while asleep are not sent). For the launch, change this to `starter` (the smallest
    # always-on paid instance, also called 0.5c-512mb) and check the current price on render.com/pricing.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000" # Render's default port, set explicitly
      # PostgreSQL connection string, typed in when the Blueprint is created. Neon: copy the DIRECT
      # string (Connection pooling switched off), it ends with ?sslmode=require&channel_binding=require.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Create the tables and load the exercise/food library on every start (safe to repeat).
      - key: DB_AUTO_MIGRATE
        value: "true"
      # Behind Render's load balancer: rate limits use the visitor's IP from X-Forwarded-For.
      - key: TRUST_PROXY
        value: "true"
      # APP_URL is not needed: the server uses RENDER_EXTERNAL_URL (https://<name>.onrender.com).
      # Set APP_URL in the Dashboard only after adding your own domain.
      # Android app (Trusted Web Activity): served as /.well-known/assetlinks.json.
      - key: ANDROID_APP_PACKAGE
        value: com.lupufit.app
      # SHA-256 of the upload key (a public fingerprint, not a secret). Add Google Play's app-signing
      # fingerprint later as ANDROID_PLAY_CERT_SHA256 in the Dashboard (a Blueprint sync keeps it).
      - key: ANDROID_CERT_SHA256
        value: 25:2D:51:18:6C:86:EB:ED:57:D9:CC:34:45:B0:63:AF:4A:A7:34:C1:63:98:10:27:AD:3C:B4:14:9A:7B:83:3B
      # Optional Anthropic API key for the AI coach and meal-photo analysis. Leave empty to run without AI.
      - key: AI_API_KEY
        sync: false

# Later, to use a Render PostgreSQL database instead of Neon (paid; check the current price), add:
#
# databases:
#   - name: lupu-fit-db
#     region: frankfurt
#     plan: 0.1c-256mb    # smallest paid plan; larger ids are listed in render.com/docs/blueprint-spec
#
# and replace the DATABASE_URL entry above with:
#
#      - key: DATABASE_URL
#        fromDatabase:
#          name: lupu-fit-db
#          property: connectionString
#
# Then move the data across (pg_dump from Neon, pg_restore into Render) before switching; see the guide.
