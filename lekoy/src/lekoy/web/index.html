<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEKOY RV5</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111'/><text x='16' y='22' font-family='system-ui' font-size='15' font-weight='700' fill='%23e8e8e8' text-anchor='middle'>L</text></svg>">
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <div class="brand-mark">L</div>
        <div class="brand-text">
          <div class="brand-family">LEKOY</div>
          <div class="brand-model" id="brand-model">RV5</div>
        </div>
      </div>
      <button class="icon-btn" id="close-sidebar" title="סגור" aria-label="סגור תפריט">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <button class="new-chat" id="new-chat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>שיחה חדשה</span>
    </button>

    <div class="conversations" id="conversations"></div>

    <div class="sidebar-foot">
      <button class="ghost-btn" id="open-settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>הגדרות</span>
      </button>
      <button class="ghost-btn" id="toggle-theme">
        <svg viewBox="0 0 24 24" class="icon-moon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg viewBox="0 0 24 24" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="theme-label">מצב בהיר</span>
      </button>
      <div class="status" id="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">מתחבר…</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="open-sidebar" aria-label="פתח תפריט">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title">
        <span class="title-main">LEKOY RV5</span>
        <span class="title-sub" id="topbar-sub"></span>
      </div>
      <button class="icon-btn" id="topbar-settings" aria-label="הגדרות">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div class="thread" id="thread">
      <div class="welcome" id="welcome">
        <div class="welcome-mark">L</div>
        <h1>LEKOY RV5</h1>
        <p class="welcome-sub">מודל שפה ממשפחת LEKOY — עברית, אנגלית וספרדית</p>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="שאל את LEKOY RV5…" autofocus></textarea>
        <button class="send" id="send" aria-label="שלח">
          <svg viewBox="0 0 24 24" class="icon-send"><path d="M7 11l5-5 5 5M12 6v13"/></svg>
          <svg viewBox="0 0 24 24" class="icon-stop"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </div>
      <div class="composer-note" id="composer-note">
        LEKOY RV5 יכול לטעות. בדוק מידע חשוב.
      </div>
    </div>
  </main>

  <div class="scrim" id="scrim"></div>

  <aside class="settings" id="settings">
    <div class="settings-head">
      <h2>הגדרות</h2>
      <button class="icon-btn" id="close-settings" aria-label="סגור">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <section>
        <h3>מודל</h3>
        <div class="model-card" id="model-card">
          <div class="row"><span>שם</span><b id="m-name">—</b></div>
          <div class="row"><span>פרמטרים</span><b id="m-params">—</b></div>
          <div class="row"><span>הקשר</span><b id="m-ctx">—</b></div>
          <div class="row"><span>backend</span><b id="m-backend">—</b></div>
          <div class="row"><span>שלב אימון</span><b id="m-stage">—</b></div>
        </div>
      </section>

      <section>
        <h3>System prompt</h3>
        <textarea id="system-prompt" rows="9" spellcheck="false"></textarea>
        <div class="btn-row">
          <button class="ghost-btn small" data-preset="he">עברית</button>
          <button class="ghost-btn small" data-preset="en">English</button>
          <button class="ghost-btn small" data-preset="es">Español</button>
        </div>
      </section>

      <section>
        <h3>יצירה</h3>
        <label class="field">
          <div class="field-head"><span>Temperature</span><output id="out-temp">0.70</output></div>
          <input type="range" id="temp" min="0" max="1.5" step="0.05" value="0.7">
          <small>0 = דטרמיניסטי · גבוה = מגוון יותר</small>
        </label>
        <label class="field">
          <div class="field-head"><span>Top P</span><output id="out-topp">0.90</output></div>
          <input type="range" id="topp" min="0.05" max="1" step="0.05" value="0.9">
        </label>
        <label class="field">
          <div class="field-head"><span>Top K</span><output id="out-topk">50</output></div>
          <input type="range" id="topk" min="0" max="100" step="1" value="50">
        </label>
        <label class="field">
          <div class="field-head"><span>Repetition penalty</span><output id="out-rep">1.05</output></div>
          <input type="range" id="rep" min="1" max="1.5" step="0.01" value="1.05">
        </label>
        <label class="field">
          <div class="field-head"><span>Max tokens</span><output id="out-max">1024</output></div>
          <input type="range" id="maxtok" min="64" max="4096" step="64" value="1024">
        </label>
      </section>

      <section>
        <h3>נתונים</h3>
        <button class="ghost-btn danger" id="clear-all">מחק את כל השיחות</button>
        <p class="hint">השיחות נשמרות בדפדפן הזה בלבד ולא נשלחות לשום מקום.</p>
      </section>
    </div>
  </aside>

</div>
<script src="app.js"></script>
</body>
</html>
