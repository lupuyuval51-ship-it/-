[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lekoy"
version = "0.1.0"
description = "LEKOY — a multilingual model family. RV5 is the first model: Hebrew-first, with English and Spanish."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "hebrew", "multilingual", "fine-tuning", "lekoy", "rv5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Hebrew",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The floor is what the pipeline is written against, not what it was last
# tested on. transformers >= 5 in particular changed apply_chat_template's
# return type, which the dataset code handles either way.
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "accelerate>=0.30",
    "peft>=0.11",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.23",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# Serving the API and the web chat.
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
# Running the benchmark suites and writing the reports.
eval = ["sacrebleu>=2.4", "scikit-learn>=1.4"]
# Everything needed to develop on the pipeline itself.
dev = ["pytest>=8.0", "tensorboard>=2.16", "httpx>=0.27"]
# CUDA-only. Installing these on a CPU host succeeds and then fails at import,
# which is why they are not in the base dependency set.
gpu = ["bitsandbytes>=0.43", "trl>=0.9", "deepspeed>=0.14"]
all = ["lekoy[serve,eval,dev]"]

[project.scripts]
lekoy-chat = "lekoy.cli:chat"
lekoy-serve = "lekoy.cli:serve"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lekoy.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs model weights or the network",
    "model: loads a real model",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
