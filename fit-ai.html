<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090D">
<meta name="description" content="FIT AI – מאמן כושר ותזונה חכם: תוכנית אימונים אישית, נגן אימונים, יומן תזונה, מעקב התקדמות ומאמן AI">
<title>FIT AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C5F82A'/%3E%3Cpath d='M36 8 16 36h14l-3 20 21-29H33z' fill='%230B1200'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07090D;--bg2:#0C1016;--surface:#11161F;--surface2:#171E29;--surface3:#212A38;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --text:#F3F6FA;--muted:#9CA8BA;--faint:#69768A;
  --accent:#C5F82A;--accent-ink:#0B1200;--accent-text:#C5F82A;--accent-soft:rgba(197,248,42,.13);
  --good:#34D399;--warn:#FBBF24;--bad:#F87171;
  --kcal:#FB923C;--protein:#F472B6;--carbs:#60A5FA;--fat:#FACC15;--water:#38BDF8;--steps:#A78BFA;
  --radius:20px;--radius-sm:14px;--shadow:0 12px 32px rgba(0,0,0,.38);
  --nav-h:72px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF2F7;--bg2:#F8FAFC;--surface:#FFFFFF;--surface2:#F2F5F9;--surface3:#E3E8EF;
  --line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.15);
  --text:#0B1220;--muted:#4F5D73;--faint:#7D8AA0;
  --good:#059669;--warn:#B45309;--bad:#DC2626;
  --kcal:#EA580C;--protein:#DB2777;--carbs:#2563EB;--fat:#CA8A04;--water:#0284C7;--steps:#7C3AED;
  --shadow:0 12px 32px rgba(15,23,42,.09);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(60vmax 40vmax at 100% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%),radial-gradient(50vmax 40vmax at -10% 110%,color-mix(in srgb,var(--water) 8%,transparent),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0}
.skip{position:absolute;inset-inline-start:-9999px;top:8px}
.skip:focus{inset-inline-start:12px;z-index:200;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:10px;font-weight:700}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:8px}
.ico{flex:none;display:block}
.ico.fill{fill:currentColor;stroke:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.layout{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{display:none}
.main{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line)}
.topbar .spacer{flex:1}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.5px;font-size:19px;text-decoration:none;color:var(--text)}
.logo .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.logo b{color:var(--accent-text)}
.view{max-width:1140px;margin:0 auto;padding:18px 16px 28px;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
.page-head p{color:var(--muted);margin-top:2px}
.bottomnav{position:fixed;bottom:0;inset-inline:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:700}
.bottomnav a .iw{display:grid;place-items:center;width:46px;height:30px;border-radius:999px;transition:background .2s}
.bottomnav a.active{color:var(--text)}
.bottomnav a.active .iw{background:var(--accent);color:var(--accent-ink)}
.side-link{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--muted);text-decoration:none;font-weight:700;transition:background .15s,color .15s}
.side-link:hover{background:var(--surface2);color:var(--text)}
.side-link.active{background:var(--accent-soft);color:var(--accent-text)}
@media (min-width:980px){
  .sidebar{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:250px;flex:none;padding:20px 14px;border-inline-end:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 70%,transparent)}
  .sidebar .logo{padding:4px 8px 18px}
  .bottomnav,.topbar .mobile-only{display:none}
  .main{padding-bottom:40px}
  .view{padding:26px 28px 40px}
}
.active-bar{position:fixed;inset-inline:12px;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));z-index:29;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;box-shadow:var(--shadow);text-decoration:none;animation:fadeUp .3s ease}
.active-bar .grow{flex:1}
@media (min-width:980px){.active-bar{inset-inline-start:auto;inset-inline-end:24px;bottom:24px;width:340px}}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;min-width:0}
.card.pad-lg{padding:20px}
.card.glow{background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 15%,var(--surface)) 0%,var(--surface) 55%);border-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
.card.click{cursor:pointer;transition:transform .15s,border-color .2s}
.card.click:hover{border-color:var(--line2)}
.card.click:active{transform:scale(.99)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.gx2{grid-template-columns:1fr 1fr}
.stack{display:grid;gap:14px}
.stack.sm{gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center}
.mt{margin-top:12px}.mt-s{margin-top:6px}.mt-l{margin-top:20px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:13px}.xs{font-size:12px}
.bold{font-weight:800}
.num{font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.huge{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{height:1px;background:var(--line);margin:12px 0}
.accent-t{color:var(--accent-text)}
.good-t{color:var(--good)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:var(--surface2);color:var(--text);font-weight:800;cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s;text-decoration:none;white-space:nowrap;user-select:none}
.btn:hover{background:var(--surface3)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;border-radius:10px}
.btn.block{width:100%}
.btn.lg{min-height:54px;font-size:16px;border-radius:16px}
.icon-btn{width:42px;height:42px;flex:none;display:inline-grid;place-items:center;border-radius:13px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;color:var(--text);transition:background .15s,transform .12s}
.icon-btn:hover{background:var(--surface3)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.icon-btn.ghost{background:transparent;border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap;color:var(--text)}
.chip.accent{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.chip.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);border-color:transparent}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:transparent}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);border-color:transparent}
button.chip{cursor:pointer}
button.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.sel{background:var(--surface);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.15)}
input,select,textarea{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;min-height:46px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:90px;resize:vertical}
input[type="range"]{padding:0;min-height:28px;accent-color:var(--accent);background:transparent;border:0;box-shadow:none}
input[type="checkbox"]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
input[type="checkbox"].sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;flex:none;border-radius:99px;background:var(--surface3);position:relative;cursor:pointer;transition:background .2s;border:0;margin:0}
input[type="checkbox"].sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:inset-inline-start .2s}
input[type="checkbox"].sw:checked{background:var(--accent)}
input[type="checkbox"].sw:checked::after{inset-inline-start:23px}
.field{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:700}
.field > span{display:flex;justify-content:space-between}
.choice-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;padding:14px;border-radius:16px;border:1.5px solid var(--line2);background:var(--surface2);cursor:pointer;transition:border-color .15s,background .15s,transform .12s;min-height:56px;font-weight:700}
.choice:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line2))}
.choice:active{transform:scale(.98)}
.choice.sel{border-color:var(--accent-text);background:var(--accent-soft)}
.choice .ci{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface3);color:var(--accent-text)}
.choice.sel .ci{background:var(--accent);color:var(--accent-ink)}
.choice small{color:var(--muted);font-weight:500;font-size:12px}
.progress{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden}
.progress > i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .lic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--accent-text)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.empty .ei{width:56px;height:56px;margin:0 auto 10px;border-radius:18px;display:grid;place-items:center;background:var(--surface2);color:var(--faint)}
.badge-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.kbd{font-family:ui-monospace,monospace;font-size:12px;padding:2px 6px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);font-size:13px}
.notice.info{background:color-mix(in srgb,var(--water) 11%,transparent);border-color:color-mix(in srgb,var(--water) 26%,transparent)}
.notice.good{background:color-mix(in srgb,var(--good) 11%,transparent);border-color:color-mix(in srgb,var(--good) 26%,transparent)}

/* ---------- stat tiles & rings ---------- */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:22px;font-weight:900;letter-spacing:-.3px}
.stat .l{font-size:12px;color:var(--muted);font-weight:700}
.ring-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;text-align:center;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--text);transition:transform .15s}
.ring-tile:active{transform:scale(.98)}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
[dir="rtl"] .ring svg{transform:rotate(-90deg) scaleY(-1)}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring circle.fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.macro-bar{display:grid;gap:5px}
.macro-bar .row{font-size:13px;font-weight:700}

/* ---------- hero ---------- */
.hero{overflow:hidden}
.hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;inset-inline-end:-80px;top:-90px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%);pointer-events:none}
.lvl-badge{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:20px;flex:none;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-strip .d{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:14px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted)}
.week-strip .d.today{outline:2px solid var(--accent-text);color:var(--text)}
.week-strip .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface3);color:var(--faint)}
.week-strip .dot.done{background:var(--accent);color:var(--accent-ink)}
.week-strip .dot.plan{border:2px dashed var(--line2);background:transparent}
.goal-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.goal-row .gi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.goal-row.done .gi{background:var(--accent);color:var(--accent-ink)}

/* ---------- workout ---------- */
.ex-card{padding:0;overflow:hidden}
.ex-head{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 10px}
.ex-num{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--surface3);font-weight:900}
.ex-card.complete .ex-num{background:var(--accent);color:var(--accent-ink)}
.ex-title{font-weight:800;font-size:16px;cursor:pointer;background:none;border:0;padding:0;text-align:start;color:var(--text)}
.ex-title:hover{color:var(--accent-text)}
.sets{display:grid;gap:6px;padding:0 14px 12px}
.set-row{display:grid;grid-template-columns:30px 1fr 1fr 1fr 46px;gap:8px;align-items:center}
.set-row.hdr{font-size:11px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.set-row .sn{font-weight:900;color:var(--muted);text-align:center}
.set-row .prev{font-size:12px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row input{min-height:42px;padding:6px 8px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.set-row .ck{width:46px;height:42px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface2);display:grid;place-items:center;cursor:pointer;color:var(--faint);transition:all .15s}
.set-row.done .ck{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.set-row.done input{background:color-mix(in srgb,var(--accent) 9%,var(--surface2));border-color:color-mix(in srgb,var(--accent) 30%,var(--line2))}
.ex-foot{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface2) 50%,transparent)}
.session-head{position:sticky;top:calc(61px + env(safe-area-inset-top));z-index:15;margin:-6px -4px 14px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
@media (min-width:980px){.session-head{top:12px}}
.rest-sheet{position:fixed;inset-inline:12px;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:60;max-width:520px;margin:0 auto;padding:14px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;animation:fadeUp .25s ease}
@media (min-width:980px){.rest-sheet{bottom:24px}}
.plan-ex{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.plan-ex:last-child{border-bottom:0}

/* ---------- timer ---------- */
.timer-face{display:grid;place-items:center;padding:10px 0 4px}
.timer-face .ring .rc .t{font-size:64px;font-weight:900;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.phase-work{--ph:var(--accent)}.phase-rest{--ph:var(--water)}.phase-prep{--ph:var(--warn)}.phase-done{--ph:var(--good)}

/* ---------- nutrition ---------- */
.meal{padding:0;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.meal-items{padding:0 14px 6px}
.food-li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.food-li:last-child{border-bottom:0}
.macros-mini{display:flex;gap:8px;font-size:11px;font-weight:700;color:var(--faint)}
.macros-mini b{font-weight:800}
.mP{color:var(--protein)}.mC{color:var(--carbs)}.mF{color:var(--fat)}.mK{color:var(--kcal)}
.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:30px;height:38px;border-radius:6px 6px 10px 10px;border:2px solid color-mix(in srgb,var(--water) 50%,var(--line2));position:relative;overflow:hidden;cursor:pointer;background:transparent;padding:0}
.glass i{position:absolute;inset-inline:0;bottom:0;height:0;background:var(--water);transition:height .4s}
.glass.full i{height:100%}
.result-li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer;border:1px solid transparent}
.result-li:hover{background:var(--surface2);border-color:var(--line)}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:9px;border:0;background:var(--surface3);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.stepper input{width:58px;min-height:32px;padding:0 4px;text-align:center;border:0;background:transparent;box-shadow:none;font-weight:800}

/* ---------- chat ---------- */
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 61px - var(--nav-h) - 36px - env(safe-area-inset-bottom) - env(safe-area-inset-top));min-height:420px}
@media (min-width:980px){.chat-wrap{height:calc(100dvh - 140px)}}
.chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px 12px;scroll-behavior:smooth}
.msg{max-width:min(86%,640px);padding:11px 14px;border-radius:18px;line-height:1.55;font-size:14.5px;word-wrap:break-word;animation:fadeUp .25s ease}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-end-end-radius:6px;font-weight:600}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-end-start-radius:6px}
.msg.bot ul,.msg.bot ol{margin:6px 0;padding-inline-start:20px}
.msg.bot li{margin:2px 0}
.msg.bot p + p{margin-top:8px}
.msg .src{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--faint);margin-bottom:4px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat-input{display:flex;gap:8px;align-items:flex-end;padding-top:10px;border-top:1px solid var(--line)}
.chat-input textarea{min-height:48px;max-height:140px;resize:none;border-radius:16px}

/* ---------- library ---------- */
.ex-tile{display:flex;flex-direction:column;gap:8px;text-align:start;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--text);transition:border-color .2s,transform .12s}
.ex-tile:hover{border-color:var(--line2)}
.ex-tile:active{transform:scale(.99)}
.lvl-dots{display:inline-flex;gap:3px}
.lvl-dots i{width:6px;height:6px;border-radius:50%;background:var(--surface3)}
.lvl-dots i.on{background:var(--accent-text)}
.anim-box{display:block;aspect-ratio:1;border-radius:18px;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--accent) 10%,var(--surface2)),var(--surface2) 70%);border:1px solid var(--line);overflow:hidden}
.anim-box.tile{aspect-ratio:auto;height:128px;margin:-2px -2px 2px}
.anim-box .exanim{width:100%;height:100%;display:block}
.ex-thumb{width:62px;height:62px;flex:none;padding:0;border-radius:14px;cursor:pointer;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:block}
.ex-thumb.sm{width:46px;height:46px;border-radius:12px;cursor:default}
.ex-thumb .exanim{width:100%;height:100%;display:block}
.timer-anim{width:120px;height:120px;margin:6px auto 0}
.has-active .main{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom))}
@media (min-width:980px){.has-active .main{padding-bottom:110px}}
.bodymap{display:flex;gap:6px;justify-content:center}
.bodymap svg{width:min(46%,170px);height:auto}
.bodymap .base{fill:var(--surface3)}
.bodymap .m{stroke:var(--bg);stroke-width:1.5;transition:fill .4s}
.bodymap .lbl{font-size:11px;fill:var(--faint);font-weight:700}

/* ---------- progress ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--faint);font-size:11px;font-weight:700;font-family:inherit}
.chart-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;direction:ltr}
.chart-y{position:relative;min-width:28px}
.chart-y span{position:absolute;right:0;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.chart-plot{position:relative;padding-bottom:20px;min-width:0}
.chart-x span{position:absolute;bottom:0;font-size:11px;font-weight:700;color:var(--faint);white-space:nowrap;transform:translateX(-50%)}
.chart-x span.first{transform:none}.chart-x span.last{transform:translateX(-100%)}
.chart-goal{position:absolute;right:4px;font-size:11px;font-weight:800;color:var(--good);transform:translateY(-125%)}
.chart-tip{position:absolute;pointer-events:none;padding:6px 10px;border-radius:10px;background:var(--surface3);border:1px solid var(--line2);font-size:12px;font-weight:800;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .15s}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--surface3)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 40%,var(--surface3))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 70%,var(--surface3))}
.heat i.l3{background:var(--accent)}
.heat i.today{outline:2px solid var(--text);outline-offset:-1px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--surface2);cursor:pointer;border:2px solid transparent;padding:0}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .pd{position:absolute;inset-inline:0;bottom:0;padding:16px 8px 6px;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.photo.sel{border-color:var(--accent)}
.compare{position:relative;aspect-ratio:3/4;max-width:420px;margin:0 auto;border-radius:18px;overflow:hidden;background:var(--surface2);touch-action:none}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare .after{clip-path:inset(0 0 0 50%)}
.compare .handle{position:absolute;top:0;bottom:0;width:3px;background:var(--accent);left:50%;transform:translateX(-50%)}
.compare .handle::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900}
.ach{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.ach .ai{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 25%,transparent)}
.ach.locked{opacity:.55}
.ach.locked .ai{background:var(--surface3);color:var(--faint);box-shadow:none}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(3,6,10,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:26px;padding-bottom:20px}}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-h h2{flex:1;font-size:19px;font-weight:900}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast-root{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline:0;z-index:120;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:480px;padding:11px 16px;border-radius:16px;background:var(--surface3);color:var(--text);border:1px solid var(--line2);box-shadow:var(--shadow);font-weight:700;font-size:14px;animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
.toast.good{border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.toast.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.toast.xp{background:var(--accent);color:var(--accent-ink);border-color:transparent}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:130;width:100%;height:100%}

/* ---------- onboarding ---------- */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.ob-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.ob-body{flex:1;animation:fadeUp .35s ease both}
.ob-body h1{font-size:28px;font-weight:900;letter-spacing:-.4px;margin-bottom:6px}
.ob-body > p{color:var(--muted);margin-bottom:20px}
.ob-foot{display:flex;gap:10px;margin-top:24px;position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}
.ob-foot .btn{flex:1}
.welcome-hero{text-align:center;padding:30px 0 10px}
.welcome-hero .mark{width:92px;height:92px;border-radius:28px;margin:0 auto 18px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 20px 60px color-mix(in srgb,var(--accent) 40%,transparent);animation:pop 1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
.welcome-hero h1{font-size:44px;font-weight:900;letter-spacing:-1px}
.welcome-hero h1 b{color:var(--accent-text)}
.feat{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.feat .fi{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.gen-steps{display:grid;gap:12px;margin:26px 0}
.gen-step{display:flex;align-items:center;gap:12px;opacity:.35;transition:opacity .3s}
.gen-step.on{opacity:1}
.gen-step .gs{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface3)}
.gen-step.on .gs{background:var(--accent);color:var(--accent-ink)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--surface3);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:44px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface2);font-weight:800;cursor:pointer}
.seg button.sel{border-color:var(--accent-text);background:var(--accent-soft);color:var(--accent-text)}
.day-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-pick button{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface2);font-weight:900;cursor:pointer;max-height:54px}
.day-pick button.sel{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:12px;border:3px solid transparent;cursor:pointer;padding:0}
.swatch.sel{border-color:var(--text)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media print{.sidebar,.bottomnav,.topbar,.active-bar{display:none}}

function insight() {
  const k = today(), tg = targets(), tot = dayTotals(k), hr = new Date().getHours();
  const leftP = Math.round(tg.protein - tot.p), leftK = Math.round(tg.kcal - tot.kcal);
  const trend = weightTrend(), p = S.profile;
  const out = [];
  if (S.active) out.push(t('האימון עדיין פתוח — סיימו אותו כדי לקבל XP ולשמור את הנתונים.', 'Your workout is still open — finish it to earn XP and save it.'));
  if (hr >= 12 && tot.kcal === 0) out.push(t('עוד לא תיעדתם אוכל היום. נסו את התיעוד החכם: פשוט כתבו מה אכלתם.', 'Nothing logged yet today. Try smart logging: just type what you ate.'));
  else if (leftP > 25) out.push(t(`נשארו ${leftP} גרם חלבון להיום. גביע קוטג׳ נותן 27.5 גרם, ויוגורט יווני 20 גרם.`, `${leftP} g of protein left today. A tub of cottage cheese gives 27.5 g, Greek yogurt 20 g.`));
  if (leftK < -150 && p.goal === 'fatloss') out.push(t(`עברתם את יעד הקלוריות ב־${-leftK}. לא נורא — מחר יום חדש, והמגמה השבועית היא מה שחשוב.`, `You're ${-leftK} kcal over target. No stress — the weekly trend is what matters.`));
  if (trend && p.goal === 'fatloss' && trend.perWeek > 0.1) out.push(t('המשקל במגמת עלייה קלה ב־4 השבועות האחרונים. נסו להוריד 150–200 קלוריות ביום או להוסיף 2,000 צעדים.', 'Weight trended slightly up over 4 weeks. Try cutting 150–200 kcal/day or adding 2,000 steps.'));
  if (trend && p.goal === 'fatloss' && trend.perWeek < -1.2) out.push(t('ירידה מהירה מאוד (מעל 1 ק״ג בשבוע). שקלו להוסיף מעט פחמימות כדי לשמור על שריר ואנרגיה.', 'Very fast loss (over 1 kg/week). Consider adding a few carbs to protect muscle and energy.'));
  if (trend && p.goal === 'muscle' && trend.perWeek < 0.05) out.push(t('כדי לבנות שריר כדאי עלייה של כ־0.25 ק״ג בשבוע. הוסיפו 150–250 קלוריות ביום.', 'For muscle gain aim for ~0.25 kg/week. Add 150–250 kcal per day.'));
  const ws = S.workouts.filter(w => w.date >= addDays(k, -7)).length;
  if (ws === 0 && S.workouts.length) out.push(t('לא התאמנתם השבוע. אפילו 20 דקות יחזירו את המומנטום!', 'No workouts this week yet. Even 20 minutes brings the momentum back!'));
  if (!out.length) out.push(t('אתם בדרך הנכונה! המשיכו בעקביות — תוצאות באות ממה שעושים רוב הימים, לא מיום מושלם אחד.', 'You’re on track! Keep it consistent — results come from most days, not one perfect day.'));
  return esc(out[hash(k + hr) % out.length]);
}

/* rest / set timer sheet */
let REST = null;
function startRest(sec, label, opts = {}) {
  if (!sec || sec <= 0) return;
  REST = { end: Date.now() + sec * 1000, total: sec, label, mode: opts.mode || 'rest', onDone: opts.onDone || null, lastBeep: null };
  renderRest();
}
function renderRest() {
  const root = $('#rest-root'); if (!root) return;
  if (!REST || !S.profile) { root.innerHTML = ''; return; }
  const rem = Math.max(0, (REST.end - Date.now()) / 1000), r = 24, c = 2 * Math.PI * r;
  root.innerHTML = `<div class="rest-sheet" role="timer" aria-label="${REST.mode === 'work' ? t('טיימר עבודה', 'Work timer') : t('טיימר מנוחה', 'Rest timer')}"><div class="ring" style="width:58px;height:58px"><svg width="58" height="58" viewBox="0 0 58 58"><circle cx="29" cy="29" r="${r}" stroke="var(--surface3)" stroke-width="6" fill="none"/><circle id="rest-c" cx="29" cy="29" r="${r}" stroke="${REST.mode === 'work' ? 'var(--kcal)' : 'var(--accent)'}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - rem / REST.total)}"/></svg><div class="rc">${icon(REST.mode === 'work' ? 'flame' : 'timer', 18)}</div></div>
  <div class="grow" style="min-width:0"><div class="xs muted bold">${REST.mode === 'work' ? t('עבודה', 'Work') : t('מנוחה', 'Rest')}</div><div class="bold num" style="font-size:28px;line-height:1.1" id="rest-t">${mmss(rem)}</div><div class="xs faint ellipsis">${esc(REST.label || '')}</div></div>
  <div class="row" style="gap:6px">${REST.mode === 'rest' ? `<button class="icon-btn sm" data-act="rest-adj" data-d="-15" aria-label="-15">−15</button><button class="icon-btn sm" data-act="rest-adj" data-d="15" aria-label="+15">+15</button>` : ''}<button class="icon-btn sm" data-act="rest-skip" aria-label="${t('דילוג', 'Skip')}">${icon('skip', 16, 'fill')}</button></div></div>`;
}
ACT['rest-adj'] = el => { if (!REST) return; REST.end += +el.dataset.d * 1000; const rem = (REST.end - Date.now()) / 1000; if (rem <= 1) REST.end = Date.now() + 1000; REST.total = Math.max(REST.total, rem); };
ACT['rest-skip'] = () => { const r = REST; REST = null; renderRest(); if (r?.mode === 'work') r.onDone?.(); };
function restTick() {
  if (!REST) return;
  const rem = (REST.end - Date.now()) / 1000, sec = Math.ceil(rem);
  if (sec <= 3 && sec > 0 && REST.lastBeep !== sec) { REST.lastBeep = sec; sfx('tick'); }
  if (rem <= 0) {
    const r = REST; REST = null; renderRest(); sfx('go'); buzz([180, 80, 180]);
    speak(r.mode === 'work' ? t('זמן! כל הכבוד', 'Time! Nice work') : t('המנוחה נגמרה, לסט הבא', 'Rest is over, next set'));
    r.onDone?.();
    return;
  }
  const c = $('#rest-c'), tx = $('#rest-t');
  if (c) c.style.strokeDashoffset = 2 * Math.PI * 24 * (1 - rem / REST.total);
  if (tx) tx.textContent = mmss(rem);
}

const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => { const r = indexedDB.open('fitai', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' }); r.onsuccess = () => res((this.db = r.result)); r.onerror = () => rej(r.error); });
  },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('photos', mode), st = tx.objectStore('photos'); const out = fn(st); tx.oncomplete = () => res(out?.result); tx.onerror = () => rej(tx.error); }); },
  put(o) { return this.tx('readwrite', st => st.put(o)); },
  get(id) { return this.tx('readonly', st => st.get(id)); },
  del(id) { return this.tx('readwrite', st => st.delete(id)); },
  clear() { return this.tx('readwrite', st => st.clear()); }
};

async function fileToJpeg(file, max = 900) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(url); }
}

  if (TM.i >= TM.phases.length) { timerFinish(); return; }
  const ph = TM.phases[TM.i];
  TM.rem = ph.sec; TM.end = Date.now() + ph.sec * 1000; TM.lastBeep = null;
  sfx('go'); buzz(ph.type === 'work' ? [250] : [120, 60, 120]); speak(phaseSpeech(ph));
  drawTimer();
}
function timerFinish() {
  TM.running = false; TM.done = true; releaseWakeLock(); sfx('done'); buzz([300, 100, 300]); confetti();
  speak(t('סיימתם! עבודה מצוינת', 'Finished! Great work'));
  const min = Math.max(1, Math.round(totalTimerSec() / 60));
  logCardio('hiit', min, 0, today(), true);
  toast(t(`אימון אינטרוולים של ${min} דק׳ נשמר`, `${min}-minute interval session saved`), 'good');
  drawTimer();
}
function timerTick() {
  if (!TM.running) return;
  const rem = (TM.end - Date.now()) / 1000, sec = Math.ceil(rem);
  if (sec <= 3 && sec > 0 && TM.lastBeep !== sec) { TM.lastBeep = sec; sfx('tick'); }
  if (rem <= 0) { timerAdvance(); return; }
  const ring = $('#tm-ring'), tx = $('#tm-t'), left = $('#tm-left'), ph = TM.phases[TM.i];
  if (ring) ring.style.strokeDashoffset = +ring.dataset.c * (1 - rem / ph.sec);
  if (tx) tx.textContent = sec;
  if (left) left.textContent = mmss(rem + sum(TM.phases.slice(TM.i + 1), p => p.sec));
}

CHG.import = async el => {
  const f = el.files?.[0]; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (!o || typeof o !== 'object' || !o.profile || !o.plan) throw new Error('bad');
    if (!(await confirmBox(t('הייבוא יחליף את כל הנתונים הנוכחיים. להמשיך?', 'Importing replaces all current data. Continue?'), t('ייבוא', 'Import'), true))) return;
    const fresh = freshState(), key = S.settings.apiKey, next = { ...fresh };
    for (const k of Object.keys(fresh)) {
      if (!(k in o)) continue;
      if (Array.isArray(fresh[k])) next[k] = Array.isArray(o[k]) ? o[k] : fresh[k];
      else if (fresh[k] && typeof fresh[k] === 'object') next[k] = o[k] && typeof o[k] === 'object' && !Array.isArray(o[k]) ? o[k] : fresh[k];
      else next[k] = o[k];
    }
    next.settings = { ...fresh.settings, ...(o.settings || {}), apiKey: key };
    next.photosMeta = [];
    S = next; saveNow(); toast(t('הנתונים יובאו בהצלחה', 'Data imported'), 'good'); render();
  } catch { toast(t('הקובץ לא תקין', 'Invalid file'), 'bad'); }

};

  const p = S.profile, tg = targets();
  return `<div class="center" style="padding-top:20px"><div class="welcome-hero" style="padding:0"><div class="mark" style="width:72px;height:72px;border-radius:22px">${icon('check', 36)}</div></div><h1 style="font-size:28px">${t(`${p.name}, התוכנית מוכנה!`, `${p.name}, your plan is ready!`)}</h1><p class="muted">${esc(L(GOALS[p.goal]))} · ${esc(L(S.plan.splitName))}</p></div>
  <div class="grid g4 mt-l">${[[tg.kcal, t('קק״ל ביום', 'kcal / day'), 'var(--kcal)'], [tg.protein, t('ג׳ חלבון', 'g protein'), 'var(--protein)'], [tg.carbs, t('ג׳ פחמימות', 'g carbs'), 'var(--carbs)'], [tg.fat, t('ג׳ שומן', 'g fat'), 'var(--fat)']].map(([v, l, c]) => `<div class="card center"><div class="big num" style="color:${c}">${fmt(v)}</div><div class="xs muted bold">${l}</div></div>`).join('')}</div>
  ${isTeen() ? `<div class="notice info mt">${icon('shield', 18)}<span>${t('מצב נוער: היעדים מחושבים לתחזוקה וצמיחה בריאה, בלי גירעון.', 'Teen mode: targets are for healthy maintenance and growth — no deficit.')}</span></div>` : ''}
  ${p.parq ? `<div class="notice mt">${icon('info', 18)}<span>${t('סימנתם תשובה חיובית בשאלון הבריאות — קבלו אישור רופא לפני אימונים עצימים.', 'You answered yes on the health check — get a doctor’s OK before intense training.')}</span></div>` : ''}
  <section class="card mt"><div class="card-h"><h2>${icon('calendar')} ${t('השבוע שלכם', 'Your week')}</h2><span class="chip">${p.days}× · ~${p.sessionMin} ${t('דק׳', 'min')}</span></div>
  <div class="list">${S.plan.days.map((dd, i) => `<div class="li"><span class="lic">${dayShort(S.plan.schedule[i])}</span><span class="grow"><span class="bold" style="display:block">${esc(L(dd.name))}</span><span class="xs muted">${dd.ex.slice(0, 4).map(x => esc(L(EXM[x.id].name))).join(' · ')}${dd.ex.length > 4 ? ` +${dd.ex.length - 4}` : ''}</span></span></div>`).join('')}</div></section>
  <p class="small muted mt">${esc(L(S.plan.notes))}</p>
  <div class="ob-foot"><button class="btn primary lg" data-act="ob-finish">${t('יאללה, מתחילים!', 'Let’s go!')} ${icon('bolt', 18, 'fill')}</button></div>`;
}
ACT['ob-finish'] = () => { OB.summary = false; OB.step = 0; OB.d = null; location.hash = '#/home'; render(); setTimeout(() => toast(t('+50 XP · ברוכים הבאים ל־FIT AI', '+50 XP · Welcome to FIT AI'), 'xp'), 400); };

/* =====================================================================
   DEMO DATA
   ===================================================================== */
function seedDemo() {
  silent = true;
  const keep = { ...S.settings };
  S = freshState(); S.settings = keep;
  const r25 = v => Math.max(2.5, Math.round(v / 2.5) * 2.5);
  const p = { name: t('אלכס', 'Alex'), sex: 'm', age: 29, height: 178, weight: 84.6, targetWeight: 78, goal: 'fatloss', level: 'intermediate', activity: 'light', days: 4, trainDays: [0, 1, 3, 4], sessionMin: 60, equipment: ['dumbbell', 'barbell', 'machine', 'cable', 'pullupbar', 'band'], injuries: [], diet: 'none', coachStyle: 'supportive', parq: false, createdAt: Date.now() - 43 * 86400000, demo: true };
  S.profile = p;
  S.plan = genPlan(p, 'demo-seed');
  S.plan.createdAt = Date.now() - 42 * 86400000;
  award('welcome', 50, t('ברוכים הבאים ל־FIT AI', 'Welcome to FIT AI'));
  for (let d = 42; d >= 1; d--) if (d % 2 === 0 || d < 8) S.weights.push({ date: addDays(today(), -d), kg: round(84.6 - (42 - d) * 0.088 + Math.sin(d * 1.7) * 0.35, 1) });
  const BASE = {
    barbell: { squat: 72.5, hinge: 85, hpush: 62.5, vpush: 37.5, hpull: 57.5, glute: 80, bi: 27.5 },
    dumbbell: { squat: 22, hinge: 22, lunge: 12, hpush: 22, vpush: 16, hpull: 24, 'sh-iso': 8, rear: 6, bi: 12, tri: 12, 'chest-iso': 10, calves: 20, carry: 24, glute: 24, core: 8 },
    machine: { squat: 130, 'legs-iso': 45, hpush: 55, hpull: 55, vpull: 55, tri: 25, 'chest-iso': 17.5, rear: 15, calves: 55 }
  };
  let rot = 0;
  for (let d = 42; d >= 1; d--) {
    const k = addDays(today(), -d);
    if (!S.plan.schedule.includes(pkey(k).getDay()) || rand01('skip' + k) < 0.08) continue;
    const day = S.plan.days[rot % S.plan.days.length]; rot++;
    const prog = 1 + ((42 - d) / 7) * 0.03;
    const start = pkey(k); start.setHours(6 + (hash(k) % 14), (hash(k + 'm') % 4) * 15);
    const exs = day.ex.map(x => {
      const e = EXM[x.id], q = e.equip.find(z => z !== 'bodyweight' && p.equipment.includes(z));
      const tbl = q === 'barbell' ? BASE.barbell : q === 'dumbbell' || q === 'kettlebell' ? BASE.dumbbell : q === 'machine' || q === 'cable' ? BASE.machine : null;
      const raw = e.timed || !tbl ? 0 : (tbl[e.pattern] ?? 12) * prog;
      const kg = raw ? (q === 'barbell' || q === 'machine' || q === 'cable' ? r25(raw) : Math.round(raw)) : 0;
      return { id: x.id, sets: Array.from({ length: x.sets }, (_, i) => ({ kg, reps: e.timed ? x.repMax : clamp(x.repMin + (hash(k + x.id + i) % (x.repMax - x.repMin + 1)), x.repMin, x.repMax) })) };
    });
    const dur = (46 + (hash(k) % 22)) * 60;
    recordWorkout({ id: uid() + d, date: k, startedAt: start.getTime(), endedAt: start.getTime() + dur * 1000, durationSec: dur, dayId: day.id, name: L(day.name), rpe: 6 + (hash(k) % 3), notes: '', exercises: exs });
    if (d > 1 && rand01('ch' + k) < 0.45) S.challenges[k] = 1;
  }
  const B = ['protein-breakfast', 'yogurt-bowl', 'oats-shake', 'cottage-toast'], Lu = ['chicken-rice-bowl', 'tuna-salad', 'lentil-bowl'], Di = ['salmon-potato', 'shakshuka-meal', 'beef-pasta', 'tofu-quinoa'], Sn = ['shake-banana', 'apple-almonds', 'protein-yogurt-dates', 'hummus-veg'];
  const tpl = id => MEAL_TEMPLATES.find(m => m.id === id);
  for (let d = 12; d >= 0; d--) {
    const k = addDays(today(), -d), h = hash('food' + k);
    const meals = d === 0 ? [B[h % 4]] : [B[h % 4], Lu[h % 3], Di[(h >>> 3) % 4], Sn[(h >>> 5) % 4], ...(h % 3 === 0 ? [Sn[(h >>> 7) % 4]] : [])];
    for (const id of meals) { const m = tpl(id); addFoodEntries(k, m.items.map(([fid, q]) => foodEntry(FOODM[fid], Math.max(0.25, Math.round(q * (0.9 + (h % 5) * 0.06) * 4) / 4), m.meal))); }
    if (d > 0 && h % 4 === 0) addFoodEntries(k, [foodEntry(FOODM.chocolate, 1, 'snack')]);
    S.steps[k] = d === 0 ? 4300 : 7400 + (h % 11) * 560;
    S.water[k] = d === 0 ? 1000 : waterGoal(k) + (h % 3) * 250 - (h % 7 === 0 ? 750 : 0);
    if (d > 0 && h % 5 !== 0) addFoodEntries(k, [foodEntry(FOODM.whey, 1, 'snack')]);
    if (d < 9) { const c = { sleep: 6 + (h % 6) * 0.5, energy: 2 + (h % 4), soreness: 1 + (h % 3), stress: 1 + ((h >> 2) % 3) }; c.score = readinessScore(c); S.checkins[k] = c; award('checkin:' + k, 5, t('צ׳ק-אין', 'Check-in')); }
    if (S.water[k] >= waterGoal(k)) award('water:' + k, 20, t('יעד מים הושג', 'Water goal hit'));
    if (S.steps[k] >= S.settings.stepGoal) award('steps:' + k, 20, t('יעד צעדים הושג', 'Step goal hit'));
  }
  for (let d = 40; d >= 2; d--) { const k = addDays(today(), -d), wd = pkey(k).getDay(); if (!S.plan.schedule.includes(wd) && (wd === 2 || wd === 6)) logCardio(wd === 2 ? 'walk' : 'cycle', wd === 2 ? 40 : 35, wd === 2 ? 3.6 : 14, k, true); }
  logCardio('hiit', 12, 0, addDays(today(), -9), true);
  S.measures = [{ date: addDays(today(), -40), waist: 94, neck: 39, chest: 104, arm: 35, thigh: 59 }, { date: addDays(today(), -12), waist: 90.5, neck: 38.5, chest: 102, arm: 35.5, thigh: 58 }];
  S.cardio.sort((a, b) => (a.date < b.date ? 1 : -1));
  checkAchievements();
  silent = false;
  saveNow();
  toast(t('נתוני דמו נטענו — תהנו מהסיור!', 'Demo data loaded — enjoy the tour!'), 'good');
}

/* =====================================================================
   BOOT
   ===================================================================== */
setInterval(() => {
  if (S.active) { const s = mmss((Date.now() - S.active.startedAt) / 1000); $$('[data-elapsed]').forEach(el => { if (el.textContent !== s) el.textContent = s; }); }
  restTick();
  timerTick();
}, 250);
if (S.profile) checkAchievements();
render();
</script>
